      <button id="retry" class="primary">Repetir</button>
    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{t=0,i=0,r=0,l()}};l()}const q={title:"Primeros modelos atómicos",subject:"Física y Química",level:"4.º ESO",sourceLesson:"lessons/FyQ4ESO/2.2-Primeros modelos atomicos_desarrollo.md",instructions:"Responde a las 20 preguntas sobre los primeros modelos atómicos. Se evalúan los tres principios (divisibilidad, electrones/protones, neutralidad), el modelo de Thomson, la formación de iones, el modelo nuclear de Rutherford y su experimento con partículas alfa. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de los primeros modelos atómicos.":e>=60?"Buen trabajo; repasa el experimento de Rutherford y la diferencia entre los modelos de Thomson y Rutherford.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"pm-01",topic:"Principio: divisibilidad",objective:"Comprender qué significa que el átomo es divisible",difficulty:"básica",type:"single-choice",prompt:"Según el principio de divisibilidad, el átomo:",options:["Es la partícula más pequeña que existe y no puede dividirse","Está hecho de partículas más pequeñas con carga eléctrica","Está formado solo por protones","Es una esfera de carga negativa uniforme"],correctAnswer:1,shuffleOptions:!0,explanation:"El principio de divisibilidad establece que el átomo NO es indivisible (como pensaba Dalton), sino que está formado por partículas más pequeñas (electrones y protones) que tienen carga eléctrica."},{id:"pm-02",topic:"Partículas subatómicas",objective:"Recordar las propiedades del electrón y del protón",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS sobre el electrón y el protón:",options:["El electrón tiene carga negativa","El protón tiene carga positiva","La masa del protón es ≈ 1836 veces mayor que la del electrón","El electrón es más pesado que el protón"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"El electrón es negativo y muy ligero. El protón es positivo y ≈ 1836 veces más pesado. La opción 4 es falsa: es al revés, el protón es mucho más pesado."},{id:"pm-03",topic:"Modelo de Thomson",objective:"Identificar el nombre popular del modelo de Thomson",difficulty:"básica",type:"single-choice",prompt:"El modelo atómico de Thomson se conoce popularmente como:",options:["Modelo nuclear","Modelo «pudin de pasas»","Modelo de órbitas","Modelo de nubes de probabilidad"],correctAnswer:1,shuffleOptions:!0,explanation:'Thomson imaginó el átomo como una esfera positiva (el "pudin") con electrones incrustados (las "pasas"). Por eso se le llama modelo "pudin de pasas" (o "bizcocho con pasas").'},{id:"pm-04",topic:"Iones",objective:"Definir catión",difficulty:"básica",type:"single-choice",prompt:"Un catión es:",options:["Un ion con carga negativa que se forma ganando electrones","Un ion con carga positiva que se forma perdiendo electrones","Un átomo neutro sin neutrones","Una partícula que sale del núcleo"],correctAnswer:1,shuffleOptions:!0,explanation:"Un catión tiene carga positiva y se forma cuando el átomo PIERDE electrones. Ejemplo: Na⁺ (sodio pierde 1 electrón). Regla: perder e⁻ → catión (+); ganar e⁻ → anión (−)."},{id:"pm-05",topic:"Partícula alfa",objective:"Identificar qué es una partícula α",difficulty:"básica",type:"single-choice",prompt:"Una partícula α (alfa) es:",options:["Un electrón con mucha energía","Un ion de helio con carga +2 (núcleo de He)","Un neutrón libre","Un fotón de alta frecuencia"],correctAnswer:1,shuffleOptions:!0,explanation:"La partícula α es un ion de helio con carga +2: un núcleo de helio (2 protones + 2 neutrones) sin electrones. Es pesada (≈ 4 masas de protón) y positiva."},{id:"pm-06",topic:"Experimento de Rutherford",objective:"Identificar el material de la lámina",difficulty:"básica",type:"single-choice",prompt:"En el experimento de Rutherford, la lámina que se bombardeaba era de:",options:["Plomo","Plata","Oro","Aluminio"],correctAnswer:2,shuffleOptions:!0,explanation:"Rutherford usó una lámina muy fina de ORO (solo unos decenas de átomos de grosor) porque el oro se puede estirar hasta formar láminas extremadamente delgadas."},{id:"pm-07",topic:"Masa del protón",objective:"Recordar la relación de masas protón/electrón",difficulty:"básica",type:"numeric",prompt:"¿Cuántas veces es aproximadamente la masa del protón mayor que la del electrón? (Redondea al entero más cercano)",correctAnswer:1836,tolerance:10,explanation:'m_p / m_e = 1,6725 × 10⁻²⁷ / 9,109 × 10⁻³¹ ≈ 1836. En la lección se redondea a "≈ 2000 veces", pero el valor exacto es 1836.'},{id:"pm-08",topic:"Modelo de Thomson",objective:"Describir la distribución de la carga en el modelo de Thomson",difficulty:"media",type:"single-choice",prompt:"En el modelo de Thomson, la carga positiva del átomo:",options:["Está concentrada en un núcleo central","Está repartida uniformemente por toda la esfera","Está en los electrones","No existe: el átomo solo tiene electrones"],correctAnswer:1,shuffleOptions:!0,explanation:"En el modelo de Thomson, la carga positiva está repartida uniformemente por toda la esfera (como la masa del pudin), y los electrones están incrustados en ella (como las pasas). No hay núcleo."},{id:"pm-09",topic:"Iones",objective:"Calcular la carga de un ion",difficulty:"media",type:"numeric",prompt:"Un ion Mg²⁺ ha perdido 2 electrones. ¿Cuál es su carga total en Coulomb? (Escribe la magnitud, p. ej. 3.2e-19)",correctAnswer:3204e-22,tolerance:1e-21,unit:"C",explanation:"q = n × e = 2 × 1,602 × 10⁻¹⁹ C = +3,204 × 10⁻¹⁹ C. Al perder 2 electrones, el ion queda con carga +2."},{id:"pm-10",topic:"Experimento de Rutherford",objective:"Interpretar la observación principal",difficulty:"media",type:"true-false",prompt:"Según el experimento de Rutherford, la mayoría de las partículas α atravesaron la lámina de oro sin desviarse, lo que indica que el átomo está prácticamente hueco.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. Si la mayoría de las partículas atraviesa sin desviarse, es que dentro del átomo hay mucho espacio vacío. Solo las que pasan cerca del núcleo (muy pequeño) se desvían o rebotan."},{id:"pm-11",topic:"Experimento de Rutherford",objective:"Explicar por qué algunas partículas rebotan",difficulty:"media",type:"single-choice",prompt:"En el experimento de Rutherford, unas pocas partículas α rebotaban hacia atrás. Esto se explica porque:",options:["Chocaron de frente con el núcleo, que es pequeño, denso y de carga positiva","La lámina de oro era demasiado gruesa","Las partículas α tenían demasiada velocidad","El detector estaba mal calibrado"],correctAnswer:0,shuffleOptions:!0,explanation:"Las partículas que rebotan son las que chocan de frente (o casi) con el núcleo. Como el núcleo es positivo y la partícula α también es positiva, se repelen con mucha fuerza y la partícula rebota. Solo ≈ 1 de cada 8000 partículas rebotaba."},{id:"pm-12",topic:"Tamaño del núcleo",objective:"Calcular el radio del núcleo",difficulty:"media",type:"numeric",prompt:"Si el radio del átomo es 5 × 10⁻¹¹ m y el núcleo es 10 000 veces menor, ¿cuál es el radio del núcleo en metros? (Escribe en notación científica, p. ej. 5e-15)",correctAnswer:5e-15,tolerance:1e-15,unit:"m",explanation:"r(núcleo) = r(átomo) / 10000 = 5 × 10⁻¹¹ m / 10000 = 5 × 10⁻¹⁵ m. El núcleo es unas 10 000 veces menor que el átomo."},{id:"pm-13",topic:"Conclusiones del experimento",objective:"Identificar las conclusiones correctas",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las conclusiones correctas del experimento de Rutherford:",options:["El átomo está prácticamente hueco","Existe un núcleo pequeño, denso y de carga positiva","La carga positiva está repartida por toda la esfera","Los electrones están en la corteza, fuera del núcleo"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Las conclusiones son: átomo hueco, núcleo pequeño y positivo, y electrones en la corteza. La opción 3 es falsa: la carga NO está repartida (eso era Thomson), está concentrada en el núcleo."},{id:"pm-14",topic:"Carga de la partícula alfa",objective:"Calcular la carga de una partícula α",difficulty:"media",type:"numeric",prompt:"¿Cuál es la carga de una partícula α en Coulomb? (Escribe la magnitud, p. ej. 3.2e-19)",correctAnswer:3204e-22,tolerance:1e-21,unit:"C",explanation:"La partícula α tiene carga +2 (es un ion de helio sin electrones): q = 2 × 1,602 × 10⁻¹⁹ C = +3,204 × 10⁻¹⁹ C."},{id:"pm-15",topic:"Descarte del modelo de Thomson",objective:"Explicar por qué el modelo de Thomson fue descartado",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué el experimento de Rutherford demuestra que el modelo de Thomson es incorrecto?",options:["Porque las partículas α no existían en 1897","Porque si la carga positiva estuviera repartida uniformemente, ninguna partícula debería rebotar, pero algunas lo hacen","Porque el oro no es un buen conductor","Porque Thomson no publicó su modelo a tiempo"],correctAnswer:1,shuffleOptions:!0,explanation:"En el modelo de Thomson (carga positiva repartida), las partículas α solo sufrirían desviaciones pequeñas y NINGUNA debería rebotar. Que ≈ 1 de cada 8000 rebotara demuestra que la carga positiva está concentrada en una zona diminuta (el núcleo), no repartida."},{id:"pm-16",topic:"Neutralidad del átomo",objective:"Calcular la carga total de un átomo",difficulty:"avanzada",type:"numeric",prompt:"Un átomo tiene 11 protones y 11 electrones. ¿Cuál es su carga total en Coulomb? (Escribe el valor numérico)",correctAnswer:0,tolerance:1,unit:"C",explanation:"Carga total = (11 × +1,602 × 10⁻¹⁹) + (11 × -1,602 × 10⁻¹⁹) = +1,762 × 10⁻¹⁸ + (-1,762 × 10⁻¹⁸) = 0 C. El átomo es neutro: las cargas se cancelan."},{id:"pm-17",topic:"Formación de iones",objective:"Distinguir catión de anión en la formación",difficulty:"avanzada",type:"single-choice",prompt:"Un átomo de oxígeno (8 protones, 8 electrones) gana 2 electrones. ¿Qué ion se forma y cuál es su carga?",options:["Catión O²⁺ con carga +3,204 × 10⁻¹⁹ C","Anión O²⁻ con carga -3,204 × 10⁻¹⁹ C","Catión O²⁺ con carga +6,408 × 10⁻¹⁹ C","Anión O²⁻ con carga -6,408 × 10⁻¹⁹ C"],correctAnswer:1,shuffleOptions:!0,explanation:"Al GANAR 2 electrones, sobran electrones → carga negativa → anión O²⁻. Carga = 2 × 1,602 × 10⁻¹⁹ = -3,204 × 10⁻¹⁹ C. Quedan 8 p⁺ y 10 e⁻: neto -2."},{id:"pm-18",topic:"Comparación de modelos",objective:"Identificar la diferencia clave entre Thomson y Rutherford",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál es la diferencia FUNDAMENTAL entre el modelo de Thomson y el de Rutherford?",options:["Thomson tiene núcleo; Rutherford no","En Thomson la carga positiva está repartida; en Rutherford está concentrada en el núcleo","Thomson no tiene electrones; Rutherford sí","No hay diferencia: son el mismo modelo"],correctAnswer:1,shuffleOptions:!0,explanation:"La diferencia clave es la ubicación de la carga positiva y la masa: en Thomson están repartidas por toda la esfera; en Rutherford están concentradas en un núcleo diminuto. Los electrones están en ambos modelos, pero en posiciones distintas."},{id:"pm-19",topic:"Electrones en el modelo de Thomson",objective:"Detectar el error de pensar que los electrones giran",difficulty:"avanzada",type:"true-false",prompt:"En el modelo de Thomson, los electrones giran alrededor de un núcleo central.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. En el modelo de Thomson NO hay núcleo. Los electrones están INCRUSTADOS (fijos) en la esfera positiva, como las pasas en un bizcocho. No giran, no hay órbitas. Eso es el modelo de Rutherford y posteriores."},{id:"pm-20",topic:"Confusión frecuente",objective:"Detectar errores comunes sobre el experimento de Rutherford",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS sobre el experimento de Rutherford:",options:["La mayoría de partículas α atravesó la lámina sin desviarse","Algunas partículas se desviaron con ángulos pequeños o grandes","Todas las partículas rebotaron hacia atrás","Solo ≈ 1 de cada 8000 partículas rebotó"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"La observación 3 es falsa: NO todas rebotaron. Solo una fracción muy pequeña (≈ 1/8000) rebotó. La mayoría atravesó sin desviarse y algunas (más que las que rebotaron) se desviaron."}]};A(document.querySelector("#app"),q);</script>
