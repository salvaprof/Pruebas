  <script type="module" crossorigin>const W={title:"Enlace químico",subject:"Física y Química",level:"4º ESO",sourceLesson:"lessons/FyQ4ESO/03-Tabla periodica-Tipos de enlace/3.2-Enlace quimico.md",outputFolder:"FyQ4ESO/03-Tabla periodica-Tipos de enlace",instructions:"Responde a las 20 preguntas sobre el enlace químico. Se evalúa la regla del octeto y sus excepciones, la definición de enlace, los cationes y los aniones, la curva de energía frente a la distancia entre los núcleos, los tres tipos de enlace entre átomos, los enlaces entre moléculas y las propiedades de cada cristal. Al finalizar verás tu puntuación y el desglose por contenidos.",finalMessage:e=>e>=80?"Dominas el enlace químico: sabes clasificar una sustancia y deducir el cristal a partir de sus propiedades.":e>=60?"Buen trabajo; repasa las excepciones del octeto (H, Li y Be) y la conductividad de cada cristal según su estado.":"Conviene repasar la lección: la regla del octeto, la tabla de cristales y cómo se reconoce cada tipo de enlace.",questions:[{id:"enl-01",topic:"Regla del octeto",objective:"Enunciar la regla del octeto",difficulty:"básica",type:"single-choice",prompt:"La regla del octeto establece que:",options:["los átomos se unen para adquirir ocho electrones en su último nivel energético","los átomos se unen para tener ocho electrones en total","los átomos completan siempre el primer nivel energético con ocho electrones","los átomos se unen para ceder ocho electrones al átomo más cercano"],correctAnswer:0,shuffleOptions:!0,explanation:"La regla del octeto dice que los átomos se unen para adquirir ocho electrones en su último nivel energético, que es la configuración del gas noble más cercano. No son ocho electrones en total: son ocho en el nivel más externo, y hay excepciones (H, Li y Be) que se conforman con dos."},{id:"enl-02",topic:"Regla del octeto",objective:"Aplicar la regla del octeto a los elementos de la primera fila",difficulty:"básica",type:"single-choice",prompt:"El hidrógeno tiene 1 electrón en su último nivel. ¿A cuántos electrones tiende al unirse?",options:["8","2","1","6"],correctAnswer:1,shuffleOptions:!0,explanation:"El hidrógeno, el litio y el berilio no persiguen el octeto: persiguen la configuración del helio, que tiene 2 electrones en su último nivel. Al hidrógeno le basta con ganar 1 electrón más."},{id:"enl-03",topic:"Definición de enlace químico",objective:"Definir enlace químico",difficulty:"básica",type:"single-choice",prompt:"Un enlace químico es:",options:["una fuerza electrostática que actúa entre átomos o grupos de átomos y los mantiene unidos","una fuerza gravitatoria que se establece entre los núcleos de dos átomos","una fuerza que solo aparece entre átomos de elementos metálicos","la fuerza de atracción que se produce entre unas moléculas y otras"],correctAnswer:0,shuffleOptions:!0,explanation:"Un enlace químico es una fuerza electrostática: el origen es eléctrico, porque intervienen las cargas positivas de los núcleos y las negativas de los electrones. Actúa entre átomos o grupos de átomos, no solo entre metales."},{id:"enl-04",topic:"Cationes y aniones",objective:"Distinguir catión y anión",difficulty:"básica",type:"single-choice",prompt:"El sodio (Z = 11) cede su electrón más externo y se transforma en Na⁺. ¿Qué es el Na⁺?",options:["un catión, porque ha cedido electrones y queda con carga positiva","un anión, porque tiene carga positiva","un gas noble, porque ha completado su último nivel energético","un átomo neutro, porque no cambia el número de protones"],correctAnswer:0,shuffleOptions:!0,explanation:"El que cede electrones se queda con carga positiva y es catión; el anión es el ion de carga negativa, el que gana electrones. El Na⁺ tiene la configuración del neón, pero sigue siendo sodio: no se ha convertido en un átomo de neón."},{id:"enl-05",topic:"Tipos de enlace entre átomos",objective:"Clasificar el enlace entre dos no metales",difficulty:"básica",type:"single-choice",prompt:"¿Qué tipo de enlace une a los dos átomos de una molécula de bromo, Br₂?",options:["iónico","covalente","metálico","enlace de hidrógeno"],correctAnswer:1,shuffleOptions:!0,explanation:"Dos no metales no pueden cederse electrones: se los comparten. El Br₂ une dos átomos iguales y no metálicos, así que el enlace es covalente y forma moléculas diatómicas. El enlace de hidrógeno es una atracción entre moléculas, no el enlace que une a los átomos."},{id:"enl-09",topic:"Gases nobles",objective:"Comprender la inertez de los gases nobles",difficulty:"básica",type:"true-false",prompt:"Los gases nobles se unen a otros átomos para ponerse más estables.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Los gases nobles no son reactivos porque ya tienen completo su último nivel: 2 electrones en el helio y 8 en los demás. No necesitan unirse a nadie para estabilizarse."},{id:"enl-15",topic:"Cationes y aniones",objective:"Calcular los electrones de un catión",difficulty:"básica",type:"numeric",prompt:"El sodio tiene Z = 11 y, al formarse el catión Na⁺, cede 1 electrón. ¿Cuántos electrones tiene el Na⁺?",correctAnswer:10,tolerance:0,unit:"electrones",explanation:"Un átomo neutro tiene tantos electrones como su número atómico: 11. Al ceder 1 electrón se queda con 11 - 1 = 10 electrones, la configuración del neón."},{id:"enl-17",topic:"Cationes y aniones",objective:"Escribir el ion que forma un no metal con su carga",difficulty:"básica",type:"short-answer",prompt:"El cloro (Z = 17) gana 1 electrón para completar su octeto. Escribe el ion que se forma, con su carga.",acceptedAnswers:["Cl-","Cl^-","Cl-1","Cl^-1","anion cloruro","ion cloruro"],format:"p. ej. Na^+",explanation:"El cloro gana 1 electrón: 17 + 1 = 18 electrones, la configuración del argón. Al ganar un electrón de carga negativa queda con carga negativa: es el anión cloruro, Cl⁻."},{id:"enl-06",topic:"Energía de enlace",objective:"Leer la curva de energía frente a la distancia internuclear",difficulty:"media",type:"single-choice",prompt:"En la curva que representa la energía del sistema de dos átomos frente a la distancia entre sus núcleos, ¿qué ocurre en el momento de formarse el enlace?",options:["la energía decrece hasta el mínimo, y ese valor es la energía de enlace","la energía sube al formarse el enlace, y por eso los átomos se estabilizan","la energía alcanza su valor máximo en el momento de formarse el enlace","la energía no cambia, porque la atracción y la repulsión se cancelan por completo"],correctAnswer:0,shuffleOptions:!0,explanation:"Al aproximarse, las fuerzas atractivas ganan a las repulsivas y la energía va bajando. El punto más bajo de la curva marca la distancia de enlace, y el valor de la energía en ese mínimo es la energía de enlace. Si los átomos se acercan más, las repulsiones entre los núcleos disparan la energía."},{id:"enl-10",topic:"Propiedades de los cristales",objective:"Situar la conductividad del cristal iónico",difficulty:"media",type:"true-false",prompt:"La sal común conduce la electricidad en estado sólido.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El cristal iónico conduce la electricidad cuando está fundido o disuelto, que es cuando los iones pueden moverse; en estado sólido los iones están fijos en la red."},{id:"enl-11",topic:"Regla del octeto",objective:"Aplicar la regla del octeto a los elementos de la primera fila",difficulty:"media",type:"true-false",prompt:"El berilio se estabiliza perdiendo los 2 electrones de su último nivel.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. El berilio tiene 2 electrones en su último nivel y le basta con perderlos para quedarse con los 2 electrones de la capa interna, que es la configuración del helio. Como el hidrógeno y el litio, no persigue ocho electrones."},{id:"enl-12",topic:"Propiedades de los cristales",objective:"Relacionar el cristal iónico con sus propiedades",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las propiedades que corresponden a un cristal iónico:",options:["es soluble en agua","conduce la electricidad cuando está fundido","tiene puntos de fusión y de ebullición muy elevados","es dúctil: se transforma en láminas","tiene brillo metálico"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"El cristal iónico es soluble en agua, conduce cuando está fundido porque los iones quedan libres, y tiene puntos de fusión y de ebullición muy elevados. La ductilidad y el brillo son propiedades del cristal metálico."},{id:"enl-13",topic:"Tipos de enlace entre átomos",objective:"Clasificar sustancias según el enlace entre sus átomos",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las sustancias en las que el enlace entre sus átomos es covalente:",options:["el bromo, Br₂","el cloruro de hidrógeno, HCl","el grafito (Cn)","el fluoruro de sodio, NaF","el mercurio, Hg","el aluminio"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"El Br₂ y el HCl están formados por no metales, que comparten electrones; el grafito es una red de átomos de carbono unidos por enlaces covalentes en las tres direcciones del espacio. El NaF es metal con no metal, así que es iónico, y el Hg y el aluminio son metales solos, con enlace metálico."},{id:"enl-14",topic:"Enlaces entre moléculas",objective:"Caracterizar los enlaces de hidrógeno y las fuerzas de Van der Waals",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre los enlaces de hidrógeno y las fuerzas de Van der Waals:",options:["son más débiles que los enlaces que unen a los átomos","explican que el amoníaco se pueda licuar","son responsables de puntos de fusión y de ebullición bajos en los cristales moleculares","unen a los átomos dentro de una misma molécula","unen a un catión con un anión"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Son atracciones entre moléculas, más débiles que los enlaces entre átomos: explican que el agua sea líquida a temperatura ambiente, que el amoníaco se licúe y que los cristales moleculares tengan puntos de fusión y de ebullición bajos. Dentro de una molécula y entre un catión y un anión actúan enlaces entre átomos, no estas fuerzas."},{id:"enl-16",topic:"Estabilidad de átomos y moléculas",objective:"Contar los electrones que aportan dos átomos al compartirlos",difficulty:"media",type:"numeric",prompt:"El átomo de oxígeno tiene 6 electrones en su último nivel y le faltan 2 para el octeto. Dos átomos de oxígeno se unen para formar O₂ compartiendo electrones. ¿Cuántos electrones aportan, entre los dos átomos, al compartirse?",correctAnswer:4,tolerance:0,unit:"electrones",explanation:"A cada átomo le faltan 2 electrones, así que entre los dos aportan 2 × 2 = 4 electrones compartidos. Cada átomo queda rodeado de ocho electrones en su último nivel y la molécula de O₂ sí es estable, a diferencia del átomo suelto."},{id:"enl-18",topic:"Gases nobles",objective:"Predecir el gas noble que pretende un elemento",difficulty:"media",type:"short-answer",prompt:"El potasio (K) tiene 19 electrones. ¿Qué gas noble pretende adquirir?",acceptedAnswers:["argon","ar","el argon","gas argon"],format:"p. ej. neón",explanation:"Se busca el gas noble con menos electrones que el átomo sin pasarse: el argón, que tiene 18. El cloro y el potasio pretenden la configuración del argón; el oxígeno y el magnesio pretenden la del neón."},{id:"enl-19",topic:"Clasificar una sustancia",objective:"Ordenar el procedimiento para justificar un enlace iónico",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos del procedimiento con el que se justifica que el NaF tiene enlace iónico.",steps:["Localizar el sodio y el flúor en la tabla periódica y clasificarlos como metal y no metal.","El sodio, que solo tiene 1 electrón en su último nivel, lo cede y se convierte en el catión Na⁺.","El flúor, al que le falta 1 electrón para el octeto, lo acepta y se convierte en el anión F⁻.","Concluir que el enlace es la atracción entre el catión y el anión, es decir, iónico."],correctAnswer:[0,1,2,3],explanation:"El procedimiento empieza siempre clasificando cada elemento como metal o no metal. Metal con no metal: el metal cede electrones y forma un catión, el no metal los acepta y forma un anión, y el enlace iónico es la atracción entre esos dos iones. El Na⁺ queda con 10 electrones y el F⁻ con 9 + 1 = 10, los dos con la configuración del neón."},{id:"enl-07",topic:"Deducir el tipo de enlace desde las propiedades",objective:"Deducir una sustancia a partir de sus propiedades",difficulty:"avanzada",type:"single-choice",prompt:"Un meteorito está hecho de una sustancia pura, sólida y de color rojo; no se disuelve en los disolventes más usuales, conduce el calor, tiene punto de fusión alto y brillo. ¿De qué sustancia se trata?",options:["grafito","óxido de hierro (III)","cobre","yoduro de potasio"],correctAnswer:2,shuffleOptions:!0,explanation:"Las propiedades describen un cristal metálico y, entre los metales, el único de color rojo es el cobre. El grafito conduce la electricidad pero es negro; el óxido de hierro (III) y el yoduro de potasio son cristales iónicos: no tienen brillo metálico y no conducen ni el calor ni la electricidad en estado sólido, y el yoduro de potasio además se disuelve en agua."},{id:"enl-08",topic:"Deducir el tipo de enlace desde las propiedades",objective:"Identificar un cristal covalente por su combinación de propiedades",difficulty:"avanzada",type:"single-choice",prompt:"Una sustancia tiene puntos de fusión y ebullición muy altos, no se disuelve en nada, conduce la electricidad, forma láminas y absorbe todas las radiaciones del espectro visible. ¿Cuál de estas sustancias es?",options:["hierro","grafito","yodo","sulfuro de calcio"],correctAnswer:1,shuffleOptions:!0,explanation:"El grafito es un cristal covalente de carbono: puntos de fusión y ebullición muy elevados, no se disuelve, conduce la electricidad y forma láminas, y absorbe toda la luz visible, por eso es negro. El hierro es metálico: tiene brillo, es decir, refleja la luz en lugar de absorberla; el yodo forma cristal molecular, con puntos de fusión y de ebullición bajos, y no conduce; el sulfuro de calcio es iónico y no conduce en estado sólido."},{id:"enl-20",topic:"Energía de enlace",objective:"Ordenar los tramos de la curva de energía",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los tramos de la curva de energía del sistema de dos átomos, desde que los átomos están muy separados hasta que se aproximan en exceso.",steps:["Átomos muy separados: la energía es muy alta y apenas actúan fuerzas entre ellos.","Los átomos se aproximan: las fuerzas atractivas ganan a las repulsivas y la energía va bajando.","Distancia de enlace: la curva llega a su punto más bajo, donde la atracción y la repulsión se equilibran.","Distancias más cortas: dominan las fuerzas repulsivas entre los núcleos y la energía sube de golpe."],correctAnswer:[0,1,2,3],explanation:"La curva se recorre de derecha a izquierda, que es lo que ocurre cuando los átomos se aproximan. El punto más bajo marca la distancia de enlace, y el valor de la energía en ese mínimo es la energía de enlace. Acercar más los átomos no los estabiliza más: los desestabiliza."}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso32EnlaceQuimicoAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"enl-01":{hint:"Fíjate en la palabra «último»: la regla habla del nivel más externo del átomo, no de la suma de todos sus electrones."},"enl-02":{hint:"El hidrógeno es el átomo más pequeño que existe: su objetivo no es el octeto, es la configuración del gas noble más ligero."},"enl-03":{hint:"Descarta la gravedad y lo que solo ocurre entre metales: piensa de qué cargas se trata y sobre quién actúan."},"enl-04":{hint:"Mira el signo de la carga y qué ha hecho el átomo con sus electrones: de las dos palabras que nombran a los iones, cada una es para un caso."},"enl-05":{hint:"Los dos átomos son idénticos y ninguno es un metal: plantee quién puede cederle electrones al otro."},"enl-09":{
