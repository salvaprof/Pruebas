  </label>`}function y(e){const n=e.querySelector("#theme-select");if(!n)return;u(n.value),n.addEventListener("change",()=>{u(n.value),localStorage.setItem("assessment-theme",n.value)});const a=localStorage.getItem("assessment-theme");a&&b.includes(a)&&(n.value=a,u(a))}function x(e,n){let a=0,r=0,t=0;const s=n.questions.map(o=>{if(o.shuffleOptions&&o.options){const i=E(o.options),l=o.options[o.correctAnswer],p=i.indexOf(l);return{...o,options:i,correctAnswer:p}}return{...o}}),c=()=>{const o=s[a];e.innerHTML=`

      <button id="retry" class="primary">Repetir</button>
    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{a=0,r=0,t=0,c()}};c()}const w={title:"Espectros atómicos",subject:"Física y Química",level:"4.º ESO",sourceLesson:"lessons/FyQ4ESO/2.4-Espectros atomicos_desarrollo.md",instructions:"Responde a las 20 preguntas sobre los espectros atómicos. Se evalúan los tipos de espectro (continuo, discontinuo, emisión, absorción), la dispersión, la relación entre energía y longitud de onda, la constante de Planck, las líneas del hidrógeno y los problemas del modelo de Rutherford. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de los espectros atómicos y la cuántica de Planck.":e>=60?"Buen trabajo; repasa las diferencias entre tipos de espectro y la relación E = h·f.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"es-01",topic:"Definición de espectro",objective:"Definir qué es un espectro",difficulty:"básica",type:"single-choice",prompt:"Un espectro es:",options:["Un tipo de microscopio óptico","El registro fotográfico de la energía que emiten o absorben los cuerpos","Una partícula subatómica","El color de un elemento químico"],correctAnswer:1,shuffleOptions:!0,explanation:"Un espectro es el registro fotográfico de la luz (energía) que un cuerpo emite o absorbe. Se obtiene separando la luz en sus colores con un prisma o una rejilla de difracción y fotografiando el resultado."},{id:"es-02",topic:"Espectro visible",objective:"Recordar el rango del espectro visible",difficulty:"básica",type:"single-choice",prompt:"El espectro visible va aproximadamente de:",options:["100 nm a 200 nm","200 nm a 400 nm","400 nm a 700 nm","700 nm a 1000 nm"],correctAnswer:2,shuffleOptions:!0,explanation:"El espectro visible va de ≈ 400 nm (violeta) a ≈ 700 nm (rojo). Por debajo de 400 nm está el ultravioleta; por encima de 700 nm, el infrarrojo."},{id:"es-03",topic:"Espectro continuo",objective:"Identificar características del espectro continuo",difficulty:"básica",type:"true-false",prompt:"Un espectro continuo presenta zonas negras o huecos entre los colores.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Un espectro continuo es una sucesión ININTERRUMPIDA de colores (como el arcoíris), sin saltos ni zonas negras. Las rayas negras aparecen en el espectro de absorción."},{id:"es-04",topic:"Origen del espectro continuo",objective:"Identificar cuándo se produce un espectro continuo",difficulty:"básica",type:"single-choice",prompt:"Un espectro continuo se produce cuando la luz proviene de:",options:["Un gas a baja presión excitado","Un sólido, líquido o gas a alta presión calentado","Un vacío absoluto","Un láser monocromático"],correctAnswer:1,shuffleOptions:!0,explanation:"El espectro continuo se produce cuando los átomos/moléculas están muy cerca (sólido, líquido o gas a alta presión) y calientes: interactúan constantemente y emiten todos los colores. Ejemplo: filamento de bombilla, disco solar."},{id:"es-05",topic:"Espectro discontinuo",objective:"Describir el aspecto de un espectro de rayas",difficulty:"básica",type:"single-choice",prompt:"Un espectro discontinuo de emisión se ve como:",options:["Una banda continua de colores (arcoíris)","Rayas de colores sobre fondo negro","Rayas negras sobre fondo blanco","Una imagen borrosa sin estructura"],correctAnswer:1,shuffleOptions:!0,explanation:"El espectro discontinuo de emisión muestra rayas de colores sobre fondo negro: cada raya es una longitud de onda concreta que el gas emite. No hay colores entre las rayas."},{id:"es-06",topic:"Longitud de onda",objective:"Convertir nanómetros a metros",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto vale 1 nm en metros?",options:["10⁻⁶ m","10⁻⁹ m","10⁻¹² m","10⁻³ m"],correctAnswer:1,shuffleOptions:!0,explanation:"1 nm = 10⁻⁹ m (nano = 10⁻⁹). Es la unidad práctica para la luz visible, que va de 400 a 700 nm."},{id:"es-07",topic:"Constante de Planck",objective:"Recordar el valor de la constante de Planck",difficulty:"básica",type:"single-choice",prompt:"El valor de la constante de Planck (h) es:",options:["3,00 × 10⁸ m/s","6,626 × 10⁻³⁴ J·s","1,602 × 10⁻¹⁹ C","9,109 × 10⁻³¹ kg"],correctAnswer:1,shuffleOptions:!0,explanation:"h = 6,626 × 10⁻³⁴ J·s. La opción 1 es la velocidad de la luz (c), la opción 3 es la carga del protón (e) y la opción 4 es la masa del electrón."},{id:"es-08",topic:"Cálculo de energía de fotón",objective:"Calcular E = h·f",difficulty:"media",type:"numeric",prompt:"Un fotón tiene una frecuencia f = 5,0 × 10¹⁴ Hz. ¿Cuál es su energía en julios? (Usa h = 6,626 × 10⁻³⁴ J·s. Expresa en notación científica, p. ej. 3.3e-19)",correctAnswer:3313e-22,tolerance:5e-21,unit:"J",explanation:"E = h·f = 6,626 × 10⁻³⁴ × 5,0 × 10¹⁴ = 3,313 × 10⁻¹⁹ J."},{id:"es-09",topic:"Líneas del hidrógeno",objective:"Identificar las líneas visibles del hidrógeno",difficulty:"media",type:"single-choice",prompt:"Las líneas visibles del espectro de emisión del hidrógeno están aproximadamente en:",options:["300 nm, 200 nm y 150 nm","656 nm, 486 nm y 434 nm","700 nm, 600 nm y 500 nm","400 nm, 350 nm y 300 nm"],correctAnswer:1,shuffleOptions:!0,explanation:'El hidrógeno emite en el visible: 656 nm (rojo, H-α), 486 nm (azul-verde, H-β) y 434 nm (violeta, H-γ). Son la "firma" del hidrógeno.'},{id:"es-10",topic:"Emisión y absorción",objective:"Relacionar posiciones de rayas de emisión y absorción",difficulty:"media",type:"true-false",prompt:"Las rayas de emisión y las de absorción de un mismo elemento aparecen en posiciones distintas (longitudes de onda diferentes).",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Aparecen en las MISMAS posiciones (mismas longitudes de onda). Si el hidrógeno emite una raya en 656 nm, también absorbe en 656 nm. Las transiciones de energía son las mismas."},{id:"es-11",topic:"Arcoíris",objective:"Identificar qué tipo de espectro es el arcoíris",difficulty:"media",type:"single-choice",prompt:"El arcoíris es un ejemplo de:",options:["Espectro discontinuo de emisión","Espectro discontinuo de absorción","Espectro continuo","Espectro de rayas de Fraunhofer"],correctAnswer:2,shuffleOptions:!0,explanation:"El arcoíris es el espectro continuo de la luz solar: la luz blanca se refracta y dispersa en las gotas de agua, separándose en todos los colores sin interrupción."},{id:"es-12",topic:"Cálculo de longitud de onda",objective:"Calcular λ a partir de E",difficulty:"media",type:"numeric",prompt:"Un fotón tiene energía E = 3,03 × 10⁻¹⁹ J. ¿Cuál es su longitud de onda en nm? (Usa c = 3,00 × 10⁸ m/s, h = 6,626 × 10⁻³⁴ J·s. λ = c·h/E. Redondea al entero más cercano)",correctAnswer:656,tolerance:5,unit:"nm",explanation:"λ = c·h/E = (3,00 × 10⁸)(6,626 × 10⁻³⁴) / (3,03 × 10⁻¹⁹) = 1,988 × 10⁻²⁵ / 3,03 × 10⁻¹⁹ ≈ 6,56 × 10⁻⁷ m = 656 nm. Coincide con la línea H-α del hidrógeno."},{id:"es-13",topic:"Rayas de Fraunhofer",objective:"Identificar las rayas de Fraunhofer",difficulty:"media",type:"single-choice",prompt:"Las rayas de Fraunhofer son:",options:["Rayas de colores del arcoíris","Rayas negras en el espectro solar debidas a la absorción por elementos","Rayas emitidas por el hidrógeno en el laboratorio","Líneas de difracción de un cristal"],correctAnswer:1,shuffleOptions:!0,explanation:"Las rayas de Fraunhofer son las rayas negras que aparecen en el espectro continuo de la luz solar, en las posiciones donde los elementos de la atmósfera solar (y terrestre) absorben esas longitudes de onda. Forman un espectro de absorción."},{id:"es-14",topic:"Problemas del modelo de Rutherford",objective:"Identificar la limitación del modelo de Rutherford",difficulty:"media",type:"true-false",prompt:"El modelo de Rutherford (1911) explicaba satisfactoriamente los espectros de rayas de los átomos.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El modelo de Rutherford NO podía explicar los espectros de rayas. Si los electrones pudieran estar a cualquier distancia, deberían emitir todos los colores (continuo). Pero se observan rayas discretas. Esto llevó a Bohr (1913) a proponer niveles de energía cuantizados."},{id:"es-15",topic:"Energía y longitud de onda",objective:"Relacionar energía con longitud de onda",difficulty:"media",type:"single-choice",prompt:"Un fotón de MAYOR energía tiene:",options:["Mayor longitud de onda","Menor longitud de onda","La misma longitud de onda","Frecuencia menor"],correctAnswer:1,shuffleOptions:!0,explanation:"E = h·f = h·c/λ. A mayor E, mayor f y MENOR λ. Por eso el violeta (400 nm) tiene más energía que el rojo (700 nm)."},{id:"es-16",topic:"Transición n=3 → n=2",objective:"Calcular la energía del fotón emitido en una transición",difficulty:"avanzada",type:"numeric",prompt:"En el hidrógeno, un electrón cae del nivel n=3 al nivel n=2. ¿Cuál es la energía del fotón emitido en eV? (E_n = -13,6/n² eV. Redondea a 2 decimales)",correctAnswer:1.89,tolerance:.05,unit:"eV",explanation:"E₃ = -13,6/9 = -1,51 eV; E₂ = -13,6/4 = -3,40 eV. E_fotón = E₃ - E₂ = (-1,51) - (-3,40) = 1,89 eV. El electrón pierde energía (emite un fotón)."},{id:"es-17",topic:"Inestabilidad del modelo de Rutherford",objective:"Explicar por qué el modelo de Rutherford predice inestabilidad",difficulty:"avanzada",type:"single-choice",prompt:"Según la electrodinámica clásica, ¿por qué el modelo de Rutherford predice que el átomo colapsaría?",options:["Porque el núcleo es demasiado pequeño","Porque un electrón en órbita es una carga acelerada que emite radiación continuamente, pierde energía y espiralaría hacia el núcleo","Porque los electrones son demasiado ligeros","Porque la fuerza eléctrica es demasiado débil"],correctAnswer:1,shuffleOptions:!0,explanation:"Una carga en aceleración (circular) emite radiación. Si el electrón pierde energía continuamente, su órbita se contrae y cae en el núcleo en ≈ 10⁻¹² s. Los átomos reales son estables, así que el modelo es incompleto."},{id:"es-18",topic:"Tipos de espectro",objective:"Clasificar correctamente los espectros",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS:",options:["El espectro continuo se produce en sólidos, líquidos o gases a alta presión calientes","El espectro de rayas se produce en gases a baja presión excitados","Las rayas de emisión y absorción de un elemento están en posiciones diferentes","Cada elemento tiene un espectro de rayas único que lo identifica"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"La opción 3 es FALSA: las rayas de emisión y absorción están en las MISMAS posiciones (mismas transiciones). Las otras tres son correctas."},{id:"es-19",topic:"Cálculo de frecuencia",objective:"Calcular la frecuencia a partir de la longitud de onda",difficulty:"avanzada",type:"numeric",prompt:"¿Cuál es la frecuencia de la luz de longitud de onda λ = 400 nm? (Usa c = 3,00 × 10⁸ m/s. f = c/λ. Expresa en notación científica con 2 decimales, p. ej. 7.50e14)",correctAnswer:75e13,tolerance:1e13,unit:"Hz",explanation:"f = c/λ = 3,00 × 10⁸ / (400 × 10⁻⁹) = 3,00 × 10⁸ / 4,00 × 10⁻⁷ = 7,50 × 10¹⁴ Hz. Es luz violeta, el límite del espectro visible."},{id:"es-20",topic:"Espectro como identidad",objective:"Explicar por qué cada elemento tiene un espectro único",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué cada elemento tiene un espectro de rayas único?",options:["Porque cada elemento tiene un color propio","Porque los niveles de energía de cada elemento son distintos, y las diferencias entre ellos (y por tanto las longitudes de onda) son específicas","Porque el prisma separa los colores de forma diferente para cada gas","Porque la temperatura de cada gas es siempre distinta"],correctAnswer:1,shuffleOptions:!0,explanation:'Los niveles de energía dependen de Z (número de protones) y de la estructura electrónica. Como cada elemento tiene un Z distinto, sus transiciones (y por tanto sus longitudes de onda) son únicas. Es como una "huella digital" atómica.'}]};x(document.querySelector("#app"),w);</script>
