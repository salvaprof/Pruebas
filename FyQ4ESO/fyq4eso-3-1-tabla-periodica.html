  <script type="module" crossorigin>const X={title:"Tabla periódica",subject:"Física y Química",level:"4º ESO",sourceLesson:"lessons/FyQ4ESO/03-Tabla periodica-Tipos de enlace/3.1-Tabla periodica.md",outputFolder:"FyQ4ESO/03-Tabla periodica-Tipos de enlace",instructions:"Responde a las 20 preguntas sobre la tabla periódica: cómo se ordenan los elementos, los 7 periodos y los 18 grupos, la configuración electrónica y el electrón diferenciador, y las tendencias de carácter metálico, electronegatividad, radio atómico y reactividad. Escribe las respuestas con el teclado del Chromebook (1s2 2s2 2p3, ns2, (n-2)f); bajo el campo tienes un teclado de símbolos. Al finalizar verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la estructura de la tabla periódica y de sus propiedades.":e>=60?"Buen trabajo; repasa el electrón diferenciador y las tendencias en periodos y grupos.":"Conviene repasar la lección y volver a intentarlo.",questions:[{id:"tp-01",topic:"Orden de la tabla",objective:"Identificar el criterio con el que se ordenan los elementos",difficulty:"básica",type:"single-choice",prompt:"¿Según qué criterio están ordenados los elementos de la tabla periódica?",options:["Por número atómico Z creciente","Por masa atómica creciente","Por orden alfabético de su nombre","Por carácter metálico creciente de izquierda a derecha"],correctAnswer:0,shuffleOptions:!0,explanation:"Los elementos se ordenan según su número atómico Z creciente, y por eso en un periodo cada elemento tiene un electrón más que el anterior. Mendeléiev ya organizó los 63 elementos conocidos atendiendo a sus propiedades y dejó huecos que luego ocuparon los elementos descubiertos, pero el orden actual es por Z, no por masa."},{id:"tp-02",topic:"Estructura: periodos y grupos",objective:"Reconocer la estructura de la tabla y lo que se conserva al recorrerla",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre la estructura de la tabla periódica:",options:["Tiene 7 periodos y 18 grupos numerados del 1 al 18","Los elementos de un mismo periodo tienen igual número de niveles electrónicos","Los elementos de un mismo grupo tienen idéntico número de electrones en su última capa","El 4.º y el 5.º periodo están formados por 18 elementos cada uno","Lantánidos y actínidos son dos series de 14 elementos situadas fuera de la tabla principal","El 2.º periodo está formado por 32 elementos","Los elementos de un mismo periodo tienen idéntico número de electrones en su última capa"],correctAnswer:[0,1,2,3,4],shuffleOptions:!1,explanation:"Son correctas las cinco primeras. El 2.º periodo es un periodo corto, con 8 elementos; los de 32 elementos son el 6.º y el 7.º. Y lo que se conserva al recorrer una fila (un periodo) es el número de niveles electrónicos, no los electrones de la última capa: eso es lo que comparten los elementos de un mismo grupo, y de ahí que tengan propiedades químicas parecidas."},{id:"tp-03",topic:"Tipos de elementos",objective:"Localizar la zona de la tabla que ocupan los no metales",difficulty:"básica",type:"single-choice",prompt:"¿Dónde se sitúan los no metales en la tabla periódica?",options:["En la parte superior derecha","En la línea de separación entre metales y no metales","En el grupo 18, colocados en el extremo derecho","Entre los grupos 1 y 15, cubriendo el resto de la tabla"],correctAnswer:0,shuffleOptions:!0,explanation:"Los no metales ocupan la parte superior derecha. En la línea de separación entre metales y no metales están los semimetales; el grupo 18 lo ocupan los gases nobles; y entre los grupos 1 y 15 se reparten los metales, que cubren el resto de la tabla."},{id:"tp-04",topic:"Tipos de elementos",objective:"Aplicar la excepción del hidrógeno a las tendencias del grupo 1",difficulty:"media",type:"true-false",prompt:"El hidrógeno está en el grupo 1, pero es un no metal y no sigue las tendencias metálicas de los alcalinos.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. Aunque el hidrógeno se coloca en el grupo 1 por su configuración externa (1s^1), es un no metal: no tiene carácter metálico ni reacciona con el agua como lo hacen el sodio o el potasio. La lección lo avisa al hablar del carácter metálico en un grupo."},{id:"tp-05",topic:"Configuración → periodo",objective:"Deducir el periodo a partir del mayor nivel ocupado",difficulty:"media",type:"single-choice",prompt:"El galio (Ga) tiene configuración electrónica 1s^2 2s^2 2p^6 3s^2 3p^6 3d^10 4s^2 4p^1. ¿En qué periodo está?",options:["En el 4.º periodo","En el 3.er periodo","En el 13.º periodo","En el 2.º periodo"],correctAnswer:0,shuffleOptions:!0,explanation:"El periodo lo da el mayor nivel de energía ocupado, que aquí es el nivel 4 (4s^2 4p^1), así que el galio está en el 4.º periodo. Que el 3d esté ocupado no cuenta para el periodo, y el 13 no es un periodo: es su grupo (2 + 10 + 1 = 13)."},{id:"tp-06",topic:"Periodo y grupo",objective:"Distinguir lo que indica el nivel más alto de lo que indican sus electrones",difficulty:"media",type:"true-false",prompt:"El número de electrones del último nivel de una configuración electrónica indica el periodo en el que está el elemento.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El periodo lo indica el mayor nivel de energía ocupado; lo que señala el grupo es el electrón diferenciador, que en los grupos 1, 2 y 13 a 18 son los electrones del último nivel. Por eso el sodio (1s^2 2s^2 2p^6 3s^1) está en el 3.er periodo y en el grupo 1."},{id:"tp-10",topic:"Configuración externa",objective:"Escribir la configuración externa de los alcalinotérreos",difficulty:"básica",type:"short-answer",prompt:"Escribe la configuración electrónica externa de los metales alcalinotérreos (grupo 2), representando el último nivel con la letra n.",acceptedAnswers:["ns2","ns^2"],format:"p. ej. ns1",explanation:"Los alcalinotérreos completan el subnivel s del último nivel con dos electrones: ns^2. Es el caso del berilio (2s^2), el magnesio (3s^2) y el calcio (4s^2), que aparecen en las tablas de la lección."},{id:"tp-11",topic:"Electrón diferenciador: bloques",objective:"Indicar el subnivel del electrón diferenciador de la transición interna",difficulty:"media",type:"short-answer",prompt:"Escribe, en la notación de la lección y expresando el último nivel con la letra n, el subnivel donde entra el electrón diferenciador de los lantánidos y los actínidos.",acceptedAnswers:["(n-2)f","n-2f"],format:"p. ej. (n-1)d",explanation:"(n-2)f: los elementos de transición interna tienen el electrón diferenciador en un subnivel f del antepenúltimo nivel. Es lo que les hace estar en las dos series de 14 elementos que se colocan fuera de la tabla principal."},{id:"tp-07",topic:"Electrón diferenciador: bloques",objective:"Relacionar la zona de la tabla con el subnivel del electrón diferenciador",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las relaciones correctas entre la zona de la tabla y el subnivel donde entra el electrón diferenciador:",options:["Grupos 1 y 2 → subnivel s del último nivel","Grupos 13 a 18 → subnivel p del último nivel","Grupos 3 a 12 → subnivel d del penúltimo nivel (n-1)","Lantánidos y actínidos → subnivel f del antepenúltimo nivel (n-2)","Grupos 13 a 18 → subnivel d del penúltimo nivel","Grupos 1 y 2 → subnivel p del último nivel"],correctAnswer:[0,1,2,3],shuffleOptions:!1,explanation:"Las cuatro primeras son correctas: los grupos 1 y 2 completan subniveles s (alcalinos ns^1, alcalinotérreos ns^2); los grupos 13 a 18 colocan el electrón diferenciador en un p del último nivel (grupo del boro ns^2 np^1, gases nobles ns^2 np^6); los metales de transición (grupos 3 a 12) lo sitúan en un d del penúltimo nivel, (n-1)d; y la transición interna, en un f del antepenúltimo nivel, (n-2)f."},{id:"tp-08",topic:"Electrón diferenciador",objective:"Identificar el último electrón que entra y no el último subnivel escrito",difficulty:"media",type:"single-choice",prompt:"El hierro (Fe) tiene configuración electrónica 1s^2 2s^2 2p^6 3s^2 3p^6 3d^6 4s^2. ¿Cuál es su electrón diferenciador?",options:["3d^6","4s^2","3p^6","3d^10"],correctAnswer:0,shuffleOptions:!0,explanation:"El electrón diferenciador es el último electrón que entra, no el último subnivel que se escribe al final. El subnivel 4s se completa antes que el 3d (por eso el calcio, 4s^2, está en el grupo 2), así que en el hierro el electrón diferenciador es el 3d^6: el hierro es un metal de transición, no un elemento del grupo 2."},{id:"tp-09",topic:"Electrón diferenciador → grupo",objective:"Calcular el grupo de un metal de transición con el electrón diferenciador d",difficulty:"media",type:"numeric",prompt:"El electrón diferenciador del hierro es 3d^6 y su último nivel (4s) aporta 2 electrones. En los metales de transición de la 4.ª serie el grupo se obtiene sumando esos 2 electrones s más el número de electrones d. ¿En qué grupo está el hierro?",correctAnswer:8,tolerance:0,check:"2+6",explanation:"2 + 6 = 8: el hierro está en el grupo 8. Si se tomara por error el 4s^2 como electrón diferenciador, el hierro quedaría en el grupo 2, como el calcio, que es el error frecuente que hay que evitar."},{id:"tp-12",topic:"Configuración desde periodo y grupo",objective:"Construir la configuración electrónica de un elemento a partir de su periodo y su grupo",difficulty:"avanzada",type:"short-answer",prompt:"Un elemento está en el 3.er periodo y en el grupo 17. Escribe su configuración electrónica completa.",acceptedAnswers:["1s2 2s2 2p6 3s2 3p5","1s^2 2s^2 2p^6 3s^2 3p^5"],format:"p. ej. 1s2 2s2 2p3",data:{columns:["Grupo","1","2","13","14","15","16","17","18"],rows:[["N.º de electrones del último nivel","1","2","3","4","5","6","7","8"],["Último subnivel","s1","s2","p1","p2","p3","p4","p5","p6"]],caption:"Electrones del último nivel según el grupo (tabla de la lección)"},explanation:"El 3.er periodo significa que el nivel más alto ocupado es el 3; el grupo 17 indica 5 electrones p (2 + 10 + 5 = 17). Como el subnivel s admite como máximo 2 electrones y el p 6, la configuración es 1s^2 2s^2 2p^6 3s^2 3p^5: 17 electrones, el cloro (Cl)."},{id:"tp-13",topic:"Z y configuración",objective:"Obtener el número atómico sumando los electrones de la configuración",difficulty:"media",type:"numeric",prompt:"El azufre (S) tiene configuración electrónica 1s^2 2s^2 2p^6 3s^2 3p^4. ¿Cuál es su número atómico Z?",correctAnswer:16,tolerance:0,check:"2+2+6+2+4",explanation:"El átomo es neutro, así que el número de protones coincide con el de electrones: 2 + 2 + 6 + 2 + 4 = 16. Por eso el azufre ocupa la posición 16 de la tabla, en el 3.er periodo y en el grupo 16 (2 + 10 + 4 = 16)."},{id:"tp-14",topic:"Validez de configuraciones",objective:"Detectar una configuración imposible comprobando la capacidad de cada subnivel",difficulty:"avanzada",type:"single-choice",prompt:"¿A qué elemento corresponde la configuración electrónica 1s^2 2s^2 2p^6 3s^3?",options:["No corresponde a ningún elemento","Al escandio (Sc), que abre los metales de transición en el grupo 3","Al aluminio (Al), que tiene número atómico 13","Al fósforo (P), que está en el 3.er periodo y en el grupo 15"],correctAnswer:0,shuffleOptions:!0,explanation:"El subnivel s admite como máximo 2 electrones, así que un 3s^3 es imposible: esa configuración no corresponde a ningún elemento. Es el error de buscar el elemento sin comprobar antes la capacidad de cada subnivel: el 3s^3 no sitúa a nadie en el grupo 3, y sumar 13 electrones no convierte la configuración en la del aluminio (1s^2 2s^2 2p^6 3s^2 3p^1)."},{id:"tp-15",topic:"Reactividad",objective:"Aplicar la tendencia de la reactividad a metales, no metales y gases nobles",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre la reactividad de los elementos:",options:["En los metales, la reactividad aumenta al descender en el grupo","En los no metales, la reactividad disminuye al descender en el grupo","En el grupo 17, el flúor es más reactivo que el yodo","En los gases nobles la reactividad es prácticamente nula","En el grupo 17, el yodo es más reactivo que el flúor","El potasio reacciona con el agua de forma más violenta que el sodio y que el litio","La reacción de los metales alcalinotérreos con el agua se vuelve menos intensa al descender en el grupo"],correctAnswer:[0,1,2,3,5],shuffleOptions:!1,explanation:"La reactividad de los metales crece al bajar en el grupo y la de los no metales decrece, así que en el grupo 17 el flúor es más reactivo que el yodo. Los gases nobles casi no reaccionan por tener el octeto completo. Y como la reactividad de los alcalinos aumenta al descender, el potasio reacciona con el agua más violentamente que el sodio y el litio. Es falso que la reacción de los alcalinotérreos con el agua se debilite al bajar: ocurre al revés (el berilio no reacciona con agua fría y el estroncio y el bario lo hacen intensamente)."},{id:"tp-16",topic:"Carácter metálico",objective:"Comparar el carácter metálico de elementos de un mismo grupo",difficulty:"media",type:"single-choice",prompt:"De entre el germanio (Ge), el fósforo (P), el estaño (Sn) y el silicio (Si), ¿cuál tiene mayor carácter metálico?",options:["El estaño (Sn)","El germanio (Ge)","El silicio (Si)","El fósforo (P)"],correctAnswer:0,shuffleOptions:!0,explanation:"El estaño. El carácter metálico aumenta al descender en un grupo: en el grupo 14 el carbono es no metal, el silicio y el germanio son semimetales y el estaño y el plomo son metales. El estaño es el que está más abajo de los cuatro, y el fósforo, además, está un grupo más a la derecha."},{id:"tp-17",topic:"Electronegatividad",objective:"Distinguir electronegatividad de carácter metálico al comparar elementos",difficulty:"media",type:"true-false",prompt:"De entre el calcio, el bromo, el potasio y el germanio, el potasio es el elemento con mayor electronegatividad.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. La electronegatividad es la capacidad de atraer electrones, y los metales la tienen baja: el potasio es el de mayor carácter metálico de los cuatro, no el más electronegativo. Los cuatro están en el 4.º periodo y, dentro del periodo, la electronegatividad aumenta hacia la derecha; el bromo, no metal y el más a la derecha de los cuatro (grupo 17), tiene el mayor valor."},{id:"tp-18",topic:"Radio atómico en el periodo",objective:"Aplicar la tendencia del radio al avanzar dentro de un periodo",difficulty:"media",type:"true-false",prompt:"En el 2.º periodo, el radio atómico del flúor es mayor que el del nitrógeno.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Al avanzar hacia la derecha en un periodo el radio disminuye: aumentan los protones y la atracción sobre los electrones del mismo nivel, de modo que la corteza queda más próxima al núcleo. El flúor, por estar más a la derecha que el nitrógeno, tiene menor radio que él."},{id:"tp-19",topic:"Radio atómico",objective:"Ordenar elementos por radio aplicando las dos tendencias",difficulty:"media",type:"order-steps",prompt:"Ordena de menor a mayor radio atómico los siguientes elementos.",steps:["Flúor (F)","Oxígeno (O)","Nitrógeno (N)","Silicio (Si)"],correctAnswer:[0,1,2,3],explanation:"F < O < N < Si. Los tres primeros están en el 2.º periodo y el radio disminuye hacia la derecha, así que el flúor es el menor y el nitrógeno el mayor. El silicio está en el 3.er periodo, con un nivel más, por lo que su radio es mayor que el de los tres no metales del 2.º periodo."},{id:"tp-20",topic:"Interpretación de tabla: halógenos",objective:"Ordenar elementos por un dato tabulado y relacionarlo con la tendencia del grupo",difficulty:"media",type:"order-steps",prompt:"Ordena de menor a mayor punto de ebullición los halógenos de la tabla.",steps:["Flúor (F)","Cloro (Cl)","Bromo (Br)","Yodo (I)"],correctAnswer:[0,1,2,3],data:{columns:["Halógeno","Punto de fusión (K)","Punto de ebullición (K)"],rows:[["Bromo (Br)
