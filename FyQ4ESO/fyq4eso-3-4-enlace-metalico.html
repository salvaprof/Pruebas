  <script type="module" crossorigin>const G={title:"Enlace metálico",subject:"Física y Química",level:"4º ESO",sourceLesson:"lessons/FyQ4ESO/03-Tabla periodica-Tipos de enlace/3.4-Enlace metalico.md",outputFolder:"FyQ4ESO/03-Tabla periodica-Tipos de enlace",instructions:"Responde a las 20 preguntas sobre el enlace metálico: por qué los metales ceden electrones, la red de cationes y la nube electrónica, la ecuación de ionización y los recuentos de electrones, y las propiedades (brillo, conductividad, ductilidad, maleabilidad, punto de fusión y dureza) con su explicación. Escribe las ecuaciones con la flecha de dos guiones, como Na -> Na+ + 1 e-. Al finalizar verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la estructura metálica y de la relación entre estructura y propiedades.":e>=60?"Buen trabajo; repasa la ecuación de ionización, la deslocalización de los electrones y la variación de dureza y punto de fusión.":"Conviene repasar la lección, sobre todo la red de cationes y la nube electrónica, y volver a intentarlo.",questions:[{id:"mt-01",topic:"Definición del enlace metálico",objective:"Definir el enlace metálico y distinguirlo del iónico y del covalente",difficulty:"básica",type:"single-choice",prompt:"¿Qué es el enlace metálico?",options:["El que se forma entre los átomos de los metales: sus cationes quedan ordenados y unidos por la nube de electrones que ceden","El que se forma entre un metal y un no metal, por cesión y ganancia de electrones","El que se forma entre dos no metales al compartir una pareja de electrones","El que se forma entre átomos neutros que comparten de dos en dos sus electrones externos"],correctAnswer:0,shuffleOptions:!0,explanation:"El enlace metálico se forma entre átomos del mismo metal: no interviene un segundo elemento. Los átomos ceden sus electrones externos, se convierten en cationes que se ordenan en posiciones fijas, y la nube de electrones desprendidos es la pieza que mantiene unido todo el conjunto. La cesión a un no metal describe el enlace iónico y la pareja compartida, el covalente."},{id:"mt-02",topic:"Brillo y color",objective:"Aplicar la regla del color metálico a una muestra",difficulty:"básica",type:"single-choice",prompt:"Un sólido con brillo metálico es de color rojo. ¿Qué metal es?",options:["El cobre","El oro","El sodio","El aluminio"],correctAnswer:0,shuffleOptions:!0,explanation:"El cobre. La nube electrónica refleja la luz y da el brillo metálico, y por eso casi todos los metales son de color blanco plateado; las dos excepciones que da la lección son el oro, amarillo, y el cobre, rojo."},{id:"mt-03",topic:"Red metálica",objective:"Identificar las partículas que forman un metal",difficulty:"básica",type:"true-false",prompt:"En un trozo de sodio metálico hay átomos de sodio neutros.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. En el sodio metálico los átomos han cedido su electrón del 3s^1, así que son cationes Na^+ colocados en posiciones fijas de la red, y los electrones cedidos forman la nube que rodea a todos ellos. El metal es neutro en conjunto, no porque cada partícula sea neutra."},{id:"mt-04",topic:"Cesión de electrones",objective:"Explicar por qué los metales pierden sus electrones más externos",difficulty:"media",type:"single-choice",prompt:"¿Por qué los átomos de los metales tienden a perder sus electrones más externos?",options:["Tienen pocos electrones en el último nivel y el núcleo los atrae débilmente; completar el octeto ganando electrones les costaría muchísimo","Ganan un electrón para completar el octeto, porque les falta exactamente uno","El núcleo los atrae con mucha fuerza y los arranca de la corteza","Los comparten en parejas con el átomo vecino, igual que en el enlace covalente"],correctAnswer:0,shuffleOptions:!0,explanation:"Los metales tienen pocos electrones en el último nivel (Na: 3s^1, Mg: 3s^2, Al: 3s^2 3p^1) y están muy apantallados por las capas internas, así que el núcleo los atrae débilmente. Completar el octeto les exigiría ganar muchos electrones, mientras que al no metal le falta muy poco para completarlo ganando: por eso el metal pierde. Al perder electrones quedan con más protones que electrones y se convierten en cationes: Na^+, Mg^2+, Al^3+."},{id:"mt-05",topic:"Nube electrónica",objective:"Reproducir las tres afirmaciones sobre la red y la nube",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre la red y la nube electrónica de un metal:",options:["Cada electrón de la nube sigue pegado al átomo que lo cedió","Los cationes se mueven libremente por el interior y son los que transportan la corriente","Los electrones están deslocalizados y se mueven libremente por el cristal","Proceden de los últimos niveles de todos los átomos y están compartidos por la red metálica","Los cationes ni se atraen ni se repelen entre sí, por el movimiento de los electrones que los rodean"],correctAnswer:[2,3,4],shuffleOptions:!1,explanation:"Son correctas la tercera, la cuarta y la quinta: los electrones están deslocalizados, no asignados a un átomo ni a un enlace; vienen de los últimos niveles de todos los átomos y son compartidos por toda la red; y el movimiento de esa nube hace que los cationes ni se atraigan ni se repelan. Es falso que el electrón cedido siga pegado a su átomo y falso que los cationes viajen: están en posiciones fijas y los que se mueven son los electrones."},{id:"mt-06",topic:"Ecuación de ionización",objective:"Escribir la ecuación por la que el sodio se convierte en catión",difficulty:"media",type:"short-answer",prompt:"Escribe, con la flecha de dos guiones, la ecuación por la que un átomo de sodio se convierte en catión sodio.",acceptedAnswers:["Na -> Na+ + 1 e-","Na -> Na+ + e-","Na -> Na^+ + 1 e-","Na -> Na^+ + e-","Na -> Na+ + 1 e^-","Na -> Na+ + e^-","Na -> Na^+ + 1 e^-","Na -> Na^+ + e^-","Na -> 1 e- + Na+"],format:"p. ej. Mg -> Mg2+ + 2 e-",explanation:"Na -> Na^+ + 1 e^-. A la izquierda está el átomo neutro y a la derecha el catión y el electrón que se desprende. Se comprueba el recuento: 11 electrones a la izquierda y 10 + 1 a la derecha; la carga también equilibra, 0 = (+1) + (-1)."},{id:"mt-07",topic:"Recuento de electrones del catión",objective:"Calcular los electrones que quedan en el catión",difficulty:"básica",type:"numeric",prompt:"El sodio tiene número atómico Z = 11 y cede 1 electrón. ¿Cuántos electrones le quedan al catión Na^+?",correctAnswer:10,unit:"electrones",tolerance:0,check:"11-1",explanation:"11 - 1 = 10 electrones. El núcleo no cambia, así que el átomo sigue siendo sodio, pero con 10 electrones queda con la configuración 1s^2 2s^2 2p^6, la del neón, y con un protón de más: de ahí la carga +1."},{id:"mt-08",topic:"Ecuación de ionización",objective:"Ordenar los pasos para escribir y comprobar la ecuación del sodio",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para escribir y comprobar la ecuación de ionización del sodio.",steps:["Localizar el electrón diferenciador, el último electrón de la configuración: el del 3s^1","Escribir la ecuación: Na -> Na+ + 1 e-","Restar los electrones cedidos al número atómico: 11 - 1 = 10, la configuración del neón","Comprobar la carga: 11 protones y 10 electrones, así que el ion queda con carga +1"],correctAnswer:[0,1,2,3],explanation:"Primero se localiza el electrón que se pierde, el electrón diferenciador de la configuración; con él se escribe la ecuación átomo neutro → catión + electrón; después se comprueba el recuento de electrones (11 - 1 = 10, configuración de gas noble) y por último la carga, comparando protones y electrones: 11 - 10 = 1, carga +1."},{id:"mt-09",topic:"Aplicaciones",objective:"Distinguir los usos del galio de los del silicio",difficulty:"media",type:"single-choice",prompt:"¿En qué grupo de aplicaciones se emplea el galio?",options:["En teléfonos móviles, ordenadores, termómetros y luces LED","En células solares y chips de ordenador","En cables eléctricos","En láminas de aluminio de cocina"],correctAnswer:0,shuffleOptions:!0,explanation:"El galio es un metal líquido que se emplea en teléfonos móviles, ordenadores, termómetros y luces LED. Las células solares y los chips de ordenador corresponden al silicio; los cables eléctricos, al cobre por su conductividad; y las láminas de cocina, al aluminio por su maleabilidad."},{id:"mt-10",topic:"Electrones de la nube",objective:"Calcular los electrones de la nube a partir del número de átomos",difficulty:"media",type:"numeric",prompt:"Un cristal de magnesio está formado por 250 átomos de Mg, que ceden 2 electrones cada uno. ¿Cuántos electrones hay en su nube electrónica?",correctAnswer:500,unit:"electrones",tolerance:0,check:"250*2",explanation:"250 · 2 = 500 electrones. Cada átomo de magnesio (3s^2) cede dos electrones, así que el número de electrones de la nube es el número de átomos multiplicado por los electrones cedidos por átomo. El cristal queda con 250 cationes Mg^2+ y 500 electrones: la carga neta es cero."},{id:"mt-11",topic:"Conductividad",objective:"Identificar qué partícula transporta la corriente en un metal",difficulty:"media",type:"true-false",prompt:"Un hilo de cobre conduce la electricidad porque los cationes se desplazan por su interior.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. En el metal los cationes están en posiciones fijas de la red; los que se mueven son los electrones deslocalizados de la nube, y esa movilidad explica la conductividad eléctrica y también la térmica. En el cristal iónico ocurre al revés: la sal sólida no conduce porque sus iones están encajados, y solo conduce disuelta o fundida."},{id:"mt-12",topic:"Comparar dos metales",objective:"Comparar la nube electrónica de dos cristales metálicos",difficulty:"avanzada",type:"numeric",prompt:"Un cristal de sodio y otro de magnesio tienen los dos 3000 átomos. El sodio cede 1 electrón por átomo y el magnesio 2. ¿Cuántos electrones de la nube tiene el cristal de magnesio más que el de sodio?",correctAnswer:3e3,unit:"electrones",tolerance:0,check:"3000*2-3000*1",explanation:"El sodio aporta 3000 · 1 = 3000 electrones y el magnesio 3000 · 2 = 6000, así que la diferencia es de 3000 electrones. Con el mismo número de átomos la nube depende de los electrones que cede cada átomo, y por eso el sodio, metal alcalino, tiene también el punto de fusión más bajo de los dos."},{id:"mt-13",topic:"Neutralidad del cristal",objective:"Comprobar la carga neta del cristal metálico",difficulty:"media",type:"numeric",prompt:"Un cristal de sodio tiene 500 átomos, que se convierten en 500 cationes Na^+ con su electrón cedido en la nube. ¿Cuál es la carga neta del cristal?",correctAnswer:0,unit:"de carga",tolerance:0,check:"500-500",explanation:"500 cargas positivas de los cationes y 500 cargas negativas de los electrones de la nube se compensan: la carga neta es 0. El cristal es neutro en conjunto, aunque cada catión sea positivo."},{id:"mt-14",topic:"Estabilidad de la red",objective:"Explicar por qué la red de cationes es estable",difficulty:"avanzada",type:"true-false",prompt:"Los cationes de la red metálica se repelen entre sí, por eso el cristal metálico tiende a deshacerse.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Los cationes ni se atraen ni se repelen entre sí, y la razón es el movimiento de los electrones que los rodean: la nube compensa las repulsiones y mantiene unido el conjunto. Por eso el metal puede ser un sólido estable con muchísimos cationes en posiciones fijas."},{id:"mt-15",topic:"Ductilidad y maleabilidad",objective:"Relacionar el enlace sin dirección con la deformación del metal",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las propiedades que se explican porque el enlace metálico no tiene una dirección preferente:",options:["La conductividad eléctrica","La ductilidad: el metal se puede estirar en hilos","El brillo metálico","La maleabilidad: el metal se puede laminar en láminas","Los puntos de fusión elevados de los elementos centrales"],correctAnswer:[1,3],shuffleOptions:!1,explanation:"Al no tener dirección preferente, los planos de cationes pueden deslizarse acompañados por la nube electrónica y el metal se deforma sin romperse: eso es la ductilidad (hilos, como el cable de cobre) y la maleabilidad (láminas, como la de aluminio). La conductividad y el brillo vienen de los electrones móviles y de su interacción con la luz, y los puntos de fusión elevados, de la mayor o menor fuerza del conjunto red-nube."},{id:"mt-16",topic:"Deformación frente a fractura",objective:"Comparar la deformación del metal con la fractura del cristal iónico",difficulty:"avanzada",type:"single-choice",prompt:"Al golpear un metal los planos de cationes se desplazan y se deforma sin romperse; la sal común sí se quiebra. ¿Por qué?",options:["En el metal la nube electrónica acompaña a los cationes desplazados y sigue manteniendo unida la red; en la sal, el desplazamiento enfrenta iones del mismo signo y las repulsiones rompen el cristal","Porque el enlace metálico es mucho más fuerte que el enlace iónico","Porque los metales son más blandos que la sal y por eso no se rompen","Porque los cationes metálicos son más pequeños que los iones de la sal"],correctAnswer:0,shuffleOptions:!0,explanation:"En el metal, al desplazarse los planos, los electrones deslocalizados los acompañan y la atracción se mantiene, de modo que el metal cambia de forma sin romperse. En el cristal iónico el desplazamiento coloca iones del mismo signo enfrentados y las repulsiones lo quiebran: por eso la sal es frágil. La dureza y la conductividad no explican la fractura, y el tamaño de los cationes no interviene."},{id:"mt-17",topic:"Punto de fusión y ebullición",objective:"Describir la variación del punto de fusión al recorrer la tabla",difficulty:"media",type:"single-choice",prompt:"¿Cómo varían el punto de fusión y el punto de ebullición de los metales al avanzar de izquierda a derecha por la tabla?",options:["Son bajos en los metales alcalinos, suben hasta los elementos centrales y después vuelven a descender","Aumentan de izquierda a derecha sin parar hasta el final de la tabla","Los metales alcalinos son los de punto de fusión más elevado","Todos los metales funden a temperaturas muy parecidas"],correctAnswer:0,shuffleOptions:!0,explanation:"Los metales alcalinos (litio, sodio, potasio) son los de punto de fusión más bajo; al avanzar hacia la derecha suben, alcanzan los valores más altos en los elementos centrales y después descienden. Por eso es falso que aumenten sin parar y falso que los alcalinos fundan muy alto. Los puntos de fusión son muy variados entre unos metales y otros, con los alcalinos en el extremo bajo, y hay excepciones líquidas como el mercurio y el galio."},{id:"mt-18",topic:"Carga del catión",objective:"Determinar la carga del catión de aluminio a partir de su configuración",difficulty:"media",type:"short-answer",prompt:"El aluminio tiene configuración electrónica 1s^2 2s^2 2p^6 3s^2 3p^1. Escribe la carga del catión que forma al ceder los electrones de su último nivel.",acceptedAnswers:["3+","3","Al3+","Al^3+","Al+3"],format:"p. ej. 2+",explanation:"El último nivel del aluminio es el 3, con 2 + 1 = 3 electrones, así que forma el catión Al^3+. La carga del catión coincide con el número de electrones cedidos: Na^+, Mg^2+, Al^3+. El ion queda con 13 - 3 = 10 electrones, la configuración del neón."},{id:"mt-19",topic:"Metales líquidos y silicio",objective:"Aplicar los datos de estado y de clasificación del silicio",difficulty:"básica",type:"true-false",prompt:"El silicio se considera un metal y se emplea en células solares y chips de ordenador.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. La lección trata el silicio como metal, igual que el libro, y lo cita como material de las células solares y de los chips de ordenador, frente al galio y el mercurio, que son los metales líquidos que da la lección. Ten en cuenta que en la tabla el silicio está en la zona de los no metales y que otros textos lo llaman metaloide: es una convención del libro, no un dato que cambie sus usos."},{id:"mt-20",topic:"Dureza",objective:"Aplicar la regla de la dureza y rechazar su relación con la conductividad",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la afirmación correcta sobre la dureza de los metales?",options:["Los metales alcalinos son blandos y se pueden cortar, mientras que el osmio y el iridio son muy duros","Los metales alcalinos son los más duros de la tabla","La dureza de un metal aumenta a la vez que su conductividad","Todos los metales tienen la misma dureza"],correctAnswer:0,shuffleOptions:!0,explanation:"La dureza sigue el mismo recorrido que el punto de fusión: blanda en los alcalinos, que se cortan, y máxima en los elementos centrales, con el osmio y el iridio como los más duros. Dureza y conductividad son propiedades independientes: el oro es blando y a la vez un buen conductor."}]},W=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso34EnlaceMetalicoAssessment:G},Symbol.toStringTag,{value:"Module"})),J={"mt-01":{hint:"Piensa cuántos elementos intervienen: ¿hace falta un no metal, o se trata de átomos todos iguales?"},"mt-02":{hint:"Recuerda los dos metales que la lección saca de la regla del color blanco plateado."},"mt-03":{hint:"Repasa qué le pasa al electrón del 3s^1 del sodio cuando el metal se forma y qué queda en cada posición de la red."},"mt-04":{hint:"Compara cuántos electrones le faltan a un metal para completar el octeto frente a cuántos le faltan a un no metal ganando."},"mt-05":{hint:"Decide quién se mueve y quién está en posición fija, y si el electrón cedido sigue asignado a un átomo."},"mt-06":{hint:"Escribe a la izquierda el átomo neutro y a la derecha lo que resulta de perder su electrón del 3s^1; después comprueba que cuadran electrones y cargas."},"mt-07":{hint:"Al catión le quedan los electrones del átomo menos los cedidos; el sodio e
