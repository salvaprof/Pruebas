          <p>${o.explanation}</p>

      <button id="retry" class="primary">Repetir</button>
    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{n=0,r=0,a=0,l()}};l()}const w={title:"Núcleo atómico",subject:"Física y Química",level:"4.º ESO",sourceLesson:"lessons/FyQ4ESO/2.3-Nucleo atomico_desarrollo.md",instructions:"Responde a las 20 preguntas sobre el núcleo atómico. Se evalúan el descubrimiento del neutrón, la estructura del átomo, número atómico y másico, isótopos, radiactividad, la unidad de masa atómica y la masa media ponderada de un elemento. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del núcleo atómico y la masa atómica.":e>=60?"Buen trabajo; repasa isótopos, número másico y la media ponderada de masas.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"na-01",topic:"Descubrimiento del neutrón",objective:"Identificar quién detectó el neutrón",difficulty:"básica",type:"single-choice",prompt:"¿Quién logró detectar experimentalmente el neutrón en 1932?",options:["Ernest Rutherford","J. J. Thomson","James Chadwick","Niels Bohr"],correctAnswer:2,shuffleOptions:!0,explanation:"James Chadwick (1891-1974) detectó el neutrón en 1932. Rutherford había hipotetizado su existencia años antes, pero no lo logró detectar experimentalmente."},{id:"na-02",topic:"Número atómico",objective:"Definir el número atómico Z",difficulty:"básica",type:"single-choice",prompt:"El número atómico (Z) de un elemento es:",options:["El número total de partículas (protones + neutrones + electrones)","El número de protones del átomo","El número de neutrones del átomo","La masa del átomo en u"],correctAnswer:1,shuffleOptions:!0,explanation:"El número atómico Z es el número de protones. Es lo que identifica al elemento: si dos átomos tienen distinto Z, son elementos distintos."},{id:"na-03",topic:"Número másico",objective:"Definir el número másico A",difficulty:"básica",type:"single-choice",prompt:"El número másico (A) de un átomo es:",options:["El número de electrones","La masa del átomo en kilogramos","La suma de protones y neutrones (nucleones)","El número de protones menos el de neutrones"],correctAnswer:2,shuffleOptions:!0,explanation:"A = Z + N (protones + neutrones). Es el número total de nucleones. No es la masa en kg, sino un recuento de partículas. Aproximadamente, A también es la masa en u."},{id:"na-04",topic:"Neutrón",objective:"Recordar la carga del neutrón",difficulty:"básica",type:"true-false",prompt:"El neutrón tiene carga eléctrica positiva.",options:["Verdadero","Falso"],correctAnswer:1,explanation:'Falso. El neutrón tiene carga eléctrica CERO (q = 0), por eso se llama "neutro". Su masa (1,6748 × 10⁻²⁷ kg) es casi igual a la del protón.'},{id:"na-05",topic:"Unidad de masa atómica",objective:"Definir la unidad de masa atómica (u)",difficulty:"básica",type:"single-choice",prompt:"La unidad de masa atómica (u) se define como:",options:["La masa de un protón","La doceava parte de la masa del isótopo carbono-12","La masa de un átomo de hidrógeno","Un miligramo dividido entre 1000"],correctAnswer:1,shuffleOptions:!0,explanation:"1 u = m(¹²C) / 12. Se toma el isótopo carbono-12 (6 protones + 6 neutrones) y se divide su masa en 12 partes iguales. Cada parte vale 1 u."},{id:"na-06",topic:"Isótopos",objective:"Definir isótopos",difficulty:"básica",type:"single-choice",prompt:"Dos átomos son isótopos cuando:",options:["Tienen el mismo número de protones y distinto número de neutrones","Tienen el mismo número de neutrones y distinto de protones","Tienen el mismo número másico y distinto número atómico","Son átomos de elementos distintos con la misma masa"],correctAnswer:0,shuffleOptions:!0,explanation:"Los isótopos son del mismo elemento (mismo Z, mismos protones) pero con distinto número de neutrones, por lo que tienen distinto número másico A. Ejemplo: ¹H, ²H, ³H."},{id:"na-07",topic:"Núcleo atómico",objective:"Identificar qué contiene el núcleo",difficulty:"básica",type:"single-choice",prompt:"El núcleo atómico contiene:",options:["Solo protones","Protones y electrones","Protones y neutrones","Solo neutrones"],correctAnswer:2,shuffleOptions:!0,explanation:"El núcleo contiene protones (carga +) y neutrones (carga 0). Los electrones están fuera, en la corteza. Protones + neutrones = nucleones."},{id:"na-08",topic:"Cálculo de neutrones",objective:"Calcular el número de neutrones",difficulty:"media",type:"numeric",prompt:"Un átomo tiene número atómico Z = 11 y número másico A = 23. ¿Cuántos neutrones tiene?",correctAnswer:12,tolerance:1,explanation:"N = A − Z = 23 − 11 = 12 neutrones. El sodio-23 tiene 11 protones y 12 neutrones."},{id:"na-09",topic:"Notación atómica",objective:"Interpretar la notación A/Z X",difficulty:"media",type:"single-choice",prompt:"En la notación ²³₁₁Na, ¿cuántos electrones tiene el átomo si es neutro?",options:["11","23","12","0"],correctAnswer:0,shuffleOptions:!0,explanation:"En un átomo neutro, el número de electrones es igual al número de protones (Z). Como Z = 11, tiene 11 electrones. El 23 es el número másico (protones + neutrones)."},{id:"na-10",topic:"Neutralidad atómica",objective:"Aplicar la neutralidad del átomo",difficulty:"media",type:"true-false",prompt:"En un átomo neutro, el número de electrones es igual al número de protones.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. La neutralidad se logra porque la carga positiva de los protones se compensa con la carga negativa de los electrones: mismo número de cada uno → carga total = 0."},{id:"na-11",topic:"Masa media ponderada",objective:"Calcular la masa media de un elemento con 2 isótopos",difficulty:"media",type:"numeric",prompt:"El cobre tiene dos isótopos: ⁶³Cu (masa 63 u, abundancia 69 %) y ⁶⁵Cu (masa 65 u, abundancia 31 %). ¿Cuál es la masa media del cobre en u? (Redondea a 2 decimales)",correctAnswer:63.62,tolerance:.1,unit:"u",explanation:"Masa media = (63 × 69 + 65 × 31) / 100 = (4347 + 2015) / 100 = 6362 / 100 = 63,62 u. Se multiplica cada masa por su abundancia y se divide entre 100."},{id:"na-12",topic:"Radiactividad",objective:"Definir radiactividad",difficulty:"media",type:"single-choice",prompt:"La radiactividad es:",options:["La emisión de luz por un átomo excitado","La pérdida espontánea de partículas y energía por algunos isótopos inestables","La absorción de neutrones por el núcleo","La formación de iones en disolución"],correctAnswer:1,shuffleOptions:!0,explanation:"La radiactividad es la propiedad de algunos isótopos de perder energía y partículas subatómicas de forma espontánea. Al perder protones o neutrones, el isótopo puede transformarse en otro elemento (cambia Z y A)."},{id:"na-13",topic:"Isótopos del hidrógeno",objective:"Identificar los isótopos del hidrógeno",difficulty:"media",type:"multiple-choice",prompt:"Selecciona los tres isótopos naturales del hidrógeno:",options:["Protio (¹H)","Deuterio (²H)","Tritio (³H)","Helio-4 (⁴He)"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Los tres isótopos del hidrógeno son: protio (1p, 0n), deuterio (1p, 1n) y tritio (1p, 2n). El helio-4 es un isótopo del helio, no del hidrógeno."},{id:"na-14",topic:"Masa del elemento",objective:"Explicar por qué la masa de un elemento no es entera",difficulty:"media",type:"single-choice",prompt:"La masa del cloro en la tabla periódica es 35,5 u, que no es un número entero. ¿Por qué?",options:["Porque el cloro no tiene isótopos","Porque es la media ponderada de sus isótopos (³⁵Cl y ³⁷Cl)","Porque el cloro es un gas","Porque la unidad u no está bien definida"],correctAnswer:1,shuffleOptions:!0,explanation:"El cloro tiene dos isótopos: ³⁵Cl (75,5 %) y ³⁷Cl (24,5 %). La masa del elemento es la media ponderada: (35×75,5 + 37×24,5)/100 = 35,49 ≈ 35,5 u. No existe ningún átomo de cloro que pese 35,5 u."},{id:"na-15",topic:"Masa del electrón",objective:"Justificar por qué se desprecia la masa del electrón",difficulty:"media",type:"true-false",prompt:"La masa del electrón se desprecia en el cálculo de la masa atómica porque es ≈ 1836 veces menor que la del protón.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. m_e ≈ 9,109 × 10⁻³¹ kg frente a m_p ≈ 1,6725 × 10⁻²⁷ kg. La razón es ≈ 1836. Por eso la masa del átomo la aportan prácticamente los nucleones (protones + neutrones)."},{id:"na-16",topic:"Hipótesis del neutrón",objective:"Explicar por qué Rutherford hipotetizó el neutrón",difficulty:"avanzada",type:"single-choice",prompt:"Rutherford hipotetizó la existencia del neutrón porque:",options:["Observó partículas neutras en el microscopio","La masa experimental de los átomos era ≈ el doble de la masa teórica (solo protones)","Los átomos no eran neutros eléctricamente","El experimento de Thomson falló"],correctAnswer:1,shuffleOptions:!0,explanation:"Si solo sumaba protones, la masa teórica era la mitad de la experimental. Debió haber partículas con masa similar al protón pero sin carga (neutrones) que no detectaba. Chadwick las detectó en 1932."},{id:"na-17",topic:"Masa media ponderada",objective:"Calcular la masa media con 3 isótopos",difficulty:"avanzada",type:"numeric",prompt:"El magnesio tiene tres isótopos: ²⁴Mg (24 u, 78,6 %), ²⁵Mg (25 u, 10,1 %) y ²⁶Mg (26 u, 11,3 %). ¿Cuál es la masa media del magnesio en u? (Redondea a 2 decimales)",correctAnswer:24.33,tolerance:.1,unit:"u",explanation:"Masa = (24×78,6 + 25×10,1 + 26×11,3) / 100 = (1886,4 + 252,5 + 293,8) / 100 = 2432,7 / 100 = 24,33 u."},{id:"na-18",topic:"Isótopos y radiactividad",objective:"Detectar el error de pensar que todos los isótopos son radiactivos",difficulty:"avanzada",type:"true-false",prompt:"Todos los isótopos de un elemento son radiactivos.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Muchos isótopos son estables. La radiactividad es una propiedad de ALGUNOS isótopos, no de todos. Por ejemplo, el carbono-12 es estable y el carbono-14 es radiactivo."},{id:"na-19",topic:"Masa de átomo vs masa de elemento",objective:"Distinguir masa de un átomo concreto de la masa del elemento",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál es la diferencia entre la masa de un átomo y la masa de un elemento?",options:["No hay diferencia: son lo mismo","La masa de un átomo es un entero (igual a A, en u); la masa del elemento es una media ponderada (con decimales)","La masa del átomo se mide en kg y la del elemento en u","La masa del átomo cambia con la temperatura"],correctAnswer:1,shuffleOptions:!0,explanation:"Un átomo concreto de cloro pesa 35 u o 37 u (entero, igual a A). La masa del elemento cloro (35,5 u) es la media ponderada de todos sus isótopos según su abundancia. No existe un átomo que pese 35,5 u."},{id:"na-20",topic:"Confusiones frecuentes",objective:"Detectar errores comunes sobre isótopos y números atómicos",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS:",options:["Los isótopos son el mismo elemento (mismo Z) con distinto A","Dos átomos con el mismo A son necesariamente del mismo elemento","Las propiedades químicas de los isótopos son prácticamente idénticas","El número másico A siempre es par"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"Opción 2 es falsa: argón-40 y calcio-40 tienen el mismo A=40 pero son elementos distintos (Z=18 y Z=20). Opción 4 es falsa: el hidrógeno-1 (protio) tiene A=1, que es impar. Lo que define al elemento es Z, no A."}]};x(document.querySelector("#app"),w);</script>
