  <script type="module" crossorigin>const Z={title:"Naturaleza eléctrica de la materia",subject:"Física y Química",level:"4.º ESO",sourceLesson:"lessons/FyQ4ESO/02-Estructura atomica/2.1-Naturaleza electrica de la materia.md",outputFolder:"FyQ4ESO/02-Estructura atomica",instructions:"Responde a las 20 preguntas sobre la naturaleza eléctrica de la materia. Se evalúan el experimento de rayos catódicos, el descubrimiento del electrón y del protón, las cargas y masas de las partículas subatómicas, y la formación de iones. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la naturaleza eléctrica de la materia.":e>=60?"Buen trabajo; repasa los datos del electrón y del protón y la diferencia entre rayos catódicos y canales.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"nem-01",topic:"Carga eléctrica",objective:"Identificar la unidad SI de la carga eléctrica",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la unidad de la carga eléctrica en el Sistema Internacional?",options:["Voltio (V)","Coulomb (C)","Amperio (A)","Ohm (Ω)"],correctAnswer:1,shuffleOptions:!0,explanation:"La carga eléctrica se mide en coulombios (C) en el SI. El voltio es la unidad de diferencia de potencial, el amperio de intensidad y el ohm de resistencia."},{id:"nem-02",topic:"Teoría atómica de Dalton",objective:"Recordar la afirmación fundamental de Dalton",difficulty:"básica",type:"single-choice",prompt:"Según la teoría atómica de Dalton (1808), el átomo es:",options:["Una esfera con carga positiva y electrones incrustados","Indivisible e indestructible","Un núcleo denso rodeado de electrones","Una nube de probabilidad"],correctAnswer:1,shuffleOptions:!0,explanation:'Dalton propuso que la materia está formada por partículas muy pequeñas e indivisibles denominadas átomos. La palabra "átomo" viene del griego "que no se puede cortar". Fue J. J. Thomson quien demostró que el átomo no es indivisible.'},{id:"nem-03",topic:"Rayos catódicos",objective:"Identificar el origen de los rayos catódicos",difficulty:"básica",type:"single-choice",prompt:"En el experimento de Thomson, los rayos catódicos salen del:",options:["Ánodo (polo positivo)","Cátodo (polo negativo)","Gas del tubo","Tapa del tubo"],correctAnswer:1,shuffleOptions:!0,explanation:'Los rayos catódicos salen del cátodo (electrodo negativo) y viajan en línea recta hacia el ánodo. Por eso se les llama "rayos catódicos": rayos que salen del cátodo.'},{id:"nem-04",topic:"Descubrimiento del electrón",objective:"Identificar quién descubrió el electrón",difficulty:"básica",type:"single-choice",prompt:"¿Quién descubrió el electrón en 1897?",options:["Ernest Rutherford","J. J. Thomson","Eugen Goldstein","Niels Bohr"],correctAnswer:1,shuffleOptions:!0,explanation:"J. J. Thomson (1856-1940) realizó en 1897 el experimento con rayos catódicos que demostró la existencia del electrón, una partícula con carga negativa y masa presente en todos los átomos."},{id:"nem-05",topic:"Propiedades de los rayos catódicos",objective:"Identificar las tres propiedades demostradas",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona las propiedades de los rayos catódicos que demostró el experimento de Thomson:",options:["Viajan en línea recta","Tienen carga negativa","Tienen masa","Salen del ánodo"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Thomson demostró tres hechos: los rayos viajan en línea recta (proyectan sombras), tienen carga negativa (se desvían hacia la placa positiva) y tienen masa (hacen girar un molinillo). Salen del cátodo, no del ánodo."},{id:"nem-06",topic:"Carga del electrón",objective:"Recordar el signo de la carga del electrón",difficulty:"básica",type:"true-false",prompt:"El electrón tiene carga eléctrica positiva.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El electrón tiene carga negativa (q = -1,602 × 10⁻¹⁹ C). Los rayos catódicos se desviaban hacia la placa positiva, lo que indicaba que las partículas que los forman tienen carga negativa."},{id:"nem-07",topic:"Carga elemental",objective:"Recordar el valor de la carga del electrón",difficulty:"básica",type:"numeric",prompt:"¿Cuántos Coulomb tiene la carga de un electrón? Escribe el valor en notación científica: X,Xe±n",correctAnswer:-1602e-22,tolerance:2e-22,format:"X,Xe±n",unit:"C",explanation:"La carga del electrón es q = -1,602 × 10⁻¹⁹ C. Este valor se llama carga elemental (e) y es la misma en magnitud que la del protón, pero con signo contrario."},{id:"nem-08",topic:"Masa del electrón",objective:"Calcular la masa del electrón",difficulty:"media",type:"numeric",prompt:"Si la relación carga/masa del electrón es 1,76 × 10¹¹ C/kg y su carga es 1,602 × 10⁻¹⁹ C, ¿cuál es su masa en kg? (Escribe el resultado en notación científica: X,Xe±n)",correctAnswer:9109e-34,tolerance:5e-33,format:"X,Xe±n",unit:"kg",explanation:"m = e / (e/m) = 1,602 × 10⁻¹⁹ C / (1,76 × 10¹¹ C/kg) ≈ 9,109 × 10⁻³¹ kg. Se divide la carga entre la relación carga/masa."},{id:"nem-09",topic:"Masa del protón",objective:"Comparar masas de protón y electrón",difficulty:"media",type:"numeric",prompt:"¿Cuántas veces es mayor la masa del protón que la del electrón? (Redondea al entero más cercano)",correctAnswer:1836,tolerance:10,explanation:"m_p / m_e = 1,6725 × 10⁻²⁷ kg / 9,109 × 10⁻³¹ kg ≈ 1836. El protón es unas 1836 veces más masivo que el electrón. Por eso la masa del electrón se considera despreciable."},{id:"nem-10",topic:"Rayos canales",objective:"Distinguir rayos canales de rayos catódicos",difficulty:"media",type:"single-choice",prompt:"¿Desde dónde salen las partículas que forman los rayos canales?",options:["Del cátodo","Del ánodo","Del gas contenido en el tubo","De las paredes del tubo"],correctAnswer:2,shuffleOptions:!0,explanation:"A diferencia de los rayos catódicos (que salen del cátodo), los rayos canales salen del propio gas del tubo. Los electrones arrancados del cátodo chocan con las moléculas del gas y les arrancan electrones, produciendo cationes que forman los rayos canales."},{id:"nem-11",topic:"Carga de los rayos canales",objective:"Identificar el signo de la carga de los rayos canales",difficulty:"media",type:"true-false",prompt:"Los rayos canales tienen carga eléctrica positiva.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. Los rayos canales se desviaban hacia la placa negativa (se atraían por ella), lo que indica que tienen carga positiva. Están formados por cationes del gas (átomos o moléculas que han perdido electrones)."},{id:"nem-12",topic:"Dependencia de q/m",objective:"Comprender la diferencia entre rayos catódicos y canales",difficulty:"media",type:"single-choice",prompt:"La relación carga/masa de los rayos canales, a diferencia de los catódicos:",options:["Es constante para todos los gases","Depende del gas contenido en el tubo","Es siempre igual a la del electrón","No se puede medir"],correctAnswer:1,shuffleOptions:!0,explanation:"La relación q/m de los rayos canales depende del gas: si es hidrógeno (H⁺) es mayor (masa pequeña), si es neón (Ne⁺) es menor (masa mayor). En cambio, la q/m de los rayos catódicos es constante para todos los elementos, lo que demuestra que el electrón es universal."},{id:"nem-13",topic:"Protón",objective:"Identificar el protón como catión de hidrógeno",difficulty:"media",type:"short-answer",prompt:"Escribe el nombre de la partícula positiva que forma los rayos canales cuando el gas del tubo es hidrógeno.",acceptedAnswers:["protón","proton","el proton","el protón"],format:"p. ej. neutrón",explanation:"El protón. Es el catión del hidrógeno (H⁺): un átomo de hidrógeno al que se le ha quitado su electrón. El hidrógeno es el átomo más ligero, así que el protón es la partícula de menor masa que forma los rayos canales."},{id:"nem-14",topic:"Carga del protón",objective:"Recordar el valor de la carga del protón",difficulty:"media",type:"numeric",prompt:"¿Cuántos Coulomb tiene la carga de un protón? (Escribe solo la magnitud, en notación científica: X,Xe±n)",correctAnswer:1602e-22,tolerance:2e-22,format:"X,Xe±n",unit:"C",explanation:"La carga del protón es +1,602 × 10⁻¹⁹ C: igual en magnitud a la del electrón pero con signo positivo. Esta simetría es la base de la neutralidad de los átomos."},{id:"nem-15",topic:"Masa del protón",objective:"Recordar la masa del protón en kg",difficulty:"media",type:"numeric",prompt:"¿Cuál es la masa del protón en kg? (Escribe el resultado en notación científica: X,Xe±n)",correctAnswer:16725e-31,tolerance:1e-29,format:"X,Xe±n",unit:"kg",explanation:"La masa del protón es 1,6725 × 10⁻²⁷ kg. Es unas 1836 veces mayor que la del electrón (9,109 × 10⁻³¹ kg)."},{id:"nem-16",topic:"Universalidad del electrón",objective:"Ordenar el procedimiento con el que Thomson demostró que el electrón es universal",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos del procedimiento con el que Thomson demostró que el electrón es una partícula universal.",steps:["Medir la relación carga/masa de los rayos catódicos con un cátodo de cobre.","Sustituir el cátodo por otro de hierro o de platino.","Medir de nuevo la relación carga/masa de los rayos catódicos.","Concluir que la relación no cambia al cambiar el metal, así que el electrón es universal."],correctAnswer:[0,1,2,3],explanation:"El procedimiento empieza midiendo la relación e/m con un cátodo de cobre. Después se cambia el metal del cátodo (hierro o platino) y se mide de nuevo la relación. Como la relación no cambia, la partícula emitida es la misma en todos los elementos: el electrón es universal, no pertenece a un elemento concreto."},{id:"nem-17",topic:"Electroneutralidad",objective:"Explicar la neutralidad del átomo",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué un átomo es eléctricamente neutro?",options:["Porque no tiene carga","Porque tiene el mismo número de protones (+) que de electrones (−) y sus cargas se cancelan","Porque tiene neutrones","Porque está rodeado de una atmósfera"],correctAnswer:1,shuffleOptions:!0,explanation:"El protón (+) y el electrón (−) tienen cargas de igual magnitud pero signo contrario. En un átomo neutro, el número de protones es igual al de electrones, de modo que la carga total es cero: se cancelan."},{id:"nem-18",topic:"Formación de iones",objective:"Calcular la carga de un ion",difficulty:"avanzada",type:"numeric",prompt:"Un ion Ca²⁺ ha perdido 2 electrones. ¿Cuál es su carga total en Coulomb? (Escribe la magnitud en notación científica: X,Xe±n)",correctAnswer:3204e-22,tolerance:1e-21,format:"X,Xe±n",unit:"C",explanation:"q = n × e = 2 × 1,602 × 10⁻¹⁹ C = +3,204 × 10⁻¹⁹ C. Al perder 2 electrones, el ion queda con carga +2, es decir, +2 × 1,602 × 10⁻¹⁹ C."},{id:"nem-19",topic:"Formación de iones",objective:"Identificar anión o catión",difficulty:"avanzada",type:"single-choice",prompt:"Un átomo de cloro (17 protones, 17 electrones) gana 1 electrón. ¿Qué ion se forma?",options:["Catión Cl⁺ (carga positiva)","Anión Cl⁻ (carga negativa)","Isótopo de cloro","No se forma ion"],correctAnswer:1,shuffleOptions:!0,explanation:"Al ganar 1 electrón, quedan 17 protones (+) y 18 electrones (−): sobran electrones, la carga total es negativa (−1). Se forma un anión Cl⁻. Regla: perder electrones → catión (+); ganar electrones → anión (−)."},{id:"nem-20",topic:"Confusión frecuente",objective:"Detectar el error de confundir rayos catódicos y canales",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS sobre los rayos catódicos y los rayos canales:",options:["Los rayos catódicos salen del cátodo y tienen carga negativa","Los rayos canales salen del gas y tienen carga positiva","Los rayos catódicos salen del gas y los canales del cátodo","La relación q/m de los rayos catódicos es constante para todos los elementos"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Los rayos catódicos salen del cátodo (e⁻, q/m constante) y los rayos canales salen del gas (cationes, q/m depende del gas). La opción 3 invierte el origen de ambos rayos: es falsa."}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso21NaturalezaElectricaMateriaAssessment:Z},Symbol.toStringTag,{value:"Module"})),W={"nem-01":{hint:"Descarta las tres unidades que ya conoces de la electricidad: la tensión, la intensidad y la resistencia."},"nem-02":{hint:"Descarta las opciones que describen modelos posteriores al de 1808; qué decía Dalton sobre poder partir el átomo."},"nem-03":{hint:"Fíjate en su nombre: los rayos se nombran por el electrodo del que salen, no por el electrodo al que llegan."},"nem-04":{hint:"Descarta al del núcleo y al de las órbitas; el de 1897 es el del tubo de rayos catódicos, que midió su carga/masa."},"nem-05":{hint:"Repasa los tres fenómenos del tubo: la sombra que proyectan, la placa hacia la que se desvían y el molinillo que los mueve."},"nem-06":{hint:"Recuerda hacia qué placa se desviaban los rayos catódicos en el tubo: eso delata el signo de sus partículas."},"nem-07":{hint:"Es la carga elemental: la misma magnitud que la del protón, escrita con el signo propio del electrón."},"nem-08":{hint:"Despeja la masa de la relación carga/masa: divide la carga entre esa relación; el exponente queda muy por debajo del de la carga."},"nem-09":{hint:"Divide la masa del protón entre la del electrón: la diferencia de exponentes da un número de miles."},"nem-10":{hint:"No salen de ninguno de los dos electrodos: los electrones del cátodo chocan con algo del interior del tubo y lo dejan cargado."},"nem-11":{hint:"Mira hacia qué placa se desvían estas partículas, la contraria a la que atraía a los rayos catódicos: de ahí sale el signo."},"nem-12":{hint:"Compara con los catódicos, que dan siempre el mismo valor. Aquí las partículas salen de la sustancia del tubo y su masa cambia."},"nem-13":{hint:"Piensa en el átomo más ligero del tubo: al arrancarle su único electrón, ¿qué partícula queda suelta?"},"nem-14":{hint:"Es la carga elemental: igual magnitud que la del elec
