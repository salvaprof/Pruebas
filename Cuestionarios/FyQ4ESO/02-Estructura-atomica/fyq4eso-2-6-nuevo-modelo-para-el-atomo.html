  <script type="module" crossorigin>const W={title:"Un nuevo modelo para el átomo",subject:"Física y Química",level:"4.º ESO",sourceLesson:"lessons/FyQ4ESO/02-Estructura atomica/2.6-Un nuevo modelo para el atomo.md",outputFolder:"FyQ4ESO/02-Estructura atomica",instructions:"Responde a las 20 preguntas sobre el modelo cuántico del átomo. Se evalúan la dualidad onda-partícula, la mecánica cuántica, el principio de incertidumbre de Heisenberg, la ecuación de Schrödinger, los orbitales y sus formas (s y p), y las diferencias con el modelo de Bohr. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del modelo cuántico y los orbitales.":e>=60?"Buen trabajo; repasa la diferencia entre órbita y orbital, y el principio de incertidumbre.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"nm-01",topic:"Mecánica cuántica",objective:"Identificar los dos pilares de la mecánica cuántica",difficulty:"básica",type:"single-choice",prompt:"La mecánica cuántica se basa en dos pilares fundamentales:",options:["La teoría de la relatividad y la termodinámica","La ecuación de Schrödinger y el principio de incertidumbre de Heisenberg","El modelo de Bohr y el efecto Zeeman","La dualidad onda-partícula y la radiactividad"],correctAnswer:1,shuffleOptions:!0,explanation:"Los dos pilares son: (1) la ecuación de Schrödinger (1926), que describe el comportamiento ondulatorio del electrón, y (2) el principio de incertidumbre de Heisenberg, que establece un límite fundamental a lo que podemos saber."},{id:"nm-02",topic:"Orbital",objective:"Definir orbital",difficulty:"básica",type:"single-choice",prompt:"Un orbital es:",options:["La trayectoria exacta que sigue el electrón alrededor del núcleo","La zona del espacio donde la probabilidad de encontrar un electrón es muy alta (>99 %)","Una línea circular o elíptica en el plano del átomo","La velocidad a la que se mueve el electrón"],correctAnswer:1,shuffleOptions:!0,explanation:"Un orbital es un VOLUMEN tridimensional donde la probabilidad de encontrar el electrón es >99 %. No es una trayectoria ni una línea: es una región de espacio con forma (esfera, mancuerna, etc.)."},{id:"nm-03",topic:"Órbita vs orbital",objective:"Distinguir órbita (Bohr) de orbital (cuántico)",difficulty:"básica",type:"true-false",prompt:"Un orbital es la trayectoria que el electrón recorre, igual que un tren por sus raíles.",options:["Verdadero","Falso"],correctAnswer:1,explanation:'Falso. La ÓRBITA (modelo de Bohr) es una trayectoria fija (línea). El ORBITAL (mecánica cuántica) es un volumen 3D donde es PROBABLE encontrar el electrón. El electrón no "recorre" el orbital como un carrito por un raíl.'},{id:"nm-04",topic:"Forma del orbital s",objective:"Identificar la forma del orbital s",difficulty:"básica",type:"single-choice",prompt:"Los orbitales s tienen forma:",options:["De mancuerna (dos lobos)","Esférica","Cuadrada","De cuatro lobos"],correctAnswer:1,shuffleOptions:!0,explanation:"Los orbitales s son esféricos: la probabilidad de encontrar el electrón es la misma en todas las direcciones (isótropa). Como una bola centrada en el núcleo."},{id:"nm-05",topic:"Forma del orbital p",objective:"Identificar la forma del orbital p",difficulty:"básica",type:"single-choice",prompt:"Los orbitales p tienen forma de:",options:["Esfera","Mancuerna (dos lobos unidos en el centro)","Cubo","Anillo"],correctAnswer:1,shuffleOptions:!0,explanation:"Los orbitales p tienen forma de mancuerna: dos lobos (protuberancias) a cada lado del eje, con un nodo (punto de probabilidad cero) en el centro donde está el núcleo."},{id:"nm-06",topic:"Modelo cuántico",objective:"Comprender que el electrón no tiene trayectoria precisa",difficulty:"básica",type:"true-false",prompt:"En el modelo cuántico, el electrón sigue una trayectoria circular precisa alrededor del núcleo.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. En el modelo cuántico NO se puede saber la trayectoria exacta del electrón (principio de incertidumbre). Solo se puede hablar de la probabilidad de encontrarlo en ciertas zonas (orbitales)."},{id:"nm-07",topic:"Heisenberg",objective:"Identificar quién formuló el principio de incertidumbre",difficulty:"básica",type:"single-choice",prompt:"El principio de incertidumbre fue formulado por:",options:["Niels Bohr","Erwin Schrödinger","Werner Heisenberg","Arnold Sommerfeld"],correctAnswer:2,shuffleOptions:!0,explanation:"Werner Heisenberg (1901-1976) formuló el principio de incertidumbre: no es posible conocer simultáneamente con precisión la posición y la velocidad de un electrón."},{id:"nm-08",topic:"Principio de incertidumbre",objective:"Nombrar el principio de Heisenberg",difficulty:"media",type:"short-answer",prompt:"Escribe el nombre del principio que establece que no es posible conocer simultáneamente y con toda precisión la posición y la velocidad de un electrón.",acceptedAnswers:["principio de incertidumbre","el principio de incertidumbre","principio de incertidumbre de heisenberg","el principio de incertidumbre de heisenberg"],format:"p. ej. principio de exclusión",explanation:"Principio de incertidumbre (de Heisenberg). No se puede conocer simultáneamente y con toda precisión la posición y la velocidad del electrón. Es un límite fundamental de la naturaleza, no de los instrumentos."},{id:"nm-09",topic:"Orbitales p",objective:"Contar los orbitales del subnivel p",difficulty:"media",type:"numeric",prompt:"¿Cuántos orbitales tiene el subnivel p?",correctAnswer:3,tolerance:1,explanation:"El subnivel p tiene 3 orbitales (pₓ, p_y, p_z), orientados a lo largo de los tres ejes del espacio. Cada orbital admite 2 electrones, por lo que el subnivel p admite 6 electrones máximo."},{id:"nm-10",topic:"Órbita vs orbital",objective:"Comparar órbita y orbital",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la diferencia fundamental entre una órbita (Bohr) y un orbital (cuántico)?",options:["No hay diferencia: son lo mismo","La órbita es una línea 2D (trayectoria fija); el orbital es un volumen 3D (región de probabilidad)","La órbita es más grande que el orbital","El orbital es una línea y la órbita es un volumen"],correctAnswer:1,shuffleOptions:!0,explanation:"La órbita (Bohr) es una trayectoria 2D: una línea circular o elíptica. El orbital (cuántico) es un volumen 3D: una región donde es probable encontrar el electrón. Son conceptos de modelos distintos."},{id:"nm-11",topic:"Nodo del orbital p",objective:"Identificar el nodo en el orbital p",difficulty:"media",type:"true-false",prompt:"En el orbital p, el núcleo se sitúa en el punto donde la probabilidad de encontrar el electrón es cero (nodo).",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Verdadero. En el orbital p, el núcleo está justo en el punto de "estrechamiento" entre los dos lobos. Ese punto es un nodo: la probabilidad de encontrar el electrón ahí es CERO.'},{id:"nm-12",topic:"Contar orbitales y electrones de un nivel",objective:"Reproducir el procedimiento para contar orbitales y electrones de un nivel",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para calcular el número de orbitales y el máximo de electrones de un nivel de energía (por ejemplo, el nivel 3).",steps:["Cuenta los orbitales de cada subnivel: 3s = 1, 3p = 3, 3d = 5.","Suma los orbitales del nivel: 1 + 3 + 5 = 9 orbitales.","Multiplica por los 2 electrones de cada orbital: 9 × 2 = 18 electrones.","Comprueba con la fórmula del nivel: 2n² = 2 × 3² = 18 electrones."],correctAnswer:[0,1,2,3],explanation:"Se cuenta el número de orbitales de cada subnivel (s=1, p=3, d=5), se suman para obtener los orbitales del nivel, se multiplican por 2 (los dos electrones con espines opuestos de cada orbital) y se comprueba con la fórmula 2n². Para el nivel 3: 9 orbitales y 18 electrones."},{id:"nm-13",topic:"Electrones por subnivel p",objective:"Calcular el máximo de electrones en p",difficulty:"media",type:"numeric",prompt:"¿Cuántos electrones puede alojar como máximo un subnivel p?",correctAnswer:6,tolerance:1,explanation:"El subnivel p tiene 3 orbitales × 2 electrones/orbital = 6 electrones máximo. Cada orbital tiene 2 electrones con espines opuestos (↑↓)."},{id:"nm-14",topic:"Ecuación de Schrödinger",objective:"Identificar el origen de la forma de los orbitales",difficulty:"media",type:"single-choice",prompt:"La forma de los orbitales (esfera para s, mancuerna para p) se obtiene de:",options:["Observación directa con microscopio","La solución matemática de la ecuación de Schrödinger","La imaginación del físico que la propuso","El experimento de Rutherford"],correctAnswer:1,shuffleOptions:!0,explanation:"Las formas de los orbitales NO se inventan: se obtienen al resolver la ecuación de Schrödinger y representar gráficamente las soluciones. Por eso cada tipo (s, p, d, f) tiene una forma matemáticamente determinada."},{id:"nm-15",topic:"Posición del electrón",objective:"Comprender la naturaleza probabilística",difficulty:"media",type:"true-false",prompt:"En el modelo cuántico, el electrón tiene una posición exacta en todo momento, pero no podemos medirla.",options:["Verdadero","Falso"],correctAnswer:1,explanation:'Falso. No es que "no podamos medirla": es que el electrón NO tiene una posición exacta hasta que se mide. Su estado se describe como una nube de probabilidad, no como una partícula en un punto concreto.'},{id:"nm-16",topic:"Inestabilidad de órbitas precisas",objective:"Explicar por qué no se pueden dibujar órbitas precisas",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué el modelo cuántico no permite dibujar órbitas precisas como las de Bohr?",options:["Porque los electrones son demasiado pequeños para verlos","Porque el principio de incertidumbre impide conocer simultáneamente posición y velocidad, por lo que no existe una trayectoria definida","Porque el núcleo no está en el centro","Porque los electrones se mueven demasiado rápido"],correctAnswer:1,shuffleOptions:!0,explanation:"Para dibujar una trayectoria necesitas saber la posición en cada instante. El principio de incertidumbre dice que no se puede conocer posición y velocidad simultáneamente con precisión. Sin trayectoria definida, solo queda hablar de probabilidad."},{id:"nm-17",topic:"Orbitales",objective:"Evaluar afirmaciones sobre orbitales",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS sobre los orbitales:",options:["Un orbital es un volumen tridimensional, no una línea","El electrón recorre el orbital como un tren por sus raíles","Cada orbital admite como máximo 2 electrones con espines opuestos","Los orbitales s son esféricos y los p tienen forma de mancuerna"],correctAnswer:[0,2,3],shuffleOptions:!1,explanation:'La opción 2 es FALSA: el electrón NO "recorre" el orbital. El orbital es la zona donde es PROBABLE encontrarlo, no una trayectoria. Las otras tres son correctas.'},{id:"nm-18",topic:"Dualidad onda-partícula",objective:"Explicar la dualidad onda-partícula",difficulty:"avanzada",type:"single-choice",prompt:"La dualidad onda-partícula significa que:",options:["La luz es siempre una onda y nunca una partícula","Los electrones son siempre partículas y nunca ondas","Tanto la luz como los electrones pueden comportarse como onda o como partícula según el experimento","Las ondas y las partículas son lo mismo exactamente"],correctAnswer:2,shuffleOptions:!0,explanation:'La dualidad onda-partícula establece que entidades como la luz y los electrones muestran comportamiento ondulatorio en unos experimentos (difracción) y particulado en otros (efecto fotoeléctrico). No son "una onda" ni "una partícula" en el sentido clásico.'},{id:"nm-19",topic:"Orbitales por nivel",objective:"Calcular el número total de orbitales en n=3",difficulty:"avanzada",type:"numeric",prompt:"¿Cuántos orbitales tiene en total el nivel de energía n = 3? (Suma los orbitales de 3s, 3p y 3d)",correctAnswer:9,tolerance:1,explanation:"Nivel n=3 tiene: 3s (1 orbital) + 3p (3 orbitales) + 3d (5 orbitales) = 9 orbitales en total. Y 9 × 2 = 18 electrones máximo."},{id:"nm-20",topic:"Nodo en orbital p",objective:"Explicar la importancia del nodo",difficulty:"avanzada",type:"single-choice",prompt:"En el orbital p, el nodo (punto de probabilidad cero) en la posición del núcleo implica que:",options:["El electrón no puede existir","El electrón nunca se encontrará exactamente en el núcleo, a diferencia del orbital s donde la probabilidad es máxima en el centro","El núcleo repele al electrón","El orbital p es inestable y se desintegra"],correctAnswer:1,shuffleOptions:!0,explanation:"En el orbital s, la probabilidad es MÁXIMA en el núcleo (centro de la esfera). En el orbital p, la probabilidad es CERO en el núcleo (nodo): el electrón está en los dos lobos, nunca en el centro. Esto es una consecuencia directa de la ecuación de Schrödinger."}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso26NuevoModeloParaElAtomoAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"nm-01":{hint:"Descarta lo que sea física clásica o un fenómeno suelto: busca las dos herramientas con las que este modelo describe al electrón."},"nm-02":{hint:"Descarta todo lo que sea un camino, una línea o una magnitud del movimiento: piensa en tres dimensiones."},"nm-03":{hint:"Compara las dos palabras del tema: una es una línea por la que se avanza y la otra es un volumen. ¿Cuál usa el enunciado?"},"nm-04":{hint:"Compara con una bola centrada en el núcleo: la probabilidad de encontrar el electrón es igual en todas las direcciones."},"nm-05":{hint:"Busca la opción con dos protuberancias separadas por un estrechamiento; descarta la que describe una sola pieza redonda."},"nm-06":{hint:"Repasa qué dice el principio de incertidumbre sobre las trayectorias del electrón en este modelo."},"nm-07":{hint:"Es el físico del principio de incertidumbre; descarta al del modelo de las capas y al de la ecuación ondulatoria."},"nm-08":{hint:"Fíjate en qué dos magnitudes se pretenden medir a la vez y en quién pone el límite: no es un defecto del instrumento."},"nm-09":{hint:"Cuenta las orientaciones del subnivel en el espacio: una por cada eje."},"nm-10":{hint:"Repasa a qué modelo pertenece cada palabra y en qué dimensiones se representa cada una de las dos."},"nm-11":{hint:"Mira la figura del orbital p: localiza el estrechamiento que separa sus protuberancias y comprueba qué hay en ese punto."},"nm-12":{hint:"Piensa en las direcciones que definen el espacio: cuántas hacen falta para describirlo y cómo se relacionan entre sí."},"nm-13":{hint:"Multiplica el número de orbitales del subnivel por los electrones que admite cada uno de ellos."},"nm-14":{hint:"Descarta verlas con aumento, inventarlas y los experimentos de principios de siglo: las formas salen de algo que se resuelve."},"nm-15":{hint:"Distingue «no podemos medirla» de «no la tiene»: repasa qué describe exactamente la nube de probabilidad."},"nm-16":{hint:"Piensa qué hace falta saber en cada instante para poder dibujar una trayectoria: eso es lo que el modelo no concede."},"nm-17":{hint:"Prueba cada frase con lo que significa orbital; la que habla de recorrerlo como un raíl es la que sobra."},"nm-18":{hint:"Busca la opción que no encasilla a la luz ni a los electrones en un solo comportamiento: depende del montaje experimental."},"nm-19":{hint:"Suma los orbitales de los tres subniveles de ese nivel, cada uno con sus orientaciones; el enunciado te los nombra."},"nm-20":{hint:"Repasa cómo se comporta la probabilidad cerca del núcleo en los dos tipos de orbital que la lección dibuja."}},ee=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso26NuevoModeloParaElAtomoHints:J},Symbol.toStringTag,{value:"Module"})),te=["hint","keys"];function ae(e,a){const t=a&&typeof a=="object"?a:{};if(!Object.keys(t).length)return e;const n=(e?.questions??[]).map(r=>{const s=t[r.id];if(!s||typeof s!="object")return r;const b={...r};for(const g of te){const m=s[g];b[g]||(g==="keys"&&Array.isArray(m)&&m.len
