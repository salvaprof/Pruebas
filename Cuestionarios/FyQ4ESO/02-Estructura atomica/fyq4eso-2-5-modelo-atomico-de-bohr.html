  <meta name="description" content="Física y Química · 4.º ESO">
  <script type="module" crossorigin>const G={title:"Modelo atómico de Bohr",subject:"Física y Química",level:"4.º ESO",sourceLesson:"lessons/FyQ4ESO/02-Estructura atomica/2.5-Modelo atomico de Bohr.md",outputFolder:"FyQ4ESO/02-Estructura atomica",instructions:"Responde a las 20 preguntas sobre el modelo atómico de Bohr. Se evalúan los tres postulados, la cuantización de la energía, la fórmula 2n², las capas y subniveles, el efecto Zeeman, el spin, y las configuraciones electrónicas. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del modelo de Bohr y las configuraciones electrónicas.":e>=60?"Buen trabajo; repasa el orden de llenado (4s antes que 3d) y las capacidades de los subniveles.":"Conviene repasar los postulados de Bohr y las configuraciones electrónicas.",questions:[{id:"bo-01",topic:"Postulados de Bohr",objective:"Identificar el primer postulado de Bohr",difficulty:"básica",type:"single-choice",prompt:"Según el 1.º postulado de Bohr, el electrón:",options:["Puede girar en cualquier órbita y emitir energía continuamente","Solo puede girar en ciertas órbitas estacionarias donde no emite energía","No puede girar: solo puede estar quieto","Emite energía en todas las órbitas permitidas"],correctAnswer:1,shuffleOptions:!0,explanation:"El 1.º postulado establece que el electrón solo puede ocupar órbitas estacionarias (radios fijos) donde NO emite energía. Esto resuelve el problema de la inestabilidad del modelo de Rutherford."},{id:"bo-02",topic:"Fórmula 2n²",objective:"Recordar la fórmula del máximo de electrones por nivel",difficulty:"básica",type:"single-choice",prompt:"El número máximo de electrones que puede alojar un nivel de energía n viene dado por:",options:["n²","2n","2n²","n³"],correctAnswer:2,shuffleOptions:!0,explanation:"Máx. electrones = 2n². Para n=1: 2; n=2: 8; n=3: 18; n=4: 32. El factor 2 viene de que cada orbital admite 2 electrones (spin ↑↓)."},{id:"bo-03",topic:"Capas electrónicas",objective:"Recordar las letras de las capas",difficulty:"básica",type:"single-choice",prompt:"Las capas electrónicas se nombran, de la más cercana al núcleo a la más lejana:",options:["A, B, C, D, E, F, G","K, L, M, N, O, P, Q","s, p, d, f, g, h, i","I, II, III, IV, V, VI, VII"],correctAnswer:1,shuffleOptions:!0,explanation:"Las siete capas se nombran K, L, M, N, O, P, Q (de n=1 a n=7). Las letras s, p, d, f son los subniveles DENTRO de cada capa."},{id:"bo-04",topic:"Órbitas estacionarias",objective:"Comprender que en órbita estacionaria no se emite energía",difficulty:"básica",type:"true-false",prompt:"En el modelo de Bohr, el electrón emite energía mientras gira en una órbita estacionaria.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Precisamente el postulado dice que en las órbitas estacionarias el electrón NO emite energía, aunque gire. Solo emite (o absorbe) energía cuando SALTA de una órbita a otra."},{id:"bo-05",topic:"Subniveles",objective:"Recordar las letras de los subniveles",difficulty:"básica",type:"single-choice",prompt:"Los subniveles dentro de cada capa se designan con las letras:",options:["K, L, M, N","s, p, d, f","α, β, γ, δ","I, II, III, IV"],correctAnswer:1,shuffleOptions:!0,explanation:"Los subniveles son s, p, d y f. Cada capa contiene uno o varios subniveles: K solo tiene s; L tiene s y p; M tiene s, p y d; N y superiores tienen s, p, d y f."},{id:"bo-06",topic:"Capacidad del subnivel p",objective:"Recordar cuántos electrones cabe en un subnivel p",difficulty:"básica",type:"single-choice",prompt:"El subnivel p puede alojar como máximo:",options:["2 electrones","4 electrones","6 electrones","10 electrones"],correctAnswer:2,shuffleOptions:!0,explanation:"El subnivel p tiene 3 orbitales (3 orientaciones) y cada orbital admite 2 electrones: 3 × 2 = 6 electrones máximo."},{id:"bo-07",topic:"Spin del electrón",objective:"Nombrar la propiedad cuántica que se manifiesta como giro del electrón",difficulty:"básica",type:"short-answer",prompt:"Escribe el nombre de la propiedad cuántica intrínseca del electrón que se manifiesta como un giro en un sentido u otro (↑ o ↓), sin ser un giro físico real.",acceptedAnswers:["spin","el spin","el spin del electron"],format:"p. ej. momento angular",explanation:'Spin. Es una propiedad cuántica intrínseca del electrón que se manifiesta como un "giro" en un sentido u otro (↑ o ↓), pero NO es un giro físico real: no tiene análogo mecánico exacto.'},{id:"bo-08",topic:"Cálculo 2n²",objective:"Calcular el máximo de electrones en n=4",difficulty:"media",type:"numeric",prompt:"¿Cuántos electrones puede alojar como máximo el nivel de energía n = 4?",correctAnswer:32,tolerance:1,explanation:"2n² = 2 × 4² = 2 × 16 = 32 electrones. Es la capa N."},{id:"bo-09",topic:"Orden de llenado",objective:"Aplicar el orden de energía (4s antes que 3d)",difficulty:"media",type:"single-choice",prompt:"En el orden de llenado por energía, ¿qué subnivel se llena ANTES?",options:["3d antes que 4s","4s antes que 3d","Se llenan simultáneamente","Depende del elemento"],correctAnswer:1,shuffleOptions:!0,explanation:"El subnivel 4s tiene energía ligeramente MENOR que 3d, por lo que se llena antes. Por eso el potasio (Z=19) tiene 4s¹, no 3d¹. Este es el error más común en configuraciones electrónicas."},{id:"bo-10",topic:"Configuración del litio",objective:"Escribir la configuración electrónica del litio",difficulty:"media",type:"single-choice",prompt:"La configuración electrónica del litio (Li, Z = 3) es:",options:["1s¹ 2s¹ 2p¹","1s² 2s¹","1s³","1s² 2p¹"],correctAnswer:1,shuffleOptions:!0,explanation:"Litio tiene 3 electrones: 2 van al 1s (capacidad 2) y 1 al 2s. Configuración: 1s² 2s¹. No puede haber 1s³ porque el subnivel s solo admite 2 electrones."},{id:"bo-11",topic:"Orden de llenado",objective:"Detectar el error de rellenar por orden de n",difficulty:"media",type:"true-false",prompt:"El subnivel 3d se llena antes que el subnivel 4s porque 3d tiene n menor.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Aunque 3d tiene n=3 y 4s tiene n=4, la energía del 4s es LIGERAMENTE menor que la del 3d. Por eso 4s se llena ANTES que 3d. Se rellena por orden de energía, no por orden del número n."},{id:"bo-12",topic:"Orientaciones del subnivel d",objective:"Recordar el número de orbitales del subnivel d",difficulty:"media",type:"single-choice",prompt:"El subnivel d tiene cuántas orientaciones (orbitales)?",options:["1","3","5","7"],correctAnswer:2,shuffleOptions:!0,explanation:"El subnivel d tiene 5 orbitales (5 orientaciones) y por tanto admite 5 × 2 = 10 electrones. El efecto Zeeman reveló estas orientaciones distintas."},{id:"bo-13",topic:"Reparto de electrones",objective:"Reproducir el procedimiento para repartir los electrones de un átomo en niveles",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para repartir los electrones de un átomo neutro entre los niveles de energía (por ejemplo, el sodio, Z = 11).",steps:["Un átomo neutro tiene Z electrones (11 en el sodio).","Nivel 1 (tope 2): se colocan 2 y quedan 9.","Nivel 2 (tope 8): se colocan 8 y queda 1.","Nivel 3 (tope 18): el electrón que sobra va al nivel 3.","Comprueba la suma: 2 + 8 + 1 = 11."],correctAnswer:[0,1,2,3,4],explanation:"Se parte de Z electrones (átomo neutro). Se llenan los niveles por orden de energía respetando los topes 2n²: 2 en el nivel 1, 8 en el nivel 2 y el sobrante en el nivel 3. Al final se comprueba que la suma da Z. Para el sodio: 2 + 8 + 1 = 11."},{id:"bo-14",topic:"Configuración del argón",objective:"Completar la configuración del argón",difficulty:"media",type:"numeric",prompt:"El argón (Ar) tiene Z = 18. ¿Cuántos electrones tiene en su capa de valencia (capa M, n=3)?",correctAnswer:8,tolerance:1,explanation:"Ar: 1s² 2s² 2p⁶ 3s² 3p⁶. La capa M (n=3) tiene 3s² + 3p⁶ = 8 electrones. El argón es un gas noble con capa de valencia completa (octeto)."},{id:"bo-15",topic:"Sommerfeld",objective:"Identificar la contribución de Sommerfeld",difficulty:"media",type:"single-choice",prompt:"Arnold Sommerfeld modificó el modelo de Bohr para explicar:",options:["La radiactividad del uranio","La estructura fina de los espectros (dobletes y tripletes)","La fusión nuclear","El efecto fotoeléctrico"],correctAnswer:1,shuffleOptions:!0,explanation:"Sommerfeld (1916) introdujo órbitas elípticas además de circulares, lo que explicaba el desdoblamiento de las líneas espectrales (estructura fina): lo que parecía una línea era en realidad un doblete o triplete."},{id:"bo-16",topic:"Configuración del potasio",objective:"Aplicar el orden de llenado al potasio",difficulty:"avanzada",type:"single-choice",prompt:"La configuración electrónica del potasio (K, Z = 19) es:",options:["1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹","1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹","1s² 2s² 2p⁶ 3s² 3p⁵ 4s²","1s² 2s² 2p⁶ 3s² 3p⁶ 4s²"],correctAnswer:1,shuffleOptions:!0,explanation:"El 19.º electrón va al 4s (no al 3d) porque 4s tiene energía menor. Configuración: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹. Opción A es el error típico de rellenar por orden de n."},{id:"bo-17",topic:"Modelo de Bohr",objective:"Evaluar las limitaciones del modelo de Bohr",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones CORRECTAS sobre el modelo de Bohr:",options:["Explica los espectros de líneas del hidrógeno","Puede aplicarse con igual precisión a átomos con muchos electrones","Introduce la idea de que la energía electrónica está cuantizada","Sus predicciones numéricas para el hidrógeno coinciden con la mecánica cuántica"],correctAnswer:[0,2,3],shuffleOptions:!1,explanation:"La opción 2 es FALSA: el modelo de Bohr solo funciona bien para el hidrógeno (1 electrón). Para átomos con más electrones, los espectros no encajan con las predicciones simples. Las otras tres son correctas."},{id:"bo-18",topic:"Estructura fina",objective:"Explicar qué causa la estructura fina",difficulty:"avanzada",type:"single-choice",prompt:"La estructura fina de los espectros (dobletes, tripletes) indica que:",options:["El prisma no tiene suficiente resolución","Existen más saltos electrónicos de los que predice el modelo original de Bohr","Los átomos están vibrando térmicamente","La luz se refracta dos veces en el prisma"],correctAnswer:1,shuffleOptions:!0,explanation:"La estructura fina revela que hay más transiciones posibles de las que Bohr predecía. Sommerfeld lo explicó con órbitas elípticas de energías ligeramente distintas: lo que parecía una línea era un conjunto de líneas muy cercanas."},{id:"bo-19",topic:"Subnivel f",objective:"Calcular orbitales y electrones del subnivel f",difficulty:"avanzada",type:"numeric",prompt:"¿Cuántos orbitales tiene el subnivel f y cuántos electrones puede alojar como máximo? (Responde solo el número de orbitales)",correctAnswer:7,tolerance:1,explanation:"El subnivel f tiene 7 orbitales (7 orientaciones) y admite 7 × 2 = 14 electrones máximo. Es el subnivel de mayor capacidad."},{id:"bo-20",topic:"Gases nobles",objective:"Relacionar la estabilidad de los gases nobles con su configuración",difficulty:"avanzada",type:"single-choice",prompt:"Los gases nobles (He, Ne, Ar...) son químicamente muy estables porque:",options:["Tienen muy pocos electrones","Sus subniveles más externos están completos (capa de valencia llena)","No tienen electrones de valencia","Su núcleo es muy pequeño"],correctAnswer:1,shuffleOptions:!0,explanation:'Los gases nobles tienen la capa de valencia COMPLETA: He (1s²), Ne (2s² 2p⁶), Ar (3s² 3p⁶). Esa configuración "llena" es muy estable, por lo que casi no reaccionan químicamente.'}]},W=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso25ModeloAtomicoDeBohrAssessment:G},Symbol.toStringTag,{value:"Module"})),J={"bo-01":{hint:"Piensa qué problema de estabilidad del átomo de Rutherford venía de que el electrón irradiara sin parar: eso es lo que Bohr arregló."},"bo-02":{hint:"Comprueba cada opción con n = 3: la capa M admite 18 electrones; solo una fórmula reproduce ese valor."},"bo-03":{hint:"Son letras, pero la serie no empieza por la A: recuerdan la designación de la capa más cercana al núcleo."},"bo-04":{hint:"Recuerda qué postulado salva la inestabilidad del átomo: mientras el electrón sigue en su nivel, ¿qué le pasa a su energía?"},"bo-05":{hint:"No son las letras de las capas ni números romanos: son las iniciales de las series históricas del espectro."},"bo-06":{hint:"Cuenta las orientaciones del subnivel y multiplica por los dos electrones que admite cada orbital."},"bo-07":{hint:"Compara con una pelota: el electrón es puntual; busca si ese giro tiene imagen mecánica en la física cuántica."},"bo-08":{hint:"Aplica la fórmula del máximo con n = 4: eleva primero ese número al cuadrado y luego multiplica."},"bo-09":{hint:"Mira el potasio (Z = 19): su último electrón está en 4s; eso te dice cuál subnivel tiene menos energía."},"bo-10":{hint:"El litio tiene tres electrones y el subnivel s admite como máximo dos; repártelos por orden de energía."},"bo-11":{hint:"Mira el potasio (Z = 19): localiza en qué subnivel está su último electrón y compáralo con lo que afirma la frase."},"bo-12":{hint:"Cuenta sus orientaciones y multiplica por 2: es el subnivel cuyo desdoblamiento reveló el efecto Zeeman."},"bo-13":{hint:"Piensa en el autobús: los asientos se ocupan de uno en uno antes de emparejar; busca la opción que dice eso de los orbitales."},"bo-14":{hint:"Escribe la configuración del argón y suma solo los electrones con número cuántico principal 3."},"bo-15":{hint:"Su aporte de 1916 fueron órbitas elípticas; descarta radiactividad y fusión y busca qué fenómeno del espectro explicaron."},"bo-16":{hint:"El electrón número 19 no va al 3d: escribe la configuración y comprueba en qué subnivel termina."},"bo-17":{hint:"Cada afirmación se prueba con el único átomo que Bohr resolvió bien; la que no se sostiene es la que generaliza de más."},"bo-18":{hint:"Descarta el instrumento: si el prisma fuera perfecto, ¿qué diría eso sobre los niveles que Bohr permitía?"},"bo-19":{hint:"Es el
