  <meta name="description" content="Física y Química · 4º ESO">
  <script type="module" crossorigin>const J={title:"Enlace iónico",subject:"Física y Química",level:"4º ESO",sourceLesson:"lessons/FyQ4ESO/03-Tabla periodica-Tipos de enlace/3.5-Enlace ionico.md",outputFolder:"FyQ4ESO/03-Tabla periodica-Tipos de enlace",instructions:"Responde a las 20 preguntas sobre el enlace iónico: cesión y ganancia de electrones, formación de cationes y aniones, las ecuaciones del cloruro de sodio y su recuento, la red cristalina, las propiedades (punto de fusión, disolución, conductividad, dureza y fragilidad) y las aplicaciones de la sal y del hidróxido de sodio. Escribe las ecuaciones con la flecha de dos guiones, como Na -> Na+ + 1 e-. Al finalizar verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del enlace iónico, su red cristalina y sus propiedades.":e>=60?"Buen trabajo; repasa las ecuaciones con su recuento de electrones y el papel del agua al disolver la sal.":"Conviene repasar la lección, sobre todo quién cede y quién gana electrones y por qué la sal sólida no conduce, y volver a intentarlo.",questions:[{id:"io-01",topic:"Definición del enlace iónico",objective:"Definir el enlace iónico y distinguirlo del covalente y del metálico",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de estas frases define el enlace iónico?",options:["La atracción electrostática entre cationes y aniones, formados por cesión y ganancia de electrones","La compartición de una pareja de electrones entre dos átomos no metálicos","La atracción entre los cationes de una red y la nube de electrones que han cedido","La pareja de electrones que comparten un átomo de sodio y uno de cloro"],correctAnswer:0,shuffleOptions:!0,explanation:"El enlace iónico tiene dos mitades: primero los metales ceden electrones y forman cationes, los no metales los ganan y forman aniones; después esos iones de signo contrario se atraen. La pareja compartida define el enlace covalente y la nube de electrones alrededor de los cationes, el enlace metálico. En el cloruro de sodio el electrón se transfiere, no se comparte."},{id:"io-02",topic:"Transferencia de electrones",objective:"Justificar la dirección de la transferencia por el carácter metálico",difficulty:"media",type:"single-choice",prompt:"En la formación del cloruro de sodio, ¿quién cede el electrón y por qué?",options:["El sodio, que es metal, cede su electrón del 3s^1, y el cloro, que es no metal, lo gana","El cloro, que es no metal, cede un electrón de su 3p, y el sodio lo gana","Los dos átomos comparten una pareja: cada uno aporta un electrón","El sodio gana un electrón del cloro hasta completar 8 electrones en su último nivel"],correctAnswer:0,shuffleOptions:!0,explanation:"El sodio termina en 3s^1, con un solo electrón en el último nivel: le sobra uno. El cloro termina en 3s^2 3p^5, con 7 electrones: le falta justo uno. El electrón sobrante del sodio pasa al cloro y completa su octeto. Compartir la pareja sería el enlace covalente, y la dirección contraria es el error de intercambiar quién cede y quién gana."},{id:"io-03",topic:"Recuento de electrones del catión",objective:"Calcular los electrones que quedan en el catión sodio",difficulty:"básica",type:"numeric",prompt:"El sodio tiene número atómico Z = 11 y cede 1 electrón al cloro. ¿Cuántos electrones le quedan al catión Na^+?",correctAnswer:10,unit:"electrones",tolerance:0,check:"11-1",explanation:"11 - 1 = 10 electrones. El núcleo no se toca, así que el átomo sigue siendo sodio; al quedarse con 10 electrones alcanza la configuración del neón y le sobra un protón, de ahí la carga +1."},{id:"io-04",topic:"Recuento de electrones del catión",objective:"Transferir la regla del sodio a un elemento nuevo",difficulty:"media",type:"numeric",prompt:"El potasio (Z = 19) cede 1 electrón al flúor y forma el catión K^+. ¿Cuántos electrones le quedan?",correctAnswer:18,unit:"electrones",tolerance:0,check:"19-1",explanation:"19 - 1 = 18 electrones, la configuración del argón. En el fluoruro de potasio el flúor (Z = 9) gana ese electrón y se queda con 9 + 1 = 10, la configuración del neón: el anión F^-. En el catión se resta al número atómico el número de electrones cedidos."},{id:"io-05",topic:"Ecuación de cesión",objective:"Teclear la ecuación de cesión del electrón del sodio",difficulty:"básica",type:"short-answer",prompt:"Escribe, con la flecha de dos guiones, la ecuación por la que el sodio cede su electrón al convertirse en catión sodio.",acceptedAnswers:["Na -> Na+ + 1 e-","Na -> Na+ + e-","Na -> Na^+ + 1 e-","Na -> Na+ + 1 e^-","Na -> Na+ + e^-","Na -> Na^+ + e^-","Na -> 1 e- + Na+","Na -> e- + Na+","Na -> 1 e^- + Na^+","Na -> e^- + Na^+"],format:"p. ej. K -> K+ + 1 e-",explanation:"Na -> Na^+ + 1 e^-. A la izquierda el átomo neutro; a la derecha, el catión y el electrón que se desprende. El recuento cuadra: 11 electrones a la izquierda, 10 + 1 a la derecha, y la carga también equilibra (0 = +1 - 1)."},{id:"io-06",topic:"Ecuación conjunta",objective:"Teclear la ecuación conjunta de formación del cloruro de sodio",difficulty:"básica",type:"short-answer",prompt:"Escribe, con la flecha de dos guiones, la ecuación conjunta de formación del cloruro de sodio a partir de los dos elementos.",acceptedAnswers:["Na + Cl -> Na+ + Cl-","Na + Cl -> Cl- + Na+","Na + Cl -> Na^+ + Cl^-","Na + Cl -> Cl^- + Na^+","Na + Cl -> Na+ + Cl^-","Na + Cl -> Na^+ + Cl-","Na + Cl -> Cl^- + Na+","Na + Cl -> Cl- + Na^+","Cl + Na -> Na+ + Cl-","Cl + Na -> Cl- + Na+"],format:"p. ej. Na -> Na+ + 1 e-",explanation:"Na + Cl -> Na^+ + Cl^-. En la ecuación conjunta no aparece el electrón porque no sobra ni falta ninguno: el que cede el sodio lo gana exactamente el cloro. La carga queda equilibrada (0 = +1 - 1) y los electrones también: 11 + 17 = 28 a la izquierda y 10 + 18 = 28 a la derecha."},{id:"io-07",topic:"Red cristalina",objective:"Explicar por qué en la sal no hay moléculas",difficulty:"media",type:"single-choice",prompt:"¿Por qué en la sal común no hay moléculas de cloruro de sodio?",options:["Porque cada ion atrae a 6 iones de signo contrario y el enlace crece en las tres direcciones del espacio","Porque el sodio y el cloro comparten un par de electrones y forman una molécula neutra","Porque los iones se forman de dos en dos y luego se sueltan al enfriarse","Porque la sal está formada por moléculas muy unidas entre sí"],correctAnswer:0,shuffleOptions:!0,explanation:"Cada ion está rodeado por 6 iones de signo contrario y la atracción se repite en las tres direcciones del espacio, de modo que el conjunto es un cristal, no un par de iones aislados. La fórmula NaCl expresa la proporción uno a uno, no una molécula. La pareja compartida es el enlace covalente, y hablar de moléculas de sal es el error frecuente que hay que evitar."},{id:"io-08",topic:"Recuento de iones",objective:"Calcular el número total de iones del cristal",difficulty:"media",type:"numeric",prompt:"Un cristal de cloruro de sodio contiene 2500 cationes sodio. ¿Cuántos iones hay en total en el cristal? Escribe solo la cifra, sin la operación.",correctAnswer:5e3,unit:"iones",tolerance:0,check:"2500*2",format:"solo la cifra, admites la unidad escrita",explanation:"En el cristal los cationes y los aniones están uno a uno, así que a los 2500 cationes Na^+ corresponden 2500 aniones Cl^-: 2500 cationes más 2500 aniones, 5000 iones. La carga neta es cero, porque las 2500 cargas positivas se compensan con las 2500 negativas."},{id:"io-09",topic:"Atracciones de la red",objective:"Calcular las atracciones que parten de los cationes",difficulty:"avanzada",type:"numeric",prompt:"Un trozo de sal contiene 1200 cationes sodio y cada ion está rodeado por 6 iones de signo contrario. ¿Cuántas atracciones catión-anión parten de esos cationes? Escribe solo la cifra, sin la operación.",correctAnswer:7200,unit:"atracciones",tolerance:0,check:"1200*6",format:"solo la cifra, admites la unidad escrita",explanation:"Cada catión atrae a sus 6 aniones vecinos, así que 1200 * 6 = 7200 atracciones. Cada una de esas atracciones une un catión con un anión, y por eso el cristal es una red continua en las tres direcciones, con la misma cantidad de cationes y de aniones y carga neta cero."},{id:"io-10",topic:"Punto de fusión",objective:"Explicar por qué el punto de fusión es tan elevado",difficulty:"avanzada",type:"single-choice",prompt:"La sal funde a 803 °C, muy por encima de los 100 °C a los que hierve el agua. ¿Por qué?",options:["Porque hay que romper la red de atracciones que se extiende por el sólido entero, y eso cuesta mucha energía","Porque la sal está formada por moléculas muy unidas entre sí","Porque el sodio y el cloro comparten varias parejas de electrones","Porque al calentarla se forman los iones y eso requiere energía"],correctAnswer:0,shuffleOptions:!0,explanation:"Para fundir hay que romper las atracciones entre iones en todo el cristal, no separar moléculas aisladas, y eso exige mucha energía: de ahí los 803 °C, un dato del libro con su unidad. Los iones ya están formados en el sólido, no se crean al calentar, y en el enlace iónico no hay parejas de electrones compartidas."},{id:"io-11",topic:"Fragilidad y dureza",objective:"Explicar la fragilidad sin confundirla con la dureza",difficulty:"media",type:"single-choice",prompt:"La sal es dura y aun así se quiebra con un golpe. ¿Por qué?",options:["Al desplazarse una capa se enfrentan iones del mismo signo y las repulsiones rompen el cristal","Porque es blanda por dentro y el golpe la deforma","Porque al golpearla los iones se sueltan de la red y quedan libres por el sólido","Porque está formada por moléculas que se separan con facilidad"],correctAnswer:0,shuffleOptions:!0,explanation:"La dureza viene de la fortaleza del enlace, que resiste la rayadura; la fragilidad, del desplazamiento de una capa que coloca iones del mismo signo enfrentados y las repulsiones quiebran el cristal. Son dos propiedades distintas: por eso la sal es dura y frágil a la vez, y no es dúctil ni maleable. En un metal el desplazamiento no rompe, porque la nube electrónica acompaña a los cationes."},{id:"io-12",topic:"Conductividad",objective:"Descartar la conductividad de la sal sólida",difficulty:"media",type:"true-false",prompt:"La sal sólida conduce la electricidad porque está llena de iones.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. En el sólido los iones están encajados en la red y no pueden desplazarse, así que la sal sólida no conduce. Conduce cuando está disuelta o fundida, porque entonces los iones quedan libres y cada ion va hacia el electrodo de carga contraria: el catión sodio hacia el negativo y el anión cloruro hacia el positivo."},{id:"io-13",topic:"Recuento de electrones del anión",objective:"Calcular los electrones del anión cloruro a partir del número atómico y del electrón ganado",difficulty:"básica",type:"numeric",prompt:"El cloro tiene número atómico Z = 17 y gana el electrón que le cede el sodio. ¿Cuántos electrones tiene el anión cloruro Cl^-?",correctAnswer:18,unit:"electrones",tolerance:0,check:"17+1",explanation:"17 + 1 = 18 electrones. El núcleo no cambia, así que el cloro sigue con 17 protones; al sumar el electrón ganado llega a 18 electrones, la configuración del argón, y le sobra un electrón: de ahí la carga −1. Es la cuenta contraria a la del catión sodio, que resta el electrón cedido."},{id:"io-14",topic:"Ecuación de ganancia",objective:"Teclear la ecuación por la que el cloro gana un electrón y se convierte en anión cloruro",difficulty:"básica",type:"short-answer",prompt:"Escribe, con la flecha de dos guiones, la ecuación por la que un átomo de cloro gana un electrón y se convierte en anión cloruro.",acceptedAnswers:["Cl + 1 e- -> Cl-","Cl + 1 e- -> Cl^-","Cl + e- -> Cl-","Cl + e- -> Cl^-","Cl + 1 e^- -> Cl-","Cl + 1 e^- -> Cl^-","Cl + e^- -> Cl^-","e- + Cl -> Cl-","Cl + 1 e- -> Cl-1","Cl + 1 e- -> Cl^-1"],format:"p. ej. Na -> Na+ + 1 e-",explanation:"Cl + 1 e^- -> Cl^-. A la izquierda el átomo neutro y el electrón que llega; a la derecha, el anión cloruro. El recuento cuadra: 17 + 1 = 18 electrones, la configuración del argón, y la carga también: 0 + (−1) = −1. Es la mitad que falta en la ecuación conjunta Na + Cl -> Na^+ + Cl^-."},{id:"io-15",topic:"Conductividad",objective:"Sostener la conductividad en los tres estados de la sal",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre la conductividad de la sal:",options:["La sal sólida conduce porque está llena de iones","La sal disuelta en agua conduce la electricidad","Los iones libres se desplazan hacia el electrodo de carga contraria","Al fundir la sal se destruyen el catión sodio y el anión cloruro","La sal fundida conduce la electricidad"],correctAnswer:[1,2,4],shuffleOptions:!1,explanation:"Conduce disuelta y fundida, porque en esos casos los iones quedan libres y van cada uno hacia el electrodo de carga contraria. No conduce en estado sólido, con los iones encajados en la red. Y al fundir se rompe la red, no los iones: siguen siendo catión sodio y anión cloruro."},{id:"io-16",topic:"Disolución",objective:"Reconstruir el orden causal de la disolución",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre lo que ocurre al disolver la sal en agua:",options:["Los iones se fabrican en el momento de disolver la sal","El cristal llega al agua con los iones ya formados y colocados en la red","El agua arranca electrones del sodio y los transfiere al cloro","El agua rompe la estructura cristalina","Los iones quedan libres y se reparten por el líquido"],correctAnswer:[1,3,4],shuffleOptions:!1,explanation:"El orden es: el cristal llega con los iones ya formados, el agua rompe la estructura cristalina y los iones quedan libres y se reparten. El agua separa iones, no los fabrica: la transferencia de electrones ocurrió al formarse el compuesto, mucho antes de echar la sal en el agua."},{id:"io-17",topic:"Clasificación de sustancias",objective:"Clasificar una sustancia como iónica a partir de sus elementos",difficulty:"media",type:"single-choice",prompt:"¿Cuál de estas sustancias es un compuesto iónico?",options:["El yoduro de sodio, NaI","El amoniaco, NH3, porque el hidrógeno cede un electrón","El acero, porque el hierro es un metal","El agua, H2O"],correctAnswer:0,shuffleOptions:!0,explanation:"El yoduro de sodio, NaI, formado por un metal (sodio) y un no metal (yodo): el sodio cede un electrón y el yodo lo gana, formando Na^+ e I^-. El amoniaco tiene dos no metales, nitrógeno e hidrógeno, y comparten electrones: es covalente. El acero es una mezcla de hierro y carbono, con enlace metálico del hierro, y el agua es covalente."},{id:"io-18",topic:"Aplicaciones",objective:"Asociar cada aplicación con su sustancia y su causa",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las aplicaciones que da la lección a la sal y al hidróxido de sodio:",options:["La sal conserva los alimentos porque les aporta agua","El hidróxido de sodio se emplea en la fabricación de jabones y detergentes","La sal fija los colores de los alimentos","La sal fija los colores en la fabricación de telas","El hidróxido de sodio se emplea en la metalurgia para extraer la alúmina con la que se obtiene aluminio","La sal conserva los alimentos gracias a su capacidad de deshidratación"],correctAnswer:[1,3,4,5],shuffleOptions:!1,explanation:"Son correctas la segunda, la tercera, la cuarta y la sexta. La sal deshidrata: quita el agua, y sin agua no se desarrollan las bacterias que producen la putrefacción, así que conserva los alimentos por eso, no por aportarles agua. También fija los colores, en la fabricación de telas, y elimina contaminantes de las fibras. El hidróxido de sodio se usa en jabones y detergentes, en el blanqueo del papel, en textiles de algodón, en fármacos, en alimentación y en la metalurgia para extraer la alúmina con la que se obtiene aluminio."},{id:"io-19",topic:"Formación del enlace iónico",objective:"Ordenar los pasos con los que se explica la formación del NaCl",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos con los que se explica la formación del enlace iónico en el cloruro de sodio.",steps:["Escribir las estructuras electrónicas del sodio, con 11 electrones, y del cloro, con 17","Contar el electrón sobrante del sodio y el electrón que le falta al cloro","El sodio cede ese electrón y se convierte en catión sodio","El cloro gana ese electrón y se convierte en anión cloruro","Los dos iones se atraen y la red cristalina crece en las tres direcciones"],correctAnswer:[0,1,2,3,4],explanation:"Primero se escriben las estructuras (11 y 17 electrones), después se ve que al sodio le sobra un electrón y al cloro le falta justo uno, luego el sodio lo cede y queda Na^+ con 10 electrones, el cloro lo gana y queda Cl^- con 18, y por último los dos iones se atraen y la red crece en las tres direcciones. La cesión y la ganancia son la primera mitad del proceso; la atracción electrostática, la segunda."},{id:"io-20",topic:"Disolución",objective:"Ordenar lo que ocurre al disolver un cristal de sal",difficulty:"avanzada",type:"order-steps",prompt:"Ordena lo que ocurre cuando un cristal de sal se disuelve en agua.",steps:["El cristal llega al agua con sus iones ya formados, colocados en la red","El agua rompe la estructura cristalina","Los iones quedan libres","Los iones se reparten por el líquido"],correctAnswer:[0,1,2,3],explanation:"El paso clave es el primero: los iones llegan ya formados desde el cristal. El agua rompe la estructura, los iones quedan libres y se reparten. Colocar la formación de los iones al final es exactamente el error de creer que el agua fabrica los iones; el agua solo separa lo que ya estaba formado."}]},W=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso35EnlaceIonicoAssessment:J},Symbol.toStringTag,{value:"Module"})),G={"io-01":{hint:"Separa las dos mitades del proceso: primero se forman los iones y después actúa la atracción; descarta lo que describe compartir el
