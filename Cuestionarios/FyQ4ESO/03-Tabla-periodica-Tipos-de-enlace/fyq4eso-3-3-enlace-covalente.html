  <meta name="description" content="Física y Química · 4º ESO">
  <script type="module" crossorigin>const W={title:"Enlace covalente",subject:"Física y Química",level:"4º ESO",sourceLesson:"lessons/FyQ4ESO/03-Tabla periodica-Tipos de enlace/3.3-Enlace covalente.md",outputFolder:"FyQ4ESO/03-Tabla periodica-Tipos de enlace",instructions:"Responde a las 20 preguntas sobre el enlace covalente: cómo se forman las moléculas al compartir electrones, el diagrama de Lewis, los enlaces sencillos, dobles y triples, moléculas apolares y polares, las fuerzas intermoleculares, los cristales moleculares y atómicos y las aplicaciones de las sustancias covalentes. Hay preguntas de elegir opción, de marcar varias, de ordenar pasos, de escribir un número y una de escribir una palabra. Al finalizar verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del enlace covalente, sus moléculas y sus cristales.":e>=60?"Buen trabajo; repasa el diagrama de Lewis, la polaridad y la diferencia entre cristal molecular y atómico.":"Conviene repasar la lección, sobre todo el recuento de electrones y las fuerzas intermoleculares, y volver a intentarlo.",questions:[{id:"cv-01",topic:"Formación del enlace covalente",objective:"Distinguir la compartición de electrones de la cesión y ganancia",difficulty:"básica",type:"true-false",prompt:"En el enlace covalente, el átomo menos electronegativo cede un electrón y el otro átomo lo gana.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. En el enlace covalente dos átomos no metálicos comparten una pareja de electrones: ningún átomo cede ni gana electrones, así que el total no cambia; lo que cambia es que la pareja pasa a contar para los dos átomos. Ceder y ganar electrones es lo que ocurre en el enlace iónico, entre un metal y un no metal."},{id:"cv-02",topic:"Formación del enlace covalente",objective:"Explicar qué ocurre con los electrones de dos átomos no metálicos",difficulty:"media",type:"single-choice",prompt:"Al unirse dos átomos no metálicos, ¿qué ocurre con sus electrones?",options:["Comparten las parejas de electrones que les hacen falta para completar el octeto, y ningún átomo gana ni pierde electrones","El menos electronegativo cede un electrón y el otro átomo lo gana","Los dos átomos ceden sus electrones externos y quedan unidos por sus cationes","Comparten todas las parejas de electrones de sus últimos niveles, no solo las que les hacen falta para completar el octeto"],correctAnswer:0,shuffleOptions:!0,explanation:"Se comparten solo las parejas necesarias para que cada átomo quede rodeado por 8 electrones: una pareja en H-Cl y F-F, dos en O=O y tres en N≡N. Cada átomo aporta un electrón por pareja, así que ninguno gana ni pierde electrones: el total se mantiene y lo que cambia es que esas parejas pasan a contar para los dos átomos. Ceder un electrón al otro átomo describe el enlace iónico, y compartir todas las parejas de valencia dejaría alrededor de cada flúor muchos más de 8 electrones."},{id:"cv-03",topic:"Sustancias simples y compuestas",objective:"Clasificar una sustancia por el número de elementos que la forman",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona todas las sustancias simples, formadas por átomos de un solo elemento:",options:["H2","O3","HF","Cl2","H2O"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"H2, O3 y Cl2 son sustancias simples: están formadas por átomos del mismo elemento (hidrógeno, oxígeno y cloro), y el oxígeno O3 es simple aunque tenga tres átomos. HF y H2O son compuestos, porque llevan átomos de dos elementos distintos unidos por enlaces covalentes."},{id:"cv-04",topic:"Sustancias simples y compuestas",objective:"Clasificar el amoníaco escribiendo la respuesta",difficulty:"media",type:"short-answer",prompt:"El amoniaco tiene fórmula NH3, formada por nitrógeno e hidrógeno. Escribe si es una sustancia simple o un compuesto.",acceptedAnswers:["compuesto"],format:"p. ej. simple",explanation:"Es un compuesto: está formado por átomos de dos elementos distintos, nitrógeno e hidrógeno. Sería una sustancia simple si todos sus átomos fueran del mismo elemento, como H2, O3 o Cl2."},{id:"cv-05",topic:"Diagrama de Lewis",objective:"Ordenar los pasos del diagrama de Lewis para la molécula de F2",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos con los que se construye el diagrama de Lewis de la molécula de F2.",steps:["Escribir la configuración electrónica del flúor: 1s2 2s2 2p5, con 7 electrones en el último nivel","Colocar los 7 electrones del último nivel alrededor del símbolo, en parejas, dejando un electrón suelto","Enfrentar los dos símbolos de modo que los electrones sueltos queden mirándose","Sustituir la pareja compartida por una raya y colocar alrededor los electrones que no se comparten"],correctAnswer:[0,1,2,3],explanation:"El orden es: configuración electrónica, reparto de los 7 electrones externos en parejas con uno suelto, enfrentar los símbolos dejando los sueltos mirándose, y sustituir la pareja compartida por una raya. Al final cada flúor queda rodeado por 8 electrones: los 6 que no se comparten más la pareja compartida, que cuenta para los dos átomos."},{id:"cv-06",topic:"Diagrama de Lewis",objective:"Interpretar la raya del diagrama de Lewis",difficulty:"media",type:"single-choice",prompt:"En el diagrama :F-F: de la molécula de flúor, ¿qué significa la raya entre los dos símbolos?",options:["Una pareja de electrones compartida, es decir, un enlace","Un electrón que un átomo de flúor ha cedido al otro","Dos electrones que no participan en el enlace","La atracción electrostática entre dos iones de signo contrario"],correctAnswer:0,shuffleOptions:!0,explanation:"La raya es la pareja de electrones compartida: cada átomo aporta un electrón y los dos cuentan ese par en su último nivel, por eso cada flúor queda rodeado por 8 electrones. Un electrón cedido describiría un enlace iónico, y los electrones que no se comparten se dibujan en parejas alrededor del símbolo, no entre los átomos."},{id:"cv-07",topic:"Electrones de valencia",objective:"Contar los electrones del último nivel a partir de la configuración",difficulty:"media",type:"numeric",prompt:"El oxígeno tiene configuración electrónica 1s^2 2s^2 2p^4. ¿Cuántos electrones tiene en su último nivel?",correctAnswer:6,unit:"electrones",tolerance:0,check:"2+4",explanation:"El último nivel es el 2, con los electrones del 2s y del 2p: 2 + 4 = 6 electrones. El oxígeno no tiene 8 electrones en su último nivel; le faltan 2, y por eso comparte dos parejas en la molécula O2."},{id:"cv-08",topic:"Enlaces múltiples",objective:"Relacionar el número de enlaces con los electrones compartidos",difficulty:"media",type:"numeric",prompt:"En la molécula de nitrógeno N2 los dos átomos están unidos por un enlace triple. ¿Cuántos electrones comparten en total?",correctAnswer:6,unit:"electrones",tolerance:0,check:"3*2",explanation:"Cada línea del enlace es una pareja compartida, con un electrón de cada átomo. Un enlace triple son tres parejas, así que son 3*2 = 6 electrones compartidos. Con ellos, cada nitrógeno llega a 8 electrones alrededor: los 5 suyos más los 3 que aporta el otro átomo."},{id:"cv-09",topic:"Enlaces múltiples",objective:"Predecir el tipo de enlace a partir de los electrones que faltan",difficulty:"media",type:"single-choice",prompt:"El azufre (Z = 16) tiene configuración electrónica 1s^2 2s^2 2p^6 3s^2 3p^4. ¿Qué tipo de enlace se forma en la molécula S2?",options:["Doble: a cada átomo de azufre le faltan 2 electrones, así que comparten dos parejas","Triple: a cada átomo de azufre le faltan 3 electrones para llegar a 8","Sencillo: el azufre cede un electrón al otro átomo de azufre","Sencillo: los dos átomos comparten todas las parejas de sus últimos niveles"],correctAnswer:0,shuffleOptions:!0,explanation:"El último nivel del azufre es el 3, con 2 + 4 = 6 electrones: le faltan 2 para llegar a 8. El número de electrones que faltan es el número de líneas del enlace, así que el enlace es doble, S=S, y cada azufre queda rodeado por 8 electrones, con la configuración del argón."},{id:"cv-10",topic:"Moléculas diatómicas",objective:"Comprobar afirmaciones sobre moléculas diatómicas y sus enlaces",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre las moléculas diatómicas:",options:["La molécula de O2 comparte dos parejas de electrones","A cada átomo de nitrógeno le faltan 3 electrones para completar 8, por eso el enlace es triple","En Cl2 cada átomo aporta un electrón a la pareja compartida","En F2 cada átomo de flúor queda rodeado por 7 electrones","La molécula de HCl tiene un enlace doble, H=Cl"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Son correctas las tres primeras: el oxígeno le faltan 2 electrones y comparte dos parejas (O=O); el nitrógeno tiene 5 electrones externos y le faltan 3, así que el enlace es triple (N≡N); y en Cl2 cada cloro aporta un electrón a la única pareja compartida. Es falso que el flúor quede rodeado por 7 electrones: a los 6 que no comparte se suma la pareja compartida, que cuenta para los dos, así que quedan 8. Y HCl tiene un enlace sencillo H-Cl, porque a cada uno de los dos le falta un solo electrón."},{id:"cv-11",topic:"Moléculas polares",objective:"Identificar el polo negativo de una molécula polar",difficulty:"básica",type:"single-choice",prompt:"La molécula de HF es polar. ¿Qué átomo constituye el polo negativo?",options:["El flúor, porque atrae con más fuerza la pareja de electrones compartida","El hidrógeno, porque es el átomo más pequeño de los dos","El hidrógeno, porque cede su electrón al flúor","Los dos átomos por igual, porque la pareja está compartida en el centro"],correctAnswer:0,shuffleOptions:!0,explanation:"El flúor, que es más electronegativo, atrae con más fuerza la pareja compartida y se queda con una carga parcial negativa; el hidrógeno queda con carga parcial positiva. La flecha del dipolo apunta hacia el átomo más electronegativo y el signo + se escribe en el extremo opuesto. No hay transferencia de electrones: la molécula sigue siendo covalente."},{id:"cv-12",topic:"Moléculas apolares",objective:"Decidir la polaridad de una molécula con enlaces polares",difficulty:"avanzada",type:"single-choice",prompt:"El CCl4 tiene cuatro enlaces entre el carbono y el cloro, que son polares. ¿Cómo es la molécula?",options:["Apolar, porque la molécula es simétrica y sus momentos dipolares se anulan","Polar, porque tiene cuatro enlaces polares","Polar, porque el cloro es más electronegativo que el carbono","Apolar, porque el carbono y el cloro son átomos del mismo elemento"],correctAnswer:0,shuffleOptions:!0,explanation:"La molécula es apolar: sus cuatro enlaces polares están dispuestos de forma simétrica y los momentos dipolares se anulan entre sí. Lo que decide la polaridad no es el número de enlaces, sino la disposición de esos enlaces y la suma de sus dipolos. Los átomos de carbono y cloro son de elementos distintos, así que los enlaces sí son polares."},{id:"cv-13",topic:"Moléculas polares",objective:"Seleccionar moléculas polares entre diatómicas y triatómicas",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las moléculas polares:",options:["HF","Cl2","HCl","N2","H2O"],correctAnswer:[0,2,4],shuffleOptions:!1,explanation:"HF, HCl y H2O son polares: están formadas por dos elementos distintos y la pareja compartida se desplaza hacia el átomo más electronegativo (flúor, cloro y oxígeno), que queda como polo negativo. Cl2 y N2 son diatómicas homonucleares, formadas por el mismo elemento, y por eso son apolares: lo que decide la polaridad no es el número de enlaces, sino si los átomos comparten la pareja por igual."},{id:"cv-14",topic:"Fuerzas intermoleculares",objective:"Distinguir qué se rompe al fundir una sustancia molecular",difficulty:"media",type:"single-choice",prompt:"Al fundir el hielo, ¿qué ocurre en el agua?",options:["Se separan las moléculas al vencer las fuerzas intermoleculares; los enlaces covalentes de cada molécula siguen intactos","Se rompen los enlaces covalentes entre el oxígeno y el hidrógeno de cada molécula","Se rompen los enlaces covalentes y la molécula se divide en iones","No se rompe nada; el hielo solo cambia de estado porque las moléculas se calientan"],correctAnswer:0,shuffleOptions:!0,explanation:"Al fundir solo se separan las moléculas, porque las fuerzas que las unen (fuerzas intermoleculares, entre ellas el enlace de hidrógeno) son mucho más débiles que el enlace covalente. Los enlaces O-H de cada molécula siguen intactos: por eso el agua líquida sigue siendo H2O. El enlace covalente mantiene unidos los átomos de una misma molécula; el intermolecular mantiene unidas moléculas distintas."},{id:"cv-15",topic:"Fuerzas intermoleculares",objective:"Distinguir el enlace de hidrógeno del enlace covalente",difficulty:"media",type:"true-false",prompt:"El enlace de hidrógeno mantiene unidos los átomos de hidrógeno y de oxígeno dentro de una molécula de agua.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Dentro de la molécula de agua los átomos están unidos por enlaces covalentes. El enlace de hidrógeno es una fuerza intermolecular: une moléculas distintas, es mucho más débil que el enlace covalente y es el responsable, por ejemplo, de que el agua hierva a 100 °C o de que se mantengan unidas las dos cadenas del ADN."},{id:"cv-16",topic:"Fuerzas intermoleculares",objective:"Interpretar una tabla de puntos de ebullición y justificar una anomalía",difficulty:"avanzada",type:"single-choice",prompt:"Dentro de una misma familia de la tabla periódica el punto de ebullición sube al bajar de periodo: el H2S hierve a -60 °C y el H2Te cerca de 0 °C. ¿Por qué el agua hierve a 100 °C, mucho más que las demás?",options:["Porque sus moléculas son muy polares y las fuerzas que unen unas moléculas con otras son mucho más intensas","Porque sus enlaces covalentes O-H son más fuertes que los enlaces de las otras moléculas de la tabla","Porque el agua forma cristal molecular y los cristales moleculares siempre hierven por encima de 0 °C","Porque el oxígeno tiene más electrones que el azufre, el flúor y el nitrógeno"],correctAnswer:0,shuffleOptions:!0,data:{columns:["Sustancia","Punto de ebullición (°C)"],rows:[["H2O","100"],["HF","20"],["NH3","-33"],["H2Te","0"],["H2S","-60"],["HCl","-85"],["HI","-35"]],caption:"Puntos de ebullición aproximados de algunos hidruros (datos de la lección)"},explanation:"El agua es muy polar y forma enlaces de hidrógeno entre sus moléculas, unas fuerzas intermoleculares mucho más intensas que las de las demás moléculas de la tabla, así que hay que aportar mucha más energía para separarlas. Lo mismo ocurre con HF y NH3, que también hierven por encima de lo que les tocaría por su posición. Lo que se rompe al hervir son las fuerzas intermoleculares, no los enlaces covalentes, y el H2S, que no forma enlaces de hidrógeno, hierve a -60 °C."},{id:"cv-17",topic:"Cristales moleculares",objective:"Describir la unidad y los enlaces de un cristal molecular",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre un cristal molecular como el hielo:",options:["La unidad que se repite en la red es la molécula entera","El cristal existe por debajo de su punto de fusión","Dentro de cada molécula siguen activos los enlaces covalentes","Las moléculas del cristal están unidas entre sí por enlaces covalentes","Se forma a temperatura ambiente, igual que el diamante"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Son correctas las tres primeras: la unidad ordenada es la molécula entera, el cristal molecular existe a la temperatura a la que la sustancia es sólida, es decir por debajo de su punto de fusión, y dentro de cada molécula los átomos siguen unidos por enlaces covalentes. Las moléculas se mantienen unidas por fuerzas intermoleculares, mucho más débiles, y por eso el hielo funde a 0 °C; el diamante es un cristal atómico, no molecular."},{id:"cv-18",topic:"Cristales moleculares y atómicos",objective:"Relacionar la estructura del cristal con su temperatura de fusión",difficulty:"avanzada",type:"single-choice",prompt:"El hielo se funde a 0 °C y el diamante no se funde ni a temperatura muy elevada. ¿Por qué?",options:["En el hielo hay que vencer fuerzas intermoleculares débiles; en el diamante hay que romper enlaces covalentes en las tres direcciones del espacio","El diamante está formado por moléculas de carbono mucho más pesadas que las moléculas de agua","En el hielo los átomos se unen por fuerzas intermoleculares y en el diamante por enlaces covalentes","El carbono tiene más electrones de valencia que el oxígeno y eso eleva su temperatura de fusión"],correctAnswer:0,shuffleOptions:!0,explanation:"El hielo es un cristal molecular: sus moléculas siguen intactas y solo hay que separarlas venciendo fuerzas intermoleculares débiles, por eso funde a 0 °C. El diamante es un cristal atómico en el que cada carbono está enlazado a otros cuatro carbonos en tres direcciones del espacio; todo el cristal es una molécula gigante y fundirlo exigiría romper enlaces covalentes por toda la red. Dentro del hielo los átomos de H y O sí están unidos por enlaces covalentes; lo intermolecular es lo que une unas moléculas con otras."},{id:"cv-19",topic:"Cristales de carbono",objective:"Relacionar la disposición de los enlaces con las propiedades del diamante y el grafito",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre el diamante y el grafito:",options:["En el diamante cada carbono se enlaza con otros 4 carbonos en tres direcciones del espacio","En el grafito cada carbono se enlaza con 3 y forman planos hexagonales","El grafito conduce la electricidad y el diamante no","El grafito es más duro que el diamante","En el grafito cada carbono se enlaza con otros 4 carbonos","El diamante es negro y absorbe la luz"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Los carbonos del diamante forman cuatro enlaces en disposición tetraédrica que se repite en las tres direcciones, y eso lo hace el material más duro. En el grafito cada carbono se enlaza con 3 formando planos hexagonales unidos entre sí por enlaces más débiles, que le permiten deslizar y exfoliar; por eso no es más duro que el diamante. El grafito conduce la electricidad y el diamante no. El diamante es transparente y reflectante; el negro y absorbente es el grafito. Los dos son cristales formados por el mismo elemento, el carbono, con los enlaces dispuestos de forma distinta."},{id:"cv-20",topic:"Aplicaciones",objective:"Asociar una aplicación con la sustancia correspondiente de la lección",difficulty:"básica",type:"single-choice",prompt:"¿Qué sustancia se emplea sobre todo en fertilizantes y también en la industria siderúrgica, los explosivos, los detergentes y los plásticos?",options:["El ácido sulfúrico, H2SO4","El bicarbonato de sodio, NaHCO3","El hipoclorito de sodio, NaClO","El cuarzo, SiO2"],correctAnswer:0,shuffleOptions:!0,explanation:"El ácido sulfúrico, H2SO4. El bicarbonato de sodio se usa como impulsor de la repostería y para neutralizar la acidez de estómago, y el hipoclorito de sodio, con el amoniaco, es el componente de los productos de limpieza y desinfección. El cuarzo (SiO2) es un cristal atómico, no una de estas aplicaciones."}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq4eso33EnlaceCovalenteAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"cv-01":{hint:"Repasa qué hace falta para que se forme un enlace covalente entre dos no metales: ¿alguien entrega electrones o quedan compartidos?"},"cv-02":{hint:"Cuenta electrones alrededor de cada átomo en H-Cl: ¿se comparten todas las parejas de los últimos niveles o solo las que faltan para llegar a ocho?"},"cv-03":{hint:"Una sustancia simple se escribe con un solo símbolo de elemento, aunque su fórmula tenga tres átomos."},"cv-04":{hint:"Mira cuántos elementos distintos aparecen en la fórmula NH3."},"cv-05":{hint:"Antes de enfrentar los dos símbolos hay que saber cuántos electrones externos tiene cada flúor y cómo se colocan alrededor del símbolo."},"cv-06":{hint:"Compara la raya con las parejas de puntos que están alrededor de cada símbolo: una de las dos cosas une a los átomos y la otra no participa."},"cv-07":{hint:"Suma los electrones del 2s y del 2p; los del 1s no cuentan porque pertenecen al primer nivel."},"cv-08":{hint:"Una línea del enlace es una pareja, y en cada pareja hay un electrón de cada átomo."},"cv-09":{hint:"Cuenta los electrones del nivel 3 del azufre y mira cuántos le faltan para llegar a ocho: ese número es el de líneas del enlace."},"cv-10":{hint:"Repasa cuántos electrones quedan alrededor de cada átomo en F2 y de qué tipo es el enlace de la molécula de HCl."},"cv-11":{hint:"El polo negativo es el átomo que se queda con carga parcial negativa: fíjate hacia dónde se desplaza la pareja compartida."},"cv-12":{hint:"No cuentes enlaces polares: dibuja la disposición del CCl4 en el espacio y piensa qué suma dan sus cuatro flechas."},"cv-13":{hint:"Una molécula es polar cuando sus átomos no comparten la pareja por igual; descarta las formadas por un solo elemento."},"cv-14":{hint:"Distingue lo que une a los átomos de una misma molécula de lo que une a unas moléculas con otras: para fundir basta con separar moléculas."},"cv-15":{hint:"Localiza el enlace de hidrógeno en la lección: ¿actúa dentro de la molécula o entre moléculas distintas?"},"cv-16":{hint:"Compara el agua con el HF y el NH3 de la tabla: las tres comparten algo que las demás moléculas de su familia no tienen."},"cv-17":{hint:"Piensa en el hielo: qué unidad se repite en la red, por debajo de qué temperatura es sólido y qué mantiene unidos a los átomos de cada molécula."},"cv-18":{hint:"Compara qué hay que romper en cada caso: separar moléculas unas de otras, o romper enlaces en una red que es una sola molécula gigante."},"cv-19":{hint:"Cuenta con cuántos carbonos se enlaza cada carbono en el diamante y en el grafi
