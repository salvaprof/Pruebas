  <script type="module" crossorigin>const W={title:"Interés simple y compuesto",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.6-Interes simple y compuesto.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre interés simple y compuesto. Se evalúa situar las cinco magnitudes del depósito, calcular intereses y capital final en los dos sistemas, adaptar el divisor cuando el plazo viene en meses o en días, entender por qué el interés compuesto se escribe como potencia, despejar la incógnita que pregunte el enunciado y comparar ofertas. Antes de operar, decide si el tiempo multiplica al rédito o es su exponente, y si lo que piden son los intereses o el capital final.",finalMessage:e=>e>=80?"Apartado dominado: distingues los dos sistemas por el papel del tiempo, adaptas el divisor al plazo y comparas ofertas restando Cf − Ci.":e>=60?"Vas bien; revisa dos cosas: si el plazo viene en meses o días el divisor cambia, y Cf no es lo mismo que i. Escribe los datos antes de sustituir.":"Repasa la lección: en el interés simple el rédito se cobra una vez por año sobre el capital inicial; en el compuesto los intereses se reinvierten y el índice se eleva al número de períodos.",questions:[{id:"ic-01",topic:"Magnitudes del depósito",objective:"Identificar las cinco magnitudes de una operación bancaria: capital inicial, intereses, rédito anual, período de duración y capital final",difficulty:"básica",type:"single-choice",prompt:"En el enunciado «Se depositan 10 000 € en una entidad que abona un 4 % anual durante 12 años», ¿cuál de las cinco magnitudes es el rédito r?",options:["El 4 % anual, el porcentaje con el que se paga el beneficio","Los 10 000 € depositados","Los 12 años que dura el depósito","La cantidad que se recibe al terminar el plazo"],correctAnswer:0,shuffleOptions:!0,explanation:"r es el tipo de interés anual, y en las fórmulas entra como número sin el símbolo: 4 por el 4 %. Las otras cuatro magnitudes son Ci = 10 000 €, t = 12 años, Cf y los intereses i = Cf − Ci."},{id:"ic-02",topic:"Magnitudes del depósito",objective:"Identificar las cinco magnitudes de una operación bancaria: capital inicial, intereses, rédito anual, período de duración y capital final",difficulty:"básica",type:"true-false",prompt:"El capital final de un depósito es la cantidad que se recibe al terminar el plazo e incluye el capital inicial más los intereses ganados.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Cf = Ci + i, de modo que i = Cf − Ci. Con 2 000 € al 5 % simple durante 3 años, Cf = 2 300 € e i = 300 €: los dos números son distintos y se diferencian justo en el capital inicial."},{id:"ic-03",topic:"Magnitudes del depósito",objective:"Identificar las cinco magnitudes de una operación bancaria: capital inicial, intereses, rédito anual, período de duración y capital final",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre las magnitudes de un depósito o un préstamo:",options:["El rédito es el porcentaje con el que se calculan los intereses y se aplica una vez por año","El período de duración puede expresarse en años, en meses o en días","Los intereses son la diferencia entre el capital final y el capital inicial","El capital inicial es la cantidad que se recibe al terminar el plazo","El tipo de interés anual se aplica una vez por cada mes del plazo"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Ci es lo que se deposita al principio y Cf lo que se recibe al final; i = Cf − Ci. El rédito es anual, y lo que se adapta al plazo no es el rédito sino el divisor de la fórmula."},{id:"ic-04",topic:"Intereses a interés simple",objective:"Calcular los intereses de un depósito a interés simple con el tiempo expresado en años, en meses o en días",difficulty:"básica",type:"numeric",prompt:"Calcula los intereses que produce un capital de 10 000 € colocado a interés simple con un rédito anual del 4 % durante 5 años. (Respuesta en €)",correctAnswer:2e3,tolerance:.01,unit:"€",checks:[{expr:"10000*4*5/100",is:2e3}],explanation:"i = Ci·r·t/100 = (10 000·4·5)/100 = 2 000 €. El producto Ci·r/100 = 400 € es el interés de un solo año, y al ser 5 años se cobra cinco veces."},{id:"ic-05",topic:"Intereses a interés simple",objective:"Calcular los intereses de un depósito a interés simple con el tiempo expresado en años, en meses o en días",difficulty:"media",type:"numeric",prompt:"Un capital de 1 000 € se coloca a interés simple con un rédito anual del 6 % durante 18 meses. Calcula los intereses. (Respuesta en €)",correctAnswer:90,tolerance:.01,unit:"€",checks:[{expr:"1000*6*18/1200",is:90}],explanation:"Con el plazo en meses el divisor es 1200 = 100·12: i = (1 000·6·18)/1200 = 90 €, que es el rédito de año y medio. Mantener el divisor 100 daría 1 080 €, más de lo depositado."},{id:"ic-06",topic:"Intereses a interés simple",objective:"Calcular los intereses de un depósito a interés simple con el tiempo expresado en años, en meses o en días",difficulty:"media",type:"numeric",prompt:"Un capital de 6 000 € se coloca a interés simple con un rédito anual del 5 % durante 72 días. Calcula los intereses. (Respuesta en €)",correctAnswer:60,tolerance:.01,unit:"€",checks:[{expr:"6000*5*72/36000",is:60}],explanation:"Con el plazo en días el divisor es 36 000 = 100·360, por los 360 días del año comercial: i = (6 000·5·72)/36 000 = 60 €."},{id:"ic-07",topic:"Capital final a interés simple",objective:"Calcular el capital final de un depósito a interés simple con el factor 1 + r·t/100",difficulty:"media",type:"numeric",prompt:"Se depositan 25 000 € a interés simple con un rédito anual del 4,5 % durante 7 años. Calcula el capital final. (Respuesta en €)",correctAnswer:32875,tolerance:.01,unit:"€",checks:[{expr:"25000+25000*45*7/1000",is:32875}],explanation:"i = (25 000·4,5·7)/100 = 7 875 €, luego Cf = 25 000 + 7 875 = 32 875 €. Equivale al factor de todo el período: 25 000·(1 + 4,5·7/100) = 25 000·1,315."},{id:"ic-08",topic:"Capital final a interés simple",objective:"Calcular el capital final de un depósito a interés simple con el factor 1 + r·t/100",difficulty:"media",type:"single-choice",prompt:"En el depósito anterior, el valor 7 875 € que da la cuenta (25 000·4,5·7)/100 es:",options:["los intereses ganados, no el capital final","el capital final del depósito","el capital inicial aumentado en los intereses","el índice de variación de todo el período"],correctAnswer:0,shuffleOptions:!0,explanation:"7 875 € es i; el capital final es Ci + i = 32 875 €. Antes de responder hay que decidir qué pregunta el enunciado: «¿cuánto se cobra al final?» se responde con Cf y «¿cuánto se gana?», con i."},{id:"ic-09",topic:"Interés compuesto",objective:"Calcular el capital final de un depósito a interés compuesto aplicando Cf = Ci(1 + r/100)^t",difficulty:"media",type:"numeric",prompt:"Se depositan 2 000 € a interés compuesto con un rédito anual del 5 % durante 3 años. Calcula el capital final. (Respuesta en €)",correctAnswer:2315.25,tolerance:.01,unit:"€",checks:[{expr:"2000*105^3/100^3",is:2315.25}],explanation:"Cf = 2 000·(1 + 5/100)³ = 2 000·1,05³ = 2 315,25 €. El índice de variación de un año se aplica tres veces porque los intereses se reinvierten."},{id:"ic-10",topic:"Interés compuesto",objective:"Calcular el capital final de un depósito a interés compuesto aplicando Cf = Ci(1 + r/100)^t",difficulty:"media",type:"true-false",prompt:"En la fórmula Cf = Ci(1 + r/100)^t, el exponente t indica cuántas veces se aplica el índice de variación anual.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"La base es el índice de un año y el exponente cuenta las veces que se aplica, que no es lo mismo que el producto del rédito por el tiempo. Confundir los dos papeles es el error más habitual del apartado."},{id:"ic-11",topic:"Reinversión de los intereses",objective:"Explicar, calculando año a año y reinvirtiendo el capital, por qué el interés compuesto se escribe como una potencia",difficulty:"media",type:"single-choice",prompt:"Para un depósito de 2 000 € al 5 % anual a interés compuesto durante 3 años, calcular 2 000·1,05 = 2 100 € supone:",options:["aplicar el índice una sola vez en lugar de las tres que corresponden","aplicar el índice tres veces, que es lo correcto","usar bien la fórmula del interés compuesto","confundir los intereses con el capital inicial"],correctAnswer:0,shuffleOptions:!0,explanation:"El índice se aplica una vez por año: 2 000·1,05³ = 2 315,25 €. Olvidar el exponente deja el cálculo en el primer año."},{id:"ic-12",topic:"Reinversión de los intereses",objective:"Explicar, calculando año a año y reinvirtiendo el capital, por qué el interés compuesto se escribe como una potencia",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para obtener el capital final de 2 000 € al 5 % de interés compuesto durante 3 años sin usar la fórmula, reinvirtiendo cada año.",steps:["Aplica el índice de un año al capital inicial: 2 000·1,05 = 2 100 € al terminar el primer año.","Pasa ese capital final a capital inicial del segundo año: 2 100·1,05 = 2 205 €.","Repite con el tercer año: 2 205·1,05 = 2 315,25 €.","Reconoce el producto repetido: tres factores 1,05 son 1,05³, así que Cf = 2 000·1,05³.","Comprueba el sentido: el resultado supera a los 2 300 € del mismo depósito a interés simple."],correctAnswer:[0,1,2,3,4],explanation:"Cada año el capital inicial es el capital final del anterior, y por eso multiplicar el índice t veces es elevarlo a t. Los 15,25 € de ventaja sobre el simple son los intereses que han generado los intereses."},{id:"ic-13",topic:"Comparación simple y compuesto",objective:"Comparar el interés simple y el interés compuesto con los mismos datos y cuantificar la diferencia en euros",difficulty:"media",type:"numeric",prompt:"Se depositan 1 200 € al 3 % anual durante 2 años. Calcula cuántos euros supera el capital final a interés compuesto al mismo depósito a interés simple. (Respuesta en €)",correctAnswer:1.08,tolerance:.01,unit:"€",checks:[{expr:"1200*103^2/100^2-1200*106/100",is:1.08,tolerance:.001}],explanation:"Compuesto: 1 200·1,03² = 1 273,08 €. Simple: 1 200·(1 + 3·2/100) = 1 272 €. La diferencia es de 1,08 €, muy pequeña porque el plazo es corto."},{id:"ic-14",topic:"Comparación simple y compuesto",objective:"Comparar el interés simple y el interés compuesto con los mismos datos y cuantificar la diferencia en euros",difficulty:"media",type:"true-false",prompt:"Con el mismo capital, el mismo rédito y el mismo plazo, el interés simple supera al interés compuesto.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Es al revés: el compuesto siempre queda por encima, y la ventaja crece con el plazo. Con 9 000 € al 7 % durante 10 años pasan a 17 704,36 € en compuesto frente a los 15 300 € del simple, una diferencia de 2 404,36 €."},{id:"ic-15",topic:"Comparación simple y compuesto",objective:"Comparar el interés simple y el interés compuesto con los mismos datos y cuantificar la diferencia en euros",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas al comparar el interés simple y el interés compuesto:",options:["En el interés simple, duplicar el tiempo duplica los intereses","En el interés compuesto, el tiempo actúa como exponente y los intereses se multiplican en lugar de sumarse","La diferencia entre los dos sistemas aumenta al alargar el plazo","Con un plazo corto la diferencia entre los dos sistemas ya es de una magnitud importante","Los dos sistemas dan siempre el mismo capital final"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"La linealidad es la firma del simple y la potencia, la del compuesto. Con plazos cortos la diferencia es de céntimos o de pocos euros, y solo se hace grande al alargar el plazo."},{id:"ic-16",topic:"Despejar la incógnita",objective:"Despejar la incógnita que pide el enunciado en Cf = Ci(1 + r/100)^t: capital inicial, rédito con una raíz o tiempo con logaritmos",difficulty:"avanzada",type:"numeric",prompt:"Cierto capital colocado al 5 % de interés compuesto durante 8 años ha pasado a 17 729,47 €. ¿Cuál era el capital inicial? (Respuesta en €)",correctAnswer:12e3,tolerance:1,unit:"€",checks:[{expr:"17729.47/(1+5/100)^8",is:12e3,tolerance:.05}],explanation:"Ci = Cf/(1 + 5/100)⁸ = 17 729,47/1,477455 = 12 000 €. Cuando la incógnita multiplica, se despeja dividiendo; usando el factor redondeado a seis decimales salen unos céntimos de exceso."},{id:"ic-17",topic:"Despejar la incógnita",objective:"Despejar la incógnita que pide el enunciado en Cf = Ci(1 + r/100)^t: capital inicial, rédito con una raíz o tiempo con logaritmos",difficulty:"media",type:"short-answer",prompt:"Un capital colocado a interés compuesto durante 10 años se multiplica por 1,97, es decir 1,97 = (1 + r/100)^10. ¿Cuál es el rédito anual?",acceptedAnswers:["7","7 %"],format:"p. ej. 5",explanation:"Extraíendo la raíz: ¹⁰√1,97 = 1 + r/100 = 1,07, de donde r = 7, un 7 % anual. Cuando la incógnita está afectada por una potencia y se busca la base, la operación inversa es la raíz."},{id:"ic-18",topic:"Despejar la incógnita",objective:"Despejar la incógnita que pide el enunciado en Cf = Ci(1 + r/100)^t: capital inicial, rédito con una raíz o tiempo con logaritmos",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para hallar en cuántos años 28 000 € colocados al 7 % de interés compuesto se convierten en 42 020,45 €.",steps:["Aísla la potencia dividiendo el capital final entre el inicial: 42 020,45/28 000 = 1,50073.","Escribe la ecuación con la incógnita en el exponente: 1,50073 = 1,07^t.","Aplica logaritmos a los dos miembros: log 1,50073 = t·log 1,07.","Despeja t dividiendo: t = log 1,50073/log 1,07.","Calcula el resultado y compruébalo: t = 6 años, y 28 000·1,07^6 reproduce el capital final."],correctAnswer:[0,1,2,3,4],explanation:"Quedarse en el cociente 1,50073 es el error típico: ese número es el factor de capitalización, no el número de años. Para bajar la incógnita del exponente hacen falta logaritmos."},{id:"ic-19",topic:"Elección de oferta",objective:"Decidir cuál de varias ofertas de depósito produce más intereses comparando los valores de Cf − Ci",difficulty:"media",type:"numeric",prompt:"Ana coloca 9 000 € a interés simple con un rédito anual del 7 % durante 10 años. Calcula los intereses que produce. (Respuesta en €)",correctAnswer:6300,tolerance:.01,unit:"€",checks:[{expr:"9000*7*10/100",is:6300}],explanation:"i = (9 000·7·10)/100 = 6 300 €, por lo que Cf = 15 300 €. Esa cantidad es la que hay que comparar con la de las demás ofertas, no el rédito."},{id:"ic-20",topic:"Elección de oferta",objective:"Decidir cuál de varias ofertas de depósito produce más intereses comparando los valores de Cf − Ci",difficulty:"avanzada",type:"single-choice",prompt:"Se tienen 10 000 € y dos ofertas: A) interés simple al 5 % anual durante 6 años; B) interés compuesto al 5 % anual durante 5 años. ¿Cuál conviene?",options:["A, porque produce más intereses aunque el rédito sea el mismo en las dos","B, porque el interés compuesto siempre gana al interés simple","A, porque su rédito anual es más alto","Las dos son iguales, porque el rédito coincide"],correctAnswer:0,shuffleOptions:!0,explanation:"A: i = (10 000·5·6)/100 = 3 000 €. B: Cf = 10 000·1,05⁵ = 12 762,82 €, o sea 2 762,82 € de intereses. Conviene A: el compuesto solo supera al simple con los mismos datos, y aquí el plazo es más corto."}]},G=Object.freeze(Object.defineProperty({__proto__:null,mat4eso26InteresSimpleCompuestoAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"ic-01":{hint:"De las cinco magnitudes, el rédito es la única que se expresa en tanto por ciento: ni euros depositados, ni años, ni lo que se cobra al final."},"ic-02":{hint:"Descompón la cantidad que te devuelven: una parte es lo que entregaste al principio y la otra es lo que ha generado."},"ic-03":{hint:"Comprueba cada afirmación con el orden del proceso: primero se deposita un capital, después actúa el rédito anual durante el plazo y al final se retira todo."},"ic-04":{hint:"Saca primero el interés de un solo año y multiplícalo por el número de años; el rédito entra en la fórmula sin el símbolo de porcentaje."},"ic-05":{hint:"El plazo no viene en años: el divisor debe llevar también el número de meses del año, no solo el cien del rédito."},"ic-06":{hint:"El plazo está en días y el año comercial tiene trescientos sesenta: escríbelos en el divisor junto al cien del porcentaje."},"ic-07":{hint:"Calcula los intereses del período completo y súmalos al capital que se depositó; la pregunta no es cuánto se gana, sino cuánto se retira."},"ic-08":{hint:"Compáralo con el capital depositado: si es más pequeño que él, no puede ser la cantidad que te devuelven al final del plazo."},"ic-09":{hint:"El índice de un año se multiplica por sí mismo tantas veces como años dura el depósito: no es un producto del rédito por el tiempo."},"ic-10":{hint:"Piensa qué hace la base y qué hace el exponente: uno es el índice de un período y el otro cuenta las veces que se aplica."},"ic-11":{hint:"Cuenta cuántos años dura el depósito y cuántas veces has multiplicado realmente por el índice de variación anual."},"ic-12":{hint:"Ordena los pasos como ocurren en el tiempo: cada año el capital inicial es el capital final del año anterior, y la fórmula aparece al final, cuando reconoces el producto repetido."},"ic-13":{hint:"Calcula el capital final de cada sistema con los mismos datos y resta los dos resultados; no compares los réditos entre sí."},"ic-14":{hint:"Fíjate en qué sistema gana intereses sobre intereses: ese es el que queda por encima cuando el plazo se alarga."},"ic-15":{hint:"Contrasta en cada afirmación si el tiempo multiplica al rédito o aparece en el exponente, y prueba con un plazo corto para ver cuánto se separan los dos sistemas."},"ic-16":{hint:"La incógnita está multiplicando al factor de capitalización, así que se despeja dividiendo el capital final entre ese factor elevado
