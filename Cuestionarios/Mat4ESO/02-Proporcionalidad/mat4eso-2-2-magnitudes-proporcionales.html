  <script type="module" crossorigin>const G={title:"Magnitudes directa e inversamente proporcionales",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.2-Magnitudes directa e inversamente proporcionales.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre magnitudes proporcionales. Se evalúa distinguir directa de inversa, la constante como cociente o como producto, el reconocimiento en una tabla, la regla de tres directa e inversa y el redondeo al final. Antes de calcular, di si la otra magnitud sube o baja.",finalMessage:e=>e>=80?"Tienes el apartado dominado: decides el tipo de proporcionalidad antes de tocar un número y colocas cada dato en su columna.":e>=60?"Vas bien; falla sobre todo en decidir el tipo. Escribe por qué la otra magnitud sube o baja y luego monta la igualdad.":"Repasa la lección: en la directa se mantiene el cociente y en la inversa el producto. Esa es la decisión que manda en todo el problema.",questions:[{id:"mp-01",topic:"Magnitudes proporcionales",objective:"Distinguir dos magnitudes directamente proporcionales de dos inversamente proporcionales a partir de un enunciado",difficulty:"media",type:"single-choice",prompt:"La velocidad media de un coche y el tiempo que tarda en completar un trayecto fijo son magnitudes:",options:["inversamente proporcionales, porque al subir la velocidad baja el tiempo","directamente proporcionales, porque al subir la velocidad sube el tiempo","directamente proporcionales, porque su producto se mantiene constante","ni proporcionales, porque el tiempo no depende de la velocidad"],correctAnswer:0,shuffleOptions:!0,explanation:"Si la velocidad sube, el tiempo baja en la misma proporción: al duplicar la velocidad se tarda la mitad. Eso es proporcionalidad inversa, y lo que se mantiene constante es el producto velocidad · tiempo, que es la distancia del trayecto."},{id:"mp-02",topic:"Magnitudes proporcionales",objective:"Distinguir dos magnitudes directamente proporcionales de dos inversamente proporcionales a partir de un enunciado",difficulty:"básica",type:"true-false",prompt:"El tiempo empleado en recorrer un trayecto a velocidad constante y el espacio recorrido son directamente proporcionales.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Andando el doble de tiempo a la misma velocidad se recorre el doble de espacio: las dos magnitudes suben a la vez y en la misma proporción, así que el cociente espacio/tiempo (la velocidad) no cambia."},{id:"mp-03",topic:"Magnitudes proporcionales",objective:"Distinguir dos magnitudes directamente proporcionales de dos inversamente proporcionales a partir de un enunciado",difficulty:"media",type:"single-choice",prompt:"Un grupo de amigos alquila una casa de vacaciones. ¿Cuál de estas cantidades es inversamente proporcional al número de personas?",options:["Lo que paga cada persona del alquiler","La cantidad de comida que deben llevar","Los kilogramos totales de equipaje","El número de maletas que se cargan"],correctAnswer:0,shuffleOptions:!0,explanation:"El precio total del alquiler es fijo, así que al subir las personas baja lo que paga cada una: es inversa. La comida, el equipaje y las maletas los aporta cada persona que se suma, luego son directas."},{id:"mp-04",topic:"Magnitudes proporcionales",objective:"Distinguir dos magnitudes directamente proporcionales de dos inversamente proporcionales a partir de un enunciado",difficulty:"media",type:"multiple-choice",prompt:"En el alquiler de una casa de vacaciones, selecciona todas las cantidades directamente proporcionales al número de personas:",options:["La cantidad de comida que deben llevar","El espacio del que dispone cada persona en la casa","Los kilogramos totales de equipaje","Lo que paga cada persona del alquiler","El número de habitaciones de la casa"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"Comida y equipaje total los aporta cada persona que se suma, así que son directas. El espacio por persona y lo que paga cada persona bajan al subir el número de personas (inversas), y el número de habitaciones es fijo: no es proporcional a nada."},{id:"mp-05",topic:"Constante inversa",objective:"Expresar la constante de proporcionalidad inversa como producto de cantidades homólogas y calcularla",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre dos magnitudes inversamente proporcionales:",options:["Al aumentar una, su homóloga baja en la misma proporción","Se mantiene constante el producto de las cantidades homólogas","Se mantiene constante el cociente de las cantidades homólogas","En 3 personas que tardan 12 días, la constante vale 36","La constante se obtiene dividiendo cada cantidad entre su homóloga"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"En la inversa sube una y baja la otra, y lo que no cambia es el producto: 3 · 12 = 36 jornadas de trabajo. El cociente constante, y eso incluye dividirlo, es propio de la proporcionalidad directa."},{id:"mp-06",topic:"Constante directa",objective:"Expresar la constante de proporcionalidad directa como cociente de cantidades homólogas y calcularla",difficulty:"media",type:"numeric",prompt:"Dos magnitudes A y B son directamente proporcionales, con A = 6 y B = 4 como pareja, y A = 15 y B = 10 como pareja. ¿Cuánto vale la constante de proporcionalidad directa k = A/B?",correctAnswer:1.5,tolerance:.01,checks:[{expr:"6/4",is:1.5}],explanation:"La constante de la directa es el cociente de cada pareja: 6/4 = 1,5 y 15/10 = 1,5. Al coincidir en todas las parejas, el valor fijo es k = 1,5."},{id:"mp-07",topic:"Constante directa",objective:"Expresar la constante de proporcionalidad directa como cociente de cantidades homólogas y calcularla",difficulty:"media",type:"numeric",prompt:"La familia de Darío ha pagado 560 € por 7 noches de hotel. ¿Cuánto vale el cociente euros/noches de esa pareja, es decir, lo que cuesta una noche? (Respuesta en €)",correctAnswer:80,tolerance:.01,unit:"€",checks:[{expr:"560/7",is:80}],explanation:"Euros entre noches: 560/7 = 80 € por noche. Es el cociente de la pareja de cantidades homólogas, y se mantiene igual para cualquier número de noches."},{id:"mp-08",topic:"Constante inversa",objective:"Expresar la constante de proporcionalidad inversa como producto de cantidades homólogas y calcularla",difficulty:"básica",type:"true-false",prompt:"En dos magnitudes inversamente proporcionales se mantiene constante el producto de sus cantidades homólogas.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"a · a' = b · b' = k. Si una cantidad sube, su homóloga baja para que la multiplicación no cambie; por eso en la inversa se igualan productos y no cocientes."},{id:"mp-09",topic:"Constante inversa",objective:"Expresar la constante de proporcionalidad inversa como producto de cantidades homólogas y calcularla",difficulty:"básica",type:"numeric",prompt:"Tres personas terminan un trabajo en 12 días. ¿Cuántas jornadas de trabajo (personas · días) tiene ese trabajo?",correctAnswer:36,tolerance:0,checks:[{expr:"3*12",is:36}],explanation:"La constante de la inversa es el producto de la pareja: 3 · 12 = 36 jornadas. Ese total no cambia trabaje quien trabaje, y con 4 personas la pareja tiene que multiplicar también a 36."},{id:"mp-10",topic:"Regla de tres inversa",objective:"Resolver un problema de proporcionalidad inversa invirtiendo una razón o igualando los productos de las parejas",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para resolver: 3 amigos hacen un trabajo en 12 días; ¿cuántos días harán falta con 4 amigos?",steps:["Escribe las dos magnitudes: número de personas y número de días.","Decide el tipo: más personas, menos días, luego son inversamente proporcionales.","Iguala los productos de las cantidades homólogas: 3 · 12 = 4 · x.","Despeja: x = 36/4 = 9 días.","Comprueba el sentido: 9 días es menos que 12, como toca al haber más personas."],correctAnswer:[0,1,2,3,4],explanation:"El orden de siempre: magnitudes, tipo, igualdad de productos, despeje y comprobación. También vale la regla de tres inversa con la razón de los días girada, 4/3 = 12/x, que lleva a la misma ecuación 4x = 36."},{id:"mp-11",topic:"Tablas",objective:"Reconocer en una tabla de valores si la relación es directa, inversa o no es proporcional",difficulty:"básica",type:"single-choice",prompt:"Para decidir si una tabla de valores representa una proporcionalidad directa hay que comprobar que:",options:["los cocientes A/B de todas las parejas valen lo mismo","los productos A · B de todas las parejas valen lo mismo","A y B suben siempre a la vez al leer la tabla","la última columna vale el doble que la primera"],correctAnswer:0,shuffleOptions:!0,explanation:"Primero los cocientes: si todos valen lo mismo, es directa y ese valor es la constante. Si no se repiten, se prueban los productos (inversa), y si tampoco coinciden, las magnitudes no son proporcionales."},{id:"mp-12",topic:"Tablas",objective:"Reconocer en una tabla de valores si la relación es directa, inversa o no es proporcional",difficulty:"avanzada",type:"single-choice",prompt:"La tabla A: 4, 6, 10 y B: 8, 12, 25 (cada valor de A con el de debajo) representa magnitudes:",options:["ni directamente ni inversamente proporcionales","directamente proporcionales, con constante 0,5","inversamente proporcionales, con constante 32","directamente proporcionales, con constante 2,5"],correctAnswer:0,shuffleOptions:!0,explanation:"Los cocientes son 4/8 = 0,5, 6/12 = 0,5 y 10/25 = 0,4: no todos valen lo mismo, así que no es directa. Los productos son 32, 72 y 250: tampoco es inversa. Fijarse solo en las dos primeras parejas es el error que lleva a decir que k = 0,5."},{id:"mp-13",topic:"Tablas",objective:"Reconocer en una tabla de valores si la relación es directa, inversa o no es proporcional",difficulty:"media",type:"numeric",prompt:"La tabla A: 36, 28, 12 y B: 70, 90, 210 es inversamente proporcional. ¿Cuánto vale su constante de proporcionalidad inversa?",correctAnswer:2520,tolerance:0,checks:[{expr:"36*70",is:2520},{expr:"28*90",is:2520}],explanation:"Los cocientes 36/70 y 28/90 no coinciden, así que hay que mirar los productos: 36 · 70 = 2520, 28 · 90 = 2520 y 12 · 210 = 2520. La constante de la inversa es ese producto, no el cociente 36/70 ≈ 0,51."},{id:"mp-14",topic:"Regla de tres directa",objective:"Resolver un problema de proporcionalidad directa montando una proporción o una regla de tres directa",difficulty:"media",type:"numeric",prompt:"Se han pagado 560 € por 7 noches de hotel. ¿Cuánto se pagará por 10 noches en la misma habitación? (Respuesta en €)",correctAnswer:800,tolerance:.01,unit:"€",checks:[{expr:"10*560/7",is:800}],explanation:"Más noches, más precio: directa. 7/10 = 560/x, luego 7x = 5600 y x = 800 €. Comprobación con cocientes: 7/10 = 0,7 y 560/800 = 0,7."},{id:"mp-15",topic:"Regla de tres directa",objective:"Resolver un problema de proporcionalidad directa montando una proporción o una regla de tres directa",difficulty:"media",type:"short-answer",prompt:"Para calcular el precio x de 10 noches sabiendo que 7 noches cuestan 560 €, se plantea 7/10 = ...  Escribe la fracción que falta, con las noches arriba y los euros abajo como en la primera razón.",acceptedAnswers:["560/x"],format:"p. ej. 3/x",explanation:"Las noches quedan arriba en las dos fracciones y los euros abajo: 7/10 = 560/x. De ahí 7x = 5600 y x = 800 €. Escribir 7/10 = x/560 mezcla las magnitudes y lleva al precio falso de 392 €."},{id:"mp-16",topic:"Redondeo de tiempos",objective:"Convertir la parte decimal de un tiempo a minutos sin perder exactitud por redondear antes de tiempo",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para hallar cuánto tarda en llenarse un estanque de 325 m³ si uno de 300 m³ se llena en 10 h.",steps:["Decide el tipo: más volumen, más tiempo de llenado, luego son directamente proporcionales.","Monta la proporción con el volumen arriba: 300/10 = 325/x.","Aplica la propiedad fundamental: 300x = 3250, así que x = 3250/300 h.","Guarda la fracción exacta y quita las horas completas: 3250/300 − 10.","Multiplica el resto por 60: 50 min, o sea 10 h 50 min."],correctAnswer:[0,1,2,3,4],explanation:"El orden manda: tipo de proporcionalidad, proporción, despeje en fracción exacta y conversión a minutos al final. Si redondeas antes a 10,83 h, la parte decimal da 0,83 · 60 = 49,8 min y pierdes exactitud."},{id:"mp-17",topic:"Regla de tres inversa",objective:"Resolver un problema de proporcionalidad inversa invirtiendo una razón o igualando los productos de las parejas",difficulty:"media",type:"numeric",prompt:"Un equipo de 6 sastres teje el vestuario de una película en 24 días. ¿Cuántos sastres hacen falta para tenerlo en 9 días?",correctAnswer:16,tolerance:0,checks:[{expr:"6*24/9",is:16}],explanation:"Menos días, más sastres: inversa, y el producto se mantiene. 6 · 24 = 9 · x, o sea 144 = 9x, de donde x = 16 sastres."},{id:"mp-18",topic:"Regla de tres inversa",objective:"Resolver un problema de proporcionalidad inversa invirtiendo una razón o igualando los productos de las parejas",difficulty:"media",type:"numeric",prompt:"Con 2 grifos del mismo caudal se llena una piscina en 15 h. ¿Cuánto tardarán en llenarla 5 grifos iguales? (Respuesta en h)",correctAnswer:6,tolerance:.01,unit:"h",checks:[{expr:"2*15/5",is:6}],explanation:"Más grifos, menos tiempo: inversa. El producto grifos · horas vale 2 · 15 = 30, así que 5 · x = 30 y x = 6 h. Montar la regla de tres como directa, 2/5 = 15/x, da 37,5 h: más grifos y más tiempo, un sin sentido."},{id:"mp-19",topic:"Regla de tres inversa",objective:"Resolver un problema de proporcionalidad inversa invirtiendo una razón o igualando los productos de las parejas",difficulty:"avanzada",type:"true-false",prompt:"Con 3 amigos un trabajo sale en 12 días; plantear 3/4 = 12/x para calcular los días con 4 amigos da x = 16 días y es el resultado correcto.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Ese planteamiento olvida invertir la razón de los días, y sale 16 días: más personas y más tiempo, algo imposible. Lo correcto es 4/3 = 12/x, o igualar productos 3 · 12 = 4 · x, y entonces x = 9 días."},{id:"mp-20",topic:"Redondeo de tiempos",objective:"Convertir la parte decimal de un tiempo a minutos sin perder exactitud por redondear antes de tiempo",difficulty:"media",type:"true-false",prompt:"Pasar a minutos la parte decimal ya redondeada de 10,83 h da exactamente el mismo resultado que guardar la fracción exacta hasta el final.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Con la parte decimal redondeada, 0,83 · 60 = 49,8 min; con la fracción exacta, (3250/300 − 10) · 60 = 50 min justos. La norma es trabajar con la fracción, convertir y redondear solo al final."}]},W=Object.freeze(Object.defineProperty({__proto__:null,mat4eso22MagnitudesProporcionalesAssessment:G},Symbol.toStringTag,{value:"Module"})),J={"mp-01":{hint:"Prueba con números: si la velocidad se duplica, ¿el trayecto se hace en el doble o en la mitad de tiempo?"},"mp-02":{hint:"Multiplica el tiempo por dos andando a la misma velocidad y mira qué le pasa al espacio recorrido."},"mp-03":{hint:"Busca la cantidad que no cambia en el problema: la que se reparte entre todos baja al subir las personas."},"mp-04":{hint:"Pregunta en cada caso si esa cantidad la aporta cada persona que se suma o si se reparte entre todos."},"mp-05":{hint:"Descarta las dos afirmaciones que hablan de dividir: en la inversa lo que no cambia es el resultado de multiplicar."},"mp-06":{hint:"Divide cada valor de A entre su pareja de abajo y haz lo mismo con la segunda pareja: la constante es el valor que se repite."},"mp-07":{hint:"El cociente que piden lleva los euros arriba; reparte el total pagado entre las noches que consta."},"mp-08":{hint:"Compara con el trabajo de repartir una tarea: al subir una magnitud, la otra baja para que no cambie la cantidad escondida."},"mp-09":{hint:"La cantidad escondida son
