  <script type="module" crossorigin>const J={title:"Aplicaciones de la proporcionalidad",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.7-Aplicaciones.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre aplicaciones de la proporcionalidad: la relación de aspecto de las imágenes, el tamaño de las pantallas medido en pulgadas, las tarifas expresadas como función de proporcionalidad o función afín, y las medidas que se sacan de una fotografía. Antes de operar, escribe qué va arriba y qué va abajo en cada proporción, y al terminar comprueba el orden de magnitud y las unidades del resultado.",finalMessage:e=>e>=80?"Apartado dominado: colocas bien los términos de cada proporción, distingues la función de proporcionalidad de la afín y corriges el orden de magnitud de tus resultados.":e>=60?"Vas bien; los fallos están en el orden de los términos: en la relación de aspecto va arriba la anchura, y en la proporción fotográfica va arriba la medida del papel.":"Repasa la lección: la relación de aspecto es la razón ancho/alto, el tamaño de una pantalla es su diagonal en pulgadas, y una función afín no es de proporcionalidad porque su término independiente no depende de x.",questions:[{id:"ap-01",topic:"Relación de aspecto",objective:"Expresar la relación de aspecto de una imagen como la razón entre su anchura y su altura, y reconocer las relaciones 3:2, 16:9 y 14:6",difficulty:"básica",type:"single-choice",prompt:"Una televisión tiene relación de aspecto 16:9. ¿Qué indica esa relación?",options:["Que la anchura y la altura están en esa razón: ancho/alto = 16/9","Que la altura y la anchura están en esa razón: alto/ancho = 16/9","Que la pantalla mide 16 cm de ancho por 9 cm de alto","Que la diagonal de la pantalla mide 25 cm"],correctAnswer:0,shuffleOptions:!0,explanation:"La relación a:b pone el primer número en la anchura, así que 16/9 = ancho/alto. Es una razón normal y corriente: describe la forma, no el tamaño, y sirve igual para un televisor que para la miniatura de una aplicación."},{id:"ap-02",topic:"Relación de aspecto",objective:"Expresar la relación de aspecto de una imagen como la razón entre su anchura y su altura, y reconocer las relaciones 3:2, 16:9 y 14:6",difficulty:"básica",type:"true-false",prompt:"Una relación de aspecto 2:3 describe una imagen vertical, más alta que ancha.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"El primer número es la anchura y el segundo la altura, así que en 2:3 la altura supera a la anchura; no describe lo mismo que 3:2, que es horizontal."},{id:"ap-03",topic:"Relación de aspecto",objective:"Expresar la relación de aspecto de una imagen como la razón entre su anchura y su altura, y reconocer las relaciones 3:2, 16:9 y 14:6",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre las relaciones de aspecto 3:2, 16:9 y 14:6:",options:["La relación 14:6 es más panorámica que la 16:9 porque su cociente es mayor","La relación 3:2 es la más habitual en fotografía","La relación 16:9 es la panorámica que usan las televisiones actuales","La relación 16:9 tiene un cociente menor que la relación 3:2","Las tres relaciones describen exactamente la misma forma"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"14/6 ≈ 2,33 y 16/9 ≈ 1,78, así que el cinemascope del cine es más panorámico que la televisión; y 1,78 sí supera a 3/2 = 1,5. Cuanto mayor es el cociente, más ancho es el formato respecto a su altura."},{id:"ap-04",topic:"Relación de aspecto",objective:"Simplificar una relación de aspecto y decidir si dos imágenes tienen la misma forma",difficulty:"media",type:"single-choice",prompt:"¿Cuál de estas relaciones de aspecto describe una imagen más ancha en relación con su altura?",options:["14:6","16:9","3:2","4:3"],correctAnswer:0,shuffleOptions:!0,explanation:"14/6 ≈ 2,33 supera a 16/9 ≈ 1,78, a 3/2 = 1,5 y a 4/3 ≈ 1,33. La retícula de cuadrados lo confirma: un formato 14:6 se reparte en 14 columnas de 6 cuadrados, el rectángulo más estirado de los cuatro."},{id:"ap-05",topic:"Relación de aspecto",objective:"Simplificar una relación de aspecto y decidir si dos imágenes tienen la misma forma",difficulty:"media",type:"short-answer",prompt:"Una imagen mide 24 cm de ancho y 18 cm de alto. Escribe su relación de aspecto en la forma a:b más reducida.",acceptedAnswers:["4:3","4/3"],format:"p. ej. 3:2",explanation:"Dividiendo las dos medidas entre 6 queda 4:3, la misma razón que 24/18 = 4/3 = 1,33. El orden no se toca: el primer término sigue siendo la anchura."},{id:"ap-06",topic:"Dimensiones de una imagen",objective:"Calcular la dimensión que falta en una imagen a partir de su relación de aspecto y de la dimensión conocida",difficulty:"básica",type:"numeric",prompt:"Las fotografías impresas más comunes tienen relación de aspecto 3:2 y miden 15 cm de ancho. ¿Cuánto mide su alto? (Respuesta en cm)",correctAnswer:10,tolerance:.1,unit:"cm",checks:[{expr:"15*2/3",is:10}],explanation:"3/2 = 15/alto, de donde alto = 15·2/3 = 10 cm. Comprobación: 15/10 = 1,5 = 3/2, así que 15:10 y 3:2 son la misma relación escrita de dos maneras."},{id:"ap-07",topic:"Dimensiones de una imagen",objective:"Calcular la dimensión que falta en una imagen a partir de su relación de aspecto y de la dimensión conocida",difficulty:"media",type:"numeric",prompt:"Una pantalla tiene relación de aspecto 16:9 y su alto mide 45 cm. ¿Cuánto mide su ancho? (Respuesta en cm)",correctAnswer:80,tolerance:.1,unit:"cm",checks:[{expr:"45*16/9",is:80}],explanation:"16/9 = ancho/45, luego ancho = 45·16/9 = 80 cm. El ancho debe salir mayor que el alto, porque el primer término de la relación es el más grande de los dos."},{id:"ap-08",topic:"Dimensiones de una imagen",objective:"Calcular la dimensión que falta en una imagen a partir de su relación de aspecto y de la dimensión conocida",difficulty:"media",type:"single-choice",prompt:"Para calcular el alto de una televisión de relación 16:9 cuyo ancho mide 110,7 cm, operar 110,7·16/9 = 196,8 cm supone:",options:["haber invertido la relación de aspecto al plantear la proporción","haber despejado correctamente el alto","haber aplicado el teorema de Pitágoras","haber convertido las pulgadas en centímetros"],correctAnswer:0,shuffleOptions:!0,explanation:"El primer número de a:b es la anchura, así que 16/9 = 110,7/alto y alto = 110,7·9/16 = 62,3 cm. Un alto de 196,8 cm delataría el error: sería una televisión más alta que ancha."},{id:"ap-09",topic:"Diagonal y pulgadas",objective:"Calcular la diagonal de una pantalla con el teorema de Pitágoras y convertirla de centímetros a pulgadas",difficulty:"media",type:"true-false",prompt:"El tamaño de una pantalla se especifica por la longitud de su diagonal, medida en pulgadas.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"No es el ancho, ni el alto, ni el área visible: es el segmento que une dos esquinas opuestas. La unidad no es el centímetro; una pulgada equivale a 2,54 cm."},{id:"ap-10",topic:"Diagonal y pulgadas",objective:"Calcular la diagonal de una pantalla con el teorema de Pitágoras y convertirla de centímetros a pulgadas",difficulty:"media",type:"numeric",prompt:"Una televisión tiene 110,7 cm de ancho y 62,3 cm de alto. Calcula la longitud de su diagonal. (Respuesta en cm, redondeada a la unidad)",correctAnswer:127,tolerance:1,unit:"cm",checks:[{expr:"√((110.7^2+62.3^2))",is:127.03,tolerance:.5}],explanation:"El ancho y el alto son los catetos y la diagonal la hipotenusa: x² = 110,7² + 62,3² = 12 254,49 + 3 881,29 = 16 135,78, de donde x ≈ 127 cm."},{id:"ap-11",topic:"Diagonal y pulgadas",objective:"Calcular la diagonal de una pantalla con el teorema de Pitágoras y convertirla de centímetros a pulgadas",difficulty:"media",type:"numeric",prompt:"La diagonal de una pantalla mide 127 cm. ¿De cuántas pulgadas es? (Respuesta en pulgadas, redondeada a la unidad)",correctAnswer:50,tolerance:.5,unit:"pulgadas",checks:[{expr:"127/2.54",is:50}],explanation:"Pulgadas = diagonal/2,54 = 127:2,54 = 50 pulgadas. Se divide porque el viaje es de centímetros a pulgadas; multiplicar daría 322,58, un tamaño imposible en un salón."},{id:"ap-12",topic:"Diagonal y pulgadas",objective:"Partir de las pulgadas de una pantalla para obtener su diagonal, su ancho y su alto en centímetros",difficulty:"avanzada",type:"numeric",prompt:"Una televisión de 32 pulgadas tiene relación de aspecto 16:9. Calcula cuánto mide su ancho. (Respuesta en cm, redondeada a la décima)",correctAnswer:70.8,tolerance:.3,unit:"cm",checks:[{expr:"32*2.54*16/√((16^2+9^2))",is:70.84,tolerance:.05}],explanation:"De pulgadas a centímetros: 32·2,54 = 81,28 cm de diagonal. En la retícula 16:9 la hipotenusa mide √(16² + 9²) = √337 ≈ 18,36 unidades, así que cada unidad vale 81,28/18,36 ≈ 4,427 cm y el ancho, 16 unidades, mide 70,8 cm."},{id:"ap-13",topic:"Diagonal y pulgadas",objective:"Partir de las pulgadas de una pantalla para obtener su diagonal, su ancho y su alto en centímetros",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para hallar el alto, en centímetros, de una pantalla de 32 pulgadas y relación de aspecto 16:9.",steps:["Convierte las pulgadas a centímetros multiplicando por 2,54: la diagonal mide 81,28 cm.","Escribe la relación de aspecto con la incógnita: 16/9 = ancho/alto.","Reproduce la retícula: los catetos valen 16 y 9 unidades, así que la hipotenusa mide √337 ≈ 18,36 unidades.","Reparte la diagonal entre esas unidades: 81,28/18,36 ≈ 4,427 cm por unidad.","Multiplica por el término de la altura: 9·4,427 ≈ 39,8 cm de alto."],correctAnswer:[0,1,2,3,4],explanation:"El viaje completo es pulgadas → centímetros → unidades de la retícula → dimensión pedida. Los 39,8 cm de alto y los 70,8 cm de ancho quedan por debajo de los 81,28 cm de la diagonal, como debe ser."},{id:"ap-14",topic:"Tarifas por tiempo",objective:"Escribir la función de proporcionalidad y = kx que corresponde a una tarifa por tiempo y distinguirla de la función afín y = kx + b",difficulty:"media",type:"numeric",prompt:"La tabla recoge el precio de un aparcamiento en función del tiempo de estancia. ¿Cuánto se paga por 5 horas? (Respuesta en €)",data:{columns:["Tiempo (h)","Precio (€)"],rows:[["1","2"],["2","4"],["3","6"],["4","8"],["5","?"]],caption:"Tarifa de un aparcamiento sin canon de entrada"},correctAnswer:10,tolerance:.01,unit:"€",checks:[{expr:"2*5",is:10}],explanation:"El cociente precio/tiempo vale 2 en todas las filas, así que k = 2 €/h y y = 2x; por 5 horas se pagan 10 €. La recta que une esos puntos pasa por el origen."},{id:"ap-15",topic:"Tarifas por tiempo",objective:"Escribir la función de proporcionalidad y = kx que corresponde a una tarifa por tiempo y distinguirla de la función afín y = kx + b",difficulty:"media",type:"single-choice",prompt:"¿Cuál de las siguientes expresiones define una función de proporcionalidad entre el tiempo x y el precio y?",options:["y = 2x","y = 2x + 1","y = x + 2","y = 2x − 1"],correctAnswer:0,shuffleOptions:!0,explanation:"Solo y = 2x pasa por el origen: para x = 0 da y = 0. En cuanto aparece un sumando o un sustraendo suelto, el término independiente estropea la proporcionalidad aunque la x siga multiplicada por una constante."},{id:"ap-16",topic:"Tarifas por tiempo",objective:"Escribir la función de proporcionalidad y = kx que corresponde a una tarifa por tiempo y distinguirla de la función afín y = kx + b",difficulty:"media",type:"short-answer",prompt:"En un aparcamiento se pagan 2 € por cada hora de estancia y, además, 1 € por utilizar el garaje. Escribe la expresión que da el precio y en función de las horas x.",acceptedAnswers:["y=2x+1","y=2*x+1","2x+1"],format:"p. ej. y=3x+2",explanation:"La parte proporcional es el producto de las horas por la tarifa, y el canon de entrada es el término independiente: y = 2x + 1. Al ser una función afín, sus magnitudes ya no son proporcionales."},{id:"ap-17",topic:"Tarifas por tiempo",objective:"Justificar, con el origen de coordenadas y con dos valores concretos, que una función afín no representa una proporcionalidad",difficulty:"media",type:"true-false",prompt:"En la tarifa y = 2x + 1, al duplicar el tiempo de estancia se duplica el precio a pagar.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Por 1 hora se pagan 2·1 + 1 = 3 € y por 2 horas, 2·2 + 1 = 5 €. El euro del acceso se paga una sola vez, así que el precio no se duplica: esa es la prueba de que la relación ha dejado de ser proporcional."},{id:"ap-18",topic:"Tarifas por tiempo",objective:"Justificar, con el origen de coordenadas y con dos valores concretos, que una función afín no representa una proporcionalidad",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para justificar que la tarifa y = 2x + 1 no es una función de proporcionalidad.",steps:["Sustituye x = 0 en la expresión: y = 2·0 + 1 = 1.","Comprueba si la recta pasa por el origen: al cortar el eje Y en (0,1), no pasa.","Calcula el precio de una hora y el de dos horas: 3 € y 5 €.","Contrasta si al duplicar el tiempo se duplica el precio: 5 € no es el doble de 3 €.","Concluye que es una función afín: su término independiente no varía con x."],correctAnswer:[0,1,2,3,4],explanation:"La prueba del origen y la de los dos valores concretos llegan a la misma conclusión. Las rectas y = 2x y y = 2x + 1 son paralelas porque las dos suben 2 unidades por cada unidad de x, y solo la primera pasa por (0,0)."},{id:"ap-19",topic:"Proporción fotográfica",objective:"Determinar la medida real de un objeto o de una persona a partir de una fotografía en la que aparece un elemento de referencia de tamaño conocido",difficulty:"media",type:"numeric",prompt:"Una cámara de seguridad capta a un joven de pie junto a su bicicleta, que mide 84 cm de alto en la realidad. Midiendo sobre la fotografía, la bicicleta ocupa 2,7 cm de alto y el joven 5,4 cm. Calcula su estatura real. (Respuesta en cm)",correctAnswer:168,tolerance:1,unit:"cm",checks:[{expr:"84*5.4/2.7",is:168}],explanation:"2,7/84 = 5,4/b′, de donde b′ = 84·5,4/2,7 = 168 cm. Comprobación rápida sin cuenta: en el papel el joven mide el doble que la bicicleta, así que en la realidad también, y 2·84 = 168 cm."},{id:"ap-20",topic:"Proporción fotográfica",objective:"Determinar la medida real de un objeto o de una persona a partir de una fotografía en la que aparece un elemento de referencia de tamaño conocido",difficulty:"media",type:"single-choice",prompt:"En el problema anterior, plantear 2,7/5,4 = b′/84 y obtener b′ = 42 cm supone:",options:["haber emparejado mal los datos: la medida real ha quedado arriba de la fracción","haber despejado correctamente la incógnita","haber convertido mal los centímetros en metros","haber usado la relación de aspecto de la cámara"],correctAnswer:0,shuffleOptions:!0,explanation:"En cada fracción va arriba la medida tomada sobre el papel y abajo la medida real: 2,7/84 = 5,4/b′, de donde b′ = 168 cm. Un resultado de 42 cm sería un joven más bajo que su bicicleta, y ese orden de magnitud ya avisa del error."}]},W=Object.freeze(Object.defineProperty({__proto__:null,mat4eso27AplicacionesAssessment:J},Symbol.toStringTag,{value:"Module"})),G={"ap-01":{hint:"El primer número de a:b se refiere siempre a la anchura, y lo que importa es el valor del cociente, no el tamaño real de la pantalla."},"ap-02":{hint:"Compara los dos términos: si el segundo supera al primero, la altura es mayor que la anchura."},"ap-03":{hint:"Escribe el cociente de cada relación y recuerda en qué medio se usa cada formato."},"ap-04":{hint:"Divide el primer número entre el segundo en cada opción: describe la imagen más ancha la que dé el cociente más alto."},"ap-05":{hint:"Busca el divisor común de las dos medidas y repártelo entre ellas; el ancho debe seguir ocupando el primer lugar."},"ap-06":{hint:"El ancho es el primer número de la relación, así que va en el numerador; despeja el alto, que está en el denominador."},"ap-07":{hint:"Monta la razón con el término mayor arriba y despeja
