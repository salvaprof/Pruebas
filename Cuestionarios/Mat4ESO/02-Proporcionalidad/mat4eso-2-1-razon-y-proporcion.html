  <script type="module" crossorigin>const J={title:"Razón y proporción",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.1-Razon y proporcion.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre razón y proporción. Se evalúa la razón como cociente indicado y su orden, los extremos y los medios, la propiedad fundamental, el término que falta y la razón de proporcionalidad de un enunciado. Al finalizar verás tu puntuación y el desglose por contenidos.",finalMessage:e=>e>=80?"Dominas la proporción: compruebas una igualdad con los productos cruzados y despejas el término que falta sin equivocarte.":e>=60?"Buen trabajo; repite los productos extremos-medios antes de afirmar que dos razones forman proporción y revisa el orden de las magnitudes.":"Conviene repasar la lección: la razón depende del orden, una proporción se comprueba con a·d = b·c y el término que falta sale de una ecuación de primer grado.",questions:[{id:"rp-01",topic:"Razón",objective:"Expresar una razón respetando el orden de las magnitudes del enunciado",difficulty:"básica",type:"single-choice",prompt:"Cinco kilos de manzanas cuestan 3 €. ¿Cuál es la razón entre los kilos y los euros?",options:["5/3","3/5","5 − 3","5 · 3"],correctAnswer:0,shuffleOptions:!0,explanation:"La razón entre dos magnitudes es el cociente indicado en el orden que pide el enunciado: kilos entre euros, 5/3. La razón 3/5 también existe, pero es la razón entre euros y kilos, y responde a otra pregunta."},{id:"rp-02",topic:"Razón",objective:"Expresar una razón respetando el orden de las magnitudes del enunciado",difficulty:"básica",type:"true-false",prompt:"La razón entre 6 y 8 es distinta de la razón entre 3 y 4, porque los números son diferentes.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Una razón no cambia si multiplicas o divides sus dos términos por el mismo número: 6/8 = 3/4. Por eso todas las fracciones equivalentes expresan la misma razón."},{id:"rp-03",topic:"Razón",objective:"Expresar una razón respetando el orden de las magnitudes del enunciado",difficulty:"media",type:"short-answer",prompt:"Seis lápices cuestan 4 €. Escribe la razón entre el precio (en €) y los lápices, tal como salen los datos.",acceptedAnswers:["4/6","2/3"],format:"p. ej. 3/5",explanation:"Manda el orden del enunciado: precio arriba y lápices abajo, 4/6. Simplificada vale 2/3 y es la misma razón. 6/4 sería la razón entre lápices y precio."},{id:"rp-04",topic:"Proporción",objective:"Reconocer los extremos y los medios de una proporción",difficulty:"básica",type:"single-choice",prompt:"En la proporción a/b = c/d, los términos a y d se llaman:",options:["los extremos","los medios","los cocientes","los términos desconocidos"],correctAnswer:0,shuffleOptions:!0,explanation:"a y d son los extremos, porque cierran la igualdad por fuera; b y c son los medios, porque quedan en el centro. En 6/10 = 15/25 los extremos son 6 y 25, y los medios 10 y 15."},{id:"rp-05",topic:"Proporción",objective:"Reconocer los extremos y los medios de una proporción",difficulty:"media",type:"single-choice",prompt:"Si a/b = c/d es una proporción, ¿cuál de estas igualdades se cumple también?",options:["b/a = d/c","a/b = d/c","a/d = c/b","b/c = a/d"],correctAnswer:0,shuffleOptions:!0,explanation:"Una proporción nunca tiene una sola forma: invirtiendo las dos razones sale b/a = d/c, e intercambiando los medios sale a/c = b/d. Con 6/10 = 15/25 se cumple 6/15 = 10/25, mientras que 6/25 = 15/10 es falso (0,24 frente a 1,5)."},{id:"rp-06",topic:"Propiedad fundamental",objective:"Comprobar si dos razones forman una proporción con la propiedad fundamental",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para comprobar si las razones 2/5 y 4/10 forman una proporción.",steps:["Escribe la igualdad de las dos razones: 2/5 = 4/10.","Multiplica los extremos: 2 · 10 = 20.","Multiplica los medios: 5 · 4 = 20.","Compara los dos productos: coinciden, así que las razones sí forman una proporción."],correctAnswer:[0,1,2,3],explanation:"Extremos con extremos y medios con medios: 2 · 10 = 20 y 5 · 4 = 20. Como los productos coinciden, las razones forman proporción. El error habitual es multiplicar en diagonal leyendo de frente (2 · 5 = 10 y 4 · 10 = 40) y concluir que no forman proporción."},{id:"rp-07",topic:"Propiedad fundamental",objective:"Comprobar si dos razones forman una proporción con la propiedad fundamental",difficulty:"media",type:"true-false",prompt:"Las razones 3/2 y 7/5 forman una proporción porque sus valores decimales, 1,5 y 1,4, están muy cerca.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"No vale comparar decimales redondeados: 3 · 5 = 15 y 2 · 7 = 14. Los productos cruzados no son iguales, así que las razones no forman proporción, por muy cerca que estén 1,5 y 1,4."},{id:"rp-08",topic:"Propiedad fundamental",objective:"Comprobar si dos razones forman una proporción con la propiedad fundamental",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las parejas de razones que forman una proporción:",options:["6/8 y 3/4","8/6 y 12/9","7/6 y 9/8","9/10 y 18/20","11/4 y 15/6"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Forman proporción 6/8 y 3/4 (6·4 = 8·3 = 24), 8/6 y 12/9 (8·9 = 6·12 = 72) y 9/10 y 18/20 (9·20 = 10·18 = 180). En 7/6 y 9/8 los productos son 56 y 54, y en 11/4 y 15/6 son 66 y 60: no forman proporción."},{id:"rp-09",topic:"Propiedad fundamental",objective:"Comprobar si dos razones forman una proporción con la propiedad fundamental",difficulty:"media",type:"numeric",prompt:"En la proporción 6/10 = 15/25, ¿cuánto vale el producto de los extremos?",correctAnswer:150,tolerance:0,checks:[{expr:"6*25",is:150}],explanation:"Los extremos de 6/10 = 15/25 son 6 y 25, y multiplican a 6 · 25 = 150. Los medios (10 y 15) dan el mismo producto, y esa igualdad es justamente lo que hace falta para que sea una proporción."},{id:"rp-10",topic:"Propiedad fundamental",objective:"Comprobar si dos razones forman una proporción con la propiedad fundamental",difficulty:"media",type:"single-choice",prompt:"Para comprobar si las razones 8/6 y 12/9 forman proporción hay que comprobar que:",options:["8 · 9 = 6 · 12","8 · 12 = 6 · 9","8 · 6 = 12 · 9","8 + 9 = 6 + 12"],correctAnswer:0,shuffleOptions:!0,explanation:"Extremos (8 y 9) contra medios (6 y 12): 8 · 9 = 72 y 6 · 12 = 72, así que sí forman proporción. 8 · 12 = 6 · 9 multiplica numeradores contra denominadores, y 8 · 6 = 12 · 9 multiplica los términos de cada fracción entre sí."},{id:"rp-11",topic:"Término que falta",objective:"Hallar el término que falta en una proporción",difficulty:"media",type:"numeric",prompt:"Halla el valor de x para que las razones 5/2 y x/8 formen una proporción.",correctAnswer:20,tolerance:0,checks:[{expr:"5*8/2",is:20}],explanation:"Propiedad fundamental: 2 · x = 5 · 8 = 40, y despejando x = 40/2 = 20. Comprueba: 5/2 = 2,5 y 20/8 = 2,5."},{id:"rp-12",topic:"Término que falta",objective:"Hallar el término que falta en una proporción",difficulty:"media",type:"numeric",prompt:"Halla x para que las razones x/2 y 21/7 formen una proporción.",correctAnswer:6,tolerance:0,checks:[{expr:"2*21/7",is:6}],explanation:"x · 7 = 2 · 21 = 42, así que x = 42/7 = 6. Comprueba: 6/2 = 3 y 21/7 = 3."},{id:"rp-13",topic:"Término que falta",objective:"Hallar el término que falta en una proporción",difficulty:"media",type:"numeric",prompt:"Halla x para que las razones 9/6 y 12/x formen una proporción.",correctAnswer:8,tolerance:0,checks:[{expr:"6*12/9",is:8}],explanation:"9 · x = 6 · 12 = 72, luego x = 72/9 = 8. Comprueba con los decimales: 9/6 = 1,5 y 12/8 = 1,5."},{id:"rp-14",topic:"Término que falta",objective:"Hallar el término que falta en una proporción",difficulty:"media",type:"single-choice",prompt:"En la proporción 2/5 = 6/x, ¿qué ecuación hay que resolver para hallar x?",options:["2 · x = 5 · 6","2 · 5 = 6 · x","2 · 6 = 5 · x","x = 2 · 5 · 6"],correctAnswer:0,shuffleOptions:!0,explanation:"Extremos con medios: 2 · x = 5 · 6 = 30, de donde x = 30/2 = 15. Las otras opciones multiplican los términos de una misma fracción, los dos numeradores entre sí, o olvidan dividir por el número que acompaña a x."},{id:"rp-15",topic:"Término que falta",objective:"Hallar el término que falta en una proporción",difficulty:"avanzada",type:"true-false",prompt:"La proporción 30/35 = x²/42 tiene dos valores de x que la cumplen.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"35 · x² = 30 · 42 = 1260, así que x² = 36. La ecuación x² = 36 tiene dos soluciones, x = 6 y x = −6, porque (−6)² = 36. Quedarse solo con el valor positivo es el error habitual."},{id:"rp-16",topic:"Término que falta",objective:"Hallar el término que falta en una proporción",difficulty:"avanzada",type:"numeric",prompt:"Halla x en la proporción 15/6 = (x + 7)/14.",correctAnswer:28,tolerance:0,checks:[{expr:"15*14/6 - 7",is:28}],explanation:"Aquí el término no es un número suelto: 6 · (x + 7) = 15 · 14 = 210, así que x + 7 = 35 y x = 35 − 7 = 28. Comprueba: (28 + 7)/14 = 35/14 = 2,5 y 15/6 = 2,5."},{id:"rp-17",topic:"Razón de proporcionalidad",objective:"Determinar la razón de proporcionalidad que esconde un enunciado",difficulty:"básica",type:"single-choice",prompt:"Las latas vienen en paquetes de 8 latas. ¿Cuál es la razón entre paquetes y latas?",options:["1/8","8/1","7/8","1/7"],correctAnswer:0,shuffleOptions:!0,explanation:"Un paquete son 8 latas, así que la razón entre paquetes y latas es 1/8: cada lata vale 1/8 de paquete. 8/1 es la razón inversa (latas entre paquetes) y 7/8 o 1/7 salen de restar 8 − 1, que no tiene sentido aquí."},{id:"rp-18",topic:"Razón de proporcionalidad",objective:"Usar la razón de proporcionalidad para calcular una cantidad desconocida",difficulty:"media",type:"numeric",prompt:"Los padres de María le dan 5 € a la semana y a su hermano Juan 3 €. Si la semana que viene María recibe 8 €, ¿cuánto le corresponde a Juan manteniendo la misma proporción? (Respuesta en €)",correctAnswer:4.8,tolerance:.01,unit:"€",checks:[{expr:"3*8/5",is:4.8}],explanation:"Con los euros de María arriba en las dos fracciones: 5/3 = 8/x, luego 5x = 24 y x = 24/5 = 4,8 €. Tiene sentido: 8 € es más que 5 €, y 4,8 € es más que 3 €."},{id:"rp-19",topic:"Razón de proporcionalidad",objective:"Usar la razón de proporcionalidad para calcular una cantidad desconocida",difficulty:"media",type:"numeric",prompt:"Si 5 kg de fruta cuestan 3 €, ¿cuánto cuestan 7 kg de esa misma fruta? (Respuesta en €)",correctAnswer:4.2,tolerance:.01,unit:"€",checks:[{expr:"3*7/5",is:4.2}],explanation:"La razón entre cantidad y precio es 5/3 y no depende de lo que compres: 5/3 = 7/x, así que 5x = 3 · 7 = 21 y x = 21/5 = 4,20 €. Si cruzas las magnitudes (5/3 = x/7) sale x = 35/3 = 11,67 €, un precio sin sentido."},{id:"rp-20",topic:"Razón de proporcionalidad",objective:"Determinar la razón de proporcionalidad que esconde un enunciado",difficulty:"avanzada",type:"multiple-choice",prompt:"En el problema «5 kg de fruta cuestan 3 €; ¿cuánto cuestan 7 kg?», selecciona todos los planteamientos correctos:",options:["5/3 = 7/x","3/5 = x/7","5/3 = x/7","x = 35/3","x = 21/5"],correctAnswer:[0,1,4],shuffleOptions:!1,explanation:"Las dos fracciones de una proporción llevan la misma magnitud arriba: 5/3 = 7/x (kg arriba) y 3/5 = x/7 (€ arriba) son planteamientos correctos, y los dos llevan a x = 21/5 = 4,20 €. La mezcla 5/3 = x/7 cruza las magnitudes y arrastra el resultado falso x = 35/3 = 11,67 €."}]},W=Object.freeze(Object.defineProperty({__proto__:null,mat4eso21RazonProporcionAssessment:J},Symbol.toStringTag,{value:"Module"})),G={"rp-01":{hint:"El enunciado nombra primero los kilos y después los euros: esa misma ordenación es la que lleva la fracción."},"rp-02":{hint:"Divide los dos términos de la primera razón entre el mismo número y compara lo que sale con la segunda."},"rp-03":{hint:"Manda el orden del enunciado: el dato que se nombra primero va arriba y el que se nombra después abajo, sin simplificar."},"rp-04":{hint:"Mira la igualdad y fíjate en qué dos términos quedan abiertos por fuera y cuáles apretados en el centro."},"rp-05":{hint:"Sustituye en cada opción una proporción de verdad, por ejemplo 6/10 = 15/25, y descarta las igualdades que dejen un resultado distinto a cada lado."},"rp-06":{hint:"El primer paso es plantear la igualdad; después van las dos multiplicaciones, cada una con términos de lados opuestos, y la comparación queda al final."},"rp-07":{hint:"No compares decimales redondeados: multiplica extremos entre sí y medios entre sí y mira si los dos productos coinciden de verdad."},"rp-08":{hint:"Aplica la propiedad fundamental a cada pareja y quédate solo con las que den exactamente el mismo producto."},"rp-09":{hint:"Los extremos son el primer término de la izquierda y el último de la derecha, no los dos del centro."},"rp-10":{hint:"Antes de multiplicar, señala cuáles son los extremos y cuáles los medios de las dos razones escritas del tirón."},"rp-11":{hint:"Iguala los dos productos cruzados y aísla la incógnita dividiendo entre el número que la acompaña."},"rp-12":{hint:"Simplifica primero la razón que no lleva incógnita; el despeje sale mucho más corto."},"rp-13":{hint:"La incógnita está en un denominador: multiplica en cruz y divide entre el número que estaba arriba a su lado."},"rp-14":{hint:"Escribe la igualdad entre el producto de los extremos y el de los medios sin mover todavía ningún número de sitio."},"rp-15":{hint:"Cuando la incógnita está elevada al cuadrado aparecen dos raíces opuestas: comprueba si las dos sostienen la proporción."},"rp-16":{hint:"El término de la derecha no es un número suelto: aplica la propiedad fundamental, despeja el paréntesis completo y solo al final quita el sumando."},"rp-17":{hint:"Piensa en una sola lata dentro del paquete: lo que vale esa lata expresado en paquetes es la razón que se pide."},"rp-18":{hint:"La magnitud que queda arriba en una fracción tiene que quedar a
