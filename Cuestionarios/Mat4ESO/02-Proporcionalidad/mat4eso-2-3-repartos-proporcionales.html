  <script type="module" crossorigin>const W={title:"Repartos directa e inversamente proporcionales",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.3-Repartos directa e inversamente proporcionales.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre repartos proporcionales. Se evalúa decidir si el reparto es directo o inverso, calcular la suma S y la proporción de cada número, repartir por reducción a la unidad, convertir un reparto inverso en directo con los inversos, plantear la cadena M/S = A/a y cerrar el reparto comprobando que las partes suman el total. Antes de calcular, di si al subir la aportación toca más o menos parte.",finalMessage:e=>e>=80?"Apartado dominado: decides el tipo de reparto, sabes qué se suma en cada caso y cierras comprobando que las partes suman el total.":e>=60?"Vas bien; el fallo está en la suma S. Recuerda que en el reparto inverso se suman los numeradores de los inversos, no el común denominador.":"Repasa la lección: primero se decide si a más aportación toca más o menos parte, y solo después se calcula. Esa decisión cambia toda la cuenta.",questions:[{id:"rpp-01",topic:"Tipo de reparto",objective:"Distinguir un reparto directamente proporcional de uno inversamente proporcional a partir del enunciado",difficulty:"básica",type:"single-choice",prompt:"Un lote de libros se reparte entre los ganadores de un concurso de forma inversamente proporcional a su edad. Eso significa que:",options:["cuantos más años tiene un ganador, menos libros le tocan","cuantos más años tiene un ganador, más libros le tocan","los tres ganadores reciben exactamente la misma cantidad de libros","el reparto se hace sumando las edades tal como están"],correctAnswer:0,shuffleOptions:!0,explanation:"En un reparto inversamente proporcional, quien aporta el doble recibe la mitad: al invertir la edad, el número grande se queda con la fracción pequeña. Por eso se trabaja con 1/8, 1/12 y 1/7, no con las edades."},{id:"rpp-02",topic:"Tipo de reparto",objective:"Distinguir un reparto directamente proporcional de uno inversamente proporcional a partir del enunciado",difficulty:"media",type:"single-choice",prompt:"¿Cuál de los siguientes repartos es inversamente proporcional?",options:["Un lote de libros entre los ganadores, según su edad","Alimentos entre barrios, según su número de habitantes","Tierras heredadas entre familias, según sus miembros","Premios de un concurso, según los puntos obtenidos"],correctAnswer:0,shuffleOptions:!0,explanation:"En alimentos, tierras y premios, a más aportación corresponde más parte: son repartos directos. Con la edad ocurre al contrario, a más edad menos libros, y por eso hay que convertir el reparto en directo sobre los inversos."},{id:"rpp-03",topic:"Suma y proporción",objective:"Calcular la suma de las magnitudes aportadas y la proporción que corresponde a cada número",difficulty:"básica",type:"true-false",prompt:"En un reparto directamente proporcional, la suma S de las magnitudes aportadas es una de las cantidades que se reparten.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"S no se reparte: es solo el denominador que convierte cada aportación en una fracción del total. Como esas fracciones suman 1, las partes que salen tienen que sumar exactamente la magnitud total M."},{id:"rpp-04",topic:"Suma y proporción",objective:"Calcular la suma de las magnitudes aportadas y la proporción que corresponde a cada número",difficulty:"media",type:"single-choice",prompt:"Al repartir 200 árboles entre tres pueblos de 11 km², 14 km² y 15 km² de extensión, el denominador del reparto es:",options:["40, la suma de las tres extensiones","200, la cantidad de árboles que se reparte","15, la mayor de las tres extensiones","3, el número de pueblos que reciben"],correctAnswer:0,shuffleOptions:!0,explanation:"El denominador es S = 11 + 14 + 15 = 40 km², la suma de las aportaciones. Usar la cantidad que se reparte como denominador lleva al sinsentido de (11/200)·200 = 11 árboles."},{id:"rpp-05",topic:"Suma y proporción",objective:"Calcular la suma de las magnitudes aportadas y la proporción que corresponde a cada número",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre la suma S de un reparto proporcional:",options:["En un reparto directo, S es la suma de las magnitudes aportadas","En un reparto inverso, S es la suma de los numeradores de los inversos reducidos a común denominador","Al repartir inversamente a 2, 4, 5 y 6, el valor de S es 67","En un reparto directo, S es la magnitud total que se reparte","Al repartir 200 árboles entre 11 km², 14 km² y 15 km², S vale 200"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"S es siempre el denominador del reparto: en el directo, la suma de las aportaciones; en el inverso, la suma de los numeradores 30 + 15 + 12 + 10 = 67. Ni el común denominador 60 ni la cantidad total repartida son nunca S."},{id:"rpp-06",topic:"Reparto directo",objective:"Repartir una cantidad en partes directamente proporcionales a varios números",difficulty:"media",type:"numeric",prompt:"Se reparten 200 árboles entre tres pueblos de 11 km², 14 km² y 15 km² de forma directamente proporcional a su extensión. ¿Cuántos árboles le corresponden al pueblo de 11 km²? (Respuesta en árboles)",correctAnswer:55,tolerance:.5,unit:"árboles",checks:[{expr:"11*200/40",is:55}],explanation:"S = 11 + 14 + 15 = 40 km² y la proporción del pueblo pequeño es 11/40, así que le tocan (11·200)/40 = 55 árboles. Las tres partes, 55, 70 y 75, suman los 200 del total."},{id:"rpp-07",topic:"Reparto directo",objective:"Repartir una cantidad en partes directamente proporcionales a varios números",difficulty:"media",type:"numeric",prompt:"Reparte 270 euros en tres partes directamente proporcionales a 8, 9 y 10. ¿Cuántos euros corresponde a la parte mayor? (Respuesta en €)",correctAnswer:100,tolerance:.01,unit:"€",checks:[{expr:"270*10/27",is:100}],explanation:"S = 8 + 9 + 10 = 27, así que la parte del 10 vale (10·270)/27 = 100 €. Las tres partes son 80, 90 y 100 euros, y suman los 270 que se reparten."},{id:"rpp-08",topic:"Reducción a la unidad",objective:"Repartir una cantidad por reducción a la unidad",difficulty:"básica",type:"numeric",prompt:"Se reparten 100 unidades en cuatro partes proporcionales a 2, 3, 5 y 6 reduciendo previamente a la unidad. ¿Cuánto corresponde a una sola unidad de aportación?",correctAnswer:6.25,tolerance:.01,checks:[{expr:"100/16",is:6.25}],explanation:"S = 2 + 3 + 5 + 6 = 16 y lo que toca a una unidad es M/S = 100/16 = 6,25. Multiplicando por cada número salen 12,5; 18,75; 31,25 y 37,5, que suman 100."},{id:"rpp-09",topic:"Reducción a la unidad",objective:"Repartir una cantidad por reducción a la unidad",difficulty:"media",type:"single-choice",prompt:"Al reducir a la unidad el reparto de 100 unidades entre 2, 3, 5 y 6, calcular 100/2 = 50 para el número 2 es incorrecto porque:",options:["el divisor tiene que ser la suma de las aportaciones, 16","el divisor tiene que ser el mayor de los cuatro números","hay que dividir entre el común denominador de los inversos","la reducción a la unidad solo sirve en repartos inversos"],correctAnswer:0,shuffleOptions:!0,explanation:"Reducir a la unidad es hallar M/S, y aquí S = 2 + 3 + 5 + 6 = 16, de donde 100/16 = 6,25 por unidad y 2·6,25 = 12,5 para el número 2. Dividir entre la propia aportación mezcla el total con una de las partes."},{id:"rpp-10",topic:"Reducción a la unidad",objective:"Repartir una cantidad por reducción a la unidad",difficulty:"media",type:"numeric",prompt:"En un concurso se reparten 1890 euros de forma directamente proporcional a las puntuaciones 10, 9 y 8. ¿Cuántos euros se reciben por cada punto? (Respuesta en €)",correctAnswer:70,tolerance:.01,unit:"€",checks:[{expr:"1890/27",is:70}],explanation:"Lo que se recibe por cada punto es el reparto por unidad: 1890/(10 + 9 + 8) = 1890/27 = 70 € por punto. Multiplicando por 10, 9 y 8 salen 700, 630 y 560 euros."},{id:"rpp-11",topic:"Reparto inverso",objective:"Convertir un reparto inversamente proporcional en un reparto directo usando los inversos y el común denominador",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para repartir 210 euros de forma inversamente proporcional a las edades 3, 5 y 6 años.",steps:["Escribe los inversos de cada edad: 1/3, 1/5 y 1/6.","Reduce los tres inversos a denominador común 30: 10/30, 6/30 y 5/30.","Suma los numeradores: S = 10 + 6 + 5 = 21.","Reparte 210 de forma directamente proporcional a 10, 6 y 5: 100, 60 y 50 euros.","Comprueba que las partes suman el total y que el nieto menor es el que más recibe."],correctAnswer:[0,1,2,3,4],explanation:"El reparto inverso se convierte en directo: inversos, común denominador, suma de numeradores, reparto y comprobación. Repartir directo a las edades daría 45, 75 y 90 euros, que es el error típico de este enunciado."},{id:"rpp-12",topic:"Reparto inverso",objective:"Convertir un reparto inversamente proporcional en un reparto directo usando los inversos y el común denominador",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre un reparto inversamente proporcional:",options:["Repartir M inversamente a a, b y c equivale a repartirlo directamente a 1/a, 1/b y 1/c","Al invertir, el número grande se queda con la fracción pequeña y recibe menos parte","El denominador del reparto es el común denominador de los inversos","Los inversos hay que reducirlos a común denominador antes de sumar sus numeradores","Se puede sumar 1/3 + 1/5 + 1/6 como (1 + 1 + 1)/(3 + 5 + 6)"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Lo que se suma son los numeradores ya reducidos: 1/3 + 1/5 + 1/6 = 10/30 + 6/30 + 5/30 = 21/30, y el denominador del reparto es 21. El común denominador 30 solo sirve para poder comparar los inversos, y sumar en diagonal da 3/14, que no vale nada."},{id:"rpp-13",topic:"Reparto inverso",objective:"Repartir una cantidad en partes inversamente proporcionales a varios números",difficulty:"media",type:"numeric",prompt:"Reparte 100 en cuatro partes inversamente proporcionales a 2, 4, 5 y 6. ¿Cuánto corresponde a la parte mayor? (Redondea a décimas)",correctAnswer:44.8,tolerance:.1,checks:[{expr:"30+15+12+10",is:67},{expr:"30*100/67",is:44.8,tolerance:.05}],explanation:"Los inversos reducidos al común denominador 60 dan numeradores 30, 15, 12 y 10, con S = 67. La parte mayor es (30·100)/67 ≈ 44,8, y las demás valen 22,4, 17,9 y 14,9."},{id:"rpp-14",topic:"Reparto inverso",objective:"Repartir una cantidad en partes inversamente proporcionales a varios números",difficulty:"media",type:"true-false",prompt:"Al repartir 100 de forma inversamente proporcional a 2, 4, 5 y 6, la parte del número 2 vale (30/60)·100 = 50.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"El 60 es solo el común denominador de los inversos. El denominador del reparto es la suma de los numeradores, 30 + 15 + 12 + 10 = 67, así que la parte del 2 es (30/67)·100 ≈ 44,8."},{id:"rpp-15",topic:"Reparto inverso",objective:"Repartir una cantidad en partes inversamente proporcionales a varios números",difficulty:"media",type:"numeric",prompt:"Una ciudad destina 7728 euros de premio a los tres barrios mejor decorados: al primero le toca el doble que al segundo, y a este, el doble que al tercero. ¿Cuántos euros recibe el primer clasificado? (Respuesta en €)",correctAnswer:4416,tolerance:.01,unit:"€",checks:[{expr:"4*7728/7",is:4416}],explanation:"El reparto es inverso a la posición: los inversos de 1, 2 y 4 reducidos al común denominador 4 dan numeradores 4, 2 y 1, con S = 7. Al primero le tocan (4·7728)/7 = 4416 €, y a los demás 2208 € y 1104 €."},{id:"rpp-16",topic:"Reparto inverso",objective:"Repartir una cantidad en partes inversamente proporcionales a varios números",difficulty:"avanzada",type:"numeric",prompt:"Un lote de libros se reparte de forma inversamente proporcional a las edades de tres ganadores: 8, 12 y 7 años. A la ganadora de 8 años le han correspondido 42 libros. ¿Cuántos libros le tocan al ganador de 12 años? (Respuesta en libros)",correctAnswer:28,tolerance:0,unit:"libros",checks:[{expr:"14*42/21",is:28}],explanation:"El m.c.m. de 7, 8 y 12 es 168, con numeradores 24, 21 y 14: a los 8 años le toca el 21 y a los 12 años, el 14. Como 42/21 = 2, al de 12 años le tocan 14·2 = 28 libros; el lote completo era de 42 + 48 + 28 = 118 volúmenes."},{id:"rpp-17",topic:"Planteamiento en cadena",objective:"Plantear el reparto en cadena M/S = A/a y despejar cada parte",difficulty:"media",type:"short-answer",prompt:"Tres personas reparten una cantidad en partes directamente proporcionales a 3, 4 y 5, y a la primera le han correspondido 1000 euros. Para hallar el total x se plantea x/(3 + 4 + 5) = ...  Escribe la razón que falta, con el dinero arriba y su número abajo.",acceptedAnswers:["1000/3"],format:"p. ej. 5/2",explanation:"La razón que acompaña al total es la de la única parte conocida: 1000 euros para el número 3, o sea 1000/3. Igualando, x/12 = 1000/3, de donde 3x = 12000 y x = 4000 euros."},{id:"rpp-18",topic:"Planteamiento en cadena",objective:"Plantear el reparto en cadena M/S = A/a y despejar cada parte",difficulty:"media",type:"numeric",prompt:"Tres personas reparten dinero en partes directamente proporcionales a 3, 4 y 5, y a la primera le han correspondido 1000 euros. ¿Cuánto dinero se repartió en total? (Respuesta en €)",correctAnswer:4e3,tolerance:.01,unit:"€",checks:[{expr:"1000*12/3",is:4e3}],explanation:"Del planteamiento x/12 = 1000/3 sale 3x = 12000, luego x = 4000 €. Comprobación: las partes valen 1000, 1333,33 y 1666,67 euros y suman los 4000 del total."},{id:"rpp-19",topic:"Comprobación y redondeo",objective:"Comprobar que las partes obtenidas suman la cantidad total eligiendo bien el momento de redondear",difficulty:"avanzada",type:"true-false",prompt:"Al repartir 20 000 de forma inversamente proporcional a 3, 5 y 8, truncar cada parte a la unidad deja 2 unidades sin repartir.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Los valores exactos son 10126,58, 6075,95 y 3797,47. Truncando salen 10126 + 6075 + 3797 = 19998, dos unidades fuera del total; redondeando cada parte quedan 10127, 6076 y 3797, que suman 20000 justos."},{id:"rpp-20",topic:"Comprobación y redondeo",objective:"Comprobar que las partes obtenidas suman la cantidad total eligiendo bien el momento de redondear",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para repartir 20 000 de forma inversamente proporcional a 3, 5 y 8 sin perder unidades por el camino.",steps:["Reduce los inversos al común denominador 120: 40/120, 24/120 y 15/120.","Suma los numeradores: 40 + 24 + 15 = 79.","Halla lo que toca por unidad: 20000/79 ≈ 253,165.","Multiplica sin truncar: 10126,58; 6075,95 y 3797,47.","Redondea cada parte a la unidad: 10127, 6076 y 3797, que suman 20000."],correctAnswer:[0,1,2,3,4],explanation:"El orden es inversos, común denominador, suma de numeradores, valor por unidad, multiplicación exacta y redondeo solo al final. Truncar en el penúltimo paso deja 19998 y un reparto que no cierra con el total."}]},G=Object.freeze(Object.defineProperty({__proto__:null,mat4eso23RepartosProporcionalesAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"rpp-01":{hint:"Piensa en lo que hace el inverso de un número: al invertir la edad, la cifra grande se queda con la fracción pequeña."},"rpp-02":{hint:"Prueba en cada caso qué le pasa a la parte que toca cuando sube la aportación: busca el único reparto en el que baja."},"rpp-03":{hint:"Mira el papel de S en la fracción a/S: es el denominador que convierte cada aportación en una fracción del total."},"rpp-04":{hint:"El denominador sale de sumar las magnitudes del mismo tipo que se comparan, no de la cantidad que se reparte."},"rpp-05":{hint:"Descarta las afirmaciones que ponen como S una cantidad que se reparte y verifica la que habla de numeradores hacien
