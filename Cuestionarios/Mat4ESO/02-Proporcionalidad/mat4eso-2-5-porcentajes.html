  <script type="module" crossorigin>const W={title:"Porcentajes",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.5-Porcentajes.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre porcentajes. Se evalúa pasar de porcentaje a fracción y a decimal, calcular el porcentaje de una cantidad, hallar el porcentaje de una parte y la cantidad total, manejar el índice de variación y encadenar varias variaciones multiplicando sus índices. Antes de calcular, decide sobre qué cantidad se aplica cada porcentaje y si lo que piden es la parte variada o la cantidad final.",finalMessage:e=>e>=80?"Apartado dominado: usas el índice de variación como multiplicador, encadenas porcentajes sin sumarlos y distingues lo que se ahorra de lo que se paga.":e>=60?"Vas bien; el fallo está en decidir sobre qué cantidad se aplica cada porcentaje. Escríbelo antes de operar: el total es el 100 %.":"Repasa la lección: los tres casos salen de la misma proporción parte/C = %/100, y los porcentajes sucesivos se multiplican mediante sus índices, nunca se suman.",questions:[{id:"pct-01",topic:"Formas del porcentaje",objective:"Expresar un valor como porcentaje, fracción y número decimal y pasar de una forma a otra",difficulty:"básica",type:"true-false",prompt:"Pasar un porcentaje a número decimal equivale a dividirlo entre 100, es decir, a mover la coma dos lugares hacia la izquierda.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"El 15 % se opera como 15/100 = 0,15 y el 84 % como 0,84. Un porcentaje es una razón con denominador fijo cien, así que quitar ese denominador es desplazar la coma."},{id:"pct-02",topic:"Formas del porcentaje",objective:"Expresar un valor como porcentaje, fracción y número decimal y pasar de una forma a otra",difficulty:"media",type:"single-choice",prompt:"¿Qué porcentaje representa 350 de 5 000?",options:["7 %","3,5 %","35 %","70 %"],correctAnswer:0,shuffleOptions:!0,explanation:"% = (350/5000)·100 = 7 %. Se puede simplificar antes de multiplicar por cien: 350/5000 = 7/100. El porcentaje no depende de cómo esté escrita la fracción, sino de la parte del total que ocupa."},{id:"pct-03",topic:"Porcentaje de una cantidad",objective:"Calcular el porcentaje de una cantidad total distinguiendo la parte variada de la cantidad final",difficulty:"básica",type:"numeric",prompt:"Calcula el 135 % de 876.",correctAnswer:1182.6,tolerance:.01,checks:[{expr:"135*876/100",is:1182.6}],explanation:"%·C/100 = (135·876)/100 = 1 182,6. Como el porcentaje pasa de cien, el resultado supera la cantidad inicial: es lo que ocurre cuando un precio sube en vez de bajar."},{id:"pct-04",topic:"Porcentaje de una cantidad",objective:"Calcular el porcentaje de una cantidad total distinguiendo la parte variada de la cantidad final",difficulty:"media",type:"single-choice",prompt:"Un artículo de 30 € está rebajado un 20 %. Calcular 30·0,2 = 6 € da como resultado:",options:["la cantidad que se ahorra, no la que se paga","el precio final del artículo","el índice de variación de la rebaja","el porcentaje que queda por pagar"],correctAnswer:0,shuffleOptions:!0,explanation:"6 € es el descuento; lo que se paga es 30 − 20 % de 30 = 0,8·30 = 24 €. El 20 % es solo la relación entre el descuento y el precio inicial: ni 6 € ni 24 € son el porcentaje."},{id:"pct-05",topic:"Porcentaje de una cantidad",objective:"Calcular el porcentaje de una cantidad total distinguiendo la parte variada de la cantidad final",difficulty:"media",type:"multiple-choice",prompt:"Seisenta estudiantes se presentan a una prueba oficial y se estima que el 80 % la supera; de los que no la superan, se estima que un 25 % aprueba en la segunda convocatoria. Selecciona todas las afirmaciones correctas:",options:["48 estudiantes superan la prueba a la primera","3 estudiantes aprobarán en la segunda convocatoria","El 25 % se aplica sobre las 60 personas iniciales","El 25 % se aplica sobre las 12 personas que no la superaron","En total aprueban la mitad de los presentados"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"(80·60)/100 = 48 la superan y quedan 12; (25·12)/100 = 3 aprueban al segundo intento, así que aprueban 51, más de la mitad. Aplicar el 25 % a las 60 personas iniciales da una respuesta falsa aunque la cuenta esté bien hecha."},{id:"pct-06",topic:"Porcentaje de una parte",objective:"Determinar el porcentaje que representa una parte de un total",difficulty:"básica",type:"true-false",prompt:"Cuando la parte es más pequeña que la cantidad total, el porcentaje que representa forzosamente es menor que 100 %.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Si con una parte menor sale un porcentaje mayor que cien, la fracción está invertida: el total ha subido al numerador. Con el piso, (96 000/120 000)·100 = 80 %, mientras que al revés daría el sinsentido del 125 %."},{id:"pct-07",topic:"Porcentaje de una parte",objective:"Determinar el porcentaje que representa una parte de un total",difficulty:"media",type:"numeric",prompt:"Oliver ha comprado un piso de 120 000 € y ha pagado ya 96 000 €. ¿Qué porcentaje del precio ha abonado? (Respuesta en % sin escribir el símbolo)",correctAnswer:80,tolerance:.01,checks:[{expr:"96*100/120",is:80}],explanation:"% = (96 000/120 000)·100 = 80 %. Como el total es el 100 %, lo que queda por pagar es el 20 % restante; responder 20 sería contestar a una pregunta que no se ha hecho."},{id:"pct-08",topic:"Cantidad total",objective:"Calcular la cantidad total a partir de una parte y del porcentaje que representa",difficulty:"media",type:"single-choice",prompt:"Natalia ha recorrido 129,22 km en una etapa de una vuelta ciclista y esa distancia supone el 70 % del total. ¿Qué planteamiento permite hallar la longitud C de la etapa?",options:["129,22/C = 70/100","C/129,22 = 70/100","C = 129,22·70/100","70/129,22 = 100/C"],correctAnswer:0,shuffleOptions:!0,explanation:"La parte va arriba y el porcentaje abajo: despejando, C = 129,22·100/70 = 184,6 km. Multiplicar por 70/100 daría 90,454 km, un total más pequeño que la parte, y eso delata el error."},{id:"pct-09",topic:"Cantidad total",objective:"Calcular la cantidad total a partir de una parte y del porcentaje que representa",difficulty:"media",type:"numeric",prompt:"El último partido disputado en un estadio ha tenido 9 360 asistentes, que representan el 12 % de su aforo. ¿Cuál es la capacidad máxima del estadio? (Respuesta en espectadores)",correctAnswer:78e3,tolerance:.5,unit:"espectadores",checks:[{expr:"9360*100/12",is:78e3}],explanation:"C = 100·9 360/12 = 78 000 espectadores. Comprobación inversa: el 12 % de 78 000 es (12·78 000)/100 = 9 360, justo la asistencia del partido."},{id:"pct-10",topic:"Cantidad total",objective:"Calcular la cantidad total a partir de una parte y del porcentaje que representa",difficulty:"avanzada",type:"numeric",prompt:"Laura ha devuelto a su hermano 240 € del dinero que le dejó y aún le falta por pagarle un 20 % del préstamo. ¿A cuánto ascendió el préstamo? (Respuesta en €)",correctAnswer:300,tolerance:.01,unit:"€",checks:[{expr:"240*100/80",is:300}],explanation:"Si le falta el 20 %, lo devuelto es el 80 %: C = 100·240/80 = 300 €. El porcentaje que aparece en el enunciado no es el del dato, así que el paso decisivo es traducir qué parte representa el dinero entregado."},{id:"pct-11",topic:"Índice de variación",objective:"Distinguir la cantidad de aumento o disminución del índice de variación que la produce",difficulty:"media",type:"short-answer",prompt:"Una rebaja del 20 % equivale a multiplicar por 0,8. Escribe ese índice de variación en forma decimal o como fracción irreducible.",acceptedAnswers:["0,8","4/5"],format:"p. ej. 3/4",explanation:"iv = 1 − 20/100 = 0,8, que como fracción irreducible es 4/5. El índice es un multiplicador: queda entre 0 y 1 cuando la cantidad baja y supera 1 cuando sube."},{id:"pct-12",topic:"Índice de variación",objective:"Distinguir la cantidad de aumento o disminución del índice de variación que la produce",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre el índice de variación:",options:["Un índice de 1,12 corresponde a un aumento del 12 %","Un índice de 0,04 corresponde a una disminución del 96 %","La rebaja del 10 % en unas rebajas tiene índice de variación 0,9","Una subida del 12 % tiene índice de variación 0,12","Un índice mayor que 1 indica una disminución porcentual"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"El porcentaje está en lo que el índice pasa de 1: 1,12 es un 12 % más, y un índice de 0,04 deja con el 4 % de lo que había, o sea una rebaja del 96 %. Escribir el índice como el propio porcentaje decimal lleva al error de 450·0,12 = 54 € en lugar de 450·1,12 = 504 €."},{id:"pct-13",topic:"Índice de variación",objective:"Distinguir la cantidad de aumento o disminución del índice de variación que la produce",difficulty:"media",type:"true-false",prompt:"Un índice de variación de 1,05 indica que la cantidad ha aumentado un 105 %.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"1,05 = 1 + 5/100, así que el aumento es del 5 %. El 105 % sería lo que se pasa respecto del original, no la variación; con el mismo plan de ahorro, un capital de 5 300 € rinde el 5 %, es decir 265 €."},{id:"pct-14",topic:"Aumentos y disminuciones",objective:"Aplicar aumentos y disminuciones porcentuales multiplicando por el índice de variación",difficulty:"media",type:"numeric",prompt:"Aplica una disminución del 12 % a 15 400 usando su índice de variación.",correctAnswer:13552,tolerance:.01,checks:[{expr:"15400*88/100",is:13552}],explanation:"iv = 1 − 12/100 = 0,88, luego C_f = 15 400·0,88 = 13 552. Trabajar con el índice resuelve el cambio en una sola multiplicación, sin calcular la rebaja para restarla después."},{id:"pct-15",topic:"Aumentos y disminuciones",objective:"Aplicar aumentos y disminuciones porcentuales multiplicando por el índice de variación",difficulty:"media",type:"numeric",prompt:"Aplica un aumento del 17 % a 3 450 usando su índice de variación.",correctAnswer:4036.5,tolerance:.01,checks:[{expr:"3450*117/100",is:4036.5}],explanation:"iv = 1 + 17/100 = 1,17, luego C_f = 3 450·1,17 = 4 036,5. Usar iv = 0,17 daría 586,5: en un aumento el índice siempre supera 1."},{id:"pct-16",topic:"Porcentajes encadenados",objective:"Encadenar varios porcentajes sucesivos mediante el producto de índices y la potencia de un índice repetido",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para hallar el precio final de un mueble de 480 € al que se le aplica un descuento del 35 % y después un impuesto del 21 %.",steps:["Calcula el descuento sobre el precio inicial: 35 % de 480 = 168 €.","Resta el descuento para obtener el precio rebajado: 480 − 168 = 312 €.","Aplica el impuesto al precio rebajado, no al inicial: 21 % de 312 = 65,52 €.","Suma el impuesto al precio rebajado: 312 + 65,52 = 377,52 €.","Comprueba el orden de magnitud: el precio final queda entre 312 € y 480 €."],correctAnswer:[0,1,2,3,4],explanation:"Cada variación actúa sobre la cantidad que resulta de la anterior. Sumar el 21 % de 480 € en lugar del de 312 € da 412,80 € en vez de 377,52 €."},{id:"pct-17",topic:"Porcentajes encadenados",objective:"Encadenar varios porcentajes sucesivos mediante el producto de índices y la potencia de un índice repetido",difficulty:"media",type:"numeric",prompt:"Carmen tiene un piano a la venta por 2 400 € y cada mes lo rebaja un 10 %. ¿Cuánto costará al cabo de dos meses? (Respuesta en €)",correctAnswer:1944,tolerance:.01,unit:"€",checks:[{expr:"2400*9^2/10^2",is:1944}],explanation:"Dos rebajas del 10 % no son una rebaja del 20 %: 2 400·0,9² = 1 944 €, una rebaja real de 456 €, que es el 19 %. Multiplicar por 0,8 habría dado 1 920 €."},{id:"pct-18",topic:"Porcentajes encadenados",objective:"Encadenar varios porcentajes sucesivos mediante el producto de índices y la potencia de un índice repetido",difficulty:"avanzada",type:"single-choice",prompt:"Un set de cosméticos que costaba 60 € sube un 10 % y, días después, se le aplica un descuento del 10 %. ¿Cuánto se paga por él?",options:["Menos de 60 €, porque el producto de los dos índices queda por debajo de 1","Exactamente 60 €, porque la subida y la rebaja se anulan","Más de 60 €, porque la subida se aplica antes que el descuento","Depende del orden en que se apliquen las dos variaciones"],correctAnswer:0,shuffleOptions:!0,explanation:"60·1,10·0,9 = 59,40 €, es decir 60 céntimos menos. El producto de índices es conmutativo, así que el orden no cambia nada; lo que no se puede hacer es compensar los porcentajes restando y sumando."},{id:"pct-19",topic:"Porcentajes encadenados",objective:"Encadenar varios porcentajes sucesivos mediante el producto de índices y la potencia de un índice repetido",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para hallar cuánto vale un ordenador de 1 300 € tras rebajarse un 5 % en enero, subir un 15 % en febrero, rebajarse un 10 % en marzo y volver a rebajarse un 20 % en abril.",steps:["Escribe el índice de variación de cada oscilación: 0,95; 1,15; 0,9 y 0,8.","Multiplica los cuatro índices: el índice total es 0,7866.","Compara el índice total con 1: al ser menor, se trata de una disminución.","Tradúcelo a porcentaje: 100 − 78,66 = 21,34 % de disminución.","Multiplica el precio inicial por el índice total: 1 300·0,7866 = 1 022,58 €."],correctAnswer:[0,1,2,3,4],explanation:"Los porcentajes encadenados nunca se suman: −5 + 15 − 10 − 20 = −20 % y el resultado real es una bajada del 21,34 %. Cada variación se aplica sobre una cantidad distinta, por eso solo vale multiplicar índices."},{id:"pct-20",topic:"Porcentajes encadenados",objective:"Encadenar varios porcentajes sucesivos mediante el producto de índices y la potencia de un índice repetido",difficulty:"media",type:"numeric",prompt:"Un vehículo comprado por 8 500 € se ha depreciado un 35 % y al precio de venta hay que restarle un 3 % de impuestos. ¿Qué cantidad bruta recibirá al venderlo? (Respuesta en €)",correctAnswer:5359.25,tolerance:.01,unit:"€",checks:[{expr:"8500*65*97/(100*100)",is:5359.25}],explanation:"Son dos disminuciones encadenadas: iv = 0,65 e iv = 0,97, así que C_f = 8 500·0,65·0,97 = 5 359,25 €. El fallo habitual es restar el 3 % de 8 500 € en vez de aplicarlo al precio ya depreciado."}]},G=Object.freeze(Object.defineProperty({__proto__:null,mat4eso25PorcentajesAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"pct-01":{hint:"Un porcentaje es una razón con denominador cien: escribe esa fracción y quítale el denominador."},"pct-02":{hint:"Divide la parte entre el total y multiplica el cociente por cien; antes de operar, simplifica la fracción."},"pct-03":{hint:"Multiplica la cantidad por el porcentaje y divide entre cien; como el porcentaje pasa de cien, el resultado superará la cantidad de salida."},"pct-04":{hint:"Distingue la parte que se va del precio de la parte que se queda: la multiplicación que ya has hecho solo da una de las dos."},"pct-05":{hint:"Cada porcentaje tiene su propia cantidad de referencia, y la segunda no es el total inicial."},"pct-06":{hint:"Si la fracción que montas lleva a un porcentaje mayor que cien, revisa cuál de los dos valores has puesto en el numerador."},"pct-07":{hint:"Divide lo pagado entre el precio total y expresa ese cociente en tanto por cien; no lo confundas con lo que falta por pagar."},"pct-08":{hint:"La proporción se monta en el mismo orden en que se leen los datos: parte sobre total, porcentaje sobre cien."},"pct-09":{hint:"Despeja la cantidad total: multiplica la parte por cien y divide entre el porcentaje que representa."},"pct-10":{hint:"Traduce antes el dato: si falta una parte, lo entregado representa el resto hasta cien. No uses el porcentaje que aparece en el enunciado sin comprobar a qué cantidad corresponde."},"pct-11":{hint:"El índice vale uno menos el porcentaje escrito en forma decimal; también puedes expresarlo como fracción y simplificarla."},"pct-12
