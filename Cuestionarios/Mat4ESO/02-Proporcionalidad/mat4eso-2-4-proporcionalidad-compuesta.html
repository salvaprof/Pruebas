  <script type="module" crossorigin>const W={title:"Proporcionalidad compuesta",subject:"Matemáticas",level:"4º ESO",sourceLesson:"lessons/Mat4ESO/02-Proporcionalidad/2.4-Proporcionalidad compuesta.md",outputFolder:"Mat4ESO/02-Proporcionalidad",instructions:"Responde a las 20 preguntas sobre proporcionalidad compuesta. Se evalúa separar las tres magnitudes y elegir la incógnita, clasificar cada relación de dos en dos, colocar cada razón en su orden o invertida, calcular la incógnita, completar tablas de dos filas y comprobar el sentido del resultado. Recuerda: un problema no es directo o inverso en bloque, cada par tiene su propia relación.",finalMessage:e=>e>=80?"Apartado dominado: decides la relación de cada magnitud con la incógnita y colocas cada razón sin depender del despeje memorizado.":e>=60?"Vas bien; el fallo está en el orden de las razones. Escribe en una línea si cada relación es directa o inversa antes de montar la igualdad.":"Repasa la lección: primero se separan las tres magnitudes y se elige la incógnita; después se clasifica cada relación de una en una. Solo entonces se escribe ninguna razón.",questions:[{id:"pc-01",topic:"Magnitudes e incógnita",objective:"Reconocer en un enunciado las tres magnitudes que intervienen y cuál de ellas es la incógnita",difficulty:"básica",type:"single-choice",prompt:"Un grupo musical de 3 miembros ha compuesto 12 canciones en 20 días. Con 5 miembros y 15 días, ¿cuántas canciones compondrán? En la regla de tres compuesta, la magnitud incógnita C es:",options:["El número de canciones","El número de miembros del grupo","El número de días trabajados","Ninguna: en este problema no hay incógnita"],correctAnswer:0,shuffleOptions:!0,explanation:"C es la magnitud cuyo valor desconoces, y aquí se pregunta por las canciones: C₁ = 12 y C₂ = x. Miembros y días son las dos magnitudes que explican su cambio, con A₁ = 3, A₂ = 5, B₁ = 20 y B₂ = 15."},{id:"pc-02",topic:"Magnitudes e incógnita",objective:"Reconocer en un enunciado las tres magnitudes que intervienen y cuál de ellas es la incógnita",difficulty:"media",type:"true-false",prompt:"En el problema del grupo musical, al decir que se suman 2 miembros más al grupo, el valor de la segunda situación para esa magnitud es 2.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"El valor de la segunda situación es el total resultante, no el incremento: 3 + 2 = 5 miembros. Plantear la razón 3/2 en lugar de 3/5 lleva a x = 6 canciones, el error más repetido de este enunciado."},{id:"pc-03",topic:"Tipo de relación",objective:"Clasificar cada relación entre magnitudes como directamente o inversamente proporcional",difficulty:"básica",type:"true-false",prompt:"Un problema de proporcionalidad compuesta es directo o inverso en bloque, igual para todas sus magnitudes.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"La clave está en la expresión «dos a dos»: cada par de magnitudes tiene su propia relación y se decide de una en una. Un mismo problema puede ser directo con una magnitud e inverso con la otra, y ese detalle cambia la cuenta."},{id:"pc-04",topic:"Tipo de relación",objective:"Clasificar cada relación entre magnitudes como directamente o inversamente proporcional",difficulty:"media",type:"single-choice",prompt:"Doce obreros, trabajando 3 h diarias, cavan una zanja en 20 días. ¿Cuánto tardarán 8 obreros trabajando 10 h diarias? Tomando los días como incógnita, las relaciones con el número de obreros y con las horas diarias son:",options:["ambas inversas","ambas directas","la de los obreros directa y la de las horas inversa","la de los obreros inversa y la de las horas directa"],correctAnswer:0,shuffleOptions:!0,explanation:"Si sube el número de obreros, bajan los días; y si sube la jornada diaria, también bajan los días. Las dos relaciones son inversas respecto de la incógnita, así que las dos razones van del revés."},{id:"pc-05",topic:"Tipo de relación",objective:"Clasificar cada relación entre magnitudes como directamente o inversamente proporcional",difficulty:"media",type:"multiple-choice",prompt:"Una compañía fabrica 1500 coches trabajando 5 h diarias durante 20 días, y se pregunta por los días para producir 1200 coches trabajando 10 h diarias. Selecciona todas las afirmaciones correctas:",options:["Fabricar menos coches exige menos días: coches y días son directamente proporcionales","Trabajar más horas diarias exige menos días: horas y días son inversamente proporcionales","Es un caso directa-inversa, con una razón en cada sentido","Las dos relaciones son inversas, así que las dos razones van del revés","Es un caso directa-directa y las dos razones van en su orden"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Coches y días suben y bajan a la vez (directa), mientras que más horas diarias acortan el plazo (inversa). Por eso la razón de los coches se escribe en su orden y la de las horas, invertida."},{id:"pc-06",topic:"Tipo de relación",objective:"Clasificar cada relación entre magnitudes como directamente o inversamente proporcional",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas sobre el orden de las razones en una regla de tres compuesta:",options:["Si la relación con la incógnita es directa, la razón se escribe en el orden de la fracción de la incógnita","Si la relación es inversa, la razón va del revés y lleva arriba el valor de la situación de la pregunta","El segundo término de la igualdad es la fracción de la magnitud incógnita con la x abajo","Todas las razones se escriben con el valor de la situación completa arriba","La magnitud incógnita se coloca con la x en el numerador de su fracción"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"La referencia es siempre C₁/x: directa significa A₁/A₂ e inversa significa A₂/A₁. Escribir x arriba, por ejemplo 12 en lugar de 12/x, desvía el resultado; en el grupo musical daría 9,6 canciones en vez de 15."},{id:"pc-07",topic:"Montaje de razones",objective:"Montar la igualdad de razones de una proporcionalidad compuesta directa-directa, inversa-inversa o directa-inversa",difficulty:"media",type:"single-choice",prompt:"En el problema de la zanja (12 obreros de 3 h diarias tardan 20 días; se pregunta por los días de 8 obreros a 10 h diarias), ¿cuál es la igualdad correcta?",options:["(8/12)·(10/3) = 20/x","(12/8)·(3/10) = 20/x","(8/12)·(3/10) = 20/x","(12/8)·(10/3) = x/20"],correctAnswer:0,shuffleOptions:!0,explanation:"Las dos relaciones son inversas, así que las dos razones van del revés que 20/x. Multiplicando: 80/36 = 20/x, luego 80x = 720 y x = 9 días. Plantear (12/8)·(3/10) = 20/x da 44,4 días: más obreros y más horas, y sin embargo más días."},{id:"pc-08",topic:"Montaje de razones",objective:"Montar la igualdad de razones de una proporcionalidad compuesta directa-directa, inversa-inversa o directa-inversa",difficulty:"media",type:"short-answer",prompt:"En el problema de la fábrica de coches, la igualdad se monta con la razón de los coches en su orden y la de las horas diarias invertida: (1500/1200)·... = 20/x. Escribe la razón de las horas diarias.",acceptedAnswers:["10/5"],format:"p. ej. 3/2",explanation:"La relación entre horas diarias y días es inversa, así que la razón va del revés: (1500/1200)·(10/5) = 20/x. Al multiplicar sale 15000/6000 = 20/x, de donde 15000x = 120000 y x = 8 días."},{id:"pc-09",topic:"Montaje de razones",objective:"Montar la igualdad de razones de una proporcionalidad compuesta directa-directa, inversa-inversa o directa-inversa",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para resolver: un grupo de 3 miembros compone 12 canciones en 20 días; ¿cuántas compondrán 5 miembros en 15 días?",steps:["Separa las tres magnitudes y elige la incógnita: el número de canciones es C, con C₁ = 12 y C₂ = x.","Clasifica cada relación: más miembros, más canciones; más días, más canciones. Son dos relaciones directas.","Escribe las dos razones en el orden de la fracción de la incógnita: (3/5)·(20/15) = 12/x.","Multiplica las razones y opera en cruz: 60/75 = 12/x, luego 60x = 900.","Calcula x = 15 canciones y comprueba el sentido: sube un poco respecto de 12."],correctAnswer:[0,1,2,3,4],explanation:"El orden fijo es magnitudes e incógnita, clasificación de cada relación, montaje de las razones, operación y comprobación. Manipular la igualdad tal como está evita depender del despeje memorizado."},{id:"pc-10",topic:"Cálculo de la incógnita",objective:"Despejar y calcular la incógnita de una regla de tres compuesta y comprobar el sentido del resultado",difficulty:"media",type:"numeric",prompt:"Doce obreros, trabajando 3 h diarias, cavan una zanja en 20 días. ¿Cuántos días tardarán 8 obreros en excavar la misma zanja trabajando 10 h diarias? (Respuesta en días)",correctAnswer:9,tolerance:0,unit:"días",checks:[{expr:"12*3*20/(8*10)",is:9}],explanation:"Caso inversa-inversa: (8/12)·(10/3) = 20/x, o sea 80/36 = 20/x, de donde 80x = 720 y x = 9 días. El control del sentido encaja: menos obreros pero mucha más jornada, y el peso de las horas gana."},{id:"pc-11",topic:"Cálculo de la incógnita",objective:"Despejar y calcular la incógnita de una regla de tres compuesta y comprobar el sentido del resultado",difficulty:"media",type:"numeric",prompt:"Una compañía de automóviles fabrica 1500 coches trabajando 5 h diarias durante 20 días. ¿Cuántos días necesita para producir 1200 coches trabajando 10 h diarias? (Respuesta en días)",correctAnswer:8,tolerance:0,unit:"días",checks:[{expr:"1200*5*20/(1500*10)",is:8}],explanation:"Caso directa-inversa: (1500/1200)·(10/5) = 20/x, luego 15000/6000 = 20/x y 15000x = 120000, de donde x = 8 días. Comprobación por el trabajo total: 8·10 = 80 horas frente a 20·5 = 100, recortadas en la proporción 1200/1500."},{id:"pc-12",topic:"Cálculo de la incógnita",objective:"Despejar y calcular la incógnita de una regla de tres compuesta y comprobar el sentido del resultado",difficulty:"media",type:"numeric",prompt:"Trabajando 8 h diarias, 6 programadores necesitaron 12 días para terminar una aplicación. ¿Cuántos programadores se necesitan para terminarla en 6 días trabajando 6 h diarias? (Respuesta en programadores)",correctAnswer:16,tolerance:0,unit:"programadores",checks:[{expr:"8*12*6/(6*6)",is:16}],explanation:"La incógnita es el número de personas, y días y horas diarias son ambos inversos respecto de ella: (6/8)·(6/12) = 6/x, o sea 36/96 = 6/x, de donde 36x = 576 y x = 16 programadores."},{id:"pc-13",topic:"Cálculo de la incógnita",objective:"Despejar y calcular la incógnita de una regla de tres compuesta y comprobar el sentido del resultado",difficulty:"avanzada",type:"numeric",prompt:"Cuatro cosechadoras han recogido en 5 h un campo de cereales de 36 ha. ¿Cuántas cosechadoras hacen falta para recoger en 2 h un campo de 18 ha? (Respuesta en cosechadoras)",correctAnswer:5,tolerance:0,unit:"cosechadoras",checks:[{expr:"4*18*5/(36*2)",is:5}],explanation:"La incógnita es el número de cosechadoras: las hectáreas son directas y las horas, inversas. (36/18)·(2/5) = 4/x, o sea 72/90 = 4/x, de donde 72x = 360 y x = 5 cosechadoras."},{id:"pc-14",topic:"Tablas",objective:"Completar tablas de dos filas y tres magnitudes en las que la incógnita está en la tercera columna",difficulty:"básica",type:"true-false",prompt:"Al leer una tabla de proporcionalidad compuesta, cada valor se empareja con los valores que están en su misma fila.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Cada fila es una situación: A₁ va con B₁ y con C₁, y A₂ va con B₂ y con x. Un valor nunca se empareja con el de la fila de al lado, y empezar la razón por la fila de la pregunta es un error típico."},{id:"pc-15",topic:"Tablas",objective:"Completar tablas de dos filas y tres magnitudes en las que la incógnita está en la tercera columna",difficulty:"media",type:"numeric",prompt:"En una tabla, A vale 63 y 120, B vale 56 y 28, y C vale 42 y x (primera fila: 63, 56, 42; segunda: 120, 28, x). Si A y B son ambas directamente proporcionales a C, ¿cuánto vale x?",correctAnswer:40,tolerance:0,checks:[{expr:"120*28*42/(63*56)",is:40}],explanation:"Caso directa-directa: (63/120)·(56/28) = 42/x, o sea 3528/3360 = 42/x, de donde 3528x = 141120 y x = 40. Respeta las filas: 63 se empareja con 56 y con 42."},{id:"pc-16",topic:"Tablas",objective:"Completar tablas de dos filas y tres magnitudes en las que la incógnita está en la tercera columna",difficulty:"media",type:"numeric",prompt:"En una tabla, A vale 105 y 140, B vale 28 y 21, y C vale 49 y x (primera fila: 105, 28, 49; segunda: 140, 21, x). Si A y B son ambas inversamente proporcionales a C, ¿cuánto vale x?",correctAnswer:49,tolerance:0,checks:[{expr:"105*28*49/(140*21)",is:49}],explanation:"Caso inversa-inversa: las dos razones van del revés, (140/105)·(21/28) = 49/x, o sea 2940/2940 = 49/x. Como el producto de las razones vale 1, la incógnita sale igual que C₁: x = 49."},{id:"pc-17",topic:"Tablas",objective:"Completar tablas de dos filas y tres magnitudes en las que la incógnita está en la tercera columna",difficulty:"avanzada",type:"numeric",prompt:"En una tabla, A vale 9 y 18, B vale 21 y 14, y C vale 45 y x (primera fila: 9, 21, 45; segunda: 18, 14, x). Si A es directamente proporcional a C y B es inversamente proporcional a C, ¿cuánto vale x?",correctAnswer:135,tolerance:0,checks:[{expr:"18*21*45/(9*14)",is:135}],explanation:"La razón de A va en su orden y la de B, invertida: (9/18)·(14/21) = 45/x, o sea 126/378 = 45/x, de donde 126x = 17010 y x = 135."},{id:"pc-18",topic:"Comprobación del sentido",objective:"Despejar y calcular la incógnita de una regla de tres compuesta y comprobar el sentido del resultado",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para comprobar por el sentido que los 8 días que ha dado la fábrica de coches son razonables.",steps:["Compara la situación 2 con la 1 magnitud a magnitud: los coches bajan de 1500 a 1200 y la jornada sube de 5 h a 10 h.","Di el efecto de cada cambio sobre los días: menos coches los acorta y más horas diarias también.","Estima de cabeza el orden de magnitud: la incógnita tiene que quedar por debajo de los 20 días.","Contrasta el resultado: 8 días es menor que 20 y va en la dirección que exigen las dos relaciones.","Revisa el trabajo total: 8·10 = 80 horas frente a 20·5 = 100 horas, recortadas en la proporción de coches."],correctAnswer:[0,1,2,3,4],explanation:"Terminar la división no cierra el problema: se comprueba la dirección de cada relación y el orden de magnitud. Si la cuenta diera 2150 días en lugar de 226,92 € en un problema de hotel, habría una razón colocada al revés."},{id:"pc-19",topic:"Problemas del entorno",objective:"Resolver problemas de proporcionalidad compuesta del entorno: producción, alquileres, consumo energético y envíos",difficulty:"media",type:"numeric",prompt:"Los 13 huéspedes de un hotel hacen un consumo energético de 590 € durante 16 días. ¿Cuánto gastarían 10 huéspedes durante 8 días en las mismas condiciones? (Respuesta en €, redondeada a céntimos)",correctAnswer:226.92,tolerance:.01,unit:"€",checks:[{expr:"47200/208",is:226.92,tolerance:.01}],explanation:"Huéspedes y días son ambos directos respecto del gasto: (13/10)·(16/8) = 590/x, o sea 208/80 = 590/x, de donde 208x = 47200 y x = 226,92 €. El orden de magnitud encaja: dos recortes y la factura baja bastante de 590 €."},{id:"pc-20",topic:"Problemas del entorno",objective:"Resolver problemas de proporcionalidad compuesta del entorno: producción, alquileres, consumo energético y envíos",difficulty:"avanzada",type:"single-choice",prompt:"Un servicio de paquetería cobra lo mismo por enviar 9 kg a 150 km que por enviar 18 kg a 75 km. ¿Por qué ocurre?",options:["Porque el doble de peso a la mitad de distancia hace que las dos razones se compensen","Porque el precio del envío no depende del peso del paquete","Porque la distancia recorrida no influye en el precio del envío","Porque los dos paquetes pesan menos de 20 kg"],correctAnswer:0,shuffleOptions:!0,explanation:"Peso y
