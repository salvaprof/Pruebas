a",type:"true-false",prompt:"(3/4)³ · (3/4)⁵ = (3/4)⁸.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Correcto. Misma base → se suman los exponentes: 3 + 5 = 8."},{id:"op-17",topic:"Jerarquía",objective:"Reconocer el orden de las operaciones",difficulty:"media",type:"single-choice",prompt:"Según la jerarquía, ¿qué se resuelve primero en una expresión con paréntesis, potencias, multiplicaciones y sumas?",options:["Los paréntesis (los más internos)","Las sumas","Las multiplicaciones","Las potencias"],correctAnswer:0,shuffleOptions:!0,explanation:"1.º paréntesis (los más internos), 2.º potencias/raíces, 3.º multiplicaciones y divisiones, 4.º sumas y restas, 5.º simplificar."},{id:"op-18",topic:"Jerarquía",objective:"Calcular una expresión sin paréntesis",difficulty:"avanzada",type:"single-choice",prompt:"Sin paréntesis, ¿cuánto vale (5/2) + (1/2)·(5/6)?",options:["35/12","5/2","5/6","1"],correctAnswer:0,shuffleOptions:!0,explanation:"La multiplicación va antes que la suma: 5/2 + 5/12 = 30/12 + 5/12 = 35/12."},{id:"op-19",topic:"Jerarquía",objective:"Integrar reglas de jerarquía y potencias",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones correctas:",options:["La multiplicación se realiza antes que la suma si no hay paréntesis","(8/3)⁻² = 9/64","(3/4)⁰ = 1","(3/7):(5/8) = 15/56"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Las tres primeras son correctas. (3/7):(5/8) = 24/35, no 15/56 (eso sería multiplicar sin invertir)."},{id:"op-20",topic:"Jerarquía",objective:"Resolver un ejercicio completo",difficulty:"avanzada",type:"single-choice",prompt:"Aplicando la jerarquía, ¿cuál es el resultado final de 3 − (1/2+2/5) : (2/5)³ + (8/3)⁻² · (8/5)?",options:["-371/40","371/40","-3/16","35/12"],correctAnswer:0,shuffleOptions:!0,explanation:"Paso a paso: paréntesis 16/20, potencias 8/125 y 9/64, divisiones/multiplicaciones 2000/160 y 72/320, y suma/resta con denominador 320 → −2968/320 = −371/40."}]},W=Object.freeze(Obj
