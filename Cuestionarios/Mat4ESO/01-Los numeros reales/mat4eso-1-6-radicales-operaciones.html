 un radical a una potencia",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto vale (⁵√2)³?",options:["⁵√8","⁵√6","³√2","¹⁵√2"],correctAnswer:0,shuffleOptions:!0,explanation:"(√[n]{a})^m = √[n]{a^m}: el índice no cambia y el radicando queda elevado a la potencia, así que (⁵√2)³ = ⁵√(2³) = ⁵√8."},{id:"rad-10",topic:"Radical de un radical",objective:"Aplicar la regla del radical de un radical (6.2)",difficulty:"básica",type:"single-choice",prompt:"Según la regla √[m]{√[n]{a}} = √[m·n]{a}, ¿cuánto vale ∛(√2)?",options:["⁶√2","³√2","⁵√2","√2"],correctAnswer:0,shuffleOptions:!0,explanation:"Los índices se multiplican: 3·2 = 6, así que ∛(√2) = ⁶√2. Con potencias: (2^(1/2))^(1/3) = 2^(1/6)."},{id:"rad-11",topic:"Radicales equivalentes",objective:"Reconocer radicales equivalentes (6.3)",difficulty:"básica",type:"true-false",prompt:"⁵√(2²) y ¹⁵√(2⁶) son radicales equivalentes (valen lo mismo).",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. Multiplicando índice y exponente por el mismo número (p = 3) el radical no cambia: ⁵√(2²) = ¹⁵√(2⁶). Los dos valen 2^(2/5)."},{id:"rad-12",topic:"Introducir factores",objective:"Introducir un factor dentro del radical (6.4)",difficulty:"básica",type:"single-choice",prompt:"Introduciendo el factor dentro de la raíz, 2·∛5 es…",options:["∛40","∛10","∛25","∛80"],correctAnswer:0,shuffleOptions:!0,explanation:"x·√[n]{a} = √[n]{x^n·a}: el factor se eleva al índice. 2³·5 = 8·5 = 40, así que 2·∛5 = ∛40."},{id:"rad-13",topic:"Extraer factores",objective:"Extraer factores usando cociente y resto (6.5)",difficulty:"avanzada",type:"short-answer",prompt:"Simplifica √(16200), sabiendo que 16200 = 2³·3⁴·5². Escribe la forma simplificada: el factor que sale fuera de la raíz y el radical que queda.",acceptedAnswers:["90*√(2)","90*2^(1/2)","90*2^0.5"],format:"p. ej. 12*√(3)",checks:[{expr:"90*√(2)",is:"√(16200)"}],explanation:"Se divide cada exponente entre el índice 2: 3÷2 = 1 resto 1 (sale un 2 y queda un 2 dentro), 4÷2 = 2 re
