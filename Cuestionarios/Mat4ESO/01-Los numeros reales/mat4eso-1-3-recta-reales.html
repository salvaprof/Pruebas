s del origen, a la izquierda. La distancia al origen es |−3| = 3."},{id:"rec-04",topic:"La recta real",objective:"Reconocer la densidad de la recta",difficulty:"media",type:"true-false",prompt:"Entre el punto 2 y el punto 3 de la recta real hay infinitos puntos.",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Correcto. La recta real es densa: entre dos números cualesquiera cabe siempre otro (fracciones, decimales, raíces…). No hay puntos "pegados".'},{id:"rec-05",topic:"La recta real",objective:"Reconocer qué contiene la recta real",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona todos los números que tienen su punto en la recta real:",options:["Los enteros (como 2)","Las fracciones (como 1/2)","Los decimales (como 0,75)","Las raíces (como √2)"],correctAnswer:[0,1,2,3],shuffleOptions:!1,explanation:"Todos: la recta real contiene enteros, fracciones, decimales y raíces. No son solo los enteros."},{id:"rec-06",topic:"Tales: fracciones",objective:"Reconocer el teorema usado para fracciones",difficulty:"básica",type:"single-choice",prompt:"¿Con qué teorema se representa exactamente una fracción en la recta real?",options:["Teorema de Pitágoras","Teorema de Tales","Teorema de Pitágoras de Tales","Teorema de Descartes"],correctAnswer:1,shuffleOptions:!0,explanation:"Las fracciones se construyen con el teorema de Tales (paralelas equidistantes). Pitágoras se usa para las raíces."},{id:"rec-07",topic:"Tales: fracciones",objective:"Interpretar el denominador en la construcción",difficulty:"media",type:"single-choice",prompt:"Al representar 2/3 con Tales, el denominador 3 indica…",options:["Qué división tomas","En cuántas partes iguales divides la auxiliar","La parte entera","El numerador de la fracción"],correctAnswer:1,shuffleOptions:!0,explanation:"El denominador (3) fija el número de divisiones iguales de la recta auxiliar; el numerador (2) indica qué división tomas como resultado."},{id:"rec-08",topic:"Tales: fracciones",objective:"Interpretar el numerador en la construcción",difficulty:"media",type:"numeric",prompt:"Al representar 2/3 con Tales, el numerador indica que tomas la división número… (responde con el número de la división).",correctAnswer:2,tolerance:.01,unit:"ª división",explanation:"El numerador (2) indica la 2.ª división del segmento 0–1, que es exactamente 2/3."},{id:"rec-09",topic:"Tales: fracciones",objective:"Distinguir fracción propia de impropia",difficulty:"básica",type:"true-false",prompt:"La fracción 2/3 es propia porque su numerador es menor que su denominador.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Correcto. Fracción propia: numerador < denominador. Si fuera numerador ≥ denominador sería impropia."},{id:"rec-10",topic:"Tales: fracciones",objective:"Convertir una fracción impropia en forma mixta",difficulty:"media",type:"short-answer",prompt:"Escribe la forma mixta de 7/3 (cociente + fracción).",acceptedAnswers:["2 + 1/3"],explanation:"7 : 3 = 2 de cociente y 1 de resto, así que 7/3 = 2 + 1/3. La parte entera te lleva al 2 y la fracción al tramo siguiente."},{id:"rec-11",topic:"Tales: fracciones",objective:"Situar la parte entera de una fracción impropia",difficulty:"media",type:"numeric",prompt:"Al representar 7/3 = 2 + 1/3, ¿hasta qué entero de la recta real llevas la parte entera antes de representar la fracción?",correctAnswer:2,tolerance:.01,unit:"unidades",explanation:"La parte entera (cociente 2) te lleva al punto 2; a partir de ahí representas 1/3 del segmento entre 2 y 3."},{id:"rec-12",topic:"Tales: fracciones",objective:"Reconocer la construcción de fracciones negativas",difficulty:"media",type:"single-choice",prompt:"Para representar -2/3, la recta auxiliar se traza…",options:["Hacia la derecha, cayendo a la derecha del 0","Hacia la izquierda, cayendo a la izquierda del 0","Hacia arriba, cayendo sobre el 1","No se puede representar"],correctAnswer:1,shuffleOptions:!0,explanation:"En fracciones negativas la auxiliar se inclina hacia la izquierda y el
