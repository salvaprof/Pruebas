 logaritmos",objective:"Simplificar log 25 + log 4",difficulty:"media",type:"single-choice",prompt:"¿Cuánto vale log 25 + log 4?",options:["2","1","100","4"],correctAnswer:0,shuffleOptions:!0,explanation:"log 25 + log 4 = log(25·4) = log 100 = log 10² = 2."},{id:"lg-13",topic:"Producto por un número",objective:"Simplificar 3·log₅ 5",difficulty:"media",type:"single-choice",prompt:"¿Cuánto vale 3·log₅ 5?",options:["3","1","5","15"],correctAnswer:0,shuffleOptions:!0,explanation:"El 3 baja como exponente: 3·log₅ 5 = log₅ 5³ = 3 (también, log₅ 5 = 1, así que 3·1 = 3)."},{id:"lg-14",topic:"Propiedades",objective:"Simplificar log₅ 50 − 3 log₅ 2 + ½ log₅ 16",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuánto vale log₅ 50 − 3·log₅ 2 + ½·log₅ 16?",options:["2","1","5","25"],correctAnswer:0,shuffleOptions:!0,explanation:"Bajando exponentes: log₅ 50 − log₅ 8 + log₅ 4 = log₅ 200 − log₅ 8 = log₅ 25 = 2."},{id:"lg-15",topic:"Logaritmo de número incómodo",objective:"Calcular log 16 con log 2 = 0,301",difficulty:"avanzada",type:"numeric",prompt:"Sabiendo que log 2 = 0,301, calcula log 16 (redondeado a tres cifras decimales).",correctAnswer:1.204,tolerance:.001,unit:"",explanation:"log 16 = log 2⁴ = 4·log 2 = 4·0,301 = 1,204."},{id:"lg-16",topic:"Propiedades básicas",objective:"Recordar la propiedad logₐ aⁿ = n",difficulty:"básica",type:"single-choice",prompt:"Según la propiedad básica, logₐ aⁿ es igual a…",options:["n","a","aⁿ","1"],correctAnswer:0,shuffleOptions:!0,explanation:"El logaritmo de la base elevada a n es el propio exponente n (con n = 0 da logₐ 1 = 0 y con n = 1 da logₐ a = 1)."},{id:"lg-17",topic:"Propiedades básicas",objective:"Recordar que log 1 = 0",difficulty:"básica",type:"true-false",prompt:"Para cualquier base a válida, logₐ 1 = 0.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Correcto. Como a⁰ = 1, el logaritmo de 1 es siempre 0."},{id:"lg-18",topic:"Cambio de base",objective:"Aplicar la fórmula del cambio de base",difficulty:"media",type:
