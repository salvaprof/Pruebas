 0,3333… (el 3 se repite para siempre)?",options:["Periódico puro","Periódico mixto","Exacto","Irracional"],correctAnswer:0,shuffleOptions:!0,explanation:'El período "3" empieza desde la primera cifra decimal, por tanto es periódico puro: 0,3̅. Equivale a 1/3.'},{id:"rac-05",topic:"Tipos de decimal",objective:"Clasificar un decimal periódico mixto",difficulty:"media",type:"single-choice",prompt:"¿Qué tipo de decimal es 2,1888… (el 8 se repite a partir de la segunda cifra decimal)?",options:["Periódico mixto","Periódico puro","Exacto","Irracional"],correctAnswer:0,shuffleOptions:!0,explanation:'Hay una parte aperiódica ("1") y luego empieza el período ("8"). Por tanto es periódico mixto: 2,1̅8̅. Equivale a 197/90.'},{id:"rac-06",topic:"Fracción generatriz",objective:"Obtener el numerador de la fracción generatriz de un decimal exacto",difficulty:"media",type:"numeric",prompt:"¿Cuál es el numerador de la fracción generatriz de 3,85 (sin simplificar)?",correctAnswer:385,tolerance:.01,unit:"",explanation:"Se escribe el número sin coma como numerador: 3,85 → 385. La fracción es 385/100 (simplificada 77/20)."},{id:"rac-07",topic:"Fracción generatriz",objective:"Obtener el denominador de la fracción generatriz de un decimal exacto",difficulty:"media",type:"numeric",prompt:"¿Cuál es el denominador de la fracción generatriz de 0,75 (sin simplificar)?",correctAnswer:100,tolerance:.01,unit:"",explanation:"0,75 tiene 2 cifras decimales, así que el denominador es 1 seguido de 2 ceros: 100. La fracción es 75/100 (simplificada 3/4)."},{id:"rac-08",topic:"Fracción generatriz",objective:"Escribir la fracción generatriz simplificada",difficulty:"media",type:"short-answer",prompt:"Escribe la fracción generatriz simplificada de 0,75.",acceptedAnswers:["3/4"],explanation:"0,75 = 75/100. Dividiendo numerador y denominador entre 25 se obtiene 3/4."},{id:"rac-09",topic:"Fracción generatriz",objective:"Calcular el numerador de la fracción generatriz de un periódico puro",difficulty:"avanzad
