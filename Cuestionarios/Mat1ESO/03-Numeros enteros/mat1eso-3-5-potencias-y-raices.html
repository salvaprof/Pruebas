ue base negativa con exponente par da resultado positivo",difficulty:"media",type:"single-choice",prompt:"¿Cuánto es (-3)⁴?",options:["+81","-81","+27","-27"],correctAnswer:0,shuffleOptions:!0,explanation:"Base negativa con exponente par: los cuatro factores se emparejan y cada par da positivo, (-3)⁴ = +81."},{id:"35-04",topic:"Signo del resultado: base negativa y exponente impar",objective:"Aplicar que base negativa con exponente impar da resultado negativo",difficulty:"media",type:"single-choice",prompt:"¿Cuánto es (-3)³?",options:["-27","+27","-9","+9"],correctAnswer:0,shuffleOptions:!0,explanation:"Base negativa con exponente impar: dos factores se emparejan y dan positivo, y el tercero queda solo y multiplica por -1, así que (-3)³ = -27."},{id:"35-05",topic:"División de potencias con igual base",objective:"Aplicar aᵐ:aⁿ = aᵐ⁻ⁿ y el signo del resultado",difficulty:"media",type:"single-choice",prompt:"¿Cuánto es (-6)⁶:(-6)⁴?",options:["+36","-36","+6","-6"],correctAnswer:0,shuffleOptions:!0,explanation:"Misma base: se restan los exponentes, 6-4 = 2, y queda (-6)². El exponente 2 es par, así que el resultado es +36."},{id:"35-06",topic:"Potencia de potencia: (aᵐ)ⁿ = aᵐ·ⁿ",objective:"Aplicar que en la potencia de potencia los exponentes se multiplican",difficulty:"media",type:"single-choice",prompt:"¿Cuánto es [(-10)³]²?",options:["+1 000 000","-1 000 000","+100 000","-100 000"],correctAnswer:0,shuffleOptions:!0,explanation:"Potencia de potencia: se multiplican los exponentes, 3·2 = 6, y queda (-10)⁶. El exponente 6 es par, así que el resultado es +1 000 000."},{id:"35-07",topic:"Exponente cero: a⁰ = 1",objective:"Aplicar que toda potencia de exponente cero vale 1 (a ≠ 0)",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto es (-25)⁰?",options:["+1","-1","+0","-25"],correctAnswer:0,shuffleOptions:!0,explanation:"Toda potencia de exponente cero vale 1 (siempre que la base no sea 0): (-25)⁰ = 1. No se confunde con el exponente uno, que deja la base igual."},{id:"35-08",topic:"Error frecuente: (-2)² = -4",objective:"Detectar el error de aplicar el exponente solo a la cifra aunque haya paréntesis",difficulty:"básica",type:"true-false",prompt:"«(-2)² = -4, porque el exponente cubre también el signo». ¿Es verdadera esta afirmación?",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: con paréntesis la base es -2 y (-2)·(-2) = +4. El -4 corresponde a -2² sin paréntesis."},{id:"35-09",topic:"Error frecuente: (-3)⁴ = -81",objective:"Detectar el error de creer que una potencia de base negativa es siempre negativa",difficulty:"básica",type:"true-false",prompt:"«(-3)⁴ = -81, porque la base es negativa». ¿Es verdadera esta afirmación?",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: el exponente 4 es par, así que los factores negativos se emparejan y el resultado es +81."},{id:"35-10",topic:"Error frecuente: sumar exponentes al dividir",objective:"Detectar que al dividir potencias con igual base los exponentes se restan",difficulty:"media",type:"true-false",prompt:"Al dividir potencias con igual base, los exponentes se suman.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: al dividir con igual base se RESTAN los exponentes, aᵐ:aⁿ = aᵐ⁻ⁿ. Sumar exponentes es para multiplicar con igual base."},{id:"35-11",topic:"Raíz de un número negativo: √-36",objective:"Detectar el error «la raíz de -36 es -6» usando que el cuadrado de un entero es siempre positivo",difficulty:"avanzada",type:"true-false",prompt:"«La raíz cuadrada de -36 es -6, porque (-6)² = -36». ¿Es verdadera esta afirmación?",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: (-6)² = +36, no -36, porque el cuadrado de cualquier entero es positivo. Por eso √-36 no existe entre los enteros."},{id:"35-12",topic:"Propiedades de las potencias",objective:"Distinguir las reglas correctas de las versiones con el error típico",difficulty:"avanzada",typ
