€.",shuffleOptions:!0},{id:"37-03",topic:"Restar un negativo",objective:"Aplicar la regla de restar un negativo a una temperatura.",difficulty:"media",type:"single-choice",prompt:"La temperatura baja de 3 °C a −6 °C. ¿Cuántos grados ha bajado?",options:["9 grados: 3 − (−6) = 3 + 6 = 9.","3 grados: 3 − 6 = −3.","6 grados: se toma solo la temperatura final.","−9 grados: 3 + (−6) = −3 y se invierte el signo."],correctAnswer:0,explanation:"La diferencia es 3 − (−6) = 3 + 6 = 9 grados. Restar un número negativo equivale a sumar su valor positivo. La opción 3 − 6 = −3 correspondería a una bajada hasta −3 °C, no hasta −6 °C.",shuffleOptions:!0},{id:"37-04",topic:"Efecto neto de la segunda maniobra",objective:"Simplificar los tres movimientos de la segunda maniobra en un solo efecto.",difficulty:"media",type:"single-choice",prompt:"En la segunda maniobra, el dron sube 20 m, cae 50 m y desciende el doble de lo subido. ¿Cuál es el efecto total de la maniobra?",options:["Un descenso de 70 m: 20 − 50 − 40 = −70 m.","Un ascenso de 30 m: 20 − 50 = −30 se interpreta como subida.","Un descenso de 30 m: solo cuentan 20 − 50.","Un descenso de 110 m: 20 + 50 + 40."],correctAnswer:0,explanation:"Lo subido fue 20 m, así que «el doble de lo subido» es 2·20 = 40 m de descenso: 20 − 50 − 40 = −70 m. Primero 20 − 50 = −30 y después −30 − 40 = −70: el efecto total es un descenso de 70 m.",shuffleOptions:!0},{id:"37-05",topic:"Deshacer una bajada",objective:"Justificar que para deshacer un descenso se suma.",difficulty:"avanzada",type:"single-choice",prompt:"El dron de Berta terminó la segunda maniobra a −10 m, que supuso un descenso total de 70 m. ¿Qué operación deshace esa bajada?",options:["−10 − (−70) = −10 + 70 = +60 m: para deshacer una bajada se suma.","−10 − 70 = −80 m: se sigue bajando.","−10 + 70 = −80 m.","−10 · 70 = −700 m."],correctAnswer:0,explanation:"Para recuperar la posición de antes de un descenso de 70 m hay que subir 70 m: −10 + 70 = +60 m. Escrito como −10 − (−70) vuelve a aplicar «restar un negativo es sumar». Restar 70 haría bajar aún más (−80 m), en dirección contraria.",shuffleOptions:!0},{id:"37-06",topic:"Años a.C. y d.C.",objective:"Calcular los años transcurridos entre una fecha a.C. y una d.C.",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuántos años hay entre el año 43 a.C. y el año 67 d.C.?",options:["110 años: 67 − (−43) = 67 + 43 = 110.","24 años: 67 − 43 = 24.","43 años: se toma solo la fecha a.C.","67 años: se toma solo la fecha d.C."],correctAnswer:0,explanation:"El año 43 a.C. se escribe −43. La diferencia es 67 − (−43) = 67 + 43 = 110 años. Restar 43 directamente (67 − 43 = 24) sería el error típico de no cambiar el signo.",shuffleOptions:!0},{id:"37-07",topic:"El doble de lo subido",objective:"Calcular «el doble de lo subido» sobre la cantidad subida, no sobre la caída.",difficulty:"avanzada",type:"single-choice",prompt:"En la segunda maniobra del dron, «el doble de lo subido» corresponde a:",options:["40 m, porque lo subido fue 20 m y 2·20 = 40.","100 m, porque la caída fue 50 m y 2·50 = 100.","20 m, porque es lo que subió.","10 m, porque es la mitad de lo subido."],correctAnswer:0,explanation:"«El doble de lo subido» se calcula sobre lo que el dron subió (20 m), no sobre lo que cayó (50 m): 2·20 = 40 m. Es el descenso final de la maniobra.",shuffleOptions:!0},{id:"37-08",topic:"Distancia y posición",objective:"Distinguir la distancia (siempre positiva) de la posición (puede ser negativa).",difficulty:"básica",type:"true-false",prompt:"La distancia entre dos posiciones es siempre una cantidad positiva, aunque una de las posiciones sea negativa.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero: la distancia mide cuántas unidades hay entre las dos posiciones (p. ej., 7 plantas) y es positiva; la posición, en cambio, puede ser negativa (el trastero está a −2).",shuffleOptions:!0},{id:"37-09",topic:"Subir desde un sótano",objective:"Comprobar que al subir 4 plantas desde el 2.º sótano se llega a la 2.ª planta atravesando el 0.",difficulty:"básica",type:"true-false",prompt:"Si Daniel sube 4 plantas desde el trastero (−2), llega a la 2.ª planta (+2), atravesando el 0 por el camino.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero: −2 + 4 = +2. Subiendo escalón a escalón: −2 + 1 = −1, −1 + 1 = 0, 0 + 1 = +1, +1 + 1 = +2. Al subir desde un sótano se atraviesa el 0.",shuffleOptions:!0},{id:"37-10",topic:"Posiciones del dron",objective:"No confundir la posición tras la primera maniobra con la posición inicial.",difficulty:"media",type:"true-false",prompt:"En el problema del dron, +60 m es la posición inicial del dron, antes de cualquier maniobra.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso: +60 m es la posición después de la primera maniobra (20·3 = 60). La posición inicial es 20 m, que se obtiene dividiendo 60 entre 3.",shuffleOptions:!0},{id:"37-11",topic:"Nota del test",objective:"Aplicar la regla de tirar el resto al calcular la nota.",difficulty:"avanzada",type:"true-false",prompt:"Si la suma de un test es 25 y se divide entre 6, la nota es 5 (redondeando arriba).",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso: la nota es el cociente entero de 25 : 6 = 4 (resto 1), tirando el resto. Redondear arriba daría 5, que es el error típico.",shuffleOptions:!0},{id:"37-12",topic:"Segunda maniobra del dron",objective:"Interpretar cada movimiento de la segunda maniobra y su efecto neto.",difficulty:"avanzada",type:"multiple-choice",prompt:"Sobre la segunda maniobra del dron (subir 20 m, caer 50 m y descender el doble de lo subido), señala las afirmaciones correctas.",options:["El primer movimiento es +20 m.","«El doble de lo subido» es 40 m, porque lo subido fue 20 m (2·20 = 40).","El efecto neto de la maniobra es un descenso de 70 m (20 − 50 − 40 = −70).","«El doble de lo subido» se calcula sobre los 50 m de caída: 2·50 = 100 m.","El efecto neto es un descenso de 30 m, porque 20 − 50 = −30."],correc o. Manuel acierta 6 y falla 2. ¿Cuántos puntos suma?",correctAnswer:26,tolerance:0,explanation:"6·5 + 2·(−2) = 30 − 4 = 26 puntos."},{id:"37-18",topic:"Reparto del premio",objective:"Escribir la operación que reparte el premio entre los nietos.",difficulty:"media",type:"short-answer",prompt:"Elena tiene 3545 € y guarda 1000 € para un viaje; reparte el resto entre 5 nietos. Escribe la operación con su resultado que da el premio de cada nieto. Usa el signo - para restar y : para dividir.",acceptedAnswers:["(3545 - 1000) : 5 = 509","(3545-1000):5=509","(3545 - 1000)/5 = 509"],format:"p. ej. (200 - 50) : 3 = 50",explanation:"(3545 − 1000) : 5 = 2545 : 5 = 509 € por nieto."},{id:"37-19",topic:"Saldo de la película",objective:"Escribir la operación que da el saldo de Fátima tras comprar las entradas.",difficulty:"avanzada",type:"short-answer",prompt:"Fátima tiene 50 € y compra entradas de 8 € para ella y 6 amigos. Escribe la operación con su resultado que da su saldo. Usa el signo - para restar y * para multiplicar.",acceptedAnswers:["50 - (6+1)*8 = -6","50 - 7*8 = -6","50-(6+1)*8=-6"],format:"p. ej. 30 - (2+1)*4 = 18",explanation:"50 − (6+1)·8 = 50 − 7·8 = 50 − 56 = −6 €: Fátima debe pedir 6 € a su madre."},{id:"37-20",topic:"Método: empezar por el final",objective:"Ordenar los pasos para resolver un problema deshaciendo maniobras.",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para resolver el problema del dron empezando por el final.",steps:["Identificar la posición final que da el enunciado.","Deshacer la última maniobra con la operación inversa.","Seguir deshaciendo cada maniobra en orden inverso.","Comprobar trazando el relato hacia adelante desde la posición inicial."],correctAnswer:[0,1,2,3],explanation:"Se parte de la posición final (−10 m), se deshace la segunda maniobra (subir 70 m → +60 m) y después la primera (dividir entre 3 → 20 m). Finalmente se comprueba trazando el relato hacia adelante."}]},W=Object.freeze(Object.defineProperty({__proto
