ón combinada es una expresión con varias operaciones que deben resolverse en un orden fijo (la jerarquía), no en el orden en que aparecen escritas.",shuffleOptions:!0},{id:"36-02",topic:"Nivel 1: paréntesis y corchetes",objective:"Identificar el primer nivel de la jerarquía: paréntesis y corchetes, del más interno al más externo.",difficulty:"básica",type:"single-choice",prompt:"¿Qué operaciones forman el nivel 1 de la jerarquía de operadores?",options:["Paréntesis y corchetes, del más interno al más externo.","Potencias y raíces.","Multiplicaciones y divisiones.","Sumas y restas."],correctAnswer:0,explanation:"El nivel 1 es el de los paréntesis y corchetes: se abre primero la caja más pequeña, la más interna, y se sustituye por su resultado.",shuffleOptions:!0},{id:"36-03",topic:"Orden dentro de un nivel",objective:"Aplicar la regla de que dentro de cada nivel de la jerarquía se resuelve de izquierda a derecha.",difficulty:"básica",type:"single-choice",prompt:"Dentro de cada nivel de la jerarquía (por ejemplo, entre varias multiplicaciones seguidas), ¿en qué orden se resuelven las operaciones?",options:["De izquierda a derecha, en el orden en que aparecen escritas.","De derecha a izquierda.","Primero las divisiones y después las multiplicaciones, sin importar dónde estén.","Da igual el orden: el resultado es siempre el mismo."],correctAnswer:0,explanation:"Dentro de cada nivel se resuelve de izquierda a derecha, en el orden en que aparecen escritas: en (−12):3·2, primero la división (−12):3 = −4 y después el producto −4·2 = −8.",shuffleOptions:!0},{id:"36-04",topic:"Primer paso de la operación del tema",objective:"Aplicar la jerarquía para identificar qué operación se resuelve primero en la expresión de la lección.",difficulty:"media",type:"single-choice",prompt:"En la operación (−3)³−(7−27):5−√9·2³, ¿qué se resuelve en primer lugar?",options:["El paréntesis (7−27), porque el nivel 1 se resuelve primero.","La potencia (−3)³, porque aparece antes en la expresión.","  a derecha, tocando lo que aparece primero». ¿Es verdadero?",options:["Verdadero","Falso"],correctAnswer:1,explanation:"FALSO: el orden no es «resolver la operación entera de izquierda a derecha», sino resolver un nivel a la vez (paréntesis → potencias → × : → + −). De izquierda a derecha solo dentro de cada nivel.",shuffleOptions:!0},{id:"36-09",topic:"Orden de niveles: potencias antes que × y :",objective:"Comprobar que las potencias y raíces se resuelven antes que las multiplicaciones y divisiones.",difficulty:"básica",type:"true-false",prompt:"«Las potencias y las raíces se resuelven antes que las multiplicaciones y las divisiones». ¿Es verdadero?",options:["Verdadero","Falso"],correctAnswer:0,explanation:"VERDADERO: potencias y raíces son el nivel 2 y multiplicaciones y divisiones el nivel 3; lo que va arriba en el gráfico de barras se hace primero.",shuffleOptions:!0},{id:"36-10",topic:"«Resolver el paréntesis» no es «resolver la operación»",objective:"Detectar el error de creer que la operación queda terminada tras resolver el paréntesis.",difficulty:"media",type:"true-false",prompt:"«Cuando se resuelve el paréntesis de la caja 1, la operación entera queda terminada». ¿Es verdadero?",options:["Verdadero","Falso"],correctAnswer:1,explanation:"FALSO: tras la caja 1 solo el paréntesis ha quedado resuelto; la expresión sigue pendiente y le faltan tres cajas (potencias y raíces, × y :, y + y −).",shuffleOptions:!0},{id:"36-11",topic:"Error de signo: −55 frente a −47",objective:"Comprobar la consecuencia de dejar mal el signo al abrir el paréntesis: −27−4−24 da −55, no −47.",difficulty:"avanzada",type:"true-false",prompt:"«Si al abrir el paréntesis se escribe −27−4−24 en vez de −27+4−24, el resultado es −55 y no −47». ¿Es verdadero?",options:["Verdadero","Falso"],correctAnswer:0,explanation:"VERDADERO: −27−4−24 = −55. El resultado correcto −47 solo sale si el menos delante del paréntesis cambia el signo: −27+4−24 = −47.",shuffleOptions:!0},{id:"36-12",topic:"Jerarq
