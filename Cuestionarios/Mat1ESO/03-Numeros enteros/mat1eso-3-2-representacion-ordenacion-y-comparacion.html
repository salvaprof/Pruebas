 el punto de a está a la izquierda del punto de b.","Cuando a está más lejos del cero que b.","Cuando a tiene menor valor absoluto que b."],correctAnswer:1,shuffleOptions:!0,explanation:"a < b si el punto de a está a la izquierda del punto de b en la recta numérica. La distancia al cero o el valor absoluto no definen el orden."},{id:"32-04",topic:"Positivo vs. negativo",objective:"Aplicar el criterio de que todo positivo es mayor que todo negativo",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de estas comparaciones es correcta?",options:["+4 > -2","+4 < -2","-2 > +4","+4 = -2"],correctAnswer:0,shuffleOptions:!0,explanation:"Todo número positivo es mayor que cualquier número negativo. El +4 está a la derecha del -2, por tanto +4 > -2."},{id:"32-05",topic:"El cero",objective:"Aplicar el papel del cero entre negativos y positivos",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de estas afirmaciones sobre el cero es verdadera?",options:["0 < -3","0 > -3","0 > +5","0 = -3"],correctAnswer:1,shuffleOptions:!0,explanation:"El 0 es mayor que todo negativo (0 > -3) y menor que todo positivo (0 < +5). Solo «0 > -3» es verdadera."},{id:"32-06",topic:"Entre positivos",objective:"Aplicar el criterio de que entre positivos gana el de mayor valor absoluto",difficulty:"media",type:"single-choice",prompt:"¿Cuál es mayor, +3 o +1, y por qué?",options:["+1, porque su valor absoluto es menor.","+3, porque |+3| = 3 es mayor que |+1| = 1.","Ninguno: son iguales.","+3, porque está a la izquierda del +1."],correctAnswer:1,shuffleOptions:!0,explanation:"De dos positivos, es mayor el de mayor valor absoluto. Como 3 > 1, +3 > +1 (el punto +3 está a la derecha del +1)."},{id:"32-07",topic:"Errores frecuentes",objective:"Detectar un enunciado erróneo sobre la regla de la distancia",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál de estas afirmaciones es un ERROR?",options:["«-5 < -1, porque el -5 está más a la izquierda en la recta.»","«Cuanto más lejos del cero, mayor el número, en ambas mitades de la recta.»","«El signo menos no hace grande el número: -2 < 2.»","«+2 y -2 no son el mismo número: -2 < +2.»"],correctAnswer:1,shuffleOptions:!0,explanation:"«Cuanto más lejos del cero, mayor el número» solo es verdad en la mitad derecha. En la mitad izquierda da la vuelta: el -5 está más lejos del 0 que el -1, pero -5 < -1."},{id:"32-08",topic:"Recta numérica",objective:"Comprender el espaciado de la recta",difficulty:"básica",type:"true-false",prompt:"Entre dos enteros consecutivos en la recta numérica hay siempre 1 unidad.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Verdadero: avanzar 1 unidad a la derecha suma 1 al número y avanzar 1 a la izquierda le resta 1."},{id:"32-09",topic:"Valor absoluto",objective:"Detectar el error «mismo valor absoluto = mismo número»",difficulty:"media",type:"true-false",prompt:"Como |+2| = |-2| = 2, el +2 y el -2 son el mismo número.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: igual distancia al cero no es ser el mismo número. El +2 está a la derecha del 0 y el -2 a la izquierda, por tanto no son iguales (-2 < +2)."},{id:"32-10",topic:"Entre negativos",objective:"Detectar el error de comparar negativos por mayor valor absoluto",difficulty:"media",type:"true-false",prompt:"De dos números negativos, es mayor el que tiene mayor valor absoluto.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: entre negativos es mayor el de MENOR valor absoluto: -1 > -2, porque |-1| = 1 < |-2| = 2."},{id:"32-11",topic:"El cero",objective:"Enunciar el papel del cero",difficulty:"básica",type:"true-false",prompt:"El cero es mayor que todo número negativo y menor que todo número positivo.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Verdadero: el 0 es mayor que todo negativo (0 > -3) y menor que todo positivo (0 < +5); es la bisagra entre la mitad negativa y la positiva."},{id:"32-12"
