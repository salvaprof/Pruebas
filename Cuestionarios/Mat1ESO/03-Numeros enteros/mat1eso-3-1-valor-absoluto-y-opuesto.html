lor absoluto |a|",objective:"Aplicar la definición de valor absoluto a un entero negativo",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto vale |-5|?",options:["-5","5","+5 y -5","0"],correctAnswer:1,shuffleOptions:!0,explanation:"El valor absoluto es el número sin signo: a -5 se le quita el signo y queda 5. Es la distancia de -5 al cero."},{id:"31-04",topic:"Números opuestos",objective:"Identificar un par de números opuestos usando la definición",difficulty:"media",type:"single-choice",prompt:"¿Cuál de estos pares de números son opuestos?",options:["+5 y +5","+8 y -8","+3 y +3","+26 y 26"],correctAnswer:1,shuffleOptions:!0,explanation:"|+8| = 8 y |-8| = 8 (mismo valor absoluto) con signos distintos (+ y -): cumplen las dos condiciones de la definición. En los otros pares el signo no cambia."},{id:"31-05",topic:"Signo doble",objective:"Resolver un signo doble del tipo -(-6) de dentro afuera",difficulty:"media",type:"single-choice",prompt:"¿Cómo se resuelve el signo doble -(-6)?",options:["-6: los signos dobles se cancelan.","+6: se resuelve de dentro afuera y el opuesto de -6 es +6.","+36: se multiplican los dos signos.","-(-6) es el opuesto de +6, así que da -6."],correctAnswer:1,shuffleOptions:!0,explanation:"Se resuelve de dentro afuera: primero el opuesto de -6, que es +6, y luego el signo de fuera deja +6. No se multiplican signos ni se cancelan a ciegas."},{id:"31-06",topic:"Alturas sobre el nivel del mar",objective:"Escribir alturas sobre y bajo el nivel del mar con su signo",difficulty:"media",type:"single-choice",prompt:"El pico Aneto está a 3 404 m sobre el nivel del mar y el punto más profundo del Mar Muerto a 420 m bajo él. ¿Cómo se expresan con enteros?",options:["Aneto: -3404 m; Mar Muerto: +420 m.","Aneto: +3404 m; Mar Muerto: -420 m.","Aneto: 3404 m; Mar Muerto: 420 m (no hacen falta signos).","Aneto: +420 m; Mar Muerto: -3404 m."],correctAnswer:1,shuffleOptions:!0,explanation:"La referencia es el nivel del mar (0 m). Lo que está sobre la referencia lleva + (Aneto: +3404 m) y lo que está bajo, - (Mar Muerto: -420 m)."},{id:"31-07",topic:"Opuesto del opuesto",objective:"Aplicar la regla op[op(a)] = a a un entero negativo",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuánto vale op[op(-7)]?",options:["+7: dos opuestos seguidos cambian el número.","-7: dos cambios de signo dejan el número de salida.","+7: el opuesto de -7 es +7 y ya está.","0: los dos opuestos se anulan."],correctAnswer:1,shuffleOptions:!0,explanation:"op(-7) = +7 y op(+7) = -7: cada opuesto cambia el signo y dos cambios seguidos dejan el número de salida. op[op(a)] = a."},{id:"31-08",topic:"Valor absoluto |a|",objective:"Detectar el error típico de escribir |-5| = -5",difficulty:"básica",type:"true-false",prompt:"Verdadero o falso: |-5| = -5.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso. Las barras quitan el signo: |-5| = 5. El valor absoluto nunca da un número negativo, porque una distancia no puede ser negativa."},{id:"31-09",topic:"Opuesto op(a)",objective:"Detectar el error de aplicar el opuesto sin cambiar el signo",difficulty:"básica",type:"true-false",prompt:"Verdadero o falso: op(-7) = -7.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso. El opuesto de -7 es +7: mismo valor absoluto (7) y signo contrario. El opuesto cambia el signo, no lo repite."},{id:"31-10",topic:"Naturales y enteros",objective:"Detectar el error de marcar un negativo como número natural",difficulty:"media",type:"true-false",prompt:"Verdadero o falso: -7 es un número natural, porque es un número entero.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso. -7 es un número entero, pero no es natural: los naturales son los enteros positivos (+1, +2, +3, ...). Los negativos no son naturales."},{id:"31-11",topic:"El cero en Z",objective:"Enunciar las tres propiedades del cero (entero, ni positivo ni negativo, sin opuesto)",difficulty:"media",type:"true-f
