  <script type="module" crossorigin>const J={title:"Multiplicación y división",subject:"Matemáticas",level:"1º ESO",sourceLesson:"lessons/Mat1ESO/Mat1ESO/03-Numeros enteros/3.4-Multiplicacion y division.md",outputFolder:"Mat1ESO/03-Numeros enteros",instructions:"Responde a las 20 cuestiones sobre la multiplicación y la división de números enteros: regla de los signos, propiedades de la multiplicación, división exacta, lo que no es conmutativo ni asociativo y la prohibición de dividir entre cero.",finalMessage:e=>e>=80?"¡Excelente! Dominas la multiplicación y la división de enteros: valores absolutos primero, el signo lo da la regla, y nunca se divide entre cero.":e>=60?"Buen trabajo. Repasa los errores frecuentes: «dos negativos dan negativo» es falso, distribuir una resta lleva un «-» en el segundo término y 4:20 no es entero.":"Necesitas repasar con calma la regla de los signos (mismo signo → positivo; distinto → negativo) y qué propiedades cumple o no la división.",questions:[{id:"34-01",topic:"Multiplicación de enteros de signo distinto",objective:"Aplicar la regla de los signos a la multiplicación de un positivo y un negativo",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto es (+10)·(-5)?",options:["-50","+50","5","-15"],correctAnswer:0,shuffleOptions:!0,explanation:"Se multiplican los valores absolutos (10·5 = 50) y se aplica la regla: signos distintos → negativo, (+10)·(-5) = -50. El 5 sería la diferencia (10-5), no el producto."},{id:"34-02",topic:"Regla de los signos: dos negativos dan positivo",objective:"Aplicar que el producto de dos negativos es positivo",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto es (-6)·(-3)?",options:["+18","-18","+9","-9"],correctAnswer:0,shuffleOptions:!0,explanation:"Dos negativos dan positivo: 6·3 = 18 y, al tener el mismo signo, el resultado es +18. En palabras: una deuda de una deuda es una ganancia."},{id:"34-03",topic:"División de enteros de signo distinto",objective:"Aplicar la regla de los signos a la división de un positivo entre un negativo",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto es (+20):(-4)?",options:["-5","+5","+80","-80"],correctAnswer:0,shuffleOptions:!0,explanation:"Se dividen los valores absolutos (20:4 = 5); signos distintos → negativo: -5. Compruébalo multiplicando: (-4)·(-5) = +20, así que el cociente es el correcto."},{id:"34-04",topic:"División de enteros de signo igual",objective:"Aplicar la regla de los signos a la división de dos negativos",difficulty:"básica",type:"single-choice",prompt:"¿Cuánto es (-90):(-6)?",options:["+15","-15","+540","-540"],correctAnswer:0,shuffleOptions:!0,explanation:"Se dividen los valores absolutos (90:6 = 15); signos iguales → positivo: +15. Compruébalo multiplicando: 15·(-6) = -90, así que el cociente es el correcto."},{id:"34-05",topic:"Signo de un producto con varios factores",objective:"Decidir el signo de un producto contando los factores negativos",difficulty:"media",type:"single-choice",prompt:"¿Cuánto es (-5)·(-4)·(-11)·(+2)·(-2)?",options:["+880","-880","+440","-440"],correctAnswer:0,shuffleOptions:!0,explanation:"Hay cuatro factores negativos (par), así que el resultado es positivo. Solo queda multiplicar los valores absolutos: 5·4·11·2·2 = 880, luego +880."},{id:"34-06",topic:"La división no es conmutativa",objective:"Explicar por qué no se puede «dar la vuelta» una división",difficulty:"media",type:"single-choice",prompt:"20:4 = 5, pero 4:20 no es entero. ¿Por qué?",options:["Porque la división no es conmutativa: el orden del dividendo y el divisor cambia el resultado.","Porque la regla de los signos hace que el resultado sea negativo.","Porque un número par no se puede dividir entre otro par.","Porque 20:4 y 4:20 son la misma operación escrita al revés."],correctAnswer:0,shuffleOptions:!0,explanation:"La división NO es conmutativa: 20:4 = 5 (20 dulces entre 4 amigos, 5 cada uno), pero 4:20 daría «menos de 1 cada uno», que no es entero. En la multiplicación, en cambio, 20·4 = 4·20 = 80."},{id:"34-07",topic:"Operaciones combinadas de izquierda a derecha",objective:"Calcular una operación combinada respetando el orden de izquierda a derecha",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuánto es -300:(-50)·(+8):(-4)?",options:["-12","+12","-0,1875","+0,1875"],correctAnswer:0,shuffleOptions:!0,explanation:"De izquierda a derecha: -300:(-50) = 6, 6·(+8) = 48 y 48:(-4) = -12. Empezar por la multiplicación de la derecha daría -0,1875, que no es entero."},{id:"34-08",topic:"Errores frecuentes: dos negativos dan negativo",objective:"Detectar el error de aplicar la regla de la suma a la multiplicación",difficulty:"básica",type:"true-false",prompt:"«(-9)·(-7) = -63, porque dos negativos dan un negativo». ¿Es verdadera esta afirmación?",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: dos negativos dan positivo, (-9)·(-7) = +63. La regla: mismo signo → positivo."},{id:"34-09",topic:"División exacta",objective:"Decidir si una división de enteros da un número entero",difficulty:"media",type:"true-false",prompt:"(-7):(-3) da un número entero.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: 7:3 no es exacta (deja resto), así que (-7):(-3) no da ningún número entero. Antes de dividir, comprueba que el resto sea 0."},{id:"34-10",topic:"La división no es conmutativa",objective:"Reconocer que dar la vuelta a una división cambia el resultado",difficulty:"media",type:"true-false",prompt:"La división es conmutativa: 20:4 y 4:20 dan el mismo resultado.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: 20:4 = 5, pero 4:20 no es entero. No se puede «dar la vuelta» una división (en la multiplicación sí: 20·4 = 4·20 = 80)."},{id:"34-11",topic:"Elemento neutro y opuesto",objective:"Distinguir multiplicar por 1 de multiplicar por -1",difficulty:"media",type:"true-false",prompt:"Multiplicar por 1 da el opuesto del número: (+4)·1 = -4.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: el 1 es el elemento neutro, (+4)·1 = +4. El opuesto se obtiene multiplicando por -1: (+4)·(-1) = -4."},{id:"34-12",topic:"Propiedades de la multiplicación",objective:"Identificar las propiedades de la multiplicación entre varias afirmaciones",difficulty:"avanzada",type:"multiple-choice",prompt:"¿Cuáles de las siguientes afirmaciones son propiedades de la multiplicación de enteros?",options:["a·b = b·a (conmutativa).","(a·b)·c = a·(b·c) (asociativa).","a·1 = a (elemento neutro: el 1).","a·0 = 0 (elemento absorbente: el 0).","a:0 = 0 (dividir entre cero da cero).","20:4 = 4:20 (la división es conmutativa)."],correctAnswer:[0,1,2,3],shuffleOptions:!1,explanation:"La multiplicación es conmutativa, asociativa, su elemento neutro es el 1 y su elemento absorbente es el 0. Dividir entre cero no está definido (a:0 no existe) y la división no es conmutativa (20:4 = 5, pero 4:20 no es entero)."},{id:"34-13",topic:"Multiplicación de enteros de signo distinto",objective:"Aplicar la regla de los signos a una multiplicación de un negativo y un positivo",difficulty:"básica",type:"numeric",prompt:"Calcula (-8)·(+6). Escribe solo el resultado.",correctAnswer:-48,tolerance:0,explanation:"Se multiplican los valores absolutos (8·6 = 48); signos distintos → negativo: -48."},{id:"34-14",topic:"Regla de los signos: dos negativos dan positivo",objective:"Aplicar que el producto de dos negativos es positivo",difficulty:"básica",type:"numeric",prompt:"Calcula (-7)·(-4). Escribe solo el resultado.",correctAnswer:28,tolerance:0,explanation:"Dos negativos dan positivo: 7·4 = 28, por lo que (-7)·(-4) = +28."},{id:"34-15",topic:"División de enteros de signo distinto",objective:"Detectar el error «un negativo entre un positivo da positivo»",difficulty:"media",type:"numeric",prompt:"Calcula (-20):(+4). Escribe solo el resultado.",correctAnswer:-5,tolerance:0,explanation:"Se dividen los valores absolutos (20:4 = 5); signos distintos → negativo: -
