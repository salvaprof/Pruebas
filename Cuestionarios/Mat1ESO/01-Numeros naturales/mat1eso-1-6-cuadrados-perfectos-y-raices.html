  <script type="module" crossorigin>const J={title:"Cuadrados perfectos y raíces",subject:"Matemáticas",level:"1º ESO",sourceLesson:"lessons/Mat1ESO/Mat1ESO/01-Numeros naturales/1.6-Cuadrados perfectos y raices.md",outputFolder:"Mat1ESO/01-Numeros naturales",instructions:"Responde a las 20 cuestiones sobre el cuadrado perfecto, la raíz cuadrada exacta, sus elementos, la raíz de un producto y de un cociente, las raíces cúbicas y cuartas y la raíz entera con resto.",finalMessage:e=>e>=80?"¡Excelente! Dominas los cuadrados perfectos y sus raíces.":e>=60?"Buen trabajo. Repasa la raíz de un producto y de un cociente y la raíz entera con resto.":"Necesitas repasar la relación entre el cuadrado y su raíz con calma.",questions:[{id:"16-01",topic:"Cuadrado perfecto",objective:"Reconocer un número cuadrado perfecto entre otros",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de estos números es un cuadrado perfecto?",options:["144","30","26"],correctAnswer:0,shuffleOptions:!0,explanation:"144 es un cuadrado perfecto porque es el cuadrado de 12 (12^2 = 144). El 30 y el 26 no lo son: quedan entre dos cuadrados consecutivos, 5^2 = 25 y 6^2 = 36, sin coincidir con ninguno."},{id:"16-02",topic:"Raíz cuadrada exacta",objective:"Calcular la raíz cuadrada exacta de un número",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la raíz cuadrada exacta de 49?",options:["7","24,5","14"],correctAnswer:0,shuffleOptions:!0,explanation:"La raíz de 49 es 7, porque 7^2 = 49. No es 24,5, que sería la mitad del radicando, ni 14, que sería el doble de la raíz. Se busca el número que, multiplicado por sí mismo, da 49."},{id:"16-03",topic:"Raíz cúbica",objective:"Calcular la raíz cúbica de un número",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la raíz cúbica de 8?",options:["2","8 : 3","1"],correctAnswer:0,shuffleOptions:!0,explanation:"La raíz cúbica de 8 es 2, porque 2^3 = 2 · 2 · 2 = 8. El índice 3 dice a qué potencia hay que elevar para comprobar la raíz; no se obtiene dividiendo el radicando entre 3."},{id:"16-04",topic:"Elementos de la raíz",objective:"Nombrar el radicando de una raíz",difficulty:"media",type:"single-choice",prompt:"En la raíz √49 = 7, el número 49 es...",options:["El radicando","La raíz","El índice"],correctAnswer:0,shuffleOptions:!0,explanation:"El radicando es el número que está dentro de la raíz (el 49). La raíz es el resultado (el 7) y el índice es el número pequeño de arriba (en la raíz cuadrada es 2 y se sobreentiende)."},{id:"16-05",topic:"Raíz de un producto",objective:"Reconocer la propiedad de la raíz de un producto",difficulty:"media",type:"single-choice",prompt:"¿Cuál de estas igualdades muestra la raíz de un producto?",options:["√25 · √9 = √(25 · 9)","√25 + √9 = √(25 + 9)","√100 : √4 = 10 : 4"],correctAnswer:0,shuffleOptions:!0,explanation:"La raíz de un producto es la raíz del producto: √a · √b = √(a·b), como en √25 · √9 = √(25·9) = √225 = 15. La propiedad no vale para la suma (√25 + √9 ≠ √34) y al dividir dos raíces se divide entre √4, que vale 2, no entre 4."},{id:"16-06",topic:"Elementos de la raíz",objective:"Nombrar el índice de la raíz cuadrada",difficulty:"media",type:"single-choice",prompt:"En la raíz cuadrada, el índice es...",options:["2, y se sobreentiende","49","7"],correctAnswer:0,shuffleOptions:!0,explanation:"En la raíz cuadrada el índice es 2 y se sobreentiende, por eso se escribe sin ponerlo. El 49 sería el radicando y el 7 la raíz de √49 = 7."},{id:"16-07",topic:"Forma de teclado",objective:"Escribir una raíz en la forma de teclado",difficulty:"media",type:"single-choice",prompt:"Para calcular la raíz de 49 en el teclado se escribe...",options:["sqrt(49)","sqrt 49","sqrt(4)"],correctAnswer:0,shuffleOptions:!0,explanation:"Se escribe sqrt(49), con el número dentro del paréntesis; la pantalla da 7. Si se escribe el número fuera, sqrt 49, no se reconoce la raíz, y sqrt(4) es la raíz de otro número."},{id:"16-08",topic:"Cuadrado perfecto",objective:"Reconocer que un número no es cuadrado perfecto",difficulty:"media",type:"true-false",prompt:"El 30 es un cuadrado perfecto.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"El 30 no es cuadrado perfecto: 5^2 = 25 y 6^2 = 36, y el 30 queda en medio, sin coincidir con el cuadrado de ningún natural."},{id:"16-09",topic:"Raíz cuadrada exacta",objective:"Reconocer la raíz como operación inversa del cuadrado",difficulty:"media",type:"true-false",prompt:"La raíz cuadrada es la operación inversa del cuadrado.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Si elevas al cuadrado el número que sale de la raíz, vuelves al número del que partiste: √49 = 7 y 7^2 = 49. Por eso se dice que la raíz es la operación inversa del cuadrado."},{id:"16-10",topic:"Raíz de un producto",objective:"Reconocer que la propiedad de la raíz no vale para una suma",difficulty:"media",type:"true-false",prompt:"La propiedad de la raíz de un producto vale también para una suma.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"La propiedad solo vale con multiplicaciones y divisiones, nunca con sumas: √25 + √9 = 5 + 3 = 8, pero √(25 + 9) = √34, y 34 no es cuadrado perfecto, así que esa raíz no es exacta."},{id:"16-11",topic:"Prueba de la raíz",objective:"Reconocer la relación de la prueba de la raíz",difficulty:"media",type:"true-false",prompt:"En la prueba de la raíz, el resto se suma al cuadrado de la raíz para obtener el radicando.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"La prueba de la raíz dice que el radicando es igual al cuadrado de la raíz más el resto: 38 = 6^2 + 2. Si al cuadrar la raíz se le sumara el resto y no saliera el radicando, la raíz estaría mal calculada."},{id:"16-12",topic:"Cuadrados perfectos y elementos de la raíz",objective:"Justificar qué afirmaciones son correctas",difficulty:"media",type:"multiple-choice",prompt:"¿Cuáles de estas afirmaciones son correctas?",options:["Un cuadrado perfecto es un número natural elevado al cuadrado","La raíz cuadrada de 49 es 24,5","El índice de la raíz cuadrada es 2 y se sobreentiende","La raíz entera de 5 000 es 71"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"Un cuadrado perfecto es un natural elevado al cuadrado (144 = 12^2) y el índice de la raíz cuadrada es 2, que se sobreentiende. La raíz de 49 es 7, no 24,5, y la raíz entera de 5 000 es 70, no 71, porque 71^2 = 5 041 excede del radicando."},{id:"16-13",topic:"Raíz de un producto",objective:"Multiplicar dos raíces cuadradas",difficulty:"media",type:"numeric",prompt:"Calcula √25 · √9.",correctAnswer:15,tolerance:0,explanation:"Se resuelve cada raíz por separado y se multiplican: √25 · √9 = 5 · 3 = 15. Es lo mismo que la raíz del producto, √(25 · 9) = √225 = 15."},{id:"16-14",topic:"Raíz de un cociente",objective:"Dividir dos raíces cuadradas",difficulty:"media",type:"numeric",prompt:"Calcula √100 : √4.",correctAnswer:5,tolerance:0,explanation:"Se resuelve cada raíz y se divide: √100 : √4 = 10 : 2 = 5. El divisor es √4, que vale 2, no el 4: si se dividiera entre 4 saldría 10 : 4 = 2,5, que no es un natural."},{id:"16-15",topic:"Raíz de un producto",objective:"Efectuar la raíz de un producto descomponiéndola",difficulty:"media",type:"numeric",prompt:"Calcula √(64 · 9).",correctAnswer:24,tolerance:0,explanation:"Se separa la raíz del producto en dos raíces: √(64 · 9) = √64 · √9 = 8 · 3 = 24. Comprueba: 24^2 = 576 y 64 · 9 = 576."},{id:"16-16",topic:"Raíz de un cociente",objective:"Efectuar la raíz de un cociente descomponiéndola",difficulty:"media",type:"numeric",prompt:"Calcula √(144 : 4).",correctAnswer:6,tolerance:0,explanation:"Se separa la raíz del cociente en dos raíces: √(144 : 4) = √144 : √4 = 12 : 2 = 6. Comprueba: 6^2 = 36 y 144 : 4 = 36."},{id:"16-17",topic:"Raíz entera por tanteo",objective:"Calcular el resto de una raíz entera por tanteo",difficulty:"avanzada",type:"numeric",prompt:"Calcula el resto de la raíz cuadrada entera de 5 000.",corre
