  <script type="module" crossorigin>const J={title:"Sistema de numeración decimal",subject:"Matemáticas",level:"1º ESO",sourceLesson:"lessons/Mat1ESO/Mat1ESO/01-Numeros naturales/1.1-Sistema de numeracion decimal.md",outputFolder:"Mat1ESO/01-Numeros naturales",instructions:"Responde a las 20 cuestiones sobre el sistema de numeración decimal: los números naturales, la base 10, el valor posicional, la agrupación de tres en tres y las series.",finalMessage:e=>e>=80?"¡Excelente! Dominas el sistema decimal: base 10, valor posicional y lectura de números grandes.":e>=60?"Buen trabajo. Repasa la diferencia entre decimal (base 10) y posicional (valor del lugar).":"Necesitas repasar el sistema de numeración decimal con calma.",questions:[{id:"sn-01",topic:"Propiedad decimal",objective:"Explicar por qué el sistema es decimal (base 10) y no solo por tener diez cifras.",difficulty:"básica",type:"single-choice",prompt:"¿Por qué se dice que el sistema de numeración es decimal?",options:["Porque usa las diez cifras del 0 al 9.","Porque diez elementos de un orden forman un grupo del orden inmediatamente superior.","Porque tiene diez órdenes de unidades.","Porque los números se escriben de izquierda a derecha."],correctAnswer:1,explanation:"Ser decimal (base 10) significa que diez elementos de un orden constituyen un grupo del orden siguiente: 10 U = 1 D, 10 D = 1 C, 10 C = 1 UM. Las diez cifras son consecuencia de esa regla, no la razón de que sea decimal.",shuffleOptions:!0},{id:"sn-02",topic:"Valor posicional",objective:"Dar el valor de una cifra según el orden que ocupa en el número.",difficulty:"básica",type:"single-choice",prompt:"En el número 52 826, ¿qué cantidad representa la primera cifra 2 (la del grupo de la izquierda)?",options:["2 unidades.","20 unidades.","2 000 unidades.","20 000 unidades."],correctAnswer:2,explanation:"Separando en grupos de tres desde la derecha (52 | 826), la primera 2 está en las unidades de millar: 2 UM = 2 · 1 000 = 2 000 unidades. La otra 2, en las decenas, vale 20.",shuffleOptions:!0},{id:"sn-03",topic:"Función del 0",objective:"Explicar la función del 0 como indicador de que un orden está vacío.",difficulty:"básica",type:"single-choice",prompt:"¿Qué función cumple el 0 en el número 4 030?",options:["Indica que no hay centenas.","Indica que no hay unidades.","Añade un orden de unidades al número.","No tiene función: es un adorno."],correctAnswer:0,explanation:"El 0 avisa de que en un lugar no hay nada: en 4 030 marca que no hay centenas. Sin ese 0, los números 4 030 y 430 se escribirían con las mismas cifras y serían cantidades distintas.",shuffleOptions:!0},{id:"sn-04",topic:"Propiedad posicional",objective:"Distinguir la propiedad posicional de la base 10.",difficulty:"media",type:"single-choice",prompt:"¿Por qué se dice que el sistema decimal es posicional?",options:["Porque agrupa los símbolos de diez en diez.","Porque cada cifra vale distinto según el lugar que ocupa en el número.","Porque usa diez cifras para escribir los números.","Porque los números tienen un orden de lectura."],correctAnswer:1,explanation:"Posicional significa que cada dígito adquiere valor según su posición: la misma cifra vale distinto en otro lugar. Agrupar de diez en diez es la propiedad decimal (base 10), que es otra cosa.",shuffleOptions:!0},{id:"sn-05",topic:"Escribir números",objective:"Escribir con cifras un número leído, completando los grupos con ceros.",difficulty:"básica",type:"single-choice",prompt:"¿Cómo se escribe con cifras «cuatro mil treinta»?",options:["4 30","4 030","43 000","4 300"],correctAnswer:1,explanation:"Cada grupo lleva tres cifras: el grupo del «mil» es 4 y el de la derecha es 030, con un cero delante del 30 para completar el grupo. El resultado es 4 030.",shuffleOptions:!0},{id:"sn-06",topic:"Origen del sistema",objective:"Localizar el origen histórico del sistema decimal.",difficulty:"media",type:"single-choice",prompt:"¿Cuál es el origen del sistema de numeración decimal?",options:["Es de origen egipcio.","Es de origen romano.","Es de origen hindú y llegó a Europa con los árabes en el siglo XIII.","Es de origen griego."],correctAnswer:2,explanation:"El sistema decimal es de origen hindú y llegó a Europa con los árabes en el siglo XIII. Antes se usaban otros sistemas, como el egipcio o el romano.",shuffleOptions:!0},{id:"sn-07",topic:"Billones",objective:"Leer un número de quince cifras en billones sin confundirlo con millones.",difficulty:"avanzada",type:"single-choice",prompt:"¿A cuántos billones equivale el número 349 000 000 000 000 000?",options:["349 billones.","349 000 billones (349 mil billones).","349 millones.","34 900 billones."],correctAnswer:1,explanation:"Separando en grupos de tres: 349 | 000 | 000 | 000 | 000. Hay cuatro grupos por debajo del primero, así que el 349 está en el orden de los billones: son 349 000 billones, es decir 349 mil billones, no 349 billones.",shuffleOptions:!0},{id:"sn-08",topic:"Conjunto N",objective:"Detectar el error de meter el 0 en el conjunto de los naturales.",difficulty:"básica",type:"true-false",prompt:"Verdadero o falso: el 0 es un número natural.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El conjunto de los naturales es N = {1, 2, 3, …}: el 0 no está dentro. El 0 es una cifra del sistema de numeración (sirve para escribir), no un número para contar.",shuffleOptions:!0},{id:"sn-09",topic:"Base 10",objective:"Aplicar la cadena de órdenes de unidades.",difficulty:"básica",type:"true-false",prompt:"Verdadero o falso: 1 C = 100 U.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Verdadero. De unidades a centenas hay dos saltos: 1 C = 10 D = 100 U. Cada salto multiplica por 10.",shuffleOptions:!0},{id:"sn-10",topic:"Propiedad posicional",objective:"Detectar la confusión entre posicional y base 10.",difficulty:"media",type:"true-false",prompt:"Verdadero o falso: el sistema es posicional porque agrupa los símbolos de diez en diez.",options:["Verdadero","Falso"],correctAnswer:1,exp
