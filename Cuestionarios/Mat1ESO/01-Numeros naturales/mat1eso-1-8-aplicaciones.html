ype:"single-choice",prompt:"¿Cuántos números de dos cifras hay, del 10 al 99, los dos incluidos?",options:["89","90","91"],correctAnswer:1,shuffleOptions:!0,explanation:"Restar 99 - 10 da 89, pero deja fuera el propio 10, que también es candidato. Como los dos extremos entran en la cuenta, se suma 1: 99 - 10 + 1 = 90 candidatos. Compruébalo con un tramo pequeño: del 10 al 19 hay 10 números, no 9."},{id:"18-04",topic:"Descarte organizado",objective:"Reducir la lista aplicando la condición de impar",difficulty:"media",type:"single-choice",prompt:"De los 90 candidatos de dos cifras, ¿cuántos quedan si el número buscado es impar?",options:["45","90","40"],correctAnswer:0,shuffleOptions:!0,explanation:"En cualquier bloque de números consecutivos la mitad son impares, así que la lista se reduce a la mitad: 90 : 2 = 45 candidatos (11, 13, 15, 17, 19, ..., 99)."},{id:"18-05",topic:"Capicúas",objective:"Identificar los capicúas de dos cifras",difficulty:"media",type:"single-choice",prompt:"¿Cuáles son los capicúas de dos cifras?",options:["11, 22, 33, 44, 55, 66, 77, 88 y 99","11, 33, 55, 77 y 99","10, 12, 14, 16 y 18"],correctAnswer:0,shuffleOptions:!0,explanation:"Un capicúa se lee igual de izquierda a derecha que de derecha a izquierda; en dos cifras significa que las dos cifras son la misma: 11, 22, 33, 44, 55, 66, 77, 88 y 99. De ellos, los impares son cinco (11, 33, 55, 77 y 99), y esos son los que se tachan de la lista de impares."},{id:"18-06",topic:"Condición de la suma de las cifras",objective:"Aplicar la condición «la suma de las cifras es menor que 6»",difficulty:"media",type:"single-choice",prompt:"De los 40 candidatos, ¿cuáles cumplen que la suma de sus dos cifras es menor que 6?",options:["13, 21, 23, 31 y 41","13, 15, 21, 23, 31, 41 y 51","15 y 51"],correctAnswer:0,shuffleOptions:!0,explanation:"Calculando cifra a cifra, los que cumplen la condición son 13, 21, 23, 31 y 41. El 15 y el 51 se descartan porque su suma de cifras es 1 + 5 = 6, y 6 no es menor que 6."},{id:"18-07",topic:"El número escondido",objective:"Resolver el problema del número escondido",difficulty:"avanzada",type:"single-choice",prompt:"Un número de dos cifras es impar, no es capicúa, la suma de sus cifras es menor que 6 y el producto de sus cifras es mayor que la suma. ¿Qué número es?",options:["23","13","31"],correctAnswer:0,shuffleOptions:!0,explanation:"De los 90 candidatos quedan 45 impares, 40 no capicúas y 5 con la suma de las cifras menor que 6 (13, 21, 23, 31 y 41). En la tabla de comprobación, solo el 23 supera la comparación: 2 · 3 = 6 y 2 + 3 = 5, y 6 > 5."},{id:"18-08",topic:"Condición de la suma de las cifras",objective:"Distinguir «menor que 6» de «menor o igual que 6»",difficulty:"media",type:"true-false",prompt:"Si la suma de las cifras de un número es 6, cumple la condición de ser menor que 6.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"6 no es menor que 6: la condición «menor que 6» excluye el propio 6. Por eso el 15 y el 51, cuya suma de cifras es 1 + 5 = 6, se descartan."},{id:"18-09",topic:"Reparto en cajas",objective:"Interpretar el resto de una división en el reparto",difficulty:"media",type:"true-false",prompt:"Si al repartir sacos en cajas de ocho sobran sacos, hacen falta una caja más, que irá sin completar.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"En 700 : 8 el cociente es 87 y el resto 4: hacen falta 87 + 1 = 88 cajas y la última no va completa. El resto no se tira: necesita su propia caja."},{id:"18-10",topic:"Rutina de problemas",objective:"Reconocer el último paso de la rutina",difficulty:"básica",type:"true-false",prompt:"El último paso de la rutina es comprobar el resultado sustituyéndolo en el enunciado.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Sí: el paso 5 decide si el trabajo vale. Un resultado que no se ha sustituido en el enunciado, pasándolo por todas las condiciones una a una, no está comprobado."},{id:" cajas",correctAnswer:88,tolerance:0,explanation:"700 : 8 = 87 y sobran 4 sacos (el resto). Esos 4 sacos necesitan una caja más, que no irá completa: 87 + 1 = 88 cajas."},{id:"18-15",topic:"La avenida de Ana",objective:"Restar el trozo que sobra para pasar de una distancia a otra",difficulty:"media",type:"numeric",prompt:"En la avenida de Ana están, por este orden, su casa, la panadería, la casa de sus abuelos y el instituto. La casa de Ana está a 600 m del instituto y la de los abuelos a 200 m del instituto. ¿A cuántos metros está la casa de Ana de la de sus abuelos?",unit:"m",correctAnswer:400,tolerance:0,explanation:"Los 200 m del instituto a la casa de los abuelos están dentro de los 600 m de la casa de Ana al instituto, así que se resta el trozo: 600 - 200 = 400 m."},{id:"18-16",topic:"El senderismo de David",objective:"Calcular el recorrido del domingo por la tarde",difficulty:"avanzada",type:"numeric",prompt:"David hace 40 km de senderismo el fin de semana. El sábado recorrió 8 km antes de comer y otros 6 km después. El domingo recorrió el resto, y esa mañana caminó el doble de distancia que el sábado por la mañana. ¿Cuántos kilómetros recorrió el domingo por la tarde?",unit:"km",correctAnswer:10,tolerance:0,explanation:"El sábado recorrió 8 + 6 = 14 km, así que el domingo recorrió 40 - 14 = 26 km. El domingo por la mañana caminó el doble que el sábado por la mañana: 8 · 2 = 16 km. Por la tarde: 26 - 16 = 10 km."},{id:"18-17",topic:"Patas de gallinas y conejos",objective:"Sumar las patas de dos animales distintos",difficulty:"avanzada",type:"numeric",prompt:"En una granja hay 36 gallinas y 40 conejos. ¿Cuántas patas hay en total?",unit:"patas",correctAnswer:232,tolerance:0,explanation:"Las gallinas tienen 2 patas y los conejos 4: 36 · 2 + 40 · 4 = 72 + 160 = 232 patas. Contar cuatro patas a las gallinas daría 304, que es otro resultado."},{id:"18-18",topic:"División con resto",objective:"Nombrar el resto de una división",difficulty:"media",type:"short-answer",
