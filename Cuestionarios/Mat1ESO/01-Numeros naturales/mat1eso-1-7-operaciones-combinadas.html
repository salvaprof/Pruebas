adero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"No: en cada línea solo se resuelven las operaciones del escalón que toca, y las que aún no tocan se copian tal cual. Si se resuelve una multiplicación y una suma en la misma línea, se salta un escalón y el resultado deja de ser fiable."},{id:"17-12",topic:"Jerarquía de operaciones",objective:"Justificar qué afirmaciones sobre la jerarquía son correctas",difficulty:"media",type:"multiple-choice",prompt:"¿Cuáles de estas afirmaciones sobre la jerarquía son correctas?",options:["Los paréntesis y corchetes se resuelven del más interno al más externo","Las sumas y restas se calculan antes que las multiplicaciones","Las potencias y las raíces se calculan antes que las multiplicaciones y divisiones","Entre operaciones del mismo nivel se opera de derecha a izquierda"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"Los paréntesis y corchetes se resuelven del más interno al más externo y las potencias y raíces van antes que multiplicar y dividir. Las sumas y restas van al final (no antes que las multiplicaciones) y entre operaciones del mismo nivel se opera de izquierda a derecha, no de derecha a izquierda."},{id:"17-13",topic:"Expresión con paréntesis, multiplicación y suma",objective:"Resolver una expresión combinada con paréntesis",difficulty:"media",type:"numeric",prompt:"Calcula (25 - 20) + 3 · (3 + 15).",correctAnswer:59,tolerance:0,explanation:"Se resuelven los paréntesis (25 - 20 = 5 y 3 + 15 = 18), luego la multiplicación (3 · 18 = 54) y al final la suma (5 + 54 = 59)."},{id:"17-14",topic:"Multiplicación y división del mismo nivel",objective:"Resolver una expresión de multiplicación y división de izquierda a derecha",difficulty:"media",type:"numeric",prompt:"Calcula 12 : 2 · 3.",correctAnswer:18,tolerance:0,explanation:"Las dos operaciones están en el mismo escalón, así que se opera de izquierda a derecha: 12 : 2 = 6 y 6 · 3 = 18. Si se multiplicara primero 2 · 3 = 6 y se dividiera, saldría 12 : 6 = 2, que es otro resultado."},{id:"17-15",topic:"Raíz, potencia, suma y resta",objective:"Resolver una expresión con raíz, potencia, suma y resta",difficulty:"media",type:"numeric",prompt:"Calcula √36 + 2^4 - 9.",correctAnswer:13,tolerance:0,explanation:"Primero la raíz (√36 = 6) y la potencia (2^4 = 16), y después la suma y la resta de izquierda a derecha: 6 + 16 = 22 y 22 - 9 = 13."},{id:"17-16",topic:"Jerarquía de operaciones",objective:"Multiplicar antes que restar",difficulty:"media",type:"numeric",prompt:"Calcula 7 - 3 · 2.",correctAnswer:1,tolerance:0,explanation:"La multiplicación va antes que la resta: 3 · 2 = 6 y 7 - 6 = 1. Si se restara primero 7 - 3 = 4 y se multiplicara, saldría 4 · 2 = 8, que es otro resultado."},{id:"17-17",topic:"Signos de agrupación y potencia",objective:"Resolver un corchete antes que la potencia que lo envuelve",difficulty:"avanzada",type:"numeric",prompt:"Calcula [(5 + 2) · 3]^2.",correctAnswer:441,tolerance:0,explanation:"Se resuelve el paréntesis (5 + 2 = 7), luego el corchete (7 · 3 = 21) y al final la potencia (21^2 = 441). Si se calculara la potencia antes de resolver el corchete, saldría otro resultado."},{id:"17-18",topic:"Jerarquía de operaciones",objective:"Nombrar los escalones de la jerarquía",difficulty:"media",type:"short-answer",prompt:"¿Cómo se llama cada uno de los cuatro grupos de la jerarquía de operaciones?",acceptedAnswers:["escalón"],explanation:"Cada uno de los cuatro grupos de la jerarquía se llama escalón: paréntesis y corchetes, potencias y raíces, multiplicaciones y divisiones, y sumas y restas."},{id:"17-19",topic:"Signos de agrupación",objective:"Nombrar el paréntesis y el corchete",difficulty:"media",type:"short-answer",prompt:"¿Cómo se llaman el paréntesis y el corchete, que encierran una parte de la expresión?",acceptedAnswers:["signo de agrupación"],explanation:"El paréntesis y el corchete son signos de agrupación: encierran una parte de la expresión que se resuelve antes que lo de fuera, del más inte
