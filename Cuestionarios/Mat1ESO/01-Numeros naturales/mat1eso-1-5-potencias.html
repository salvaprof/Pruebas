 se teclea...",options:["Primero la base y después el exponente","Primero el exponente y después la base","La base y el exponente en cualquier orden"],correctAnswer:0,shuffleOptions:!0,explanation:"Se teclea primero la base y después el exponente: para 10^4 se teclea 10 [x^y] 4, que da 10 000. Si se pone el exponente delante, 4 [x^y] 10, da 10, que es otro valor."},{id:"15-08",topic:"Potencia de exponente 1",objective:"Calcular el valor de una potencia de exponente 1",difficulty:"media",type:"true-false",prompt:"Una potencia de exponente 1 vale igual que su base.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:'Cualquier número elevado a 1 es ese mismo número: a^1 = a, como en 5^1 = 5. El exponente 1 significa "una vez el factor".'},{id:"15-09",topic:"Potencia de exponente 0",objective:"Calcular el valor de una potencia de exponente 0",difficulty:"media",type:"true-false",prompt:"Una potencia de exponente 0 vale 0.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Una potencia de exponente 0 vale 1, no 0: a^0 = 1 para cualquier base distinta de cero. Sale de dividir una potencia entre sí misma, 7^3 : 7^3 = 7^0 = 1."},{id:"15-10",topic:"Reparto del exponente",objective:"Reconocer que el exponente no se reparte en una suma",difficulty:"media",type:"true-false",prompt:"El exponente se reparte en una suma.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"El exponente no se reparte en una suma: (2 + 3)^2 = 5^2 = 25, mientras que 2^2 + 3^2 = 4 + 9 = 13. Primero se suma dentro del paréntesis y después se eleva el resultado."},{id:"15-11",topic:"División de potencias de la misma base",objective:"Dividir potencias de la misma base restando los exponentes",difficulty:"media",type:"true-false",prompt:"Al dividir potencias de la misma base se restan los exponentes.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Al dividir potencias de la misma base se restan los
