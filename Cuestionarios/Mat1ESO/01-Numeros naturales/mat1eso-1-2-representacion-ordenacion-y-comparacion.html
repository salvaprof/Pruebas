l símbolo ≈ significa...",options:["Aproximado a","Distinto de","Mayor o igual que"],correctAnswer:0,shuffleOptions:!0,explanation:"El símbolo ≈ se usa cuando el número que se escribe no es exacto, sino un valor cercano. «Distinto de» es ≠ y «mayor o igual que» es ≥."},{id:"12-08",topic:"El 0 en la recta",objective:"Situar el 0 en la recta numérica como origen y explicar por qué no es un número natural",difficulty:"básica",type:"true-false",prompt:"El 0 es un número natural.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"El 0 no se considera un número natural, al no representar ninguna cantidad: no hay nada que contar. En la recta es imprescindible, pero como origen, no como número de contar."},{id:"12-09",topic:"Símbolos de comparación",objective:"Usar los símbolos de comparación con su significado",difficulty:"media",type:"true-false",prompt:"7 ≤ 7 es verdad.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"El símbolo ≤ significa «menor que o igual que», así que admite la igualdad: 7 ≤ 7 es verdad. Confundir ≤ con < llevaría a descartar la igualdad."},{id:"12-10",topic:"Orden en la recta",objective:"Ordenar un grupo de números naturales de mayor a menor y de menor a mayor, en la recta y por escrito",difficulty:"media",type:"true-false",prompt:"Para ordenar de mayor a menor se lee la recta numérica de izquierda a derecha.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"De mayor a menor se lee la recta de derecha a izquierda; de izquierda a derecha sería de menor a mayor. Cuanto más a la derecha está un punto, mayor es el número."},{id:"12-11",topic:"Símbolos de comparación",objective:"Usar los símbolos de comparación con su significado",difficulty:"media",type:"true-false",prompt:"El símbolo ≠ dice cuál de los dos números es mayor.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"El símbolo ≠ solo dice que los dos números no son el mismo, sin decir cuál es mayor. Para saber cuál es mayor se usan < y >."},{id:"12-12",topic:"Símbolos de comparación",objective:"Usar los símbolos de comparación con su significado",difficulty:"media",type:"multiple-choice",prompt:"¿Cuáles de estas afirmaciones sobre los símbolos de comparación son correctas?",options:["El símbolo ≤ admite la igualdad","El símbolo ≠ dice cuál de los dos números es mayor","El símbolo ≈ se usa para un valor cercano","El símbolo > se abre hacia el número menor"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"≤ significa «menor que o igual que» (admite la igualdad) y ≈ se usa para un valor cercano. En cambio, ≠ solo dice que no son el mismo número (no cuál es mayor) y > se abre hacia el número mayor, no el menor."},{id:"12-13",topic:"Números consecutivos",objective:"Explicar qué es el consecutivo de un número natural y obtenerlo añadiendo una unidad",difficulty:"básica",type:"numeric",prompt:"Escribe el número anterior a 99.",correctAnswer:98,tolerance:0,explanation:"Para volver al anterior se resta una unidad: 99 - 1 = 98. Entre dos consecutivos siempre hay una sola unidad de distancia."},{id:"12-14",topic:"Comparación por resta",objective:"Comparar dos números naturales restando y justificar la comparación diciendo que el resultado es un número natural",difficulty:"media",type:"numeric",prompt:"¿Cuántas unidades separan 6 537 y 6 529?",correctAnswer:8,tolerance:0,explanation:"La distancia entre dos números se obtiene restando el menor al mayor: 6 537 - 6 529 = 8 unidades."},{id:"12-15",topic:"Leer la recta",objective:"Leer el número que representa un punto de una recta numérica a partir de un número conocido",difficulty:"media",type:"numeric",prompt:"En una recta con divisiones de 1 unidad está escrito el 317 en una marca. El punto A está dos marcas a la izquierda de esa marca. ¿Cuánto vale A?",correctAnswer:315,tolerance:0,explanation:"A está a la izquierda del 317, así que es menor: 317 - 2 = 315. La marca en la que está escrito el 317 no se cuenta."},{id:"12-16",topic:"Leer la recta",objective:"Leer el número que representa un punto de una recta numérica a partir de un número conocido",difficulty:"media",type:"numeric",prompt:"En la misma recta, el punto B está tres marcas a la derecha de la del 317. ¿Cuánto vale B?",correctAnswer:320,tolerance:0,explanation:"B está a la derecha del 317, así que es mayor: 317 + 3 = 320. Cada división de la recta equivale a una unidad."},{id:"12-17",topic:"Leer la recta",objective:"Leer el número que representa un punto de una recta numérica a partir de un número conocido",difficulty:"avanzada",type:"numeric",prompt:"En una recta con divisiones de 1 unidad, el número 26 está en la cuarta marca. ¿Cuánto vale el punto situado en la octava marca?",correctAnswer:30,tolerance:0,explanation:"La octava marca está 4 divisiones a la derecha de la cuarta (8 - 4 = 4), así que vale 26 + 4 = 30."},{id:"12-18",topic:"Símbolos de comparación",objective:"Usar los símbolos de comparación con su significado",difficulty:"media",type:"short-answer",prompt:"¿Cómo se escribe en el teclado el símbolo «≤» (menor o igual que)?",acceptedAnswers:["<="],explanation:"En el teclado los siete símbolos se escriben como =, !=, <, >, <=, >= y ~; el símbolo ≤ corresponde a <=."},{id:"12-19",topic:"Símbolos de comparación",objective:"Usar los símbolos de comparación con su significado",difficulty:"media",type:"short-answer",prompt:"¿Cómo se escribe en el teclado el símbolo «≈» (aproximado a)?",acceptedAnswers:["~"],explanation:"En el teclado, el símbolo ≈ se escribe como ~, el único de la lista que no es una operación."},{id:"12-20",topic:"Comparación cifra a cifra",objective:"Comparar dos números naturales de igual número de cifras recorriendo sus cifras desde la izquierda",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para comparar dos números que tienen el mismo número de cifras.",steps:["Alinear las cifras de los dos números, una debajo de otra, por la derecha","Recorrer las columnas
