  <meta name="description" content="Matemáticas · 1º ESO">
  <script type="module" crossorigin>const W={title:"Máximo común divisor y mínimo común múltiplo",subject:"Matemáticas",level:"1º ESO",sourceLesson:"lessons/Mat1ESO/Mat1ESO/02-Divisibilidad/2.4-Maximo comun divisor y minimo comun multiplo.md",outputFolder:"Mat1ESO/02-Divisibilidad",instructions:"Responde a las 20 cuestiones sobre el m.c.d. y el m.c.m.: definiciones, reglas de exponentes por descomposición factorial, primos entre sí, la relación de divisibilidad y la propiedad a · b = m.c.d. · m.c.m.",finalMessage:e=>e>=80?"¡Excelente! Dominas el m.c.d. y el m.c.m. y sus reglas de exponentes.":e>=60?"Buen trabajo. Repasa la diferencia entre menor exponente (m.c.d.) y mayor exponente (m.c.m.).":"Necesitas repasar el m.c.d. y el m.c.m. con calma.",questions:[{id:"24-01",topic:"m.c.d. en contexto",objective:"Interpretar el m.c.d. como el tamaño máximo de reparto",difficulty:"básica",type:"single-choice",prompt:"Tienes 30 caramelos de una marca y 45 de otra y quieres repartirlos de modo que cada niño reciba la misma cantidad de cada marca. El máximo número de niños que pueden participar es 15. ¿Qué representa ese 15?",options:["El m.c.m. de 30 y 45.","El m.c.d. de 30 y 45.","El producto de 30 y 45.","La suma de 30 y 45."],correctAnswer:1,shuffleOptions:!0,explanation:"El m.c.d. es el «tamaño de grupo» más grande para repartir en partes iguales: los divisores comunes de 30 y 45 son 1, 3, 5 y 15, y el mayor es 15."},{id:"24-02",topic:"m.c.m. en contexto",objective:"Interpretar el m.c.m. como el punto de sincronización",difficulty:"básica",type:"single-choice",prompt:"Un autobús A pasa cada 30 minutos y un B cada 45. Si ambos pasan juntos ahora, volverán a pasar juntos en el minuto 90. ¿Qué representa el 90?",options:["El m.c.d. de 30 y 45.","La suma de 30 y 45.","El m.c.m. de 30 y 45.","La diferencia entre 30 y 45."],correctAnswer:2,shuffleOptions:!0,explanation:"El m.c.m. es el «punto de sincronización» más pronto: los múltiplos comunes de 30 y 45 empiezan en 90, y 90 : 30 = 3 y 90 : 45 = 2."},{id:"24-03",topic:"Regla del m.c.d.",objective:"Enunciar la regla de exponentes del m.c.d. por descomposición",difficulty:"media",type:"single-choice",prompt:"Al calcular el m.c.d. de dos números por descomposición factorial, ¿qué factores se toman?",options:["Todos los factores de las descomposiciones, al mayor exponente.","Solo los factores comunes, al mayor exponente.","Solo los factores comunes, al menor exponente.","Todos los factores de las descomposiciones, al menor exponente."],correctAnswer:2,shuffleOptions:!0,explanation:"El m.c.d. es el mayor divisor común: solo cuentan los factores comunes, y cada uno se usa con el menor exponente. En 30 y 45: 3 · 5 = 15."},{id:"24-04",topic:"Regla del m.c.m.",objective:"Enunciar la regla de exponentes del m.c.m. por descomposición",difficulty:"media",type:"single-choice",prompt:"Al calcular el m.c.m. por descomposición factorial, ¿qué se hace con los factores primos?",options:["Se toman solo los que aparecen en todas las descomposiciones, al mayor exponente.","Se toman todos los factores, al mayor exponente.","Se toman todos los factores, al menor exponente.","Se toman solo los que aparecen en todas las descomposiciones, al menor exponente."],correctAnswer:1,shuffleOptions:!0,explanation:"Un múltiplo común debe contener cada primo tantas veces como pida el número más exigente: todos los factores, al mayor exponente. El 2 va en el m.c.m.(30, 45) aunque solo aparezca en el 30."},{id:"24-05",topic:"Factor común en tres números",objective:"Aplicar el criterio «común = en todas las descomposiciones»",difficulty:"media",type:"single-choice",prompt:"En 24 = 2^3 · 3, 90 = 2 · 3^2 · 5 y 300 = 2^2 · 3 · 5^2, el 5 aparece en el 90 y en el 300. ¿Por qué el 5 NO se incluye en el m.c.d.?",options:["Porque el 5 no es primo.","Porque no aparece en la descomposición de 24: un factor es común solo si aparece en todas.","Porque solo aparece en dos de las tres descomposiciones, y para el m.c.d. basta que aparezca en la mayoría.","Porque su exponente en el 300 (2) es mayor que en el 90 (1)."],correctAnswer:1,shuffleOptions:!0,explanation:"«Común» exige aparecer en todas las descomposiciones. El 5 está en el 90 y en el 300 pero no en el 24, así que no es factor común: m.c.d.(24, 90, 300) = 2 · 3 = 6."},{id:"24-06",topic:"Primos entre sí",objective:"Reconocer números primos entre sí sin que cada uno sea primo",difficulty:"básica",type:"single-choice",prompt:"¿Son 35 y 12 primos entre sí?",options:["No, porque ninguno de los dos es primo.","Sí, porque no tienen ningún divisor común mayor que 1.","No, porque 12 es múltiplo de 35.","Sí, porque el 1 es un factor primo común a ambos."],correctAnswer:1,shuffleOptions:!0,explanation:"35 = 5 · 7 y 12 = 2^2 · 3 no comparten primo: el único divisor común es el 1, así que m.c.d.(35, 12) = 1 y son primos entre sí aunque ambos sean compuestos."},{id:"24-07",topic:"Propiedad a · b = m.c.d. · m.c.m.",objective:"Usar la propiedad para pasar de la multiplicación al m.c.m.",difficulty:"avanzada",type:"single-choice",prompt:"Se sabe que a · b = 1350 y que m.c.d.(a, b) = 15. ¿Cuánto vale m.c.m.(a, b)?",options:["1350","15","90","150"],correctAnswer:2,shuffleOptions:!0,explanation:"a · b = m.c.d. · m.c.m. → 1350 = 15 · m.c.m. → m.c.m. = 1350 : 15 = 90 (es justo el caso de 30 y 45)."},{id:"24-08",topic:"Definición de m.c.d.",objective:"Enunciar la definición de m.c.d.",difficulty:"básica",type:"true-false",prompt:"El m.c.d. de dos números es el mayor de sus divisores comunes.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Verdadero: los divisores comunes de 30 y 45 son 1, 3, 5 y 15; el mayor es 15."},{id:"24-09",topic:"Regla del m.c.d.",objective:"Detectar la confusión de las reglas de exponentes",difficulty:"media",type:"true-false",prompt:"Para calcular el m.c.d. por descomposición factorial se toman todos los factores primos que aparezcan en alguna de las descomposiciones, elevados al mayor exponente.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: esa es la regla del m.c.m. Para el m.c.d. se toman solo los factores comunes, al menor exponente."},{id:"24-10",topic:"Regla del m.c.m.",objective:"Detectar el error de dejar fuera un primo del m.c.m.",difficulty:"media",type:"true-false",prompt:"Al calcular el m.c.m. por descomposición factorial, un primo que solo aparece en una de las descomposiciones se deja fuera.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"Falso: el m.c.m. lleva todos los factores, al mayor exponente. El 2, que solo está en el 30, entra en el m.c.m.(30, 45) = 2 · 3^2 · 5 = 90."},{id:"24-11",topic:"Relación de divisibilidad",objective:"Aplicar la regla cuando un número es múltiplo del otro",difficulty:"básica",type:"true-false",prompt:"Si un número es múltiplo de otro, su m.c.d. es el menor de los dos y su m.c.m. es el mayor.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Verdadero: en 45 y 90, el 90 es múltiplo del 45, así que m.c.d.(45, 90) = 45 (el menor) y m.c.m.(45, 90) = 90 (el mayor)."},{id:"24-12",topic:"Comparación m.c.d. / m.c.m.",objective:"Distinguir las propiedades del m.c.m.",difficulty:"media",type:"multiple-choice",prompt:"Selecciona todas las afirmaciones que describen correctamente el m.c.m.",options:["Busca el menor de los múltiplos comunes de los números.","Por descomposición, toma todos los factores al mayor exponente.","Por descomposición, toma los factores comunes al menor exponente.","Su valor para 30 y 45 es 90.","Solo incluye los factores que aparecen en todas las descomposiciones."],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"La c) y la e) describen el m.c.d. El m.c.m. es el menor de los múltiplos comunes, toma todos los factores al mayor exponente e incluye los primos que solo aparecen en un número (como el 2 en el 30)."},{id:"24-13",topic:"Cálculo de m.c.d.",objective:"Calcular el m.c.d. de dos números",difficulty:"básica",type:"numeric",prompt:"Calcula el m.c.d.(30, 45).",correctAnswer:15,tolerance:0,explanation:"30 = 2 · 3 · 5 y 45 = 3^2 · 5: los factores comunes son 3 y 5, al menor exponente → 3 · 5 = 15."},{id:"24-14",topic:"Cálculo de m.c.m.",objective:"Calcular el m.c.m. de dos números",difficulty:"básica",type:"numeric",prompt:"Calcula el m.c.m.(30, 45).",correctAnswer:90,tolerance:0,explanation:"Todos los factores al mayor exponente → 2 · 3^2 · 5 = 90. Comprobación: 90 : 30 = 3 y 90 : 45 = 2."},{id:"24-15",topic:"m.c.d. de tres números",objective:"Calcular el m.c.d. de tres números",difficulty:"media",type:"numeric",prompt:"Calcula el m.c.d.(24, 90, 300).",correctAnswer:6,tolerance:0,explanation:"24 = 2^3 · 3, 90 = 2 · 3^2 · 5 y 300 = 2^2 · 3 · 5^2: el 5 no está en el 24, así que solo son comunes el 2 y el 3 → 2 · 3 = 6."},{id:"24-16",topic:"m.c.m. de tres números",objective:"Calcular el m.c.m. de tres números",difficulty:"avanzada",type:"numeric",prompt:"Calcula el m.c.m.(24, 90, 300).",correctAnswer:1800,tolerance:0,explanation:"2^3 · 3^2 · 5^2 = 8 · 9 · 25 = 1800. Comprobación: 1800 : 24 = 75, 1800 : 90 = 20 y 1800 : 300 = 6."},{id:"24-17",topic:"Propiedad a · b = m.c.d. · m.c.m.",objective:"Despejar un número de la propiedad del producto",difficulty:"avanzada",type:"numeric",prompt:"Se cumple m.c.d.(a, 6) = 2 y m.c.m.(a, 6) = 24. ¿Cuánto vale a?",correctAnswer:8,tolerance:0,explanation:"a · 6 = m.c.d. · m.c.m. = 2 · 24 = 48, así que a = 48 : 6 = 8. Comprobación: 8 = 2^3 y 6 = 2 · 3 → m.c.d. = 2 y m.c.m. = 2^3 · 3 = 24."},{id:"24-18",topic:"m.c.d. como producto de primos",objective:"Escribir el m.c.d. de tres números como producto de primos",difficulty:"media",type:"short-answer",prompt:"Escribe el m.c.d. de 24, 90 y 300 como producto de factores primos. Usa * para la multiplicación.",acceptedAnswers:["2*3","6"],explanation:"Los factores comunes al menor exponente son 2 y 3: m.c.d.(24, 90, 300) = 2 · 3 = 6."},{id:"24-19",topic:"m.c.m. como producto de potencias",objective:"Escribir el m.c.m. de tres números como producto de potencias",difficulty:"avanzada",type:"short-answer",prompt:"Escribe el m.c.m. de 24, 90 y 300 como producto de potencias de primos. Usa * para la multiplicación y ^ para el exponente.",acceptedAnswers:["2^3*3^2*5^2"],explanation:"Todos los factores al mayor exponente: 2^3 · 3^2 · 5^2 = 8 · 9 · 25 = 1800."},{id:"24-20",topic:"Rutina de m.c.d. y m.c.m.",objective:"Ordenar los pasos de cálculo por descomposición factorial",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para calcular el m.c.d. y el m.c.m. de dos números por descomposición factorial.",steps:["Descomponer ambos números en factores primos","Calcular el m.c.d. tomando los factores comunes al menor exponente","Calcular el m.c.m. tomando todos los factores al mayor exponente","Comprobar: el m.c.d. divide exactamente a los dos números y el m.c.m. se divide exactamente entre ellos"],correctAnswer:[0,1,2,3],explanation:"Se descomponen los dos números en factores primos; el m.c.d. toma los factores comunes al menor exponente y el m.c.m. todos los factores al mayor exponente; y al final se comprueba que el m.c.d. divide a los dos números y que el m.c.m. se divide entre ellos, como en 30 y 45: m.c.d. = 15 y m.c.m. = 90."}]},G=Object.freeze(Object.defineProperty({__proto__:null,mat1eso24MaximoComunDivisorYMinimoComunMultiploAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"24-01":{hint:"Cuenta cuántos niños caben: el tamaño del grupo no puede pasar de la cantidad que repartes; descarta la suma y el producto."},"24-02":{hint:"Los dos autobuses vuelven a coincidir en un minuto que es múltiplo de los dos tiempos de paso: busca el más pequeño de esos minutos."},"24-03":{hint:"Un divisor de los dos números no puede llevar un primo más veces que el número que menos lo tiene; mira cuál de las reglas cumple eso."},"24-04":{hint:"Un múltiplo común debe caber en los dos números: mira qué hace cada regla con el primo que solo aparece en uno de ellos."},"24-05":{hint:"Escribe las tres descomposiciones y busca el 5 una por una: la respuesta está en cuál de los números lo tiene y en cuál falta."},"24-06":{hint:"Trocea los dos números y compara sus primos: si las dos listas no comparten ninguno, no hay nada que repartir."},"24-07":{hint:"Escribe la igualdad de la propiedad: conoces el producto de los dos números y el m.c.d., así que te falta un factor de esa multiplicación."},"24-08":{hint:"Lista los divisores comunes de 30 y 45 y quédate con el último de la lista; compara ese número con lo que afirma la frase."},"24-09":{hint:"Aplica la frase a 30 y 45 y compara el número que sale con el mayor divisor común de los dos."},"24-10":{hint:"Mira el 2, que solo está en la descomposición del 30, y comprueba si entra en el múltiplo común más pequeño de 30 y 45."},"24-11":{hint:"Prueba con 45 y 90: escribe los divisores de 45 y mira cuáles dividen también a 90."},"24-12":{hint:"Comprueba cada frase calculando el m.c.m. de 30 y 45: las que describen la regla del m.c.d. quedan fuera."},"24-13":{hint:"Escribe las dos descomposiciones y quédate con los primos que salen en ambas, una sola vez cada uno."},"24-14":{hint:"Un múltiplo de los dos ha de llevar el primo que solo está en uno de ellos; multiplica cada primo por las veces que más se repite."},"24-15":{hint:"En tres números el factor común tiene que estar en los tres: escribe las tres descomposiciones y elimina el que falte en alguna."},"24-16":{hint:"Con tres números entran todos los primos que aparezcan en cualquiera; usa en cada uno el exponente más grande que tenga."},"24-17":{hint:"Escribe la propiedad a · 6 = m.c.d. · m.c.m. con los datos del enunciado y despeja a con una división."},"24-18":{hint:"Escribe las tres descomposiciones, quédate con los primos que están en las tres y únelos con el signo de multiplicar."},"24-19":{hint:"Une todos los primos que aparezcan en alguno de los tres números, cada uno con el exponente más grande de las tres descomposiciones."},"24-20":{
