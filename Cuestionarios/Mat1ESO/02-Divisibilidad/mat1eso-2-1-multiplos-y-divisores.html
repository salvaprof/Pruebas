 de 7, 7̇?",options:["7, 14, 21, 28, 35, …","0, 7, 14, 21, …","7, 14, 21, 28, 35"],correctAnswer:0,shuffleOptions:!0,explanation:"El conjunto 7̇ arranca en el propio 7, que sale de multiplicar 7 por 1, y sigue 14, 21, 28, 35, … con puntos suspensivos, porque los múltiplos no se acaban. El 0 también es múltiplo de 7 (0 = 7 · 0), pero la lista arranca en el 7."},{id:"21-04",topic:"Conjunto de divisores",objective:"Escribir el conjunto de divisores de 10",difficulty:"media",type:"single-choice",prompt:"¿Cuál es el conjunto de divisores de 10, D(10)?",options:["{1, 2, 5, 10}","{0, 1, 2, 5, 10}","{2, 5, 10}"],correctAnswer:0,shuffleOptions:!0,explanation:"Los divisores de 10 son 1, 2, 5 y 10: el 1 es divisor de cualquier número, el propio 10 es divisor de sí mismo, y 2 y 5 caben exactos (10 : 2 = 5 y 10 : 5 = 2). El 0 no entra porque no es posible dividir por cero."},{id:"21-05",topic:"Relación de divisibilidad",objective:"Escribir las dos frases de la relación de divisibilidad",difficulty:"media",type:"single-choice",prompt:"Entre 3 y 24 existe relación de divisibilidad. ¿Cuál es la relación completa?",options:["24 es múltiplo de 3 y 3 es divisor de 24","24 es múltiplo de 3","3 es divisor de 24"],correctAnswer:0,shuffleOptions:!0,explanation:"La relación de divisibilidad son las dos frases a la vez: el mayor es múltiplo del menor (24 es múltiplo de 3) y el menor es divisor del mayor (3 es divisor de 24). Decir solo una deja media relación sin declarar."},{id:"21-06",topic:"Propiedades de los múltiplos",objective:"Reconocer una propiedad de los múltiplos",difficulty:"media",type:"single-choice",prompt:"¿Cuál de estas afirmaciones es una propiedad de los múltiplos?",options:["Todo número es múltiplo de 1","El cero es divisor de cualquier número","Un número tiene una cantidad finita de múltiplos"],correctAnswer:0,shuffleOptions:!0,explanation:"Todo número es múltiplo de 1, porque 5 = 1 · 5. El cero no es divisor de ningún número (es múltiplo de todos, que es lo contrario), y un número tiene infinitos múltiplos, no una cantidad finita."},{id:"21-07",topic:"Relación de divisibilidad",objective:"Comprobar la relación de divisibilidad entre 46 y 230",difficulty:"media",type:"single-choice",prompt:"¿Existe relación de divisibilidad entre 46 y 230?",options:["Sí: 230 es múltiplo de 46 y 46 es divisor de 230","No: 230 : 46 no es exacta","Sí: 46 es múltiplo de 230 y 230 es divisor de 46"],correctAnswer:0,shuffleOptions:!0,explanation:"Se divide el mayor entre el menor: 230 : 46 = 5 y el resto es 0, así que sí hay relación de divisibilidad: 230 es múltiplo de 46 (230 = 46 · 5) y 46 es divisor de 230."},{id:"21-08",topic:"Propiedades de los múltiplos",objective:"Reconocer que el cero es múltiplo de cualquier número",difficulty:"media",type:"true-false",prompt:"El cero es múltiplo de cualquier número.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Sí: 0 es múltiplo de cualquier número porque 0 = b · 0 para cualquier b. El número que multiplica es el propio 0."},{id:"21-09",topic:"Propiedades de los divisores",objective:"Reconocer que el cero no es divisor de ningún número",difficulty:"media",type:"true-false",prompt:"El cero es divisor de cualquier número.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"No: el cero no es divisor de ningún número, porque no es posible dividir por cero. 5 : 0 no se puede calcular, así que 0 no entra en D(5)."},{id:"21-10",topic:"Propiedades de los múltiplos",objective:"Reconocer la infinitud de los múltiplos",difficulty:"básica",type:"true-false",prompt:"Un número tiene infinitos múltiplos.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Sí: como puedes multiplicar el número por 1, por 2, por 3, por 4… y seguir indefinidamente, los múltiplos no se terminan nunca. Por eso el conjunto lleva puntos suspensivos al final."},{id:"21-11",topic:"Propiedades de los múltiplos",objective:"Reconocer que un número no siempre es mayor qu
