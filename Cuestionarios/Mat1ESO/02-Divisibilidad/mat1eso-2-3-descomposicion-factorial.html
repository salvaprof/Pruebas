  <script type="module" crossorigin>const Q={title:"Descomposición factorial",subject:"Matemáticas",level:"1º ESO",sourceLesson:"lessons/Mat1ESO/Mat1ESO/02-Divisibilidad/2.3-Descomposicion factorial.md",outputFolder:"Mat1ESO/02-Divisibilidad",instructions:"Responde a las 20 cuestiones sobre la descomposición factorial: definición, descomposición mental, columna de divisiones sucesivas, potencias, contar divisores y comprobación.",finalMessage:e=>e>=80?"¡Excelente! Dominas la descomposición factorial y la columna de divisiones.":e>=60?"Buen trabajo. Repasa la columna de divisiones y la comprobación multiplicando.":"Necesitas repasar la descomposición factorial con calma.",questions:[{id:"23-01",topic:"Definición",objective:"Definir la descomposición factorial como producto de primos",difficulty:"básica",type:"single-choice",prompt:"¿En qué consiste la descomposición factorial de un número?",options:["Escribirlo como producto de números primos","Escribirlo como suma de números primos","Escribirlo como producto de números naturales cualesquiera"],correctAnswer:0,shuffleOptions:!0,explanation:"La descomposición factorial es la descomposición en la que todos los factores son números primos: de ahí el nombre. La operación es la multiplicación, no la suma, y no basta cualquier producto: si queda un factor compuesto, la descomposición no ha terminado."},{id:"23-02",topic:"Primo sin descomposición",objective:"Justificar por qué un primo no admite descomposición factorial",difficulty:"media",type:"single-choice",prompt:"¿Por qué un número primo, como el 17, no admite descomposición factorial?",options:["Porque no tiene divisores: solo se puede escribir como 1 · 17 y el 1 no es primo","Porque los números primos solo se descomponen con la columna de divisiones","Porque es mayor que 10"],correctAnswer:0,shuffleOptions:!0,explanation:"Un primo no admite descomposición factorial por no tener divisores: el 17 solo se puede escribir como 1 · 17 y el 1 no es primo, así que no hay ningún producto de primos que lo reproduzca. Lo mismo le pasa al 2, al 3, al 5 y al 11: son primos y se quedan solos."},{id:"23-03",topic:"Descomponer 60",objective:"Descomponer mentalmente el 60 y ordenar los primos de menor a mayor",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la descomposición factorial de 60?",options:["2^2 · 3 · 5","2 · 3^2 · 5","2^3 · 3 · 5"],correctAnswer:0,shuffleOptions:!0,explanation:"60 = 6 · 10; el 6 se parte en 2 · 3 y el 10 en 2 · 5, así que 60 = 2 · 3 · 2 · 5, y al ordenar y agrupar queda 2^2 · 3 · 5. Comprueba: 4 · 3 · 5 = 60. En 2 · 3^2 · 5 = 90 y en 2^3 · 3 · 5 = 120."},{id:"23-04",topic:"Descomponer 8 712",objective:"Leer la columna de divisiones del 8 712 y agrupar con potencias",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la descomposición factorial de 8 712?",options:["2^3 · 3^2 · 11^2","2^3 · 3^2 · 11","2^2 · 3^2 · 11^2"],correctAnswer:0,shuffleOptions:!0,explanation:"La columna de 8 712 anota los divisores 2, 2, 2, 3, 3, 11 y 11: el 2 aparece tres veces, el 3 dos y el 11 dos, así que 8 712 = 2^3 · 3^2 · 11^2. Comprueba: 8 · 9 · 121 = 8 712. En 2^3 · 3^2 · 11 = 792 y en 2^2 · 3^2 · 11^2 = 4 356."},{id:"23-05",topic:"Del producto al número",objective:"Obtener el número a partir de su descomposición multiplicando",difficulty:"media",type:"single-choice",prompt:"¿A qué número pertenece la descomposición factorial 2^4 · 5^2 · 7?",options:["2 800","2 400","280"],correctAnswer:0,shuffleOptions:!0,explanation:"2^4 = 16 y 5^2 = 25; conviene agrupar para que salga una cifra redonda: 16 · 25 = 400, y 400 · 7 = 2 800. El producto de los factores da el número al que pertenece la descomposición."},{id:"23-06",topic:"Dividir operando con los exponentes",objective:"Dividir un número descompuesto entre 24 restando exponentes",difficulty:"avanzada",type:"single-choice",prompt:"La descomposición factorial de un número es 2^3 · 3^3 · 5^2. ¿Cuál es la descomposición factorial del cociente al dividirlo entre 24?",options:["3^2 · 5^2","2^3 · 3^2 · 5^2","3 · 5^2"],correctAnswer:0,shuffleOptions:!0,explanation:"24 = 2^3 · 3: al dividir se restan los exponentes. Al 2 le quitas 3 (3 - 3 = 0, el 2 desaparece), al 3 le quitas 1 (3 - 1 = 2) y el 5 no se toca: queda 3^2 · 5^2 = 225. Comprueba: el número era 5 400 y 5 400 : 24 = 225 exacto."},{id:"23-07",topic:"Contar los divisores",objective:"Contar los divisores de 1 710 desde su descomposición",difficulty:"media",type:"single-choice",prompt:"La descomposición factorial de 1 710 es 2 · 3^2 · 5 · 19. ¿Cuántos divisores tiene 1 710?",options:["24","10","8"],correctAnswer:0,shuffleOptions:!0,explanation:"Se suma uno a cada exponente y se multiplican los resultados: (1 + 1) · (2 + 1) · (1 + 1) · (1 + 1) = 2 · 3 · 2 · 2 = 24, así que 1 710 tiene 24 divisores. El 10 sale de multiplicar 2 por la suma de los exponentes (1 + 2 + 1 + 1 = 5) y el 8, de contar mal los primos."},{id:"23-08",topic:"Comprobación",objective:"Detectar el error de sumar en vez de multiplicar al comprobar",difficulty:"básica",type:"true-false",prompt:"La comprobación de una descomposición factorial se hace sumando los factores.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"No: la comprobación de una descomposición factorial es un producto, se multiplican los factores y se compara con el número de partida. En 30 = 2 · 3 · 5, multiplicar da 30; sumar da 2 + 3 + 5 = 10, que es justo el error típico que hace parecer que la descomposición está mal."},{id:"23-09",topic:"Unicidad",objective:"Reconocer la unicidad de la descomposición factorial",difficulty:"avanzada",type:"true-false",prompt:"Si un número tiene descomposición factorial, es única: da igual el orden en que se hagan las divisiones.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Sí: no hay dos números distintos con el mismo producto de primos, y dos productos representan el mismo número cuando tienen los mismos primos con los mismos exponentes. El orden de partir no cambia el resultado, así que la descomposición es única."},{id:"23-10",topic:"Exponentes pares",objective:"Relacionar los exponentes pares con los cuadrados perfectos",difficulty:"media",type:"true-false",prompt:"Si todos los exponentes de una descomposición factorial son pares, el número es un cuadrado perfecto.",options:["Verdadero","Falso"],correctAnswer:0,shuffleOptions:!0,explanation:"Sí: si todos los exponentes son pares, el número es un cuadrado perfecto. Por ejemplo, 2^2 · 5^2 · 7^2 = 4 900 y su raíz es 70: cada primo aparece dos veces y se puede repartir uno en cada factor de la raíz."},{id:"23-11",topic:"Reglas de la columna",objective:"Detectar el error de dividir por un primo que no divide exactamente",difficulty:"básica",type:"true-false",prompt:"En la columna de divisiones se puede dividir por un primo que no divide exactamente al cociente.",options:["Verdadero","Falso"],correctAnswer:1,shuffleOptions:!0,explanation:"No: cada división de la columna tiene que ser exacta. Si 855 no se puede partir entre 2 (855 : 2 = 427,5), se prueba con el siguiente primo y 855 : 3 = 285, que sí es exacta."},{id:"23-12",topic:"Columna y árbol",objective:"Justificar qué afirmaciones sobre la columna y el árbol son correctas",difficulty:"media",type:"multiple-choice",prompt:"¿Cuáles de estas afirmaciones sobre la columna de divisiones y el árbol de factores son correctas?",options:["Cada división de la columna tiene que ser exacta","La columna termina cuando el cociente es un número grande","El árbol de factores y la columna de divisiones dan el mismo producto","2^3 vale 2 · 3 = 6"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"Cada división de la columna tiene que ser exacta y el árbol y la columna dan el mismo producto: el orden de partir no cambia el resultado. La columna no termina cuando el cociente es grande, sino cuando el cociente es 1; y 2^3 vale 2 · 2 · 2 = 8, no 2 · 3 = 6, que es el fallo más habitual al pasar de la columna al producto."},{id:"23-13",topic:"Contar los divisores",objective:"Contar los divisores de 8 712 desde su descomposición",difficulty:"media",type:"numeric",prompt:"La descomposición factorial de 8 712 es 2^3 · 3^2 · 11^2. ¿Cuántos divisores tiene 8 712?",unit:"divisores",correctAnswer:36,tolerance:0,explanation:"Se suma uno a cada exponente y se multiplican: (3 + 1) · (2 + 1) · (2 + 1) = 4 · 3 · 3 = 36, así que 8 712 tiene 36 divisores. Cada primo da exponente más uno posibilidades, porque un divisor elige cuántas veces entra cada primo, desde 0 hasta su exponente."},{id:"23-14",topic:"Contar los divisores",objective:"Contar los divisores de un número con exponentes grandes",difficulty:"media",type:"numeric",prompt:"Un número tiene la descomposición factorial 2^4 · 3 · 5^2 · 7^2. ¿Cuántos divisores tiene?",unit:"divisores",correctAnswer:90,tolerance:0,explanation:"(4 + 1) · (1 + 1) · (2 + 1) · (2 + 1) = 5 · 2 · 3 · 3 = 90: un número con exponentes grandes tiene muchos divisores sin necesidad de escribirlos uno a uno."},{id:"23-15",topic:"Dividir operando con los exponentes",objective:"Calcular el cociente exacto de dividir el número descompuesto entre 24",difficulty:"avanzada",type:"numeric",prompt:"El número de la descomposición factorial 2^3 · 3^3 · 5^2 se divide entre 24. ¿Cuál es el cociente exacto?",correctAnswer:225,tolerance:0,explanation:"2^3 · 3^3 · 5^2 = 8 · 27 · 25 = 5 400, y 5 400 : 24 = 225 exacto. Operando con los exponentes: 24 = 2^3 · 3, se restan y queda 3^2 · 5^2 = 9 · 25 = 225, que es el mismo cociente."},{id:"23-16",topic:"Del producto al número",objective:"Obtener el número de una descomposición con un primo grande",difficulty:"media",type:"numeric",prompt:"¿A qué número pertenece la descomposición factorial 2^4 · 23?",correctAnswer:368,tolerance:0,explanation:"2^4 = 16 y 16 · 23 = 368: la descomposición 2^4 · 23 pertenece al número 368."},{id:"23-17",topic:"Lectura de la columna",objective:"Contar las divisiones exactas por 2 en la columna del 58 800",difficulty:"media",type:"numeric",prompt:"En la columna de divisiones de 58 800, ¿cuántas divisiones exactas por 2 se hacen antes de llegar al primo 3?",unit:"divisiones",correctAnswer:4,tolerance:0,explanation:"58 800 : 2 = 29 400, 29 400 : 2 = 14 700, 14 700 : 2 = 7 350 y 7 350 : 2 = 3 675: cuatro divisiones exactas por 2, y entonces 3 675 ya no es par, así que se prueba con el 3. Por eso el 2 aparece cuatro veces: 58 800 = 2^4 · 3 · 5^2 · 7^2."},{id:"23-18",topic:"Método para números grandes",objective:"Nombrar la columna de divisiones sucesivas",difficulty:"media",type:"short-answer",prompt:"¿Cómo se llama el método para descomponer números grandes, que consiste en escribir el número arriba, dividir en fila por primos de menor a mayor y anotar los divisores hasta que el cociente queda en 1?",acceptedAnswers:["columna de divisiones","la columna de divisiones","columna de divisiones sucesivas"],explanation:"Es la columna de divisiones sucesivas: se escribe el número arriba, se divide en fila por primos de menor a mayor y se anota a la derecha el primo usado en cada división; esos primos anotados son los factores, y la columna termina cuando el cociente es 1."},{id:"23-19",topic:"Vocabulario",objective:"Nombrar el factor primo",difficulty:"básica",type:"short-answer",prompt:"¿Cómo se llama cada primo que aparece en el producto de una descomposición factorial?",acceptedAnswers:["factor primo","el factor primo"],explanation:"Es el factor primo: cada número primo que aparece en el producto. En 2^3 · 3^2 · 11^2 los factores primos son 2, 3 y 11."},{id:"23-20",topic:"Rutina de la columna",objective:"Ordenar los pasos de la columna de divisiones sucesivas",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos de la columna de divisiones sucesivas para descomponer un número grande.",steps:["Escribir el número arriba y elegir el primo más pequeño que lo divide","Dividir en fila y anotar el primo usado, solo con divisiones exactas","Seguir dividiendo el cociente hasta que quede en 1","Juntar los primos anotados, ordenarlos de menor a mayor y agrupar con potencias"],correctAnswer:[0,1,2,3],explanation:"Se escribe el número arriba y se elige el primo más pequeño que lo divide; se divide en fila y se anota el primo usado, solo con divisiones exactas (si un primo no divide, se prueba con el siguiente); se sigue dividiendo el cociente hasta que queda en 1; y al final se juntan los primos anotados, se ordenan de menor a mayor y se agrupan con potencias, como en 1 710 = 2 · 3^2 · 5 · 19."}]},W=Object.freeze(Object.defineProperty({__proto__:null,mat1eso23DescomposicionFactorialAssessment:Q},Symbol.toStringTag,{value:"Module"})),G={"23-01":{hint:"La definición habla de un producto, no de una suma, y los factores tienen nombre."},"23-02":{hint:"Mira los divisores que tiene: con uno solo no sale ningún producto."},"23-03":{hint:"Parte en dos factores y sigue partiendo; al final ordena de menor a mayor."},"23-04":{hint:"Cuenta cuántas veces aparece cada primo en la columna."},"23-05":{hint:"Calcula las potencias y agrupa de forma que salga una cifra redonda."},"23-06":{hint:"Descompón el 24 y resta los exponentes."},"23-07":{hint:"A cada exponente se le suma uno y luego se multiplican los resultados."},"23-08":{hint:"La comprobación es una operación, no otra: la misma que une los factores."},"23-09":{hint:"Dos productos con los mismos primos y exponentes son el mismo número."},"23-10":{hint:"Mira el ejemplo del 4 900 y su raíz."},"23-11":{hint:"Si la división no es exacta, se prueba con el siguiente primo."},"23-12":{hint:"Una confunde el final de la columna y otra confunde potencia con multiplicación."},"23-13":{hint:"A cada exponente se le suma uno y se multiplican."},"23-14":{hint:"Cada primo da exponente más uno posibilidades."},"23-15":{hint:"Es la división exacta que comprueba el resultado de dividir entre 24."},"23-16":{hint:"Calcula la potencia y multiplica por el primo que queda."},"23-17":{hint:"Cuenta las divisiones exactas entre 2 antes de l
