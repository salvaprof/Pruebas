  <script type="module" crossorigin>const G={title:"Los cambios de estado",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/02-Los sistemas materiales/2.5-Los cambios de estado.md",outputFolder:"FyQ3ESO/02-Los sistemas materiales",instructions:"Responde a las 20 preguntas sobre los cambios de estado. Se evalúan la fusión, solidificación, vaporización (evaporación y ebullición), condensación, sublimación y sublimación inversa, el efecto de la presión y la temperatura, la gráfica de calentamiento y los calores latentes. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de los cambios de estado y los calores latentes.":e>=60?"Buen trabajo; repasa los seis procesos y las gráficas de calentamiento.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"cbe-01",topic:"Definición",objective:"Definir cambio de estado",difficulty:"básica",type:"single-choice",prompt:"Un cambio de estado es un proceso físico en el que:",options:["La sustancia cambia su naturaleza y aparece una sustancia nueva","La sustancia pasa de un estado a otro sin que cambie su naturaleza (son las mismas partículas)","Se rompen los enlaces químicos entre moléculas distintas","El volumen siempre aumenta"],correctAnswer:1,shuffleOptions:!0,explanation:"Un cambio de estado es un proceso físico: antes y después son las mismas moléculas, solo cambia cómo se mueven y cómo están unidas. No aparece ninguna sustancia nueva (eso sería una reacción química)."},{id:"cbe-02",topic:"Ebullición en la montaña",objective:"Relacionar presión y ebullición",difficulty:"básica",type:"true-false",prompt:"En la cima de una montaña el agua hierve a una temperatura menor que a nivel del mar.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. En la montaña la presión atmosférica es menor, así que las burbujas de vapor se forman más fácilmente y el agua hierve a una temperatura menor que 100 °C (por eso un huevo tarda más en cocinarse)."},{id:"cbe-03",topic:"Temperatura durante el cambio",objective:"Comprender que la temperatura se mantiene constante",difficulty:"básica",type:"single-choice",prompt:"Durante un cambio de estado (p. ej., la fusión del hielo), la temperatura:",options:["Sube constantemente","Se mantiene constante","Baja constantemente","Oscila aleatoriamente"],correctAnswer:1,shuffleOptions:!0,explanation:"Durante el cambio de estado la temperatura se mantiene constante: la energía aportada se usa para cambiar el estado de agregación, no para subir la temperatura. Solo al terminar el cambio vuelve a subir."},{id:"cbe-04",topic:"Evaporación",objective:"Definir evaporación",difficulty:"básica",type:"single-choice",prompt:"La evaporación es un proceso de vaporización que:",options:["Solo ocurre a una temperatura concreta y en toda la masa del líquido","Ocurre a cualquier temperatura, es lenta y solo en la superficie del líquido","Siempre produce burbujas","Solo ocurre en sólidos"],correctAnswer:1,shuffleOptions:!0,explanation:"La evaporación es lenta, ocurre a cualquier temperatura (aunque no se alcance la ebullición) y solo en la superficie del líquido, de donde se escapan las partículas más rápidas."},{id:"cbe-05",topic:"Ebullición",objective:"Definir ebullición",difficulty:"básica",type:"single-choice",prompt:"La ebullición es un proceso de vaporización que:",options:["Ocurre a cualquier temperatura en la superficie","Ocurre solo a una temperatura dada (el punto de ebullición), en toda la masa del líquido, formando burbujas","Solo ocurre en sólidos","No forma burbujas"],correctAnswer:1,shuffleOptions:!0,explanation:"La ebullición ocurre solo a una temperatura concreta (el punto de ebullición, 100 °C para el agua a presión normal), es más rápida que la evaporación y ocurre en toda la masa del líquido, formando burbujas de gas."},{id:"cbe-06",topic:"Los seis cambios de estado",objective:"Leer la tabla de los seis cambios y su energía",difficulty:"básica",type:"multiple-choice",prompt:"Según la tabla de los seis cambios de estado, selecciona las afirmaciones correctas:",data:{columns:["Cambio de estado","De qué estado a qué estado","Energía"],rows:[["Fusión","Sólido a líquido","Recibe energía"],["Solidificación","Líquido a sólido","Cede energía"],["Vaporización","Líquido a gas","Recibe energía"],["Condensación","Gas a líquido","Cede energía"],["Sublimación","Sólido a gas","Recibe energía"],["Sublimación inversa","Gas a sólido","Cede energía"]],caption:"Los seis cambios de estado y la energía que absorben o ceden"},options:["La fusión y la vaporización reciben energía","La solidificación y la condensación ceden energía","La sublimación cede energía","La sublimación inversa recibe energía"],correctAnswer:[0,1],shuffleOptions:!1,explanation:"Los cambios que se alejan del sólido (fusión, vaporización, sublimación) reciben energía; los que se acercan al sólido (solidificación, condensación, sublimación inversa) ceden energía. La sublimación recibe energía y la sublimación inversa la cede."},{id:"cbe-07",topic:"Calor latente de vaporización",objective:"Aplicar la fórmula Q = m·Lv",difficulty:"media",type:"numeric",prompt:"El calor latente de vaporización del agua es 2,245·10⁶ J/kg. ¿Qué calor (en julios) se necesita para vaporizar 0,5 kg de agua a 100 °C? (Expresa el resultado como número, p. ej. 1122500)",correctAnswer:1122500,tolerance:5e3,unit:"J",explanation:"Q = m·Lv = 0,5 kg · 2,245·10⁶ J/kg = 1,1225·10⁶ J ≈ 1 122 500 J."},{id:"cbe-08",topic:"Punto de fusión",objective:"Aplicar el punto de fusión del agua",difficulty:"media",type:"single-choice",prompt:"El punto de fusión del agua (a 10⁵ Pa) es:",options:["100 °C","0 °C","25 °C","−15 °C"],correctAnswer:1,shuffleOptions:!0,explanation:"El punto de fusión del agua es 0 °C: es la temperatura a la que el hielo pasa a agua líquida a presión de 10⁵ Pa. Es una propiedad característica que sirve para identificar la sustancia."},{id:"cbe-09",topic:"Punto de ebullición",objective:"Aplicar el punto de ebullición del agua",difficulty:"media",type:"single-choice",prompt:"El punto de ebullición del agua (a 10⁵ Pa) es:",options:["0 °C","100 °C","−15 °C","25 °C"],correctAnswer:1,shuffleOptions:!0,explanation:"El punto de ebullición del agua es 100 °C: la temperatura a la que el agua hierve cuando la presión exterior es 10⁵ Pa. Si la presión es menor, hierve a menos temperatura; si es mayor, a más temperatura."},{id:"cbe-10",topic:"Condensación",objective:"Definir condensación",difficulty:"media",type:"single-choice",prompt:"La condensación es el proceso por el que una sustancia:",options:["Pasa de sólido a líquido","Pasa de gaseoso a líquido (proceso contrario a la vaporización)","Pasa de líquido a gas","Pasa de gas a sólido directamente"],correctAnswer:1,shuffleOptions:!0,explanation:"La condensación es gas → líquido, el proceso contrario a la vaporización. Es la que produce las gotas en las ventanas frías o el rocío en las plantas. Libera energía."},{id:"cbe-11",topic:"Calor latente de fusión",objective:"Despejar el calor latente de fusión",difficulty:"media",type:"numeric",prompt:"Para fundir 0,25 kg de hielo se necesitan 83 750 J. ¿Cuál es el calor latente de fusión del agua (en J/kg)? (Expresa el resultado como número, p. ej. 335000)",correctAnswer:335e3,tolerance:5e3,unit:"J/kg",explanation:"Lf = Q/m = 83 750 J / 0,25 kg = 335 000 J/kg = 3,35·10⁵ J/kg."},{id:"cbe-12",topic:"Sublimación",objective:"Identificar un caso de sublimación",difficulty:"media",type:"single-choice",prompt:"El hielo seco (CO₂ sólido) que pasa directamente de sólido a gas, sin dejar residuo líquido, es un ejemplo de:",options:["Fusión","Evaporación","Sublimación","Condensación"],correctAnswer:2,shuffleOptions:!0,explanation:"La sublimación es el paso directo de sólido a gas sin pasar por el estado líquido. El hielo seco (CO₂ sólido) sublima y por eso es un excelente refrigerante. No lo sufren todos los sólidos, solo algunos."},{id:"cbe-13",topic:"Sublimación inversa",objective:"Identificar un caso de sublimación inversa",difficulty:"media",type:"single-choice",prompt:"La escarcha de las mañanas de invierno (vapor de agua que pasa directamente a sólido) es un ejemplo de:",options:["Evaporación","Condensación","Sublimación inversa","Fusión"],correctAnswer:2,shuffleOptions:!0,explanation:"La sublimación inversa (o desublimación) es el paso directo de gaseoso a sólido sin pasar por líquido. La escarcha se forma cuando el vapor de agua toca una superficie por debajo de 0 °C y pasa directamente a sólido."},{id:"cbe-14",topic:"Olla rápida",objective:"Explicar la ebullición a mayor presión",difficulty:"media",type:"true-false",prompt:"En una olla rápida (olla a presión) el agua hierve a una temperatura mayor que 100 °C.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. En la olla a presión la presión exterior es mayor que la atmosférica, así que el agua puede alcanzar temperaturas superiores a 100 °C sin pasar a vapor. Por eso cocina más rápido."},{id:"cbe-15",topic:"Calor latente de vaporización (fórmula)",objective:"Escribir la fórmula Q = m·Lv",difficulty:"avanzada",type:"short-answer",prompt:"Escribe la fórmula del calor latente de vaporización en forma de teclado (como en la lección).",acceptedAnswers:["Q = m * Lv","Q=m*Lv"],explanation:"El calor necesario para vaporizar es Q = m · Lv, donde m es la masa en kilogramos y Lv el calor latente de vaporización en J/kg. En el teclado se escribe Q = m * Lv."},{id:"cbe-16",topic:"Calor latente de fusión (fórmula)",objective:"Escribir la fórmula Q = m·Lf",difficulty:"avanzada",type:"short-answer",prompt:"Escribe la fórmula del calor latente de fusión en forma de teclado (como en la lección).",acceptedAnswers:["Q = m * Lf","Q=m*Lf"],explanation:"El calor necesario para fundir es Q = m · Lf, donde m es la masa en kilogramos y Lf el calor latente de fusión en J/kg. En el teclado se escribe Q = m * Lf."},{id:"cbe-17",topic:"Gráfica de calentamiento",objective:"Ordenar los tramos de la gráfica del agua",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los tramos de la gráfica de calentamiento del agua, de menor a mayor temperatura:",steps:["El sólido se calienta: la temperatura sube de -15 a 0 grados Celsius","Meseta de 0 grados Celsius: el hielo se funde y pasa a líquido (fusión)","El líquido se calienta: la temperatura sube de 0 a 100 grados Celsius","Meseta de 100 grados Celsius: el agua hierve y pasa a gas (vaporización)","El gas se calienta: la temperatura sube de 100 a 110 grados Celsius"],correctAnswer:[0,1,2,3,4],explanation:"La gráfica del agua tiene cinco tramos: el sólido se calienta, la meseta de fusión a 0 grados Celsius, el líquido se calienta, la meseta de vaporización a 100 grados Celsius y el gas se calienta. Los tramos inclinados son calentamientos y las mesetas son los cambios de estado."},{id:"cbe-18",topic:"Calor latente (pasos)",objective:"Ordenar los pasos para calcular Q = m·Lv",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para calcular el calor necesario para vaporizar una masa de agua:",steps:["Identifica la masa de agua que se vaporiza y exprésala en kilogramos","Busca el calor latente de vaporización del agua en J/kg","Aplica la expresión Q = m * Lv","Comprueba que el resultado está en julios y es proporcional a la masa"],correctAnswer:[0,1,2,3],explanation:"Primero se identifica la masa en kilogramos, después se busca el calor latente en J/kg, se aplica Q = m * Lv y al final se comprueba que el resultado está en julios y crece con la masa."},{id:"cbe-19",topic:"Calor latente de fusión",objective:"Calcular el calor de fusión",difficulty:"avanzada",type:"numeric",prompt:"El calor latente de fusión del hielo es 3,35·10⁵ J/kg. ¿Qué calor (en julios) se necesita para fundir 0,3 kg de hielo a 0 °C?",correctAnswer:100500,tolerance:5e3,unit:"J",explanation:"Q = m·Lf = 0,3 kg · 3,35·10⁵ J/kg = 100 500 J. Fundir un kilogramo de hielo cuesta casi siete veces menos energía que vaporizar un kilogramo de agua."},{id:"cbe-20",topic:"Detección de errores",objective:"Distinguir masa y calor latente en la energía de fusión",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué una masa pequeña de una sustancia con alto calor latente puede necesitar más energía para fundirse que una masa grande de otra con calor latente bajo?",options:["Porque la masa siempre pesa más que el calor latente","Porque la energía depende de DOS factores: la masa y el calor latente (Q = m·Lf)","Porque la masa no influye","Porque el calor latente es constante"],correctAnswer:1,shuffleOptions:!0,explanation:"La energía para fundir es Q = m·Lf y depende de DOS factores: la masa y el calor latente. Una masa pequeña con Lf alto puede necesitar más energía que una masa grande con Lf bajo."}]},Z=Object.freeze(Object.defineProperty({__proto__:null,fyq3eso25CambiosEstadoAssessment:G},Symbol.toStringTag,{value:"Module"})),W={"cbe-01":{hint:"Piensa si al fundir el hielo aparece una sustancia nueva o siguen las mismas moléculas: eso separa un cambio de estado de una reacción."},"cbe-02":{hint:"En la montaña empuja menos aire sobre la superficie: decide si eso facilita o dificulta que se formen las burbujas."},"cbe-03":{hint:"La energía del proceso se gasta en separar partículas, no en subir el termómetro: mira qué hace la temperatura mientras queda hielo."},"cbe-04":{hint:"Piensa en el charco que se seca a temperatura ambiente: fíjate en lo despacio que va y en qué parte del líquido desaparece."},"cbe-05":{hint:"Fíjate en la olla al fuego: ¿a qué temperatura hierve y en qué parte del líquido salen las burbujas? Eso la distingue del charco."},"cbe-06":{hint:"Los cambios que se alejan del sólido reciben energía y los que se acercan al sólido la ceden: marca solo los que cumplen la tabla."},"cbe-07":{hint:"Multiplica la masa por el calor latente que da el enunciado, Q = m·Lv, y cuidado con la potencia de diez."},"cbe-08":{hint:"No lo confundas con la temperatura a la que el agua hierve a presión normal: aquí el hielo se convierte en líquido."},"cbe-09":{hint:"Es la temperatura del agua hirviendo a presión normal, muy por encima de la de fusión; es la referencia de la cocina."},"cbe-10":{hint:"Piensa en las gotas que aparecen en el cristal frío de la ventana: fíjate de qué estado salen y a cuál llegan."},"cbe-11":{hint:"El calor latente es la energía por kilogramo: divide el calor total entre la masa para obtenerlo."},"cbe-12":{hint:"El CO₂ sólido desaparece sin mojar nada: salta del estado sólido al gaseoso sin pasar por el líquido."},"cbe-13":{hint:"El vapor del aire se vuelve hielo sin pasar por líquido: es el proceso inverso del que sufre el hielo seco."},"cbe-14":{hint:"La tapa con válvula cierra la salida: compara la presión de dentro de la olla con la del aire de fuera y mira cómo cambia la ebullición."},"cbe-15":{hint:"La fórmula relaciona el calor con la masa y el calor latente de vaporización: en el teclado se escribe con *."},"cbe-16":{hint:"Igual que la de vaporización, pero con el calor latente de fusión: en el teclado se escribe con *."},"cbe-17":{hint:"Los tramos inclinados son calentamientos (sube el termómetro) y las mesetas son cambios de estado (el termómetro se queda fijo)."},"cbe-18":{hint:"Primero la masa en kilogramos, después el calor latente en J/kg, después la fórmula y al final la comprobación de unidades."},"cbe-19":{hint:"Multiplica la masa por el calor latente de fusión que da el enunciado: el resultado está en julios."},"cbe-20":{hint:"Escribe la fórmula de la energía de fusión y mira cuántas magnitudes intervienen: ninguna de las dos, por sí sola, decide el resultado."}},ee=Object.freeze(Object.defineProperty({__proto__:null,fyq3eso25CambiosEstadoHints:W},Symbol.toStringTag,{value:"Module"})),ae=["hint","keys"];function te(e,t){const a=t&&typeof t=="object"?t:{};if(!Object.keys(a).length)return e;const n=(e?.questions??[]).map(r=>{const i=a[r.id];if(!i||typeof i!="object")return r;const f={...r};for(const y of ae){const m=i[y];f[y]||
