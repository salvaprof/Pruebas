  <script type="module" crossorigin>const W={title:"La clasificación de la materia",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/02-Los sistemas materiales/2.2-La clasificacion de la materia.md",outputFolder:"FyQ3ESO/02-Los sistemas materiales",instructions:"Responde a las 20 preguntas sobre la clasificación de la materia. Se evalúan sustancias puras (elementos y compuestos), mezclas homogéneas y heterogéneas, la separación de componentes y las propiedades de sustancias puras y mezclas. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la clasificación de la materia.":e>=60?"Buen trabajo; repasa elementos, compuestos y tipos de mezcla.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"cla-01",topic:"Sustancias puras",objective:"Definir sustancia pura",difficulty:"básica",type:"single-choice",prompt:"Una sustancia pura es aquella que:",options:["Está formada por varias sustancias unidas","Está formada por un solo componente, con propiedades constantes","Cambia sus propiedades según la cantidad","Siempre se encuentra mezclada en la naturaleza"],correctAnswer:1,shuffleOptions:!0,explanation:"Una sustancia pura está formada por un solo componente, así que sus propiedades (densidad, punto de ebullición, punto de fusión) son fijas, se mida la muestra que se mida."},{id:"cla-02",topic:"Elementos",objective:"Definir elemento o sustancia simple",difficulty:"básica",type:"single-choice",prompt:"Un elemento (sustancia simple) es una sustancia pura formada por:",options:["Dos o más tipos de átomo unidos químicamente","Átomos de un solo elemento","Varias sustancias mezcladas","Moléculas de compuestos distintos"],correctAnswer:1,shuffleOptions:!0,explanation:"Un elemento está hecho de una sola clase de átomos (hierro, aluminio, cobre, grafito, azufre) y no se puede descomponer en sustancias más simples."},{id:"cla-03",topic:"Compuestos",objective:"Definir compuesto químico",difficulty:"básica",type:"single-choice",prompt:"Un compuesto químico es una sustancia pura formada por:",options:["Un solo tipo de átomo","Átomos de dos o más elementos diferentes","Varias sustancias mezcladas sin unirse","Átomos sueltos sin unirse"],correctAnswer:1,shuffleOptions:!0,explanation:"Un compuesto (agua, sal, glucosa, dióxido de carbono) está hecho de dos o más clases de átomos unidos. Es un solo componente, no una mezcla de los elementos que lo forman."},{id:"cla-04",topic:"Mezclas",objective:"Definir mezcla",difficulty:"básica",type:"single-choice",prompt:"Una mezcla es un sistema formado por varias sustancias puras que:",options:["Están unidas químicamente en proporción fija","Están juntas pero sin unirse químicamente; cada componente conserva sus propiedades","Se han descompuesto en átomos","Forman una sola sustancia nueva"],correctAnswer:1,shuffleOptions:!0,explanation:"En una mezcla las sustancias puras están juntas sin unirse químicamente. Cada componente conserva su identidad y las propiedades de la mezcla dependen de las proporciones."},{id:"cla-05",topic:"Compuestos",objective:"Distinguir compuesto de mezcla",difficulty:"básica",type:"true-false",prompt:"El agua (H2O) es una mezcla de hidrógeno y oxígeno.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El agua es una sustancia pura compuesta: un solo componente con propiedades fijas. Sus moléculas tienen hidrógeno y oxígeno, pero la sustancia no es una mezcla."},{id:"cla-06",topic:"Mezclas homogéneas",objective:"Identificar una mezcla homogénea",difficulty:"básica",type:"single-choice",prompt:"El aire es una mezcla homogénea porque:",options:["Es una sola sustancia pura","Tiene varios gases, pero no se distinguen a simple vista y sus propiedades son las mismas en toda la muestra","Se ven burbujas dentro","Su composición cambia de una parte a otra"],correctAnswer:1,shuffleOptions:!0,explanation:"El aire es una mezcla de varios gases. No se distinguen los componentes a simple vista y las propiedades son las mismas en toda la muestra, así que es homogénea (no una sustancia pura)."},{id:"cla-07",topic:"Mezclas heterogéneas",objective:"Identificar una mezcla heterogénea",difficulty:"básica",type:"true-false",prompt:"La arena de playa es una mezcla heterogénea porque sus componentes (granos, conchas, agua) se distinguen a simple vista.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. La arena de playa es heterogénea: sus componentes son distinguibles y cada sustancia conserva sus propiedades; una cucharada no tiene las mismas propiedades que otra."},{id:"cla-08",topic:"Fórmulas",objective:"Escribir la fórmula del agua en forma de teclado",difficulty:"media",type:"short-answer",prompt:"Escribe la fórmula del agua tal como se teclea (sin subíndices).",acceptedAnswers:["H2O"],explanation:"El agua es H₂O: dos átomos de hidrógeno y uno de oxígeno. En el teclado se escribe sin subíndices: H2O."},{id:"cla-09",topic:"Fórmulas",objective:"Contar átomos en una fórmula",difficulty:"media",type:"numeric",prompt:"La glucosa es C6H12O6. ¿Cuántos átomos hay en total en una molécula de glucosa?",correctAnswer:24,tolerance:0,explanation:"En C6H12O6 hay 6 átomos de carbono, 12 de hidrógeno y 6 de oxígeno. En total: 6 + 12 + 6 = 24 átomos."},{id:"cla-10",topic:"Clasificación",objective:"Distinguir mezclas homogéneas de heterogéneas",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las mezclas homogéneas (disoluciones):",options:["El aire","El aceite de oliva","El agua con sal","La mayonesa"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"El aire, el aceite de oliva y el agua con sal son homogéneas: no se distinguen los componentes a simple vista. La mayonesa es heterogénea: sus componentes se distinguen."},{id:"cla-11",topic:"Separación",objective:"Elegir el método de separación para mezclas heterogéneas",difficulty:"media",type:"single-choice",prompt:"Las mezclas heterogéneas se separan aprovechando:",options:["La temperatura de ebullición","La densidad de sus componentes","La conductividad eléctrica","El color de los componentes"],correctAnswer:1,shuffleOptions:!0,explanation:"En una mezcla heterogénea hay partes distinguibles con densidades distintas (la nata de la leche es menos densa que el agua y flota), así que se separan según la densidad."},{id:"cla-12",topic:"Separación",objective:"Elegir el método de separación para mezclas homogéneas",difficulty:"media",type:"single-choice",prompt:"Las mezclas homogéneas se separan aprovechando:",options:["La densidad de sus componentes","La temperatura de ebullición de cada sustancia","El tamaño de los granos","La presencia de un imán"],correctAnswer:1,shuffleOptions:!0,explanation:"En una mezcla homogénea los componentes no se ven, así que la densidad no separa nada. Lo que se aprovecha es que cada sustancia hierve a su propia temperatura (destilación)."},{id:"cla-13",topic:"Propiedades",objective:"Reconocer que la densidad de una mezcla es un intervalo",difficulty:"media",type:"true-false",prompt:"La densidad de la leche se da como un único valor fijo, igual que la de una sustancia pura.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. La leche es una mezcla, así que su densidad es un intervalo (de 1028 a 1033 kg/m³ la entera), no un número fijo. Solo las sustancias puras tienen densidad fija."},{id:"cla-14",topic:"Propiedades",objective:"Calcular la densidad media de un intervalo",difficulty:"media",type:"numeric",prompt:"Según la tabla, calcula la densidad media de la leche entera (en kg/m³).",data:{columns:["Leche","Densidad mínima (kg/m³)","Densidad máxima (kg/m³)"],rows:[["Entera","1028","1033"],["Desnatada","1032","1036"]],caption:"Intervalos de densidad de la leche"},correctAnswer:1030.5,tolerance:.5,unit:"kg/m³",explanation:"La densidad media de un intervalo es la media de sus dos extremos: (1028 + 1033) / 2 = 1030,5 kg/m³."},{id:"cla-15",topic:"Punto de ebullición",objective:"Explicar por qué el agua con sal no hierve a temperatura constante",difficulty:"avanzada",type:"single-choice",prompt:"Al calentar agua con sal, la temperatura de ebullición varía porque:",options:["La sal hierve antes que el agua","Al evaporarse el agua, la sal queda más concentrada y la composición cambia","El recipiente está mal cerrado","La sal enfría el agua"],correctAnswer:1,shuffleOptions:!0,explanation:"Al evaporarse el agua, la sal queda cada vez más concentrada, así que la composición de la mezcla cambia mientras hierve y, con ella, cambia la temperatura de ebullición. Solo el agua pura hierve a temperatura constante."},{id:"cla-16",topic:"Densidad de mezclas",objective:"Aplicar el experimento de las dos latas de refresco",difficulty:"avanzada",type:"single-choice",prompt:"En un recipiente con agua se depositan dos latas de refresco de la misma marca: una azucarada y otra sin azúcar. ¿Qué ocurre?",options:["Flota la azucarada, porque es más densa","Flota la de refresco sin azúcar (menos densa); la azucarada, más densa, se hunde","Las dos flotan","Las dos se hunden"],correctAnswer:1,shuffleOptions:!0,explanation:"La bebida azucarada tiene más masa disuelta en el mismo volumen, así que es más densa y se hunde. La de refresco sin azúcar es menos densa que el agua y flota."},{id:"cla-17",topic:"Clasificación",objective:"Ordenar la rutina de clasificación de un sistema material",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para clasificar un sistema material en sustancias puras o mezclas:",steps:["Contar cuántos componentes (sustancias puras) tiene el sistema","Si tiene un solo componente, clasificarlo como sustancia pura","Si tiene varios componentes, clasificarlo como mezcla","Decidir si los componentes se distinguen: homogénea o heterogénea"],correctAnswer:[0,1,2,3],explanation:"Primero se cuenta el número de componentes; con uno solo es una sustancia pura, con varios es una mezcla. Si es mezcla, se decide si los componentes se distinguen para saber si es homogénea o heterogénea."},{id:"cla-18",topic:"Separación",objective:"Ordenar los pasos para separar los componentes de una mezcla",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para separar los componentes de una mezcla:",steps:["Identificar el tipo de mezcla (homogénea o heterogénea)","Elegir la propiedad que se aprovecha: densidad o temperatura de ebullición","Aplicar el método de separación correspondiente","Recuperar los componentes ya separados"],correctAnswer:[0,1,2,3],explanation:"Primero se identifica el tipo de mezcla, después se elige la propiedad que se aprovecha (densidad en heterogéneas, temperatura de ebullición en homogéneas), se aplica el método y al final se recuperan los componentes."},{id:"cla-19",topic:"Compuestos",objective:"Identificar compuestos entre sustancias puras",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona los compuestos (sustancias puras de dos o más elementos):",options:["El agua (H2O)","La sal común (NaCl)","El hierro (Fe)","El dióxido de carbono (CO2)"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"El agua, la sal común y el dióxido de carbono son compuestos: están hechos de dos o más elementos. El hierro es un elemento: una sola clase de átomos."},{id:"cla-20",topic:"Fórmulas",objective:"Escribir la fórmula de la sal común en forma de teclado",difficulty:"avanzada",type:"short-answer",prompt:"Escribe la fórmula de la sal común tal como se teclea (sin subíndices).",acceptedAnswers:["NaCl"],explanation:"La sal común es NaCl: un átomo de sodio (Na) y uno de cloro (Cl). En el teclado se escribe NaCl."}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq3eso22ClasificacionMateriaAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"cla-01":{hint:"Compara una muestra pequeña y otra grande de la misma sustancia: si algo cambia al cambiar la cantidad, esa opción describe una mezcla."},"cla-02":{hint:"Cuenta de cuántas clases distintas de átomo está hecha; si en la opción aparecen dos clases enla
