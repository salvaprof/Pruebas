  <script type="module" crossorigin>const Z={title:"Disoluciones",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/02-Los sistemas materiales/2.3-Disoluciones.md",outputFolder:"FyQ3ESO/02-Los sistemas materiales",instructions:"Responde a las 20 preguntas sobre las disoluciones. Se evalúan la definición de disolución, disolvente y soluto, los coloides y las aleaciones, la clasificación por el estado físico y por la cantidad de soluto, y el cálculo de la concentración (tanto por ciento en masa, en volumen, riqueza y gramos por litro) con sus conversiones. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de las disoluciones y la concentración.":e>=60?"Buen trabajo; repasa el denominador de la fórmula y las conversiones.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"dis-01",topic:"Definición",objective:"Definir disolución",difficulty:"básica",type:"single-choice",prompt:"Una disolución es:",options:["Una sustancia pura de composición fija","Una mezcla homogénea de varias sustancias puras en proporciones variables","Una mezcla heterogénea con componentes distinguibles","Un compuesto de dos elementos"],correctAnswer:1,shuffleOptions:!0,explanation:"Una disolución es una mezcla homogénea: no se distinguen los componentes a simple vista y las proporciones son variables (a diferencia de un compuesto, que tiene composición fija)."},{id:"dis-02",topic:"Disolvente",objective:"Identificar el disolvente",difficulty:"básica",type:"single-choice",prompt:"En una disolución, el disolvente (fase continua) es:",options:["El componente en menor proporción","El componente en mayor proporción, que forma el medio continuo","Siempre el agua","El recipiente que contiene la mezcla"],correctAnswer:1,shuffleOptions:!0,explanation:"El disolvente es el componente en mayor proporción. En el aire es el nitrógeno (78,08 % en volumen), no el oxígeno, aunque este sea el gas que nos interesa."},{id:"dis-03",topic:"Soluto",objective:"Identificar el soluto",difficulty:"básica",type:"single-choice",prompt:"En una disolución, el soluto (fase dispersa) es:",options:["El componente en mayor proporción","El componente en menor proporción, cuyas partículas están repartidas dentro del disolvente","Siempre un sólido","La fase continua"],correctAnswer:1,shuffleOptions:!0,explanation:"El soluto es el componente en menor proporción. Sus partículas están repartidas dentro del disolvente, separadas unas de otras, sin formar grupos, por eso no se ve."},{id:"dis-04",topic:"Estado físico",objective:"Determinar el estado físico de una disolución",difficulty:"básica",type:"single-choice",prompt:"Según la tabla, ¿en qué estado físico está una disolución cuyo disolvente es un líquido y cuyo soluto es un sólido (como el agua del mar)?",data:{columns:["Disolvente","Soluto","Ejemplo"],rows:[["Gas","Gas","el aire"],["Líquido","Gas","el agua de un acuario"],["Líquido","Sólido","el agua del mar"],["Sólido","Sólido","el acero"]],caption:"Estado físico de una disolución según el disolvente y el soluto"},options:["Gaseoso","Líquido","Sólido","Depende del soluto"],correctAnswer:1,shuffleOptions:!0,explanation:"El estado físico de una disolución es el estado del disolvente. Si el disolvente es un líquido, la disolución es líquida, da igual el estado del soluto."},{id:"dis-05",topic:"Estado físico",objective:"Distinguir el papel del disolvente y del soluto",difficulty:"básica",type:"true-false",prompt:"El estado físico de una disolución lo marca el soluto.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El estado lo marca el disolvente, no el soluto. El agua de un acuario es una disolución líquida, aunque lleve oxígeno (un gas) disuelto, porque el disolvente es el agua."},{id:"dis-06",topic:"Coloides",objective:"Identificar un coloide",difficulty:"básica",type:"true-false",prompt:"La leche es un coloide: la grasa está en gotas suspendidas, mucho mayores que las partículas disueltas, y por eso desvía la luz de una linterna.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. La leche no es una disolución: la grasa no está disuelta, está repartida en gotitas que flotan en el agua y desvían la luz (el haz de una linterna se ve de color naranja amarillento)."},{id:"dis-07",topic:"Aleaciones",objective:"Definir aleación",difficulty:"básica",type:"single-choice",prompt:"Una aleación es:",options:["Una mezcla heterogénea de metales","Una disolución sólida que se obtiene al fundir los componentes y dejarlos enfriar, con al menos un metal","Un metal puro","Una disolución líquida de un metal en agua"],correctAnswer:1,shuffleOptions:!0,explanation:"Una aleación es una disolución sólida: al fundir los componentes y enfriarlos quedan repartidos de forma homogénea. El latón (cobre y cinc), el acero (hierro y carbono) y el bronce (cobre y estaño) son aleaciones."},{id:"dis-08",topic:"Concentración",objective:"Escribir la fórmula del tanto por ciento en masa",difficulty:"media",type:"short-answer",prompt:"Escribe la fórmula del tanto por ciento en masa en forma de teclado (como en la lección).",acceptedAnswers:["%(masa) = m_soluto / (m_soluto + m_disolvente) * 100","%(masa) = m_soluto / m_disolucion * 100","% = m_soluto / m_disolucion * 100"],explanation:"El tanto por ciento en masa es la masa de soluto dividida entre la masa de la disolución (soluto más disolvente), multiplicada por 100. En el teclado: %(masa) = m_soluto / (m_soluto + m_disolvente) * 100."},{id:"dis-09",topic:"Concentración",objective:"Calcular el tanto por ciento en masa",difficulty:"media",type:"numeric",prompt:"Se disuelven 8 g de sal en 192 g de agua. ¿Cuál es la concentración de la disolución en tanto por ciento en masa?",correctAnswer:4,tolerance:.1,unit:"%",explanation:"La masa de la disolución es la suma: 8 + 192 = 200 g. El tanto por ciento es 8 / 200 · 100 = 4 %."},{id:"dis-10",topic:"Concentración",objective:"Despejar la masa de soluto",difficulty:"media",type:"numeric",prompt:"Un frasco contiene 50 g de una disolución de ácido clorhídrico al 35 % en masa. ¿Cuántos gramos de ácido clorhídrico contiene?",correctAnswer:17.5,tolerance:.1,unit:"g",explanation:"La masa del soluto es el tanto por ciento por la masa de disolución, dividido entre 100: 35 · 50 / 100 = 17,5 g."},{id:"dis-11",topic:"Concentración",objective:"Calcular la concentración en gramos por litro",difficulty:"media",type:"numeric",prompt:"Se disuelven 2 g de sal en agua hasta completar 250 mL de disolución. ¿Cuál es la concentración en gramos por litro?",correctAnswer:8,tolerance:.1,unit:"g/L",explanation:"Primero se pasa el volumen a litros: 250 mL = 0,25 L. Después se divide la masa entre el volumen: 2 / 0,25 = 8 g/L."},{id:"dis-12",topic:"Clasificación por cantidad",objective:"Distinguir diluida, concentrada, saturada y sobresaturada",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las afirmaciones correctas sobre la clasificación de una disolución por la cantidad de soluto:",options:["Una disolución diluida contiene poca cantidad de soluto","Una disolución saturada contiene la máxima cantidad de soluto que se puede disolver","Una disolución sobresaturada es estable y no se altera","Una disolución concentrada contiene una cantidad de soluto elevada"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Diluida (poco soluto) y concentrada (mucho soluto) son comparaciones. Saturada es el límite (la máxima cantidad disuelta) y sobresaturada es inestable: contiene más soluto del que se puede disolver y el sobrante se deposita al agitarla."},{id:"dis-13",topic:"Clasificación por cantidad",objective:"Identificar una disolución saturada",difficulty:"media",type:"single-choice",prompt:"Un vaso con sal y agua tiene sal sin disolver en el fondo. La disolución está:",options:["Diluida, porque el sólido del fondo no cuenta","Saturada: contiene la máxima cantidad de soluto disuelta y el sobrante queda sin disolver","Sobresaturada y estable","Concentrada, pero no saturada"],correctAnswer:1,shuffleOptions:!0,explanation:"Cuando por mucho que se remueve la sal se queda en el fondo, la disolución está saturada: contiene la máxima cantidad de soluto que se puede disolver. El sólido del fondo es el soluto que no ha podido disolverse."},{id:"dis-14",topic:"Riqueza",objective:"Calcular la riqueza de una aleación",difficulty:"media",type:"numeric",prompt:"Se funden 1000 g de plomo con 500 g de estaño. ¿Cuál es la riqueza de la aleación en estaño (en %)?",correctAnswer:33.3,tolerance:.1,unit:"%",explanation:"La masa de la disolución es la suma: 1000 + 500 = 1500 g. La riqueza en estaño es 500 / 1500 · 100 = 33,3 %."},{id:"dis-15",topic:"Concentración",objective:"Explicar el denominador de la fórmula",difficulty:"avanzada",type:"single-choice",prompt:"Un tanto por ciento en masa no puede superar el 100 %. ¿Por qué?",options:["Porque la masa del soluto siempre es menor que la del disolvente","Porque el denominador es la masa de la disolución (soluto más disolvente), que es mayor que la masa del soluto","Porque el agua siempre pesa más que la sal","Porque la fórmula está mal escrita"],correctAnswer:1,shuffleOptions:!0,explanation:"En el denominador va la masa de la disolución, que es la suma del soluto y del disolvente. Como es mayor que la masa del soluto, la división da menos de 1 y el tanto por ciento no pasa de 100. Si te sale 140 %, has puesto la masa del disolvente en el denominador."},{id:"dis-16",topic:"Concentración",objective:"Distinguir tanto por ciento en masa de gramos por litro",difficulty:"avanzada",type:"true-false",prompt:"Una disolución al 4 % en masa es lo mismo que una disolución de 4 g/L.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. El 4 % en masa son 4 g de soluto cada 100 g de disolución; 4 g/L son 4 g de soluto cada litro de disolución. Son dos divisiones distintas: una por masa y otra por volumen."},{id:"dis-17",topic:"Concentración",objective:"Ordenar los pasos para calcular el tanto por ciento en masa",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para calcular el tanto por ciento en masa de una disolución:",steps:["Identificar el soluto y el disolvente","Calcular la masa de la disolución sumando las masas del soluto y del disolvente","Aplicar la fórmula: % = masa de soluto / masa de disolución · 100","Comprobar que el resultado no supera el 100 %"],correctAnswer:[0,1,2,3],explanation:"Primero se identifican los papeles, después se suma la masa de la disolución, se aplica la fórmula y al final se comprueba que el tanto por ciento no supera el 100."},{id:"dis-18",topic:"Concentración",objective:"Ordenar los pasos para calcular la concentración en g/L",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para calcular la concentración en gramos por litro cuando el volumen viene en mililitros:",steps:["Convertir el volumen de la disolución de mL a L (dividiendo entre 1000)","Dividir la masa del soluto en gramos entre el volumen de la disolución en litros","El resultado es la concentración en g/L","Comprobar el resultado estimando cuántas porciones de ese volumen caben en un litro"],correctAnswer:[0,1,2,3],explanation:"Primero se pasa el volumen a litros, después se divide la masa entre el volumen, el resultado es la concentración en g/L y al final se comprueba por estimación."},{id:"dis-19",topic:"Conversiones",objective:"Aplicar las conversiones de volumen y masa",difficulty:"avanzada",type:"multiple-choice",prompt:"Según la tabla, selecciona las conversiones correctas:",data:{columns:["Cantidad","Equivale a"],rows:[["1 L","1000 mL"],["1 L","100 cL"],["1 g","1000 mg"],["1 kg","1000 g"]],caption:"Conversiones de volumen y masa"},options:["1 L = 1000 mL","1 g = 1000 mg","1 kg = 100 g","1 L = 100 cL"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Según la tabla: 1 L = 1000 mL, 1 g = 1000 mg y 1 L = 100 cL son correctas. «1 kg = 100 g» es falsa: la tabla dice 1 kg = 1000 g."},{id:"dis-20",topic:"Concen
