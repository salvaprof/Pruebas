  <script type="module" crossorigin>const G={title:"La materia y sus propiedades",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/02-Los sistemas materiales/2.1-La materia y sus propiedades.md",outputFolder:"FyQ3ESO/02-Los sistemas materiales",instructions:"Responde a las 20 preguntas sobre la materia y sus propiedades. Se evalúan la definición de materia, propiedades generales y específicas, la densidad (fórmula, unidades y conversión), el volumen por desplazamiento y el menisco. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la materia y la densidad.":e>=60?"Buen trabajo; repasa la densidad y las conversiones de unidades.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"mat-01",topic:"Definición de materia",objective:"Definir materia",difficulty:"básica",type:"single-choice",prompt:"Según la lección, la materia es todo aquello que:",options:["Tiene brillo y color","Tiene masa y ocupa un volumen","Ocupa un volumen y se mueve","Tiene masa y produce energía"],correctAnswer:1,shuffleOptions:!0,explanation:"La materia es todo aquello que tiene masa y ocupa un volumen. La luz, la energía o una idea no son materia porque carecen de masa y no ocupan espacio."},{id:"mat-02",topic:"Masa",objective:"Identificar la unidad SI de la masa",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la unidad de la masa en el Sistema Internacional?",options:["Gramo (g)","Kilogramo (kg)","Newton (N)","Litro (L)"],correctAnswer:1,shuffleOptions:!0,explanation:"La masa se mide en kilogramos (kg) en el SI. El gramo es un submúltiplo (1 g = 10⁻³ kg)."},{id:"mat-03",topic:"Volumen",objective:"Identificar la unidad SI del volumen",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la unidad del volumen en el Sistema Internacional?",options:["Litro (L)","Metro cúbico (m³)","Centímetro cúbico (cm³)","Metro (m)"],correctAnswer:1,shuffleOptions:!0,explanation:"El volumen se mi {id:"mat-13",topic:"Propiedades específicas",objective:"Identificar propiedades específicas",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las propiedades específicas de la materia:",options:["Densidad","Masa","Punto de ebullición","Volumen"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"La densidad y el punto de ebullición son propiedades específicas: caracterizan a cada sustancia y permiten identificarla. La masa y el volumen son generales."},{id:"mat-14",topic:"Densidad",objective:"Relacionar densidad y masa para el mismo volumen",difficulty:"media",type:"single-choice",prompt:"Para el mismo volumen, ¿qué ocurre con una sustancia más densa?",options:["Tiene menos masa","Tiene más masa","Tiene la misma masa","No se puede comparar"],correctAnswer:1,shuffleOptions:!0,explanation:'Una sustancia más densa "empaca" más materia en el mismo espacio, por lo que, para el mismo volumen, tiene más masa. Por eso una esfera de hierro pesa más que una de madera del mismo tamaño.'},{id:"mat-15",topic:"Conversión de densidades",objective:"Comprender el factor g/L",difficulty:"media",type:"true-false",prompt:"1 g/L es equivalente a 1 kg/m³.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. 1 g/L = 10⁻³ kg / 10⁻³ m³ = 1 kg/m³. Por eso el aire, con densidad 1,3 g/L, equivale a 1,3 kg/m³."},{id:"mat-16",topic:"Identificación",objective:"Identificar una sustancia por su densidad",difficulty:"avanzada",type:"single-choice",prompt:"Una roca tiene una masa de 54 g y un volumen de 20 cm³. Según la tabla, ¿qué es?",data:{columns:["Sustancia","Densidad (kg/m³)"],rows:[["Aceite","920"],["Agua","1000"],["Azufre","1960"],["Mármol","2700"],["Hierro","7900"]],caption:"Densidades de algunas sustancias"},options:["Hierro","Mármol","Azufre","Aceite"],correctAnswer:1,shuffleOptions:!0,explanation:"d = m/V = 54 g / 20 cm³ = 2,7 g/cm³ = 2700 kg/m³. Según la tabla, 2700 kg/m³ corresponde al mármol."},{id:"mat-17",topic:"Identificación",objective:"Ordenar los pasos
