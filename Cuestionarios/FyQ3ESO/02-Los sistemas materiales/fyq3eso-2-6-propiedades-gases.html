  <script type="module" crossorigin>const Z={title:"Las propiedades de los gases",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/02-Los sistemas materiales/2.6-Las propiedades de los gases.md",outputFolder:"FyQ3ESO/02-Los sistemas materiales",instructions:"Responde a las 20 preguntas sobre las propiedades de los gases. Se evalúan las variables de estado (presión, volumen y temperatura), las cuatro propiedades de los gases y las tres leyes de los gases (Boyle-Mariotte y las dos de Charles y Gay-Lussac), con sus fórmulas, conversiones a kelvin y ejemplos. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de las leyes de los gases y de sus variables de estado.":e>=60?"Buen trabajo; repasa qué magnitud se mantiene constante en cada ley y los cálculos en kelvin.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"gas-01",topic:"Variables de estado",objective:"Identificar las tres magnitudes de un gas",difficulty:"básica",type:"single-choice",prompt:"Las tres variables de estado que caracterizan a un gas son:",options:["La presión (p), el volumen (V) y la temperatura (T)","La masa, el peso y la densidad","La fuerza, la energía y la velocidad","La temperatura, la masa y el volumen"],correctAnswer:0,shuffleOptions:!0,explanation:"Un gas se describe con tres magnitudes: presión (p), volumen (V) y temperatura (T). Están ligadas entre sí, y cada ley de los gases se obtiene manteniendo una de ellas fija."},{id:"gas-02",topic:"Propiedades de los gases",objective:"Reconocer que un gas no tiene forma ni volumen propios",difficulty:"básica",type:"true-false",prompt:"Un gas tiene una forma y un volumen propios y fijos, igual que un sólido.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. Un gas NO tiene forma ni volumen fijos: toma la forma del recipiente que lo contiene y su volumen depende de la presión. Sus partículas están muy separadas y se mueven libremente."},{id:"gas-03",topic:"Comprimir o expandir",objective:"Aplicar la propiedad de compresibilidad",difficulty:"básica",type:"single-choice",prompt:"Como sus partículas pueden acercarse o separarse, un gas se puede:",options:["Comprimir o expandir a voluntad","Comprimir, pero nunca expandir","Expandir, pero nunca comprimir","Ni comprimir ni expandir"],correctAnswer:0,shuffleOptions:!0,explanation:"Al estar sus partículas muy separadas, un gas puede comprimirse (acercarlas) o expandirse (separarlas) a voluntad. Por eso una bombona, un neumático o un globo cambian de volumen si se presiona."},{id:"gas-04",topic:"Origen de la presión",objective:"Explicar por qué un gas produce presión",difficulty:"básica",type:"single-choice",prompt:"La presión que un gas ejerce sobre las paredes del recipiente se debe a:",options:["El peso del gas hacia abajo","La suma de los choques de millones de partículas contra la pared","Una fuerza estática fija del gas","La temperatura, directamente, sin más"],correctAnswer:1,shuffleOptions:!0,explanation:"Cada partícula que choca contra la pared ejerce una pequeña fuerza; la presión es la suma de todos esos choques por unidad de superficie. No es una fuerza estática: son millones de choques continuos."},{id:"gas-05",topic:"Las tres leyes",objective:"Leer la tabla de las tres leyes de los gases",difficulty:"básica",type:"multiple-choice",prompt:"Según la tabla de las tres leyes de los gases, selecciona las afirmaciones correctas:",data:{columns:["Ley","Magnitud fija","Relación"],rows:[["Boyle-Mariotte","Temperatura","p y V inversamente proporcionales"],["Primera de Charles y Gay-Lussac","Presión","V y T directamente proporcionales"],["Segunda de Charles y Gay-Lussac","Volumen","p y T directamente proporcionales"]],caption:"Las tres leyes de los gases y qué magnitud se mantiene fija"},options:["En Boyle-Mariotte la temperatura es constante y p y V son inversamente proporcionales","En la primera ley de Charles y Gay-Lussac la presión es constante y V y T son directamente proporcionales","En la segunda ley de Charles y Gay-Lussac el volumen es constante y p y T son directamente proporcionales","En Boyle-Mariotte la presión es constante"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Cada ley fija una magnitud: Boyle-Mariotte fija la temperatura (p y V varían, inversamente), la primera ley de Charles y Gay-Lussac fija la presión (V y T varían, directamente) y la segunda fija el volumen (p y T varían, directamente). En Boyle-Mariotte no es la presión la que es constante."},{id:"gas-06",topic:"Difusión",objective:"Identificar la tendencia a ocupar todo el volumen",difficulty:"básica",type:"single-choice",prompt:"El olor de un ambientador se reparte por toda la habitación porque las partículas del gas:",options:["Se quedan donde se liberan","Se difunden por el movimiento aleatorio y ocupan todo el volumen disponible","Son empujadas por un ventilador oculto","Quieren expandirse porque quieren"],correctAnswer:1,shuffleOptions:!0,explanation:'El movimiento aleatorio (térmico) de las partículas hace que se difundan solas por todo el volumen, sin que nadie las empuje. No es una "voluntad" del gas, sino el movimiento de sus partículas.'},{id:"gas-07",topic:"Conversión de temperatura",objective:"Convertir °C a kelvin",difficulty:"media",type:"numeric",prompt:"Convierte 20 °C a kelvin (T = t + 273). Escribe solo el número en kelvin.",correctAnswer:293,tolerance:0,unit:"K",explanation:"T = 20 + 273 = 293 K. En las leyes de los gases siempre se trabaja con temperatura absoluta en kelvin."},{id:"gas-08",topic:"Boyle-Mariotte (fórmula)",objective:"Recordar la fórmula de Boyle-Mariotte",difficulty:"media",type:"short-answer",prompt:"Escribe la fórmula de la ley de Boyle-Mariotte que relaciona las condiciones iniciales (1) y finales (2) de presión y volumen.",acceptedAnswers:["p1*V1 = p2*V2","p1v1 = p2v2"],explanation:"A temperatura constante se cumple p·V = constante, de modo que p1·V1 = p2·V2. Los subíndices 1 son las condiciones iniciales y 2 las finales. En el teclado se escribe p1*V1 = p2*V2."},{id:"gas-09",topic:"Boyle-Mariotte (relación)",objective:"Identificar la relación inversa p-V",difficulty:"media",type:"single-choice",prompt:"En la ley de Boyle-Mariotte (T constante), si la presión se duplica, el volumen:",options:["Se duplica","Se reduce a la mitad","No cambia","Se reduce a la cuarta parte"],correctAnswer:1,shuffleOptions:!0,explanation:"p y V son inversamente proporcionales: p·V = k. Si p se duplica, V se reduce a la mitad. Si la presión baja a la mitad, el volumen se duplica."},{id:"gas-10",topic:"Boyle-Mariotte (cálculo)",objective:"Calcular V₂ con p₁V₁ = p₂V₂",difficulty:"media",type:"numeric",prompt:"Un gas ocupa 5 L a 10⁵ Pa. ¿Qué volumen ocupa si la presión pasa a 1,2·10⁵ Pa (T constante)? Escribe el volumen en litros como número.",correctAnswer:4.2,tolerance:.05,unit:"L",explanation:"V₂ = p₁V₁/p₂ = (10⁵ Pa · 5 L)/(1,2·10⁵ Pa) = 5/1,2 = 4,2 L. Al subir la presión, el volumen disminuye de 5 L a 4,2 L."},{id:"gas-11",topic:"Primera ley de Charles y Gay-Lussac (cálculo)",objective:"Calcular V₂ con V₁/T₁ = V₂/T₂",difficulty:"media",type:"numeric",prompt:"Un gas ocupa 2 L a 300 K. ¿Qué volumen ocupa a 450 K (presión constante)? Escribe el volumen en litros como número.",correctAnswer:3,tolerance:.05,unit:"L",explanation:"V₂ = V₁·T₂/T₁ = 2 L · 450 K / 300 K = 3 L. La temperatura (en kelvin) se multiplica por 1,5 y el volumen también se multiplica por 1,5."},{id:"gas-12",topic:"Boyle-Mariotte (gráfica)",objective:"Identificar la gráfica de una relación inversa",difficulty:"media",type:"single-choice",prompt:"Al representar p en el eje Y y V en el eje X en la ley de Boyle-Mariotte, la gráfica es:",options:["Una recta que pasa por el origen","Una curva que baja (relación inversa)","Una recta horizontal","Una parábola que sube"],correctAnswer:1,shuffleOptions:!0,explanation:"Como p y V son inversamente proporcionales, la gráfica es una curva que baja, no una recta. Esa curva es la forma característica de una relación inversa."},{id:"gas-13",topic:"Elección de la ley",objective:"Identificar la ley según la magnitud constante",difficulty:"avanzada",type:"single-choice",prompt:"Un gas se calienta y su presión varía, pero su volumen se mantiene fijo (recipiente rígido). ¿Qué ley se aplica?",options:["Ley de Boyle-Mariotte","Primera ley de Charles y Gay-Lussac","Segunda ley de Charles y Gay-Lussac","Ninguna, porque no hay ley para ello"],correctAnswer:2,shuffleOptions:!0,explanation:"Si el volumen se mantiene constante y varían p y T, corresponde a la segunda ley de Charles y Gay-Lussac (p/T = k). El primer paso es siempre identificar qué magnitud se mantiene fija."},{id:"gas-14",topic:"Segunda ley de Charles y Gay-Lussac (cálculo p₂)",objective:"Calcular p₂ con p₁/T₁ = p₂/T₂",difficulty:"avanzada",type:"numeric",prompt:"Un gas está a 300 K y 10⁵ Pa (volumen constante). ¿Qué presión soporta si la temperatura aumenta a 450 K? Escribe el valor de p2 como número (en Pa), p. ej. 150000.",correctAnswer:15e4,tolerance:5e3,unit:"Pa",explanation:"p₂ = p₁·T₂/T₁ = 10⁵ Pa · 450 K / 300 K = 1,5·10⁵ Pa = 150 000 Pa. La presión se multiplica por el mismo factor (1,5) que la temperatura en kelvin."},{id:"gas-15",topic:"Segunda ley de Charles y Gay-Lussac (cálculo T₂)",objective:"Calcular T₂ con p₁/T₁ = p₂/T₂",difficulty:"avanzada",type:"numeric",prompt:"Un gas está a 300 K y 10⁵ Pa (volumen constante). ¿A qué temperatura estará cuando la presión sea 1,8·10⁵ Pa? Escribe T2 en kelvin como número.",correctAnswer:540,tolerance:5,unit:"K",explanation:"T₂ = p₂·T₁/p₁ = 1,8·10⁵ Pa · 300 K / 10⁵ Pa = 540 K. La presión y la temperatura (en kelvin) son directamente proporcionales."},{id:"gas-16",topic:"Método de Boyle-Mariotte",objective:"Ordenar los pasos para resolver un problema de Boyle-Mariotte",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para resolver un problema de Boyle-Mariotte (temperatura constante):",steps:["Identifica que la temperatura es constante, así que se aplica la ley de Boyle-Mariotte","Escribe las condiciones iniciales (p1, V1) y las finales (p2), cada una con su unidad","Aplica p1*V1 = p2*V2 y despeja la incógnita","Comprueba la dirección: si la presión sube, el volumen debe bajar"],correctAnswer:[0,1,2,3],explanation:"Primero se identifica la magnitud fija (temperatura), después se escriben las condiciones con sus unidades, se aplica la ley despejando la incógnita y al final se comprueba que la dirección del resultado es coherente con la ley."},{id:"gas-17",topic:"Método de Charles y Gay-Lussac",objective:"Ordenar los pasos con conversión a kelvin",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para resolver un problema de la primera ley de Charles y Gay-Lussac cuando las temperaturas vienen en grados Celsius:",steps:["Identifica que la presión es constante, así que se aplica la primera ley de Charles y Gay-Lussac","Pasa las temperaturas a kelvin: T1 = t1 + 273 y T2 = t2 + 273","Aplica V1/T1 = V2/T2 y despeja V2 = V1*T2/T1","Comprueba la dirección: si la temperatura sube, el volumen debe subir"],correctAnswer:[0,1,2,3],explanation:"Primero se identifica la magnitud fija (presión), después se pasan las temperaturas a kelvin (el paso que más errores evita), se aplica la ley despejando la incógnita y al final se comprueba la dirección del resultado."},{id:"gas-18",topic:"Recipiente de Boyle-Mariotte",objective:"Aplicar el resultado a un caso real",difficulty:"avanzada",type:"true-false",prompt:"Con 5 L de gas a 10⁵ Pa, si se introduce en un recipiente de 4 L que soporta hasta 1,2·10⁵ Pa, el gas cabe en el recipiente.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. V₂ = p₁V₁/p₂ = (10⁵·5)/(1,2·10⁵) = 4,2 L. Como 4,2 L > 4 L (la capacidad disponible), el gas NO cabe: el recipiente no sirve para el experimento."},{id:"gas-19",topic:"Método de las tres variables",objective:"Aplicar el método para obtener una ley",difficulty:"avanzada",type:"short-a
