  <script type="module" crossorigin>const Z={title:"Los estados de la materia",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/02-Los sistemas materiales/2.4-Los estados de la materia.md",outputFolder:"FyQ3ESO/02-Los sistemas materiales",instructions:"Responde a las 20 preguntas sobre los estados de la materia. Se evalúan los cuatro estados (sólido, líquido, gaseoso y plasma), la teoría cinética, la densidad, la temperatura como energía cinética media, las unidades (kelvin y grado Celsius), las conversiones y el funcionamiento del termómetro. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de los estados de la materia y de la temperatura.":e>=60?"Buen trabajo; repasa la diferencia entre estados y las conversiones de temperatura.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"esm-01",topic:"Plasma",objective:"Identificar el estado con partículas cargadas",difficulty:"básica",type:"single-choice",prompt:"El estado de la materia cuyas partículas poseen carga eléctrica es:",options:["Sólido","Líquido","Gaseoso","Plasma"],correctAnswer:3,shuffleOptions:!0,explanation:"El plasma es el único estado cuyas partículas poseen carga eléctrica. En el gas las partículas son neutras; en el plasma llevan carga, y por eso responde a los campos eléctricos y magnéticos."},{id:"esm-02",topic:"Plasma frente al gas",objective:"Distinguir plasma de gas por la carga",difficulty:"básica",type:"true-false",prompt:"La diferencia clave entre el plasma y el gas es que en el plasma las partículas están cargadas (ionizadas).",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Exacto. El plasma es un gas "encendido" o ionizado: los átomos han perdido electrones y hay electrones libres e iones positivos. Esa carga es lo que diferencia al plasma del gas.'},{id:"esm-03",topic:"Teoría cinética",objective:"Enunciar la teoría cinética",difficulty:"básica",type:"single-choice",prompt:"Según la teoría cinética, la materia:",options:["Está formada por partículas en continuo movimiento, cuya velocidad aumenta cuanto mayor es la temperatura","Está formada por partículas en reposo que no se mueven","Está formada por partículas que solo se mueven en los gases","Está formada por partículas cuyo tamaño cambia con la temperatura"],correctAnswer:0,shuffleOptions:!0,explanation:"La teoría cinética se resume en dos afirmaciones: la materia está formada por partículas extremadamente pequeñas y en continuo movimiento, y la velocidad a la que se mueven aumenta cuanto mayor es la temperatura."},{id:"esm-04",topic:"Estado sólido",objective:"Describir el sólido a escala de partículas",difficulty:"básica",type:"single-choice",prompt:"En un sólido, las partículas:",options:["Se mueven libremente con movimiento caótico","Están muy juntas en posiciones fijas y ordenadas, y solo vibran en su sitio","Se deslizan unas respecto a otras","Han perdido sus electrones"],correctAnswer:1,shuffleOptions:!0,explanation:"En el sólido las partículas están muy próximas, unidas por fuerzas muy fuertes, en posiciones fijas y ordenadas, y solo vibran alrededor de su posición. Por eso el sólido tiene volumen y forma constantes."},{id:"esm-05",topic:"Estado líquido",objective:"Identificar las propiedades macroscópicas del líquido",difficulty:"básica",type:"single-choice",prompt:"Un líquido tiene:",options:["Volumen constante y forma constante","Volumen constante y forma variable (adopta la del recipiente)","Volumen variable y forma variable","Ni forma ni volumen definidos"],correctAnswer:1,shuffleOptions:!0,explanation:"El líquido tiene volumen constante (las partículas siguen unidas) pero forma variable: las fuerzas que las unen son más débiles que en un sólido, así que pueden deslizarse y adaptarse al recipiente."},{id:"esm-06",topic:"Estado gaseoso",objective:"Explicar el origen de la presión de un gas",difficulty:"básica",type:"single-choice",prompt:"En un gas, la presión que se ejerce sobre las paredes del recipiente se debe a:",options:["El peso del gas hacia abajo","Los choques de las partículas contra las paredes","Una fuerza estática fija del gas","La temperatura, directamente, sin más"],correctAnswer:1,shuffleOptions:!0,explanation:"Las partículas del gas se mueven con movimiento caótico y chocan entre ellas y con las paredes. Esos choques contra la pared empujan por dentro y producen la presión del gas."},{id:"esm-07",topic:"Tabla comparativa",objective:"Leer la tabla de los cuatro estados",difficulty:"básica",type:"multiple-choice",prompt:"Según la tabla comparativa, selecciona las afirmaciones correctas:",data:{columns:["Estado","Volumen","Forma","Carga eléctrica de las partículas"],rows:[["Sólido","Constante","Constante","Sin carga"],["Líquido","Constante","Variable","Sin carga"],["Gaseoso","Variable","Variable","Sin carga"],["Plasma","Variable","Variable","Con carga"]],caption:"Comparación de los cuatro estados de la materia"},options:["El sólido tiene volumen y forma constantes","El líquido tiene volumen constante y forma variable","El gaseoso tiene volumen constante y forma variable","El plasma es el único estado cuyas partículas poseen carga eléctrica"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"El gaseoso, como el plasma, tiene volumen y forma variables, no volumen constante. Las otras tres afirmaciones se leen directamente de la tabla."},{id:"esm-08",topic:"Conversión K/°C",objective:"Convertir de °C a K",difficulty:"media",type:"numeric",prompt:"La temperatura del aire de una habitación es de 25 °C. ¿A cuántos kelvins equivale? (Usa T = t + 273)",correctAnswer:298,tolerance:1,unit:"K",explanation:"T = 25 + 273 = 298 K. Para pasar de grados Celsius a kelvin se suma 273."},{id:"esm-09",topic:"Conversión K/°C",objective:"Convertir de K a °C",difficulty:"media",type:"numeric",prompt:"Una muestra de agua está a 293 K. ¿A cuántos grados Celsius equivale? (Usa t = T − 273)",correctAnswer:20,tolerance:1,unit:"°C",explanation:"t = 293 − 273 = 20 °C. Para pasar de kelvin a grados Celsius se resta 273."},{id:"esm-10",topic:"Temperatura",objective:"Definir temperatura como energía cinética media",difficulty:"media",type:"single-choice",prompt:"La temperatura mide:",options:["La masa del cuerpo","La energía cinética media de las partículas","El volumen del cuerpo","La energía total del cuerpo"],correctAnswer:1,shuffleOptions:!0,explanation:"La temperatura es la energía cinética media de las partículas: lo rápido que se mueven, de media. No es la energía total del cuerpo, que depende también de cuántas partículas hay."},{id:"esm-11",topic:"Termómetro",objective:"Explicar el funcionamiento del termómetro",difficulty:"media",type:"single-choice",prompt:"Un termómetro se basa en:",options:["La dilatación que sufre una sustancia al aumentar la temperatura","El peso del líquido","El color del tubo","La gravedad"],correctAnswer:0,shuffleOptions:!0,explanation:"El termómetro se basa en la dilatación: al calentarse la sustancia crece y sube por el tubo, y la altura que alcanza se lee en la escala grabada. Al enfriarse se contrae y baja."},{id:"esm-12",topic:"Incrementos de temperatura",objective:"Relacionar incrementos de °C y K",difficulty:"media",type:"true-false",prompt:"Un incremento de 1 °C equivale a un incremento de 1 K.",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Exacto. El "tamaño" de un grado es el mismo en ambas escalas: un incremento de 1 °C es igual a un incremento de 1 K. Lo que cambia entre escalas es el punto de partida, no la longitud del grado.'},{id:"esm-13",topic:"Densidad",objective:"Explicar la densidad de sólidos y líquidos frente a gases",difficulty:"media",type:"single-choice",prompt:"Según la teoría cinética, los sólidos y los líquidos son más densos que los gases porque:",options:["Sus partículas son más pequeñas","Sus partículas están muy juntas y ocupan poco volumen","Sus partículas están más cargadas","Tienen más masa"],correctAnswer:1,shuffleOptions:!0,explanation:"En sólidos y líquidos las partículas están muy juntas y ocupan poco volumen para una masa dada, así que su densidad (d = m/V) es alta. En los gases las partículas están muy separadas y ocupan mucho volumen: densidad baja."},{id:"esm-14",topic:"Nomenclatura",objective:"Nombrar correctamente la unidad Celsius",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la forma correcta de nombrar la unidad de la escala Celsius?",options:["Grado centígrado","Grado Celsius","Kelvin","Grado termométrico"],correctAnswer:1,shuffleOptions:!0,explanation:'Lo correcto es "grado Celsius". Desde 1948 el término "grado centígrado" se considera incorrecto. El kelvin es la unidad de la escala absoluta y no lleva la palabra "grado": se dice 298 K, no 298 grados kelvin.'},{id:"esm-15",topic:"Conversión (fórmula)",objective:"Escribir la fórmula de °C a K",difficulty:"avanzada",type:"short-answer",prompt:"Escribe la fórmula para pasar de grados Celsius a kelvin en forma de teclado (como en la lección).",acceptedAnswers:["T = t + 273","T=t+273"],explanation:"Para pasar de grados Celsius a kelvin se despeja la temperatura termodinámica: T = t + 273. En el teclado se escribe T = t + 273."},{id:"esm-16",topic:"Conversión (fórmula)",objective:"Escribir la fórmula de K a °C",difficulty:"avanzada",type:"short-answer",prompt:"Escribe la fórmula para pasar de kelvin a grados Celsius en forma de teclado (como en la lección).",acceptedAnswers:["t = T - 273","t=T-273"],explanation:"El grado Celsius se define a partir del kelvin: t = T − 273. En el teclado se escribe t = T - 273."},{id:"esm-17",topic:"Energía cinética",objective:"Ordenar los estados por energía cinética",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los estados de la materia según la cantidad de energía cinética de sus partículas, de mayor a menor:",steps:["Plasma","Gaseoso","Líquido","Sólido"],correctAnswer:[0,1,2,3],explanation:"Del plasma al sólido la energía cinética disminuye: el plasma tiene partículas muy rápidas y con carga, el gas partículas rápidas y neutras, el líquido partículas más lentas y el sólido partículas que solo vibran en posiciones fijas."},{id:"esm-18",topic:"Conversión (pasos)",objective:"Ordenar los pasos de la conversión °C a K",difficulty:"avanzada",type:"order-steps",prompt:"Ordena los pasos para convertir una temperatura de grados Celsius a kelvin:",steps:["Identifica la unidad de lo que te dan: grados Celsius, así que buscas la temperatura termodinámica T","Aplica la expresión despejada T = t + 273","Sustituye el valor y suma 273","Comprueba el orden de magnitud: el valor en kelvin es mayor que el valor en grados Celsius"],correctAnswer:[0,1,2,3],explanation:"Primero se identifica la unidad de partida, después se aplica la fórmula T = t + 273, se sustituye y se suma, y al final se comprueba que el resultado en kelvin es mayor que el valor en grados Celsius."},{id:"esm-19",topic:"Conversión K/°C",objective:"Convertir valores negativos de °C a K",difficulty:"avanzada",type:"numeric",prompt:"En una cámara frigorífica el aire está a −10 °C. ¿A cuántos kelvins equivale?",correctAnswer:263,tolerance:1,unit:"K",explanation:"T = −10 + 273 = 263 K. El signo menos forma parte del valor; se suma igual. Una temperatura negativa en grados Celsius sigue siendo positiva en kelvin."},{id:"esm-20",topic:"Detección de errores",objective:"Distinguir temperatura de energía total",difficulty:"avanzada",type:"single-choice",prompt:"Una bañera de agua a 30 °C y un cazo de agua a 90 °C. ¿Cuál tiene mayor temperatura?",options:["La bañera, porque tiene más agua","El cazo, porque sus partículas se mueven más rápido de media","Tienen la misma temperatura","No se puede saber"],correctAnswer:1,shuffleOptions:!0,explanation:"La temperatura mide la energía cinética media de las partículas, no la energía total. El cazo a 90 °C tiene mayor temperatura que la bañera a 30 °C, aunque la bañera contenga mucha más agua y mucha más energía total."}]},W=Object.freeze(Object.definePrope
