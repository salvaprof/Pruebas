 se obtiene al comparar el patrón con la magnitud que se mide. "},{id:"med-03",topic:"Sistema Internacional",objective:"Identificar las unidades del Sistema Internacional",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la unidad del Sistema Internacional utilizada para medir el tiempo?",options:["el minuto","el segundo","la hora","el día"],correctAnswer:1,shuffleOptions:!0,explanation:"El segundo es la unidad del SI para el tiempo; el minuto, la hora y el día aparecen en la lección como unidades de uso cotidiano. "},{id:"med-04",topic:"Sistema Internacional",objective:"Identificar las unidades del Sistema Internacional",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la unidad del SI para medir la masa?",options:["El gramo","El kilogramo","La tonelada","El newton"],correctAnswer:1,shuffleOptions:!0,explanation:"La unidad del SI para medir masas es el kilogramo. La tonelada es un múltiplo y el newton es la unidad de fuerza, no de masa. "},{id:"med-05",topic:"Sistema Internacional",objective:"Identificar las unidades del Sistema Internacional",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las magnitudes que la lección incluye entre las magnitudes básicas del Sistema Internacional:",options:["Longitud","Masa","Tiempo","Temperatura","Velocidad"],correctAnswer:[0,1,2,3],shuffleOptions:!1,explanation:"Las magnitudes básicas de la lección son longitud, masa, tiempo, temperatura, intensidad de corriente eléctrica y cantidad de sustancia. La velocidad es una magnitud derivada: se construye a partir de la longitud y del tiempo. "},{id:"med-06",topic:"Equivalencias",objective:"Aplicar las equivalencias entre unidades de medida",difficulty:"media",type:"numeric",prompt:"¿Cuántos metros por segundo son 72 km/h? Escribe solo el valor numérico.",correctAnswer:20,tolerance:.01,explanation:"Se aplica la relación 1 m/s = 3,6 km/h: 72 dividido entre 3,6 da 20 m/s. Equivale a pasar los kilómetros a metros y las horas a segundos. "},{id:"med-07",topic:"Equivalencias",objective:"Aplicar las equivalencias entre unidades de medida",difficulty:"media",type:"short-answer",prompt:"¿En qué unidad del Sistema Internacional se mide la intensidad de corriente eléctrica?",acceptedAnswers:["amperio","A"],explanation:"La intensidad de corriente eléctrica se mide en amperios en el Sistema Internacional. "},{id:"med-08",topic:"Notación científica",objective:"Expresar cantidades en notación científica",difficulty:"básica",type:"numeric",prompt:"Expresa 0,000065 en notación científica.",correctAnswer:65e-8,tolerance:1e-10,format:"a*10^n",explanation:"La coma se desplaza cinco posiciones hacia la derecha para dejar un número entre 1 y 10 (6,5) y el exponente resulta negativo: 0,000065 = 6,5 × 10⁻⁷. "},{id:"med-09",topic:"Notación científica",objective:"Expresar cantidades en notación científica",difficulty:"media",type:"numeric",prompt:"La distancia media de la Tierra al Sol es de 149 600 000 km. Redondea esa distancia a la decena de millones de kilómetros y exprésala como número entero y sin potencia de diez.",correctAnswer:15e7,tolerance:1,format:"numero entero",explanation:"Redondeando a la decena de millones, las cifras siguientes a 150 000 000 no alcanzan la mitad del orden y el resultado es 150 000 000 km. "},{id:"med-10",topic:"Notación científica",objective:"Expresar cantidades en notación científica",difficulty:"media",type:"numeric",prompt:"En un curso escolar de 40 semanas se han consumido 31 536 000 s. Expresa esa cantidad en notación científica.",correctAnswer:31536e3,tolerance:.001,format:"a*10^n",explanation:"Desplazando la coma siete posiciones se obtiene 3,1536 × 10⁷ s, que es la expresión exacta de la notación científica pedida en la lección. "},{id:"med-11",topic:"Prefijos",objective:"Usar los prefijos del SI",difficulty:"media",type:"short-answer",prompt:"La lección usa el prefijo μ en magnitudes como μg. ¿Qué nombre tiene ese prefijo?",acceptedAnswers:["micro"],explanation:"El prefijo μ es micro, que equivale a la millonésima parte de la unidad. "},{id:"med-12",topic:"Múltiplos y submúltiplos",objective:"Usar los prefijos del SI",difficulty:"media",type:"numeric",prompt:"Un objeto mide 2,3 km. ¿Cuántos metros son? Escribe solo el valor numérico.",correctAnswer:2300,tolerance:.01,explanation:"Kilo es el prefijo de mil, así que 2,3 km son 2,3 × 1 000 = 2 300 m. "},{id:"med-13",topic:"Magnitudes derivadas",objective:"Distinguir una magnitud derivada de una básica",difficulty:"media",type:"short-answer",prompt:"La velocidad es una magnitud derivada porque se obtiene a partir de la longitud y del tiempo. Con esas dos mismas magnitudes básicas se obtiene otra magnitud de la lección, que se define como masa por volumen y se mide en kg/m³. ¿Qué magnitud es?",acceptedAnswers:["densidad","magnitud derivada","derivada"],explanation:"La densidad se define como masa por volumen, por lo que se obtiene a partir de dos magnitudes básicas y su unidad en el SI es el kg/m³. "},{id:"med-14",topic:"Cifras significativas",objective:"Calcular la aproximación de una medida",difficulty:"media",type:"numeric",prompt:"El cronómetro de la lección marca t = (23,83 ± 0,1) s. Indica el valor de la aproximación de esa medida, en segundos.",correctAnswer:.1,tolerance:.11,explanation:"La aproximación es la incertidumbre con la que se expresa la medida: en t = (23,83 ± 0,1) s vale 0,1 s. "},{id:"med-15",topic:"Cifras significativas",objective:"Aplicar las cifras significativas",difficulty:"media",type:"order-steps",prompt:"La masa de la Tierra es de 5 972 000 000 000 000 000 000 000 kg y la cifra escrita «5 972 000 000 000 000 000 000 000» tiene cuatro cifras significativas. Ordena los pasos para expresarla en notación científica.",steps:["Contar las cifras significativas de la cantidad","Dejar un número entre 1 y 10 desplazando la coma","Determinar el exponente de la potencia de diez","Escribir la expresión final con las cifras significativas"],correctAnswer:[0,1,2,3],explanation:"Las cifras significativa icativa",difficulty:"básica",type:"single-choice",prompt:"Se mide la longitud de un pasillo con una cinta métrica y se obtiene 12,5 m, siendo la precisión de la cinta 0,05 m. ¿Cuál es la exactitud de esa medición?",options:["Depende de lo cerca que esté el valor medido del valor real","Depende de la menor división de la cinta métrica","Depende del número de cifras significativas escritas","Depende de la resolución de la cinta métrica"],correctAnswer:0,shuffleOptions:!0,explanation:"La exactitud indica lo cerca que está la medida del valor real de la magnitud y depende de la calidad de la medición y del método utilizado. La precisión sí depende de la resolución del instrumento. "},{id:"med-20",topic:"Precisión y exactitud",objective:"Aplicar los pasos del estudio de la calidad de una medida",difficulty:"media",type:"order-steps",prompt:"El estudiante de la lección ha tomado cinco medidas en un mismo instante, en cinco posiciones diferentes. Ordena los pasos del estudio de calidad de su medición.",steps:["Identificar el valor de referencia con el que se va a comparar la medida","Calcular la precisión a partir de la mayor diferencia entre las medidas directas","Calcular la exactitud comparando el valor más repetido con el de referencia","Expresar el resultado con su incertidumbre y sus unidades"],correctAnswer:[0,1,2,3],explanation:"La lección estudia la calidad de una medición en cuatro pasos: elegir el valor de referencia, calcular la precisión, calcular la exactitud y expresar el resultado con su incertidumbre y sus unidades. "}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq3eso12MedidasMagnitudesAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"med-01":{hint:"Descarta instrumentos y decimales: la propiedad de un cuerpo o de un fenómeno que admite una medida."},"med-02":{hint:"Piensa en las dos exigencias de la lección: que la medida no cambie con la persona y que al repetirla salga igual."},"med-03":{hint:"La propiedad que se puede medir es la ma
