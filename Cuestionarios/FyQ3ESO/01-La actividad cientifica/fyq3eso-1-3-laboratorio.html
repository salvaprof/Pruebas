  <script type="module" crossorigin>const G={title:"El laboratorio de Física y Química",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/01-La actividad cientifica/1.3-El laboratorio de fisica y quimica.md",outputFolder:"FyQ3ESO/01-La actividad cientifica",instructions:"Responde a las 20 preguntas sobre el laboratorio de Física y Química: material de medida, material de sujeción, material para contener y calentar, material variado de Química y de Física, normas de seguridad, gestión de residuos y pictogramas de peligro. Dispones de dos intentos por pregunta. Al finalizar verás tu puntuación y el desglose por contenidos.",finalMessage:e=>e>=80?"Conoces el material del laboratorio y sus normas de seguridad.":e>=60?"Buen trabajo; te queda por afinar la función de algún material o alguna norma.":"Conviene repasar la lista de materiales y las normas, y volver a intentarlo.",questions:[{id:"lab-01",topic:"Material de medida",objective:"Reconocer el material para medir masas o volúmenes",difficulty:"básica",type:"single-choice",prompt:"¿Qué material de la lección mide el volumen con mucha precisión?",options:["La probeta","El matraz aforado","La pipeta con aspirador","El vaso de precipitado"],correctAnswer:2,shuffleOptions:!0,explanation:"La pipeta con aspirador es la que mide el volumen con mucha precisión. La bureta mide volumen con precisión, el matraz aforado da un volumen exacto y las probetas miden volúmenes de forma aproximada. "},{id:"lab-02",topic:"Material de medida",objective:"Reconocer el material para medir masas o volúmenes",difficulty:"media",type:"single-choice",prompt:"Para medir la masa de una muestra el laboratorio utiliza una balanza. ¿Qué instrumento de los cuatro propuestos mide el volumen con precisión?",options:["La bureta","La gradilla","El mortero","El soporte universal"],correctAnswer:0,shuffleOptions:!0,explanation:"La bureta mide volumen con precisión. La gradilla sostiene los tubos de ensayo, el mortero machaca sustancias sólidas y el soporte universal sirve para sujetar diferentes materiales. "},{id:"lab-03",topic:"Material de medida",objective:"Reconocer el material para medir masas o volúmenes",difficulty:"media",type:"multiple-choice",prompt:"Selecciona los materiales que la lección incluye en el grupo de material para medir masas o volúmenes:",options:["La balanza","La bureta","El dinamómetro","El matraz aforado","La probeta","La pipeta con aspirador"],correctAnswer:[0,1,3,4,5],shuffleOptions:!1,explanation:"En ese grupo están la balanza, que mide masas, y la bureta, el matraz aforado, las probetas y la pipeta con aspirador, que miden volumen. El dinamómetro pertenece al material de Física y se usa para medir fuerzas. "},{id:"lab-04",topic:"Material de sujeción",objective:"Reconocer el material de sujeción",difficulty:"media",type:"single-choice",prompt:"En un montaje para calentar una muestra, ¿para qué se utilizan el trípode y la rejilla?",options:["Permiten un mejor calentamiento de las muestras","Sostienen los tubos de ensayo","Condensan el vapor de las muestras calientes","Miden la masa de la muestra"],correctAnswer:0,shuffleOptions:!0,explanation:"El trípode y la rejilla permiten un mejor calentamiento de las muestras, por lo que el recipiente se apoya sobre ellos. Los tubos de ensayo se sostienen en la gradilla y el vapor lo condensa el refrigerante. "},{id:"lab-05",topic:"Material de sujeción",objective:"Reconocer el material de sujeción",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona los materiales que la lección clasifica como material de sujeción:",options:["El soporte universal","La probeta","La nuez","La gradilla","El trípode y la rejilla","El mortero"],correctAnswer:[0,2,3,4],shuffleOptions:!1,explanation:"El material de sujeción de la lección lo forman el soporte universal, las pinzas, la nuez, el trípode y la rejilla, y la gradilla. La probeta mide volúmenes y el mortero machaca sustancias sólidas. "},{id:"lab-06",topic:"Material de sujeción",objective:"Reconocer el material de sujeción",difficulty:"media",type:"short-answer",prompt:"¿Qué pieza de sujeción sujeta aros o pinzas al soporte universal?",acceptedAnswers:["nuez","la nuez","nuez de soporte"],explanation:"La nuez sujeta aros o pinzas al soporte universal. Las pinzas sujetan matraces y tubos de ensayo, y la gradilla se utiliza para sostener los tubos de ensayo. "},{id:"lab-07",topic:"Contener y calentar",objective:"Reconocer el material para contener, mezclar, calentar o enfriar",difficulty:"media",type:"single-choice",prompt:"En el grupo de material para contener, mezclar, calentar o enfriar, ¿para qué sirve el refrigerante?",options:["Condensa el vapor de muestras calientes","Calienta las sustancias químicas","Mide el volumen exacto de la disolución","Realiza filtraciones rápidas mediante vacío"],correctAnswer:0,shuffleOptions:!0,explanation:"El refrigerante condensa el vapor de las muestras calientes. El mechero Bunsen es el que calienta sustancias químicas y el kitasato sirve para realizar filtraciones rápidas mediante vacío. "},{id:"lab-08",topic:"Contener y calentar",objective:"Reconocer el material para contener, mezclar, calentar o enfriar",difficulty:"media",type:"single-choice",prompt:"¿Qué material se usa para calentar líquidos y agitar?",options:["El matraz de fondo redondo","La probeta","El matraz aforado","La gradilla"],correctAnswer:0,shuffleOptions:!0,explanation:"El matraz de fondo redondo sirve para calentar líquidos y agitar. El vaso de precipitado prepara, calienta o mide líquidos, y el matraz Erlenmeyer mezcla sustancias o evapora líquidos. "},{id:"lab-09",topic:"Contener y calentar",objective:"Reconocer el material para contener, mezclar, calentar o enfriar",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos del montaje, con las piezas que cita la lección, para calentar una muestra en la cápsula de porcelana.",steps:["Colocar el trípode en la zona de calentamiento","Apoyar la rejilla sobre el trípode","Situar la cápsula de porcelana sobre la rejilla","Calentar la muestra con el mechero"],correctAnswer:[0,1,2,3],explanation:"La rejilla se apoya en el trípode porque ambos permiten un mejor calentamiento de las muestras; sobre la rejilla se coloca la cápsula de porcelana, que guarda, evapora o reposa soluciones, y el calor lo aporta el mechero, que sirve para calentar sustancias químicas. "},{id:"lab-10",topic:"Material variado",objective:"Reconocer el material variado de química y de Física",difficulty:"básica",type:"short-answer",prompt:"¿Qué material de la lista de material variado guarda, evapora o reposa soluciones?",acceptedAnswers:["cápsula de porcelana","capsula porcelana","la cápsula de porcelana","cápsula"],explanation:"La cápsula de porcelana es el material variado que guarda, evapora o reposa soluciones. El mortero machaca sustancias sólidas y el kitasato realiza filtraciones rápidas mediante vacío. "},{id:"lab-11",topic:"Material variado",objective:"Identificar los materiales de laboratorio de uso frecuente y su función",difficulty:"media",type:"single-choice",prompt:"¿Para qué sirve el embudo de decantación?",options:["Para separar líquidos inmiscibles","Para tomar pequeñas cantidades de sustancias en polvo","Para realizar filtraciones rápidas mediante vacío","Para machacar sustancias sólidas"],correctAnswer:0,shuffleOptions:!0,explanation:"El embudo de decantación sirve para separar líquidos inmiscibles. La espátula toma pequeñas cantidades de sustancias en polvo, el kitasato realiza filtraciones rápidas mediante vacío y el mortero machaca sustancias sólidas. "},{id:"lab-12",topic:"Normas con equipos eléctricos",objective:"Aplicar las normas para el uso de equipos electrónicos y eléctricos",difficulty:"básica",type:"true-false",prompt:"Un aparato eléctrico del laboratorio que no funciona lo arregla el propio alumno.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"La norma del laboratorio es no arreglar ningún aparato eléctrico: debe hacerlo un técnico. Con los equipos electrónicos y eléctricos tampoco se tocan enchufes ni conexiones con las manos húmedas. "},{id:"lab-13",topic:"Material de Física",objective:"Reconocer el material variado de química y de Física",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona todas las relaciones correctas entre el material de Física y lo que hace, según la lección:",options:["El calibre mide longitudes con gran precisión","El osciloscopio analiza señales eléctricas","El calorímetro mide fuerzas","El cronómetro mide el tiempo","El voltímetro mide la tensión eléctrica","El péndulo analiza señales eléctricas"],correctAnswer:[0,1,3,4],shuffleOptions:!1,explanation:"El calorímetro mide el calor que emite o absorbe un cuerpo, y el péndulo se utiliza en experimentos en los que interviene la gravedad. El amperímetro mide la corriente eléctrica y el dinamómetro se usa para medir fuerzas. "},{id:"lab-14",topic:"Normas básicas",objective:"Aplicar las normas básicas en el laboratorio",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona el equipo de protección que la lección cita como esencial para trabajar en el laboratorio:",options:["Gafas de seguridad","Mascarilla","Bata","Guantes","Delantal"],correctAnswer:[0,2,3],shuffleOptions:!1,explanation:"Las normas básicas incluyen el uso de equipo de protección: gafas de seguridad, bata y guantes, que son esenciales para trabajar en el laboratorio. "},{id:"lab-15",topic:"Normas con productos químicos",objective:"Aplicar las normas para el uso de productos químicos",difficulty:"media",type:"single-choice",prompt:"Para diluir un ácido, ¿qué hay que hacer?",options:["Añadir siempre el ácido sobre el agua","Añadir el agua sobre el ácido: el ácido se diluye de forma peligrosa y puede salpicar","Echar agua y ácido a la vez en el mismo recipiente","Añadir el agua sobre el ácido solo si el recipiente está limpio"],correctAnswer:0,shuffleOptions:!0,explanation:"Hay que tener especial cuidado con los ácidos: para diluirlos se añade siempre el ácido sobre el agua y no al revés. Añadir el agua sobre el ácido es un procedimiento defectuoso que hace que se diluya de forma peligrosa y puede salpicar. "},{id:"lab-16",topic:"Normas con productos químicos",objective:"Aplicar las normas para el uso de productos químicos",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos para preparar una disolución a partir de un ácido, según las normas de la lección.",steps:["Leer detenidamente la etiqueta del producto","Utilizar un recipiente limpio","Añadir el ácido sobre el agua","Rotular convenientemente el recipiente ya con la disolución preparada"],correctAnswer:[0,1,2,3],explanation:"La lección recomienda leer detenidamente la etiqueta antes de utilizar cualquier producto, emplear un recipiente limpio y rotularlo para preparar la disolución, y añadir siempre el ácido sobre el agua y no al revés. "},{id:"lab-17",topic:"Normas con productos químicos",objective:"Aplicar las normas para el uso de productos químicos",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las normas correctas para el uso de productos químicos:",options:["Los frascos de reactivos no deben permanecer abiertos","Antes de utilizar cualquier producto, leer detenidamente su etiqueta","Los productos inflamables se sitúan cerca de mecheros y estufas","No pipetear con la boca los productos químicos","Se usa un producto sin conocer sus propiedades cuando la etiqueta está borrosa"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Los frascos no deben permanecer abiertos porque el reactivo puede contaminarse o evaporarse; la etiqueta se lee antes de usar cualquier producto para conocer sus propiedades, y no se pipetea con la boca. Los inflamables se mantienen lejos de mecheros y estufas. "},{id:"lab-18",topic:"Normas con productos químicos",objective:"Aplicar las normas para el uso de productos químicos",difficulty:"media",type:"true-false",prompt:"Los sobrantes de los productos que se han utilizado se devuelven siempre a los frascos de origen.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"No se devuelven nunca a los frascos de origen los sobrantes de los productos que se hayan utilizado, sin consultar al profesor. Si se vierte cualquier producto químico, se avisa al profesor. "},{id:"lab-19",topic:"Residuos de laboratorio",objective:"Aplicar las normas para la gestión de residuos de laboratorio",difficulty:"media",type:"single-choice",prompt:"Según la lección, ¿cómo se desechan las sustancias líquidas residuales del laboratorio?",options:["Se pueden verter al fregadero, previa consulta al profesor y diluidas en agua","Se echan en los contenedores destinados al vidrio","Se tiran al contenedor de papel","Se vierten siempre en los bidones de residuos tóxicos"],correctAnswer:0,shuffleOptions:!0,explanation:"Las sustancias líquidas pueden verterse al fregadero previa consulta al profesor y diluidas en agua. Los productos químicos tóxicos se desechan en contenedores especiales, y el vidrio, el papel y otros sólidos van a los contenedores destinados a cada material. "},{id:"lab-20",topic:"Pictogramas",objective:"Reconocer los pictogramas de peligro",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las definiciones correctas de los pictogramas de peligro que aparecen en la lección:",options:["Inflamable: la sustancia puede arder fácilmente","Corrosivo: la sustancia puede dañar la piel o los ojos","Corrosivo: la sustancia favorece la combustión de otras sustancias","Comburente: la sustancia favorece la combustión de otras sustancias","Inflamable: la sustancia puede dañar la piel o los ojos"],correctAnswer:[0,1,3],shuffleOptions:!1,explanation:"Los pictogramas de la lección son inflamable (puede arder fácilmente), corrosivo (puede dañar la piel o los ojos) y comburente (favorece la combustión de otras sustancias); las dos opciones que quedan cruzan el nombre con el efecto que no le corresponde. "}]},W=Object.freeze(Object.defineProperty({__proto__:null,fyq3eso13L
