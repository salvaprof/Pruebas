  <script type="module" crossorigin>const W={title:"La actividad científica",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/01-La actividad cientifica/1.1-La actividad cientifica.md",outputFolder:"FyQ3ESO/01-La actividad cientifica",instructions:"Responde a las 20 preguntas sobre la actividad científica: los ocho pasos del método científico, las fuentes de información, las hipótesis, el experimento del péndulo y sus variables, las tablas de datos, las leyes, las teorías y los modelos, y el artículo científico. Tienes dos intentos por pregunta. Al finalizar verás tu puntuación y el desglose por contenidos.",finalMessage:e=>e>=80?"Excelente: dominas el método científico, el experimento del péndulo y las leyes.":e>=60?"Buen trabajo. Repasa las leyes cualitativas y cuantitativas y los significados de teoría y modelo.":"Conviene repasar el método científico, los tipos de hipótesis y las variables del experimento del péndulo.",questions:[{id:"act-01",topic:"Método científico",objective:"Explicar en qué consiste el método científico y sus ocho pasos",difficulty:"básica",type:"order-steps",prompt:"Un equipo investiga por qué una planta crece mejor cerca de la ventana. Ordena los cinco primeros pasos del método científico, tal y como los enumera la lección.",steps:["Observar que las plantas necesitan luz para vivir","Buscar y seleccionar información, por ejemplo en un libro de biología","Enunciar la hipótesis: las plantas necesitan luz para obtener su nutrición","Experimentar en condiciones controladas con una planta sin luz","Interpretar los resultados: si una planta no tiene luz, muere"],correctAnswer:[0,1,2,3,4],explanation:"Los cinco primeros pasos son: 1.ª Observación, 2.ª Búsqueda y selección de información, 3.ª Enunciado de hipótesis, 4.ª Experimentación, 5.ª Interpretación de los resultados. Después llegan la formulación de leyes, la formulación de teorías y modelos, y la elaboración de un informe. "},{id:"act-02",topic:"Teorías y modelos",objective:"Definir una teoría y un modelo",difficulty:"media",type:"single-choice",prompt:"La lección habla de la teoría atómico-molecular de Dalton y de los modelos atómicos. ¿Qué diferencia plantea entre teoría y modelo?",options:["La teoría es una ley generalizada que abarca un conjunto de hechos; el modelo es una representación del fenómeno, generalmente mediante expresiones matemáticas","La teoría es una representación del fenómeno y el modelo es una ley generalizada que abarca un conjunto de hechos","Teoría y modelo son dos nombres para la misma cosa: una hipótesis ya comprobada","La teoría es una suposición que no se ha comprobado y el modelo es una hipótesis cierta"],correctAnswer:0,shuffleOptions:!0,explanation:"Una teoría es una ley generalizada que abarca un conjunto de hechos y está compuesta por leyes y principios. Un modelo es una representación de un fenómeno natural, generalmente mediante expresiones matemáticas, que lo describe total o parcialmente para simplificar su estudio. "},{id:"act-03",topic:"Observación",objective:"Definir la observación como punto de partida de la investigación",difficulty:"básica",type:"single-choice",prompt:"Según la lección, ¿en qué consiste la observación?",options:["En prestar atención, con cuidado, a un objeto o a un fenómeno para estudiarlo tal y como se presenta realmente","En reproducir un fenómeno en condiciones controladas que pueden repetirse y modificarse","En recopilar información en libros, revistas y páginas web","En presentar los resultados en tablas y gráficas"],correctAnswer:0,shuffleOptions:!0,explanation:"La observación consiste en prestar atención, con cuidado, a un objeto o a un fenómeno para estudiarlo tal y como se presenta realmente, aplicando todos los sentidos a lo que llama la atención. La investigación arranca de la observación. "},{id:"act-04",topic:"Fuentes de información",objective:"Distinguir los tipos de fuentes de información y los criterios de fiabilidad",difficulty:"básica",type:"multiple-choice",prompt:"Vas a informaros sobre la contaminación del río de tu ciudad. Selecciona todas las fuentes de información que la lección considera adecuadas y fiables.",options:["Una tesis doctoral sobre la calidad de las aguas","Una revista especializada avalada por una institución científica","Una página web avalada por un centro de investigación","Una página web que no indica quién avala su contenido"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"La lección recomienda monografías, tesis doctorales y artículos de investigación; revistas avaladas por una asociación o institución científica; páginas web avaladas por una universidad o un centro de investigación, y entrevistas a científicos. Al terminar el trabajo hay que citar las referencias. "},{id:"act-05",topic:"Hipótesis",objective:"Definir una hipótesis y las condiciones que debe cumplir para ser válida",difficulty:"básica",type:"single-choice",prompt:"¿Qué condiciones debe cumplir una hipótesis para ser válida?",options:["Enunciarse de forma clara y precisa, y poder verificarse mediante un experimento","Ser verdadera desde el principio y coincidir con lo que dice la lección","Estar publicada en una revista avalada por una institución científica","Expresarse siempre mediante una fórmula matemática"],correctAnswer:0,shuffleOptions:!0,explanation:"Una hipótesis es una suposición sobre cómo ocurre un fenómeno. Para ser válida debe enunciarse de forma clara y precisa y poder verificarse, es decir, poder rechazarse o confirmarse mediante un experimento. "},{id:"act-06",topic:"Hipótesis",objective:"Definir una hipótesis y las condiciones que debe cumplir para ser válida",difficulty:"media",type:"single-choice",prompt:"La hipótesis 1 del péndulo («el periodo de oscilación depende del color de la masa oscilante») no es una hipótesis válida. ¿Por qué?",options:["Porque no puede verificarse por experimentación que el color de un péndulo influya en su periodo","Porque su enunciado no es claro ni preciso","Porque el color de la masa oscilante no se puede observar","Porque las hipótesis solo pueden referirse a la masa y al largo del hilo"],correctAnswer:0,shuffleOptions:!0,explanation:"La lección concluye que la hipótesis 1 no es válida porque no puede verificarse por experimentación que el color influya en el periodo. El enunciado sí es claro: le falta la condición de ser verificable. "},{id:"act-07",topic:"Hipótesis",objective:"Diferenciar una hipótesis válida de una hipótesis cierta",difficulty:"media",type:"true-false",prompt:"La hipótesis 2 está bien formulada, así que es cierta.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Hipótesis válida no es lo mismo que hipótesis cierta. La hipótesis 2, sobre la masa, es válida porque es clara y verificable, pero la experimentación demuestra que el periodo es independiente de la masa: no es cierta. Una sola evidencia contraria basta para descartarla. "},{id:"act-08",topic:"Hipótesis",objective:"Diferenciar una hipótesis válida de una hipótesis cierta",difficulty:"media",type:"multiple-choice",prompt:"Sobre las tres hipótesis del péndulo de la lección, selecciona todas las afirmaciones correctas.",options:["La hipótesis 2 es válida, pero hay que comprobar si es cierta","La hipótesis 3 es válida y se comprueba que es cierta","A menor largo de hilo, el péndulo oscila más rápido","La hipótesis 2 está bien formulada, así que es cierta"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"La hipótesis 2 es válida y queda por aclarar si la masa influye; la experimentación decide que no es cierta. La hipótesis 3 es válida y cierta: a menor largo, el péndulo oscila más rápido; a mayor largo, más lento. Estar bien formulada solo garantiza que es verificable. "},{id:"act-09",topic:"Experimentación",objective:"Definir la experimentación y el trabajo de campo",difficulty:"básica",type:"short-answer",prompt:"¿Cómo se llama la fase del método científico que consiste en reproducir un fenómeno en condiciones controladas que pueden repetirse y modificarse, para comprobar si una hipótesis es verdadera o falsa? Responde con una sola palabra.",acceptedAnswers:["experimentacion"],keys:["ó"],explanation:"Es la experimentación: reproducir un fenómeno en condiciones controladas que pueden repetirse y modificarse, para comprobar si una hipótesis es verdadera o falsa. En el péndulo, la experimentación es la fase que decide sobre la hipótesis de la masa. "},{id:"act-10",topic:"Experimentación",objective:"Definir la experimentación y el trabajo de campo",difficulty:"media",type:"single-choice",prompt:"Un grupo mide la temperatura de un manantial durante varios días, recogiendo los datos directamente en el río y sin alterar nada. ¿Qué describe la lección?",options:["Trabajo de campo, una forma de experimentación que consiste en recoger datos o medir fenómenos naturales en el campo","Experimentación en condiciones controladas, porque reproduce el fenómeno en el laboratorio","Elaboración de un informe, porque consiste en comunicar medidas","Formulación de leyes, porque enuncia regularidades"],correctAnswer:0,shuffleOptions:!0,explanation:"El trabajo de campo es una forma de experimentación que consiste en recoger datos o medir fenómenos naturales en el campo. No reproduce el fenómeno en condiciones controladas. "},{id:"act-11",topic:"Variables",objective:"Identificar la variable independiente, la dependiente y la controlada en un experimento",difficulty:"básica",type:"single-choice",prompt:"En el experimento del péndulo se cambia el largo del hilo y se mide el tiempo que tarda en completar diez oscilaciones. ¿Cuál es la variable independiente?",options:["El largo del péndulo","El periodo de oscilación","La masa del péndulo","El número de oscilaciones que se miden"],correctAnswer:0,shuffleOptions:!0,explanation:"La variable independiente es el factor que cambias a propósito: el largo del péndulo. El periodo es lo que mides (dependiente) y la masa se mantiene constante (controlada). "},{id:"act-12",topic:"Variables",objective:"Identificar la variable independiente, la dependiente y la controlada en un experimento",difficulty:"media",type:"multiple-choice",prompt:"En el experimento del péndulo se usa la misma bola, se cambia el largo del hilo y se anota el tiempo de diez oscilaciones. Selecciona todos los enunciados correctos sobre sus variables.",options:["El largo del péndulo es la variable independiente","El periodo de oscilación es la variable dependiente","La masa del péndulo es la variable controlada","La variable independiente es el periodo de oscilación"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"El largo es lo que cambias (independiente), el periodo es lo que mides (dependiente) y la masa es lo que mantienes constante (controlada). Intercambiar el papel del largo y del periodo es el error más frecuente en este experimento. "},{id:"act-13",topic:"Experimentación",objective:"Definir la experimentación y el trabajo de campo",difficulty:"media",type:"order-steps",prompt:"Ordena los pasos del experimento del péndulo descritos en la lección.",steps:["Medir el largo del hilo desde el soporte hasta el centro de la esfera suspendida","Separar el péndulo 10° de la posición de equilibrio","Medir el tiempo que tarda en realizar 10 oscilaciones","Anotar el largo y el tiempo en una tabla de datos","Cambiar el largo del hilo y repetir el proceso para hacer varias mediciones"],correctAnswer:[0,1,2,3,4],explanation:"Los pasos son: medir el largo del hilo, separarlo 10°, medir el tiempo de 10 oscilaciones, anotar el largo y el tiempo en la tabla, y cambiar el largo y repetir el proceso. "},{id:"act-14",topic:"Variables",objective:"Identificar la variable independiente, la dependiente y la controlada en un experimento",difficulty:"avanzada",type:"single-choice",prompt:"Se quiere comprobar si el periodo del péndulo depende de la masa suspendida. ¿Qué diseño de experimento es el correcto?",options:["Péndulos de distinta masa y el mismo largo de hilo, soltando las masas desde el mismo punto","Péndulos de la misma masa y distinto largo de hilo","Un solo péndulo, medido dos veces seguidas con el mismo largo y la misma masa","Péndulos de distinta masa y distinto largo de hilo"],correctAnswer:0,shuffleOptions:!0,explanation:"Para comprobar la hipótesis 2 se cambia solo la masa, que es la variable independiente, y se mantienen constantes el largo del hilo y el punto de lanzamiento. Si cambias a la vez la masa y el largo, no puedes saber qué causa la diferencia. "},{id:"act-15",topic:"Interpretación de tablas",objective:"Interpretar los resultados de un experimento mediante tablas y gráficas",difficulty:"básica",type:"numeric",prompt:"La tabla da el tiempo t que tarda el péndulo en completar 10 oscilaciones para cada largo l. ¿Cuál es el periodo T de una oscilación, en segundos, para el hilo de 0,30 m?",data:{caption:"Datos crudos del experimento del péndulo",columns:["Largo del hilo l (m)","Tiempo de 10 oscilaciones t (s)"],rows:[["0,10","6,3"],["0,30","11,0"],["0,60","15,5"],["0,90","19,0"],["1,40","23,7"]]},correctAnswer:1.1,tolerance:.01,unit:"s",explanation:"El periodo es el tiempo de una oscilación: T = t / 10. Para l = 0,30 m, T = 11,0 / 10 = 1,10 s. La tabla mide diez oscilaciones, así que el valor de t no es el periodo. "},{id:"act-16",topic:"Interpretación de tablas",objective:"Interpretar los resultados de un experimento mediante tablas y gráficas",difficulty:"media",type:"single-choice",prompt:"Compara las dos columnas de la tabla. ¿Qué conclusión es coherente con los datos de la lección?",data:{caption:"Periodo de una oscilación según el largo del hilo",columns:["Largo del hilo l (m)","Periodo de una oscilación T (s)"],rows:[["0,10","0,63"],["0,30","1,10"],["0,60","1,55"],["0,90","1,90"],["1,40","2,37"]]},options:["Hay proporcionalidad entre el largo del hilo y el periodo: a mayor largo, más tarda el péndulo en completar una oscilación","El periodo disminuye al aumentar el largo del hilo","El periodo solo depende de la masa, y el largo del hilo no influye","La tabla no permite ninguna conclusión porque solo tiene cinco filas"],correctAnswer:0,shuffleOptions:!0,explanation:"Al pasar de 0,10 m a 1,40 m el periodo pasa de 0,63 s a 2,37 s: las dos magnitudes crecen a la vez, hay proporcionalidad, y por eso la hipótesis 3 se confirma. "},{id:"act-17",topic:"Interpretación de tablas",objective:"Interpretar los resultados de un experimento mediante tablas y gráficas",difficulty:"avanzada",type:"order-steps",prompt:"Ordena las actuaciones que la lección realiza para pasar de la tabla de tiempos del péndulo hasta la ley.",steps:["Dividir cada tiempo t entre 10 para obtener el periodo T de una oscilación","Dibujar la gráfica de T en función de l","Observar que al aumentar l aumenta T, es decir, que hay proporcionalidad entre las dos magnitudes","Confirmar la hipótesis planteada","Extraer la ley cualitativa: a mayor largo del péndulo, mayor periodo de oscilación"],correctAnswer:[0,1,2,3,4],explanation:"Primero se calcula T dividiendo t entre 10; después se representa T frente a l; de ahí se deduce la proporcionalidad, lo que confirma la hipótesis; y la ley cualitativa «a mayor largo del péndulo, mayor periodo de oscilación» es el último paso. "},{id:"act-18",topic:"Leyes científicas",objective:"Distinguir una ley cualitativa de una ley cuantitativa",difficulty:"media",type:"single-choice",prompt:"La lección enuncia: «La masa y el volumen son directamente proporcionales». ¿Cuál es la clasificación correcta de ese enunciado?",options:["Es una ley cualitativa: se define mediante un enunciado y no puede expresarse matemáticamente","«La masa y el volumen son directamente proporcionales» es una ley cuantitativa","No es una ley, porque una regularidad medida no se puede representar en una gráfica","Es una teoría, porque es una ley generalizada que abarca un conjunto de hechos"],correctAnswer:0,shuffleOptions:!0,explanation:"Ese enunciado es una ley cualitativa. Ley cuantitativa es la expresión m = k · V, que responde a un enunciado, a una expresión matemática y a una representación gráfica. "},{id:"act-19",topic:"Artículo científico",objective:"Enumerar las partes de un artículo científico",difficulty:"básica",type:"short-answer",prompt:"Un artículo científico se compone de cabecera con autores e institución; objetivo de la investigación; introducción y trabajos previos; método experimental; resultados, interpretación y conclusiones; referencias o bibliografía; y una parte que se nombra también abstract. ¿Cómo se llama esa parte que falta?",acceptedAnswers:["resumen"],explanation:"Es el resumen o abstract. La lista de partes del artículo científico que da la lección es: cabecera con autores e institución; resumen o abstract; objetivo de la investigación; introducción y trabajos previos; método experimental; resultados, interpretación y conclusiones; referencias o bibliografía. "},{id:"act-20",topic:"Proporcionalidad",objective:"Distinguir una ley cualitativa de una ley cuantitativa",difficulty:"media",type:"numeric",prompt:"La tabla da el volumen V y la masa m de varias piezas de acero, que cumplen la ley cuantitativa m = k · V. Calcula el valor de k, en g/cm³.",data:{caption:"Masa y volumen de las piezas de acero",columns:["Volumen V (cm³)","Masa m (g)"],rows:[["1","7,8"],["2","15,6"],["4","31,2"],["6","46,8"],["8","62,4"]]},correctAnswer:7.8,tolerance:.01,unit:"g/cm³",explanation:"La constante k se calcula dividiendo la masa entre el volumen en cada fila: 7,8/1 = 15,6/2 = 31,2/4 = 46,8/6 = 62,4/8 = 7,8 g/cm³. La constante k coincide con la densidad del acero. "}]},G=Object.freeze(Object.defineProperty({__proto__:null,fyq3eso11MetodoCientificoAssessment:W},Symbol.toStringTag,{value:"Module"})),J={"act-01":{hint:"Fíjate en qué fase consiste en mirar sin dar nada por sabido y en cuál llega cuando ya tienes una respuesta medida."},"act-02":{hint:"Piensa qué abarca un conjunto de hechos y qué es una representación, que suele ser matemática."},"act-03":{hint:"Es la fase en la que se mira con cuidado, sin añadir lo que uno espera ver."},"act-04":{hint:"Descarta la página que no dice quién la avala; en las demás responde alguien que se puede identificar."},"act-05":{hint:"La respuesta deja claro qué se afirma y cómo se puede comprobar; sin comprobación no vale."},"act-06":{hint:"Comprueba si existe algún experimento que permita comparar el color de dos flores iguales."},"act-07":{hint:"Valora si plantear bien una hipótesis convierte en cierto lo que esa hipótesis afirma."},"act-08":{hint:"Dos opciones repiten lo que exige la experimentación, una confunde una hipótesis con un hecho y la otra confunde bien formulada con cierta."},"act-09":{hint:"Es la fase en la que se comprueba la hipótesis midiendo, con un experimento o saliendo al terreno."},"act-10":{hint:"Piensa dónde se mide lo que no cabe en el laboratorio: ahí no hay mecheros ni probetas."},"act-11":{hint:"La variable independiente es la que tú cambias a propósito; de las tres magnitudes del péndulo, esa es la longitud."},"act-12":{hint:"Separa qué magnitud cambias tú, qué magnitud anotas como resultado y qué magnitudes mantienen iguales dos péndulos distintos."},"act-13":{hint:"El primer escalón es anotar los datos del montaje y el último repite la medida con un hilo de longitud distinta."},"act-14":{hint:"Busca la opción en la que cambia solo la masa, el hilo mide lo mismo y la posición de partida es idéntica."},"act-15":{hint:"El cronómetro da el tiempo de diez oscilaciones; el periodo reparte ese tiempo entre las diez."},"act-16":{hint:"Mira si al doblar el largo el periodo también sube el doble: con eso decides si hay proporcionalidad."},"act-17":{hint:"El primer paso convierte los tiempos de diez oscilaciones en periodos y el último escribe la conclusión sobre el péndulo."},"act-18":{hint:"La afirmación compara cómo crece el largo con cómo crece el periodo, sin dar ninguna cifra."},"act-19":{hint:"Es la parte que va justo después de la cabecera, antes de situar el trabaj
