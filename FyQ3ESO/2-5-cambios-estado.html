    <select id="theme-select" aria-label="Seleccionar tema">
      ${y.map(e=>`<option value="${e}" ${e==="system"?"selected":""}>${L[e]}</option>`).join("")}
    </select>
  </label>`}function b(e){const n=e.querySelector("#theme-select");if(!n)return;d(n.value),n.addEventListener("change",()=>{d(n.value),localStorage.setItem("assessment-theme",n.value)});const i=localStorage.getItem("assessment-theme");i&&y.includes(i)&&(n.value=i,d(i))}function C(e,n){let i=0,r=0,s=0;const o=n.questions.map(a=>{if(a.shuffleOptions&&a.options){const t=q(a.options),c=a.options[a.correctAnswer],p=t.indexOf(c);return{...a,options:t,correctAnswer:p}}return{...a}}),l=()=>{const a=o[i];e.innerHTML=`
      <main class="assessment">
        <header>
          <div class="topbar">
            <p class="eyebrow">${n.subject} · ${n.level}</p>
            ${f()}
          </div>
          <h1>${n.title}</h1>
          <p>${n.instructions}</p>
          <div class="progress"><div class="progress__bar" style="width:${(i+1)/o.length*100}%"></div></div>
          <p>Pregunta ${i+1} de ${o.length}</p>
        </header>
        <section class="card">
          <p class="question__meta">${a.topic} · ${a.difficulty}</p>
          <h2>${a.prompt}</h2>
          <form id="form">${v(a)}</form>
          <div id="feedback" aria-live="polite"></div>
        </section>
      </main>`,b(e),e.querySelector("#form").addEventListener("submit",t=>{t.preventDefault(),s++;const c=g(a),p=E(a,c);p&&r++;const u=e.querySelector("#feedback");p?(u.className="feedback ok",u.innerHTML=`<strong>Correcto</strong>
          <p>${a.explanation}</p>
          <button id="next" class="primary" type="button">${i===o.length-1?"Ver resultado":"Siguiente"}</button>`,u.querySelector("#next").onclick=()=>{i===o.length-1?h():(i++,l())}):(u.className="feedback wrong",u.innerHTML=`<strong>Revisa tu respuesta</strong>
          <p>${a.explanation}</p>
          ${a.hint?`<p><strong>Pista:</strong> ${a.hint}</p>`:""}
          <button id="retry" class="primary" type="button">Reintentar</button>`,u.querySelector("#retry").onclick=()=>{l()})})},v=a=>a.type==="single-choice"||a.type==="true-false"?`<fieldset class="options">${a.options.map((t,c)=>`<label class="option"><input type="radio" name="a" value="${c}"><span>${t}</span></label>`).join("")}
        </fieldset><button class="primary" type="submit">Comprobar</button>`:a.type==="multiple-choice"?`<fieldset class="options">${a.options.map((t,c)=>`<label class="option"><input type="checkbox" name="a" value="${c}"><span>${t}</span></label>`).join("")}
        </fieldset><button class="primary" type="submit">Comprobar</button>`:a.type==="numeric"?`<label class="field">Respuesta<input id="answer" type="number" step="any" inputmode="decimal">${a.unit?` <span>${a.unit}</span>`:""}</label><button class="primary" type="submit">Comprobar</button>`:'<label class="field">Respuesta<input id="answer" type="text" autocomplete="off"></label><button class="primary" type="submit">Comprobar</button>',g=a=>{if(a.type==="single-choice"||a.type==="true-false"){const t=e.querySelector('input[name="a"]:checked');return t?Number(t.value):null}return a.type==="multiple-choice"?[...e.querySelectorAll('input[name="a"]:checked')].map(t=>Number(t.value)):e.querySelector("#answer")?.value??""},h=()=>{const a=Math.round(r/s*100);e.innerHTML=`<main class="assessment"><section class="card result">
      <div class="topbar">
        <p class="eyebrow">${n.subject}</p>

      <h1>Resultado</h1>

      <p>${n.finalMessage?.(a)??""}</p>
      <button id="retry" class="primary">Repetir</button>
    </section></main>`,b(e),e.querySelector("#retry").onclick=()=>{i=0,r=0,s=0,l()}};l()}const S={title:"Los cambios de estado",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/2.5-Los cambios de estado_desarrollo.md",instructions:"Responde a las 20 preguntas sobre los cambios de estado. Se evalúan la fusión, solidificación, vaporización (evaporación y ebullición), condensación, sublimación, el efecto de la presión y la temperatura, las gráficas de calentamiento y los calores latentes. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de los cambios de estado y los calores latentes.":e>=60?"Buen trabajo; repasa los seis procesos y las gráficas de calentamiento.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"cbe-01",topic:"Definición",objective:"Definir cambio de estado",difficulty:"básica",type:"single-choice",prompt:"Un cambio de estado es un proceso físico en el que:",options:["La sustancia cambia su naturaleza y se crea una sustancia nueva","La sustancia pasa de un estado a otro sin que cambie su naturaleza (son las mismas moléculas)","Se rompen enlaces químicos entre moléculas distintas","El volumen siempre aumenta"],correctAnswer:1,shuffleOptions:!0,explanation:"Un cambio de estado es un proceso físico: antes y después son las mismas moléculas, solo cambia cómo se mueven y cómo están unidas. No aparece ninguna sustancia nueva (eso sería una reacción química)."},{id:"cbe-02",topic:"Presión",objective:"Identificar la presión atmosférica normal",difficulty:"básica",type:"single-choice",prompt:"En el SI la presión se mide en pascales (Pa). La presión atmosférica normal o estándar es de:",options:["10⁵ Pa","1 Pa","100 Pa","1000 Pa"],correctAnswer:0,shuffleOptions:!0,explanation:"La presión atmosférica normal o estándar es de 10⁵ Pa (100 000 Pa). Los puntos de fusión y ebullición se definen a esta presión de referencia."},{id:"cbe-03",topic:"Ebullición en la montaña",objective:"Relacionar presión y ebullición",difficulty:"básica",type:"true-false",prompt:"En la cima de una montaña el agua hierve a una temperatura menor que a nivel del mar.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. En la montaña la presión atmosférica es menor, así que las burbujas de vapor se forman más fácilmente y el agua hierve a una temperatura menor que 100 °C (por eso un huevo tarda más en cocinarse)."},{id:"cbe-04",topic:"Temperatura durante el cambio",objective:"Comprender que la temperatura se mantiene constante",difficulty:"básica",type:"single-choice",prompt:"Durante un cambio de estado (p. ej., la fusión del hielo), la temperatura:",options:["Sube constantemente","Se mantiene constante","Baja constantemente","Oscila aleatoriamente"],correctAnswer:1,shuffleOptions:!0,explanation:"Durante el cambio de estado la temperatura se mantiene constante: la energía aportada se usa para vencer (o reforzar) las fuerzas de atracción, no para subir la temperatura. Solo al terminar el cambio vuelve a subir."},{id:"cbe-05",topic:"Evaporación",objective:"Definir evaporación",difficulty:"básica",type:"single-choice",prompt:"La evaporación es un proceso de vaporización que:",options:["Solo ocurre a una temperatura concreta y en toda la masa del líquido","Ocurre a cualquier temperatura, es lento y solo en la superficie del líquido","Siempre produce burbujas","Solo ocurre en sólidos"],correctAnswer:1,shuffleOptions:!0,explanation:"La evaporación es lenta, ocurre a cualquier temperatura (aunque no se alcance la ebullición) y solo en la superficie del líquido, de donde se escapan las partículas más rápidas."},{id:"cbe-06",topic:"Ebullición",objective:"Definir ebullición",difficulty:"básica",type:"single-choice",prompt:"La ebullición es un proceso de vaporización que:",options:["Ocurre a cualquier temperatura en la superficie","Ocurre solo a una temperatura dada (el punto de ebullición), es más rápida y en toda la masa del líquido, formando burbujas","Solo ocurre en sólidos","No forma burbujas"],correctAnswer:1,shuffleOptions:!0,explanation:"La ebullición ocurre solo a una temperatura concreta (el punto de ebullición, 100 °C para el agua a presión normal), es más rápida que la evaporación y ocurre en toda la masa del líquido, formando burbujas de gas."},{id:"cbe-07",topic:"Gráficas de calentamiento",objective:"Interpretar los tramos de la gráfica",difficulty:"media",type:"single-choice",prompt:"En la gráfica de calentamiento de una sustancia, los tramos horizontales (temperatura constante) indican:",options:["Que la sustancia se está calentando","Un cambio de estado (fusión o ebullición)","Que la sustancia está en reposo","Que la presión aumenta"],correctAnswer:1,shuffleOptions:!0,explanation:"Los tramos horizontales corresponden a un cambio de estado (fusión y ebullición): la temperatura no varía mientras dura el proceso. Los tramos inclinados son los que indican que la sustancia se está calentando."},{id:"cbe-08",topic:"Punto de fusión",objective:"Aplicar el punto de fusión del agua",difficulty:"media",type:"single-choice",prompt:"El punto de fusión del agua (a 10⁵ Pa) es:",options:["100 °C","0 °C","25 °C","−15 °C"],correctAnswer:1,shuffleOptions:!0,explanation:"El punto de fusión del agua es 0 °C: es la temperatura a la que el hielo pasa a agua líquida a presión de 10⁵ Pa. Es una propiedad característica que sirve para identificar la sustancia."},{id:"cbe-09",topic:"Punto de ebullición",objective:"Aplicar el punto de ebullición del agua",difficulty:"media",type:"single-choice",prompt:"El punto de ebullición del agua (a 10⁵ Pa) es:",options:["0 °C","100 °C","−15 °C","25 °C"],correctAnswer:1,shuffleOptions:!0,explanation:"El punto de ebullición del agua es 100 °C: la temperatura a la que el agua hierve cuando la presión exterior es 10⁵ Pa. Si la presión es menor, hierve a menos temperatura; si es mayor, a más temperatura."},{id:"cbe-10",topic:"Vaporización y condensación",objective:"Definir condensación",difficulty:"media",type:"single-choice",prompt:"La condensación es el proceso por el que una sustancia:",options:["Pasa de sólido a líquido","Pasa de gaseoso a líquido (proceso contrario a la vaporización)","Pasa de líquido a gas","Pasa de gas a sólido directamente"],correctAnswer:1,shuffleOptions:!0,explanation:"La condensación es gas → líquido, el proceso contrario a la vaporización. Es la que produce las gotas en las ventanas frías o el rocío en las plantas. Libera energía."},{id:"cbe-11",topic:"Calor latente de vaporización",objective:"Aplicar la fórmula Q = m·Lv",difficulty:"media",type:"numeric",prompt:"El calor latente de vaporización del agua es 2,245·10⁶ J/kg. ¿Qué calor (en julios) se necesita para vaporizar 0,5 kg de agua a 100 °C? (Expresa el resultado como número, p. ej. 1122500)",correctAnswer:1122500,tolerance:5e3,unit:"J",explanation:"Q = m·Lv = 0,5 kg · 2,245·10⁶ J/kg = 1,1225·10⁶ J ≈ 1 122 500 J (≈ 1,123·10⁶ J)."},{id:"cbe-12",topic:"Sublimación",objective:"Identificar un caso de sublimación",difficulty:"media",type:"single-choice",prompt:"El hielo seco (CO₂ sólido) que pasa directamente de sólido a gas, sin dejar residuo líquido, es un ejemplo de:",options:["Fusión","Evaporación","Sublimación","Condensación"],correctAnswer:2,shuffleOptions:!0,explanation:"La sublimación es el paso directo de sólido a gas sin pasar por el estado líquido. El hielo seco (CO₂ sólido) sublima y por eso es un excelente refrigerante. No lo sufren todos los sólidos, solo algunos."},{id:"cbe-13",topic:"Sublimación inversa",objective:"Identificar un caso de sublimación inversa",difficulty:"media",type:"single-choice",prompt:"La escarcha de las mañanas de invierno (vapor de agua que pasa directamente a sólido) es un ejemplo de:",options:["Evaporación","Condensación","Sublimación inversa (desublimación)","Fusión"],correctAnswer:2,shuffleOptions:!0,explanation:"La sublimación inversa (o desublimación) es el paso directo de gaseoso a sólido sin pasar por líquido. La escarcha se forma cuando el vapor de agua toca una superficie por debajo de 0 °C y pasa directamente a sólido."},{id:"cbe-14",topic:"Olla rápida",objective:"Explicar la ebullición a mayor presión",difficulty:"avanzada",type:"single-choice",prompt:"En una olla rápida (olla a presión) el agua hierve a más de 100 °C porque:",options:["El fuego es más intenso","La presión que se ejerce sobre el agua es superior a la presión atmosférica, lo que retrasa la ebullición","El agua tiene más masa","No se puede explicar"],correctAnswer:1,shuffleOptions:!0,explanation:"En la olla a presión la presión exterior es mayor que la atmosférica, así que el agua puede alcanzar temperaturas superiores a 100 °C sin pasar a vapor. Por eso cocina más rápido."},{id:"cbe-15",topic:"Calor latente de fusión",objective:"Calcular el calor latente de fusión",difficulty:"avanzada",type:"numeric",prompt:"Para fundir 250 g de hielo se necesitan 83 750 J. ¿Cuál es el calor latente de fusión del agua (en J/kg)? (Expresa el resultado como número, p. ej. 335000)",correctAnswer:335e3,tolerance:5e3,unit:"J/kg",explanation:"m = 0,25 kg. Lf = Q/m = 83 750 J / 0,25 kg = 335 000 J/kg = 3,35·10⁵ J/kg."},{id:"cbe-16",topic:"Comparación de calores latentes",objective:"Comparar tiempos de vaporización",difficulty:"avanzada",type:"single-choice",prompt:"El Lv del agua es 2,245·10⁶ J/kg y el del etanol es 8,54·10⁵ J/kg. Con la misma masa y fuentes de calor iguales, ¿cuál se vaporiza antes?",options:["El agua, porque tiene más masa","El etanol, porque su calor latente es menor","Se vaporizan a la vez","No se puede saber"],correctAnswer:1,shuffleOptions:!0,explanation:"Cuanto mayor es el Lv, más energía se necesita para vaporizar una masa dada. El agua tiene un Lv mayor que el etanol, así que el etanol (Lv menor) se vaporiza antes."},{id:"cbe-17",topic:"Energía absorbida o liberada",objective:"Identificar procesos que liberan energía",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona los procesos de cambio de estado que LIBERAN energía (ocurren al enfriar):",options:["Fusión","Solidificación","Condensación","Sublimación"],correctAnswer:[1,2],shuffleOptions:!1,explanation:"Los procesos que liberan energía son los inversos (al enfriar): solidificación (líquido→sólido), condensación (gas→líquido) y sublimación inversa (gas→sólido). La fusión, la vaporización y la sublimación absorben energía."},{id:"cbe-18",topic:"Número de cambios de estado",objective:"Contar los seis procesos",difficulty:"avanzada",type:"numeric",prompt:"¿Cuántos procesos de cambio de estado puede sufrir una sustancia (los seis entre sus tres estados)?",correctAnswer:6,tolerance:0,unit:"",explanation:"Son seis: fusión, solidificación, vaporización, condensación, sublimación y sublimación inversa. Forman tres parejas inversas: fusión/solidificación, vaporización/condensación y sublimación/sublimación inversa."},{id:"cbe-19",topic:"Punto de ebullición",objective:"Interpretar el punto de ebullición de otra sustancia",difficulty:"avanzada",type:"single-choice",prompt:"Según la tabla, el etanol hierve a 78 °C y el plomo a 1725 °C. ¿Qué conclusión se puede extraer?",options:["El etanol es más denso que el plomo","El etanol necesita menos energía para vaporizarse que el plomo (su punto de ebullición es mucho menor)","El plomo se evapora antes que el etanol","No se puede concluir nada"],correctAnswer:1,shuffleOptions:!0,explanation:"El punto de ebullición es la temperatura a la que el líquido hierve. El etanol (78 °C) hierve a una temperatura mucho menor que el plomo (1725 °C), así que requiere menos temperatura/energía para vaporizarse."},{id:"cbe-20",topic:"Detección de errores",objective:"Distinguir masa y calor latente en la energía de fusión",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué una masa pequeña de una sustancia con alto calor latente puede necesitar más energía para fundirse que una masa grande de otra con calor latente bajo?",options:["Porque la masa siempre pesa más que el calor latente","Porque la energía depende de DOS factores: la masa y el calor latente (Q = m·Lf)","Porque la masa no influye","Porque el calor latente es constante"],correctAnswer:1,shuffleOptions:!0,explanation:"La energía para fundir es Q = m·Lf y depende de DOS factores: la masa y el calor latente. Una masa pequeña con Lf alto puede necesitar más energía que una masa grande con Lf bajo (p. ej., aluminio frente a plomo)."}]};C(document.querySelector("#app"),S);</script>
  <style rel="stylesheet" crossorigin>*{box-sizing:border-box}:root{--bg:#f3f5f8;--text:#172033;--card-bg:#fff;--card-shadow:0 8px 30px rgba(20,30,50,.08);--option-border:#e1e5eb;--option-active-border:#356ae6;--option-active-bg:#f1f5ff;--primary:#356ae6;--progress-bg:#e3e7ee;--progress-bar:#356ae6;--field-border:#d9dee7;--btn-border:#cfd5df;--btn-bg:#fff;--btn-text:#172033;--feedback-ok-bg:#e9f7ee;--feedback-ok-border:#9ad4ac;--feedback-wrong-bg:#fff3e6;--feedback-wrong-border:#edbd87;--select-bg:#fff;--select-border:#d9dee7}[data-theme=dark]{--bg:#0f1729;--text:#e2e8f0;--card-bg:#1e293b;--card-shadow:0 8px 30px rgba(0,0,0,.35);--option-border:#334155;--option-active-border:#60a5fa;--option-active-bg:#1e3a5f;--primary:#3b82f6;--progress-bg:#334155;--progress-bar:#3b82f6;--field-border:#475569;--btn-border:#475569;--btn-bg:#1e293b;--btn-text:#e2e8f0;--feedback-ok-bg:#052e16;--feedback-ok-border:#22c55e;--feedback-wrong-bg:#1c0a00;--feedback-wrong-border:#f59e0b;--select-bg:#1e293b;--select-border:#475569}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.assessment{width:min(900px,calc(100% - 32px));margin:auto;padding:32px 0 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow,.question__meta{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.25rem 0 .75rem}h2{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.35}.card{background:var(--card-bg);border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:var(--card-shadow)}.progress{height:10px;background:var(--progress-bg);border-radius:999px;overflow:hidden}.progress__bar{height:100%;background:var(--progress-bar);transition:width .25s}.options{border:0;padding:0;margin:24px 0;display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--option-border);border-radius:12px;padding:15px;cursor:pointer}.option:has(input:checked){border-color:var(--option-active-border);background:var(--option-active-bg)}.field{display:block;font-weight:700;margin:24px 0}.field input{display:block;width:min(100%,360px);font:inherit;margin-top:8px;padding:13px;border:2px solid var(--field-border);border-radius:10px;background:var(--card-bg);color:var(--text)}button{font:inherit;font-weight:700;padding:12px 18px;border-radius:10px;border:2px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);cursor:pointer}button:focus-visible{outline:3px solid rgba(53,106,230,.25)}button.primary{color:#fff;background:var(--primary);border-color:var(--primary)}.feedback{margin-top:24px;padding:18px;border-radius:12px}.feedback.ok{background:var(--feedback-ok-bg);border:1px solid var(--feedback-ok-border)}.feedback.wrong{background:var(--feedback-wrong-bg);border:1px solid var(--feedback-wrong-border)}.feedback button{margin-top:10px}.result{text-align:center}.score{font-size:5rem;font-weight:800;margin:20px 0}.theme-select{font-size:.9rem}.theme-select select{font:inherit;padding:6px 10px;border-radius:8px;border:2px solid var(--select-border);background:var(--select-bg);color:var(--text);cursor:pointer}@media(max-width:600px){.assessment{width:calc(100% - 20px);padding-top:18px}}</style>
