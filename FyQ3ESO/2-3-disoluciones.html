  </label>`}function y(e){const a=e.querySelector("#theme-select");if(!a)return;p(a.value),a.addEventListener("change",()=>{p(a.value),localStorage.setItem("assessment-theme",a.value)});const n=localStorage.getItem("assessment-theme");n&&g.includes(n)&&(a.value=n,p(n))}function C(e,a){let n=0,l=0,t=0;const i=a.questions.map(o=>{if(o.shuffleOptions&&o.options){const s=L(o.options),r=o.options[o.correctAnswer],u=s.indexOf(r);return{...o,options:s,correctAnswer:u}}return{...o}}),c=()=>{const o=i[n];e.innerHTML=`

      <button id="retry" class="primary">Repetir</button>
    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{n=0,l=0,t=0,c()}};c()}const E={title:"Disoluciones",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/2.3-Disoluciones_desarrollo.md",instructions:"Responde a las 20 preguntas sobre disoluciones. Se evalúan soluto y disolvente, coloides, aleaciones, la clasificación por cantidad de soluto y los distintos tipos de concentración (%, g/L, riqueza). Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de las disoluciones y sus concentraciones.":e>=60?"Buen trabajo; repasa los tipos de concentración y sus fórmulas.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"dis-01",topic:"Definición",objective:"Definir disolución",difficulty:"básica",type:"single-choice",prompt:"Una disolución es:",options:["Una sustancia pura de un solo componente","Una mezcla homogénea de varias sustancias puras en proporciones variables","Una mezcla heterogénea","Un compuesto químico"],correctAnswer:1,shuffleOptions:!0,explanation:"Una disolución es una mezcla homogénea: su composición es la misma en cualquier punto y no se distingue la frontera entre lo que se disuelve y lo que disuelve."},{id:"dis-02",topic:"Soluto y disolvente",objective:"Identificar el soluto",difficulty:"básica",type:"single-choice",prompt:"En una disolución, el soluto es:",options:["La sustancia que disuelve, en mayor cantidad","La sustancia que se disuelve, normalmente en menor cantidad","El recipiente","Siempre un gas"],correctAnswer:1,shuffleOptions:!0,explanation:"El soluto es la sustancia que se disuelve (normalmente en menor cantidad). El disolvente es el que disuelve (en mayor cantidad) y determina el estado físico de la disolución."},{id:"dis-03",topic:"Estado físico",objective:"Relacionar el estado de la disolución con el disolvente",difficulty:"básica",type:"true-false",prompt:"El estado físico de una disolución es el mismo que el del disolvente (el componente mayoritario).",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. El estado físico de la disolución coincide con el del disolvente, que es el componente mayoritario. El soluto puede estar en cualquier estado (gas, líquido o sólido)."},{id:"dis-04",topic:"Coloides",objective:"Definir coloide",difficulty:"básica",type:"single-choice",prompt:"Un coloide es una mezcla situada entre la disolución y la mezcla heterogénea, cuya diferencia con la disolución está en:",options:["El color de la mezcla","El tamaño de las partículas del componente disperso (mucho mayor que en una disolución)","La temperatura","Siempre es sólida"],correctAnswer:1,shuffleOptions:!0,explanation:'En un coloide las partículas de la fase dispersa son mucho más grandes que las del soluto en una disolución. Por eso la leche, la niebla o el humo son coloides, no disoluciones "de verdad".'},{id:"dis-05",topic:"Coloides",objective:"Identificar un coloide",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de los siguientes es un ejemplo de coloide?",options:["Agua destilada","Leche","Oro puro","Sal de mesa"],correctAnswer:1,shuffleOptions:!0,explanation:"La leche es un coloide: minúsculas gotas de grasa (fase dispersa) esparcidas en agua y otros componentes (fase continua). La niebla, el humo o la espuma de afeitar son otros ejemplos."},{id:"dis-06",topic:"Aleaciones",objective:"Definir aleación",difficulty:"básica",type:"single-choice",prompt:"Una aleación es:",options:["Un metal puro de un solo tipo de átomo","Una mezcla de dos o más sustancias de las que al menos una es un metal (una disolución sólida)","Una disolución líquida","Un compuesto con oxígeno"],correctAnswer:1,shuffleOptions:!0,explanation:"Una aleación es una mezcla de dos o más sustancias (al menos una metal), obtenida fundiendo y enfriando. Es un tipo de disolución sólida: los átomos de un metal se dispersan entre los de otro."},{id:"dis-07",topic:"Aleaciones",objective:"Identificar una aleación",difficulty:"media",type:"single-choice",prompt:"El latón es una aleación de:",options:["Hierro + carbono","Cobre + cinc","Cobre + estaño","Plata + mercurio"],correctAnswer:1,shuffleOptions:!0,explanation:"El latón es cobre + cinc. El acero es hierro + carbono, el bronce es cobre + estaño y la amalgama es plata + mercurio."},{id:"dis-08",topic:"Cantidad de soluto",objective:"Distinguir diluida de concentrada",difficulty:"media",type:"single-choice",prompt:"Una disolución diluida es la que:",options:["Contiene poca cantidad de soluto respecto al disolvente","Contiene la máxima cantidad de soluto posible","Contiene más soluto del límite de saturación","No contiene disolvente"],correctAnswer:0,shuffleOptions:!0,explanation:'Una disolución diluida contiene poca cantidad de soluto; una concentrada, mucha. No hay que confundir "concentrada" con "saturada": una concentrada aún podría disolver más soluto.'},{id:"dis-09",topic:"Saturación",objective:"Definir disolución saturada",difficulty:"media",type:"single-choice",prompt:"Una disolución saturada:",options:["Contiene poca cantidad de soluto","Contiene la máxima cantidad de soluto que puede disolverse a esa temperatura","Siempre hierve","No puede contener disolvente"],correctAnswer:1,shuffleOptions:!0,explanation:"Una disolución saturada contiene la máxima cantidad de soluto que puede disolverse a una temperatura dada. Si se añade más soluto, no se disuelve y queda depositado en el fondo."},{id:"dis-10",topic:"Concentración",objective:"Definir concentración",difficulty:"media",type:"single-choice",prompt:"La concentración de una disolución es:",options:["La masa total de la disolución","La cantidad de soluto disuelta en una cantidad determinada de disolvente o disolución","Siempre un gas","El color de la mezcla"],correctAnswer:1,shuffleOptions:!0,explanation:"La concentración describe la proporción entre soluto y disolvente: la cantidad de soluto disuelta en una cantidad determinada de disolvente o disolución."},{id:"dis-11",topic:"% en masa",objective:"Calcular el tanto por ciento en masa",difficulty:"media",type:"numeric",prompt:"Una disolución contiene 8 g de NaCl en 192 g de agua. ¿Cuál es su concentración en % en masa?",correctAnswer:4,tolerance:.1,unit:"%",explanation:"La masa de la disolución es 192 + 8 = 200 g. % en masa = (8 g / 200 g) × 100 = 4 %. El denominador es la masa de la disolución (200 g), no solo la del agua."},{id:"dis-12",topic:"% en volumen",objective:"Calcular el tanto por ciento en volumen",difficulty:"media",type:"single-choice",prompt:"Se disuelven 15 mL de agua oxigenada en 1 L de agua. Aproximadamente, ¿cuál es la concentración en % en volumen?",options:["1,5 %","15 %","0,15 %","150 %"],correctAnswer:0,shuffleOptions:!0,explanation:"V_soluto = 15 mL = 0,015 L; V_disolución = 0,015 + 1 = 1,015 L. % en volumen = (0,015 / 1,015) × 100 ≈ 1,5 %."},{id:"dis-13",topic:"g/L",objective:"Calcular la concentración en g/L",difficulty:"media",type:"numeric",prompt:"Una disolución contiene 2 g de soluto en 250 mL. ¿Cuál es su concentración en g/L?",correctAnswer:8,tolerance:.1,unit:"g/L",explanation:"250 mL = 0,250 L. Concentración = 2 g / 0,250 L = 8 g/L. Cada litro de disolución contiene 8 g de soluto."},{id:"dis-14",topic:"Tipos de concentración",objective:"Identificar las formas de expresar la concentración",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las formas correctas de expresar la concentración de una disolución:",options:["Tanto por ciento en masa","Tanto por ciento en volumen","Concentración en g/L","Número de átomos de oxígeno"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"La concentración se expresa en % en masa, % en volumen o en g/L (masa de soluto por litro de disolución). Contar átomos de oxígeno no es una forma de concentración."},{id:"dis-15",topic:"Sobresaturación",objective:"Comprender la sobresaturación",difficulty:"avanzada",type:"single-choice",prompt:"Una disolución sobresaturada:",options:["Contiene la máxima cantidad de soluto estable","Contiene temporalmente más soluto del límite de saturación, hasta que algo la altera","No contiene disolvente","Es siempre sólida"],correctAnswer:1,shuffleOptions:!0,explanation:"Una disolución sobresaturada contiene más soluto del que correspondería a la saturación (p. ej., enfriando con cuidado una saturada caliente). El soluto extra permanece disuelto hasta que una agitación o una semilla cristalina lo deposita."},{id:"dis-16",topic:"Saturación",objective:"Relacionar saturación y temperatura",difficulty:"avanzada",type:"true-false",prompt:"La cantidad de soluto que puede disolverse (saturación) depende de la temperatura.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. La saturación depende de la temperatura: a mayor temperatura suele disolverse más soluto."},{id:"dis-17",topic:"Riqueza",objective:"Aplicar la riqueza en aleaciones",difficulty:"avanzada",type:"numeric",prompt:"El oro rojo es una aleación con 25 % de cobre en masa. En un anillo de 7 g, ¿cuántos gramos son de oro (Au)?",correctAnswer:5.25,tolerance:.05,unit:"g",explanation:"m_Cu = (25 × 7)/100 = 1,75 g. m_Au = 7 − 1,75 = 5,25 g de oro."},{id:"dis-18",topic:"% en masa",objective:"Detectar el error del denominador",difficulty:"avanzada",type:"single-choice",prompt:"Al calcular el % en masa, ¿por qué el denominador debe ser la masa de la disolución (soluto + disolvente) y no solo la del disolvente?",options:["Porque el porcentaje se refiere a la mezcla completa, no solo al líquido","Porque el disolvente no pesa nada","Porque el soluto siempre es un gas","Es indiferente, da lo mismo"],correctAnswer:0,shuffleOptions:!0,explanation:"El % en masa es la masa de soluto por cada 100 unidades de masa de disolución (mezcla completa). Usar solo la masa del disolvente (192 g) daría un valor incorrecto (≈4,2 % en vez de 4 %)."},{id:"dis-19",topic:"g/L",objective:"Aplicar g/L a la inversa",difficulty:"avanzada",type:"numeric",prompt:"La concentración de sal en el agua del mar es 3,5 g/L. ¿Cuántos litros hay que evaporar para obtener 1 kg (1000 g) de sal? (Redondea al entero más cercano)",correctAnswer:286,tolerance:1,unit:"L",explanation:"V = m / C = 1000 g / 3,5 g/L ≈ 285,7 L ≈ 286 L de agua del mar."},{id:"dis-20",topic:"Detección de errores",objective:"Distinguir concentración en g/L de porcentaje",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál es la diferencia entre la concentración en g/L y el tanto por ciento?",options:["Son exactamente lo mismo","El % es un número sin unidades; el g/L tiene unidades (gramos por litro)","El g/L no tiene unidades y el % sí","El % solo se usa en sólidos"],correctAnswer:1,shuffleOptions:!0,explanation:"El % en masa o en volumen es un número sin unidades (un porcentaje). La concentración en g/L sí tiene unidades (gramos por litro). Además, con g/L hay que convertir los volúmenes a litros y las masas a gramos."}]};C(document.querySelector("#app"),E);</script>
