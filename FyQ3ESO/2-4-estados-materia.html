  </label>`}function y(e){const s=e.querySelector("#theme-select");if(!s)return;p(s.value),s.addEventListener("change",()=>{p(s.value),localStorage.setItem("assessment-theme",s.value)});const t=localStorage.getItem("assessment-theme");t&&b.includes(t)&&(s.value=t,p(t))}function q(e,s){let t=0,r=0,o=0;const i=s.questions.map(a=>{if(a.shuffleOptions&&a.options){const n=C(a.options),c=a.options[a.correctAnswer],d=n.indexOf(c);return{...a,options:n,correctAnswer:d}}return{...a}}),l=()=>{const a=i[t];e.innerHTML=`

          <p>${a.explanation}</p>

        </fieldset><button class="primary" type="submit">Comprobar</button>`:a.type==="multiple-choice"?`<fieldset class="options">${a.options.map((n,c)=>`<label class="option"><input type="checkbox" name="a" value="${c}"><span>${n}</span></label>`).join("")}
        </fieldset><button class="primary" type="submit">Comprobar</button>`:a.type==="numeric"?`<label class="field">Respuesta<input id="answer" type="number" step="any" inputmode="decimal">${a.unit?` <span>${a.unit}</span>`:""}</label><button class="primary" type="submit">Comprobar</button>`:'<label class="field">Respuesta<input id="answer" type="text" autocomplete="off"></label><button class="primary" type="submit">Comprobar</button>',v=a=>{if(a.type==="single-choice"||a.type==="true-false"){const n=e.querySelector('input[name="a"]:checked');return n?Number(n.value):null}return a.type==="multiple-choice"?[...e.querySelectorAll('input[name="a"]:checked')].map(n=>Number(n.value)):e.querySelector("#answer")?.value??""},h=()=>{const a=Math.round(r/o*100);e.innerHTML=`<main class="assessment"><section class="card result">

      <button id="retry" class="primary">Repetir</button>
    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{t=0,r=0,o=0,l()}};l()}const j={title:"Los estados de la materia",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/2.4-Los estados de la materia_desarrollo.md",instructions:"Responde a las 20 preguntas sobre los estados de la materia. Se evalúan los cuatro estados (sólido, líquido, gas y plasma), la teoría cinética, la densidad, la temperatura, las unidades (K y °C), las conversiones y los cambios de estado. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de los estados de la materia y la temperatura.":e>=60?"Buen trabajo; repasa las diferencias entre estados y las conversiones de temperatura.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"esm-01",topic:"Estados de agregación",objective:"Identificar los cuatro estados",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona los cuatro estados de agregación de la materia:",options:["Sólido","Líquido","Gaseoso","Plasma"],correctAnswer:[0,1,2,3],shuffleOptions:!1,explanation:"La materia puede presentarse en cuatro estados: sólido, líquido, gaseoso y plasma. Los tres primeros son los habituales en la Tierra; el plasma aparece en condiciones muy energéticas (estrellas, rayos, auroras)."},{id:"esm-02",topic:"Factores del estado",objective:"Identificar qué determina el estado",difficulty:"básica",type:"single-choice",prompt:"El estado en que se encuentra una sustancia depende de:",options:["Solo de su color","La temperatura y la presión","El tamaño del recipiente","La forma del recipiente"],correctAnswer:1,shuffleOptions:!0,explanation:"El estado de una sustancia no es fijo: depende de la temperatura y la presión. La misma sustancia puede ser sólida, líquida o gaseosa según esas condiciones (p. ej., el agua: hielo, agua o vapor)."},{id:"esm-03",topic:"Sólido",objective:"Describir el sólido a escala de partículas",difficulty:"básica",type:"single-choice",prompt:"En un sólido, las partículas:",options:["Están muy separadas y se mueven libremente","Están muy juntas en posiciones fijas y ordenadas, y solo vibran en su sitio","Se deslizan unas sobre otras","Han perdido sus electrones"],correctAnswer:1,shuffleOptions:!0,explanation:"En el sólido las partículas están muy próximas, en posiciones fijas y ordenadas, y solo vibran alrededor de su posición. Las fuerzas de atracción son muy fuertes y la energía cinética muy baja."},{id:"esm-04",topic:"Líquido",objective:"Identificar las propiedades macroscópicas del líquido",difficulty:"básica",type:"single-choice",prompt:"Un líquido tiene:",options:["Volumen constante y forma constante","Volumen constante y forma variable (adopta la del recipiente)","Volumen variable y forma variable","No tiene forma ni volumen definidos"],correctAnswer:1,shuffleOptions:!0,explanation:"El líquido tiene volumen constante (no cambia) pero forma variable: adopta la forma del recipiente. Es prácticamente incompresible."},{id:"esm-05",topic:"Gas",objective:"Identificar las propiedades macroscópicas del gas",difficulty:"básica",type:"single-choice",prompt:"Un gas tiene:",options:["Volumen constante y forma constante","Volumen constante y forma variable","Volumen variable y forma variable: llena todo el recipiente disponible","Siempre es incompresible"],correctAnswer:2,shuffleOptions:!0,explanation:"El gas tiene volumen y forma variables: llena todo el recipiente disponible y es muy comprisible. Sus partículas están muy separadas y se mueven libremente."},{id:"esm-06",topic:"Plasma",objective:"Distinguir plasma de gas",difficulty:"básica",type:"true-false",prompt:"La diferencia clave entre el plasma y el gas es que en el plasma las partículas están cargadas (ionizadas).",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Exacto. El plasma es un gas "encendido" o ionizado: los átomos han perdido electrones y hay electrones libres e iones positivos. Esa carga es lo que diferencia al plasma del gas.'},{id:"esm-07",topic:"Comparación de estados",objective:"Relacionar propiedades con un estado",difficulty:"media",type:"single-choice",prompt:"¿Qué estado tiene volumen constante pero forma variable?",options:["Sólido","Líquido","Gas","Plasma"],correctAnswer:1,shuffleOptions:!0,explanation:"El líquido tiene volumen constante (no cambia) pero forma variable (adopta la del recipiente). El sólido tiene ambos constantes; el gas y el plasma tienen ambos variables."},{id:"esm-08",topic:"Densidad",objective:"Explicar la densidad de los gases",difficulty:"media",type:"single-choice",prompt:"Según la teoría cinética, los gases son menos densos que los sólidos y líquidos porque:",options:["Sus partículas son más pequeñas","Sus partículas están muy separadas y ocupan un gran volumen","Sus partículas están más cargadas","Tienen más masa"],correctAnswer:1,shuffleOptions:!0,explanation:"En los gases las partículas están muy separadas y ocupan un gran volumen para una masa dada, por lo que su densidad (d = m/V) es baja. En sólidos y líquidos las partículas están juntas: densidad alta."},{id:"esm-09",topic:"Temperatura",objective:"Definir temperatura",difficulty:"media",type:"single-choice",prompt:"La temperatura mide:",options:["La masa del cuerpo","La energía cinética media de las partículas","El volumen del cuerpo","La cantidad de materia"],correctAnswer:1,shuffleOptions:!0,explanation:'La temperatura es una magnitud que mide la energía cinética media de las partículas: lo rápido que se mueven, de media. Un cuerpo "más caliente" tiene partículas que se mueven más rápido.'},{id:"esm-10",topic:"Conversión K/°C",objective:"Convertir de °C a K",difficulty:"media",type:"numeric",prompt:"¿A cuántos kelvins equivale 23 °C? (Usa T(K) = t(°C) + 273)",correctAnswer:296,tolerance:1,unit:"K",explanation:"T = 23 + 273 = 296 K. Para pasar de Celsius a kelvins se suma 273."},{id:"esm-11",topic:"Conversión K/°C",objective:"Convertir de K a °C",difficulty:"media",type:"numeric",prompt:"¿A cuántos grados Celsius equivale 500 K? (Usa t(°C) = T(K) − 273)",correctAnswer:227,tolerance:1,unit:"°C",explanation:"t = 500 − 273 = 227 °C. Para pasar de kelvins a Celsius se resta 273."},{id:"esm-12",topic:"Cero absoluto",objective:"Identificar 0 K",difficulty:"media",type:"single-choice",prompt:"El 0 K (cero absoluto) es:",options:["El punto de congelación del agua","La temperatura más baja posible, donde las partículas se mueven lo menos posible","Igual que 100 °C","La temperatura del agua hirviendo"],correctAnswer:1,shuffleOptions:!0,explanation:"El 0 K es el cero absoluto, la temperatura más baja posible. No hay que confundirlo con el 0 °C, que es el punto de congelación del agua (un punto práctico, no el cero absoluto)."},{id:"esm-13",topic:"Termómetro",objective:"Explicar el funcionamiento del termómetro",difficulty:"media",type:"single-choice",prompt:"Un termómetro se basa en:",options:["La dilatación de una sustancia al calentarse","El peso del líquido","El color del tubo","La gravedad"],correctAnswer:0,shuffleOptions:!0,explanation:"El termómetro se basa en la dilatación: al calentarse la sustancia se expande (sube por el tubo) y al enfriarse se contrae (baja). La altura de la columna indica la temperatura."},{id:"esm-14",topic:"Incrementos de temperatura",objective:"Relacionar incrementos de °C y K",difficulty:"media",type:"true-false",prompt:"Un incremento de 1 °C equivale a un incremento de 1 K.",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Exacto. El "tamaño" de un grado es el mismo en ambas escalas: un incremento de 1 °C es igual a un incremento de 1 K. Lo que cambia entre escalas es el punto de partida, no la longitud del grado.'},{id:"esm-15",topic:"Cambios de estado",objective:"Explicar la fusión y la ebullición con energía",difficulty:"avanzada",type:"single-choice",prompt:"Para que el agua pase de líquido a gas (hierve) hay que:",options:["Quitarle energía (enfriarla)","Aportarle energía (calentarla) para que las partículas se muevan más y se separen","Aumentar su masa","Reducir su volumen"],correctAnswer:1,shuffleOptions:!0,explanation:"Para pasar a un estado con más energía (sólido → líquido → gas) hay que aportar energía (calentar). Al hervir, las moléculas se mueven más rápido y vencen las fuerzas de atracción para separarse."},{id:"esm-16",topic:"Vapor",objective:"Definir vapor",difficulty:"avanzada",type:"single-choice",prompt:"El vapor es:",options:["El estado gaseoso de una sustancia que normalmente es líquida","Un estado diferente al gaseoso","Siempre un sólido","Una mezcla de dos gases"],correctAnswer:0,shuffleOptions:!0,explanation:'El vapor es simplemente el estado gaseoso de una sustancia que normalmente es líquida (como el agua). No hay que confundir "gas" con "vapor": el vapor es gas de una sustancia normalmente líquida.'},{id:"esm-17",topic:"Plasma",objective:"Identificar propiedades del plasma",difficulty:"avanzada",type:"single-choice",prompt:"El plasma:",options:["No conduce la electricidad","Conduce la electricidad y reacciona a los campos magnéticos (sus partículas están cargadas)","Es siempre sólido","No tiene energía"],correctAnswer:1,shuffleOptions:!0,explanation:"Al estar formado por partículas cargadas (electrones e iones), el plasma conduce la electricidad y reacciona a los campos magnéticos. Por eso un rayo es un canal de plasma que conduce electricidad."},{id:"esm-18",topic:"Conversión K/°C",objective:"Convertir valores negativos de °C a K",difficulty:"avanzada",type:"numeric",prompt:"¿A cuántos kelvins equivale −10 °C?",correctAnswer:263,tolerance:1,unit:"K",explanation:"T = −10 + 273 = 263 K. Se suma 273 incluso cuando el valor en Celsius es negativo."},{id:"esm-19",topic:"Cambios de estado",objective:"Aplicar la energía a los cambios de estado",difficulty:"avanzada",type:"single-choice",prompt:"Al quitar energía (enfriar) a una sustancia, esta pasa:",options:["De sólido a gas directamente","De gas → líquido → sólido (a estados con menos energía)","De sólido a líquido","No cambia de estado"],correctAnswer:1,shuffleOptions:!0,explanation:"Quitar energía (enfriar) hace que las partículas se muevan más despacio y las fuerzas de atracción las junten: la sustancia pasa a un estado con menos energía (gas → líquido → sólido)."},{id:"esm-20",topic:"Detección de errores",objective:'Detectar el error de "grado centígrado"',difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál es la forma correcta de nombrar la unidad de la escala Celsius?",options:["Grado centígrado","Grado Celsius","Kelvin","Grado termométrico"],correctAnswer:1,shuffleOptions:!0,explanation:'Lo correcto es "grado Celsius". Desde 1948 el término "grado centígrado" se considera incorrecto. El kelvin es la unidad de la escala absoluta, no de la Celsius.'}]};q(document.querySelector("#app"),j);</script>
