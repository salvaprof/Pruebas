      <button id="retry" class="primary">Repetir</button>
    </section></main>`,b(e),e.querySelector("#retry").onclick=()=>{o=0,n=0,i=0,l()}};l()}const z={title:"El laboratorio de Física y Química",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/1.3-El laboratorio de fisica y quimica_desarrollo.md",instructions:"Responde a las 20 preguntas sobre el laboratorio de Física y Química. Se evalúan el material de laboratorio, sus funciones, las normas de seguridad y los pictogramas de peligro. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del material y las normas del laboratorio.":e>=60?"Buen trabajo; repasa las funciones del material y las normas de seguridad.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"lab-01",topic:"Conceptos",objective:"Definir la función del laboratorio",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la función principal del laboratorio de Física y Química?",options:["Almacenar productos químicos","Realizar experimentos para medir, observar y comprobar fenómenos","Preparar exámenes teóricos","Practicar deportes"],correctAnswer:1,shuffleOptions:!0,explanation:"El laboratorio es el espacio de trabajo donde se realizan experimentos: se manipulan sustancias, se miden masas, volúmenes, temperaturas y fuerzas, y se observa lo que ocurre."},{id:"lab-02",topic:"Material de medida",objective:"Identificar el instrumento para medir masa",difficulty:"básica",type:"single-choice",prompt:"¿Qué instrumento se utiliza para medir la masa de una sustancia en el laboratorio?",options:["Probeta","Balanza","Bureta","Matraz aforado"],correctAnswer:1,shuffleOptions:!0,explanation:"La balanza mide la masa de una sustancia en gramos (g). Debe tararse (ponerla a cero) antes de cada pesada."},{id:"lab-03",topic:"Material de medida",objective:"Identificar el instrumento para medir volumen de líquidos",difficulty:"básica",type:"single-choice",prompt:"¿Qué instrumento sirve para medir el volumen de un líquido con precisión moderada?",options:["Balanza","Mechero Bunsen","Probeta","Mortero"],correctAnswer:2,shuffleOptions:!0,explanation:"La probeta es un tubo de vidrio graduado que sirve para medir el volumen de un líquido con una precisión razonable. Para leer bien, se mira a la altura del menisco."},{id:"lab-04",topic:"Material de medida",objective:"Comprender la lectura del menisco",difficulty:"básica",type:"true-false",prompt:"Para leer correctamente el volumen en una probeta, se mira a la altura del menisco, de frente al nivel más bajo de la superficie curva del líquido.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. El menisco es la superficie curva que forma el líquido. Siempre se mira de frente al nivel más bajo del menisco para obtener una lectura precisa."},{id:"lab-05",topic:"Material variado",objective:"Identificar la función del mortero",difficulty:"básica",type:"single-choice",prompt:"¿Para qué sirve el mortero en el laboratorio?",options:["Para medir volúmenes","Para calentar sustancias","Para machacar y pulverizar sustancias sólidas","Para filtrar líquidos"],correctAnswer:2,shuffleOptions:!0,explanation:"El mortero es un recipiente de porcelana donde, con una piedra o maza, se machacan sustancias sólidas para pulverizarlas."},{id:"lab-06",topic:"Material de sujeción",objective:"Identificar la función del soporte universal",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la función del soporte universal?",options:["Medir la temperatura","Sujetar aros, pinzas y nueces para fijar otros objetos en posición estable","Calentar sustancias","Filtrar líquidos"],correctAnswer:1,shuffleOptions:!0,explanation:"El soporte universal es un poste metálico con base que sujeta aros, pinzas y nueces. Es la pieza central del montaje de un experimento."},{id:"lab-07",topic:"Material variado",objective:"Identificar la función del mechero Bunsen",difficulty:"básica",type:"true-false",prompt:"La llama azul del mechero Bunsen es la más caliente.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. La llama azul del mechero Bunsen es la más caliente. La llama amarillenta (más sucia) es menos caliente."},{id:"lab-08",topic:"Material de medida",objective:"Distinguir probeta de bureta",difficulty:"media",type:"single-choice",prompt:"¿Qué característica distingue a la bureta de la probeta?",options:["La bureta es más corta que la probeta","La bureta tiene un grifo que permite verter y medir volúmenes con mayor precisión","La probeta tiene un grifo","La bureta solo se usa para sólidos"],correctAnswer:1,shuffleOptions:!0,explanation:"La bureta es parecida a la probeta pero más larga y con un grifo en la parte baja que deja salir el líquido gota a gota. Permite medir volúmenes con mucha más precisión que la probeta."},{id:"lab-09",topic:"Material de medida",objective:"Comprender la función del matraz aforado",difficulty:"media",type:"single-choice",prompt:"¿Para qué sirve el matraz aforado?",options:["Para calentar disoluciones","Para preparar disoluciones de volumen exacto","Para machacar sólidos","Para medir la temperatura"],correctAnswer:1,shuffleOptions:!0,explanation:"El matraz aforado tiene una marca en el cuello que indica un volumen exacto. Se usa para preparar disoluciones de volumen exacto: se disuelve la sustancia y se añade agua hasta justo la marca."},{id:"lab-10",topic:"Material variado",objective:"Identificar la función del matraz Erlenmeyer",difficulty:"media",type:"single-choice",prompt:"¿Para qué se usa el matraz Erlenmeyer?",options:["Para medir volúmenes exactos","Para preparar y agitar disoluciones sin que el líquido salga","Para calentar hasta evaporar","Para filtrar al vacío"],correctAnswer:1,shuffleOptions:!0,explanation:"El matraz Erlenmeyer tiene base ancha y cuello estrecho. Al agitarlo en círculos, el líquido no sale por el cuello estrecho. Es útil para preparar y agitar disoluciones y en ensayos de neutralización."},{id:"lab-11",topic:"Masa y peso",objective:"Distinguir masa de peso",difficulty:"media",type:"single-choice",prompt:"¿Cuál es la diferencia entre masa y peso?",options:["Son exactamente lo mismo","La masa es la cantidad de materia (en g o kg); el peso es la fuerza con que la Tierra atrae el objeto (en N)","El peso se mide en gramos y la masa en newton","La masa cambia al cambiar de lugar y el peso no"],correctAnswer:1,shuffleOptions:!0,explanation:"La masa es la cantidad de materia de un objeto y no cambia al cambiar de lugar. El peso es la fuerza con que la Tierra atrae ese objeto (en newton). En la Tierra casi coinciden numéricamente, pero son magnitudes distintas."},{id:"lab-12",topic:"Material variado",objective:"Identificar la función del embudo de decantación",difficulty:"media",type:"single-choice",prompt:"¿Para qué sirve el embudo de decantación?",options:["Para introducir líquidos en recipientes de boca pequeña","Para separar dos líquidos que no se mezclan (no miscibles)","Para calentar disoluciones","Para medir volúmenes con precisión"],correctAnswer:1,shuffleOptions:!0,explanation:"El embudo de decantación tiene un grifo en la parte baja. Sirve para separar dos líquidos no miscibles: se deja que se separen en capas y se abre el grifo para verter la capa de abajo."},{id:"lab-13",topic:"Pictogramas",objective:"Identificar el pictograma de inflamable",difficulty:"media",type:"single-choice",prompt:"¿Qué indica el pictograma con una llama?",options:["Tóxico","Explosivo","Inflamable: la sustancia se enciende fácilmente","Corrosivo"],correctAnswer:2,shuffleOptions:!0,explanation:"El pictograma de la llama indica que la sustancia es inflamable: se enciende fácilmente. No debe colocarse cerca de fuentes de calor."},{id:"lab-14",topic:"Gestión de residuos",objective:"Comprender la gestión de residuos químicos",difficulty:"media",type:"single-choice",prompt:"¿Cómo se gestionan los productos químicos tóxicos generados en el laboratorio?",options:["Se echan a la basura normal","Se vierten al fregadero con abundante agua","Se desechan en contenedores especiales designados por el profesor","Se guardan en el armario para usarlos después"],correctAnswer:2,shuffleOptions:!0,explanation:"Los productos químicos tóxicos se desechan en contenedores especiales (bidones o cajas de residuos químicos) que el profesor designa. Nunca se vierten a la basura ni al fregadero."},{id:"lab-15",topic:"Material de física",objective:"Identificar la función del dinamómetro",difficulty:"media",type:"single-choice",prompt:"¿Qué magnitud mide el dinamómetro?",options:["Masa (en gramos)","Temperatura (en °C)","Fuerza (en newton)","Volumen (en mL)"],correctAnswer:2,shuffleOptions:!0,explanation:"El dinamómetro es un aparato con un muelle que permite medir fuerzas en newton (N). Se usa para medir el peso de un objeto o la fuerza necesaria para estirar un muelle."},{id:"lab-16",topic:"Normas de seguridad",objective:"Identificar el error al diluir un ácido",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál es el error frecuente al diluir un ácido?",options:["Añadir el ácido sobre el agua","Añadir el agua sobre el ácido concentrado","Usar un matraz aforado","Tener la balanza tarada"],correctAnswer:1,shuffleOptions:!0,explanation:'La regla es "ácido sobre agua, nunca al revés". Si se echa agua sobre ácido concentrado, el agua hierve de golpe y salpica el ácido concentrado, causando quemaduras.'},{id:"lab-17",topic:"Normas de seguridad",objective:"Aplicar la regla de dilución de ácidos",difficulty:"avanzada",type:"true-false",prompt:"Para diluir un ácido concentrado, siempre se añade el ácido sobre el agua, nunca al revés.",options:["Verdadero","Falso"],correctAnswer:0,explanation:'Exacto. La regla mnemotécnica es "Ácido sobre Agua, Siempre". Añadir agua sobre ácido concentrado provoca una reacción violenta: el agua hierve de golpe y salpica el ácido.'},{id:"lab-18",topic:"Pictogramas",objective:"Identificar el pictograma de corrosivo",difficulty:"avanzada",type:"single-choice",prompt:"¿Qué indica el pictograma de un tubo derramando líquido sobre una superficie y una mano?",options:["Inflamable","Tóxico","Corrosivo: daña la piel, los ojos o los materiales","Peligroso para el medioambiente"],correctAnswer:2,shuffleOptions:!0,explanation:"El pictograma de corrosivo (tubo derramando líquido sobre una superficie y una mano) indica que la sustancia daña la piel, los ojos o los materiales."},{id:"lab-19",topic:"Normas de seguridad",objective:"Aplicar normas de seguridad eléctrica",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona todas las normas de seguridad correctas para el uso de equipos eléctricos en el laboratorio:",options:["No tocar enchufes con las manos húmedas","Arreglar los aparatos eléctricos uno mismo","No arreglar ningún aparato; deben hacerlo técnicos autorizados","Usar los equipos aunque estén mojados"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"No se tocan enchufes con manos húmedas (el agua conduce la electricidad) y no se arreglan aparatos eléctricos: deben hacerlo técnicos autorizados. Usar equipos mojados es peligroso."},{id:"lab-20",topic:"Material variado",objective:"Identificar la función de la cápsula de porcelana",difficulty:"avanzada",type:"single-choice",prompt:"¿Para qué se usa la cápsula de porcelana?",options:["Para medir volúmenes exactos","Para calentar fuertes o evaporar un líquido hasta secar","Para filtrar al vacío","Para preparar disoluciones de volumen exacto"],correctAnswer:1,shuffleOptions:!0,explanation:"La cápsula de porcelana es un recipiente redondo y resistente al calor, usado para calentar fuertes o para evaporar un líquido hasta secar. Aguanta mucho más calor que el vidrio."}]};A(document.querySelector("#app"),z);</script>
