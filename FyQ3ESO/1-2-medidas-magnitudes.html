    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{t=0,o=0,r=0,c()}};c()}const L={title:"Medidas y magnitudes",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/1.2-Medidas y magnitudes_desarrollo.md",instructions:"Responde a las 20 preguntas sobre medidas y magnitudes. Se evalúan magnitudes básicas y derivadas, múltiplos y submúltiplos, conversión de unidades, notación científica, errores e incertidumbre. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de medidas y magnitudes.":e>=60?"Buen trabajo; repasa las conversiones y notación científica.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"med-01",topic:"Magnitudes",objective:"Definir magnitud",difficulty:"básica",type:"single-choice",prompt:"¿Qué es una magnitud?",options:["Una propiedad que solo puede medirse con instrumentos","Una propiedad de un fenómeno o cuerpo que puede expresarse cuantitativamente (número + unidad)","Una ley física universal","Un instrumento de medida"],correctAnswer:1,shuffleOptions:!0,explanation:"Una magnitud es una propiedad de un fenómeno, cuerpo o sustancia que puede expresarse cuantitativamente, es decir, mediante un número y una unidad de medida. Por ejemplo: 8 m, 100 °C, 12 s."},{id:"med-02",topic:"Unidades",objective:"Identificar los requisitos de una unidad de medida",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona los requisitos que debe cumplir una unidad de medida para ser útil:",options:["Constante: no cambiar con la persona ni las condiciones ambientales","Universal: no cambiar según el país","Reproducible: dar el mismo resultado al repetir la medida","Barata: ser de fácil fabricación"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Una unidad debe ser constante, universal y reproducible. El costo de fabricación no es un requisito científico."},{id:"med-03",topic:"Sistema Internacional",objective:"Identificar magnitudes básicas del S io",difficulty:"media",type:"single-choice",prompt:"Un termómetro que siempre marca 2 °C menos de lo real comete un error:",options:["Aleatorio, porque cambia de una lectura a otra","Sistemático, porque tiene una causa fija y desvía todas las medidas en la misma dirección","De redondeo, porque falta precisión","De incertidumbre, porque no se puede corregir"],correctAnswer:1,shuffleOptions:!0,explanation:"Es un error sistemático: tiene una causa fija (calibración incorrecta) y todas las medidas se desvían en la misma dirección (2 °C menos). No desaparece repitiendo la medida; hay que calibrar el instrumento."},{id:"med-09",topic:"Incertidumbre",objective:"Expresar una medida con su incertidumbre",difficulty:"media",type:"true-false",prompt:"Si se mide un tiempo de 23,83 s con un cronómetro de sensibilidad 0,01 s, la medida se expresa como t = 23,83 ± 0,01 s.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. La forma correcta de expresar una medida es: valor medido ± incertidumbre (unidad). El ± indica que el valor verdadero está entre 23,82 s y 23,84 s."},{id:"med-10",topic:"Cifras significativas",objective:"Contar cifras significativas",difficulty:"media",type:"numeric",prompt:"¿Cuántas cifras significativas tiene la medida t = 23,83 s?",correctAnswer:4,tolerance:0,unit:"cifras",explanation:"En t = 23,83 s hay cuatro cifras significativas: 2, 3, 8 y 3. La incertidumbre (0,01 s) afecta a la última décima, por lo que todas las cifras son fiables."},{id:"med-11",topic:"Cifras significativas",objective:"Aplicar la regla del menor número de cifras significativas",difficulty:"media",type:"single-choice",prompt:"Si x = 12,34 m (4 cifras) y t = 2,1 s (2 cifras), ¿con cuántas cifras significativas se expresa v = x/t?",options:["4 cifras","3 cifras","2 cifras","5 cifras"],correctAnswer:2,shuffleOptions:!0,explanation:"El resultado se expresa con el número de cifras significativas menor de las medidas: t = 2,1 s tiene solo 2 cifras. Por tanto, v = 5,9 m/s (2 cible; se reduce repitiendo y promediando","Ser siempre mayor que el error sistemático","No poderse reducir nunca"],correctAnswer:1,shuffleOptions:!0,explanation:"El error aleatorio cambia de forma impredecible de una medida a otra (temblor de mano, variaciones del entorno). Se reduce repitiendo la medida varias veces y promediando los resultados."}]};A(document.querySelector("#app"),L);</script>
