    </section></main>`,y(e),e.querySelector("#retry").onclick=()=>{n=0,r=0,t=0,c()}};c()}const k={title:"La materia y sus propiedades",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/2.1-La materia y sus propiedades_desarrollo.md",instructions:"Responde a las 20 preguntas sobre la materia y sus propiedades. Se evalúan la definición de materia, propiedades generales y específicas, la densidad (fórmula, unidades y conversión) y el menisco. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la materia y la densidad.":e>=60?"Buen trabajo; repasa la densidad y las conversiones de unidades.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"mat-01",topic:"Definición de materia",objective:"Definir materia",difficulty:"básica",type:"single-choice",prompt:"Según la lección, la materia es todo aquello que:",options:["Tiene brillo y color","Tiene masa y ocupa un volumen","Ocupa un volumen y se mueve","Tiene masa y produce energía"],correctAnswer:1,shuffleOptions:!0,explanation:"La materia es todo aquello que tiene masa y ocupa un volumen. La luz, la energía o una idea no son materia porque carecen de masa y no ocupan espacio."},{id:"mat-02",topic:"Masa",objective:"Identificar la unidad SI de la masa",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la unidad de la masa en el Sistema Internacional?",options:["Gramo (g)","Kilogramo (kg)","Newton (N)","Litro (L)"],correctAnswer:1,shuffleOptions:!0,explanation:"La masa se mide en kilogramos (kg) en el SI. El gramo es un submúltiplo (1 g = 10⁻³ kg)."},{id:"mat-03",topic:"Volumen",objective:"Identificar la unidad SI del volumen",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la unidad del volumen en el Sistema Internacional?",options:["Litro (L)","Metro cúbico (m³)","Centímetro cúbico (cm³)","Metro (m)"],correctAnswer:1,shuffleOptions:!0,explanation:"El volumen se mide en metros cúbicos (m³) en el SI. El litro (L) y el centímetro cúbico (cm³) son unidades habituales, pero no son la unidad básica SI."},{id:"mat-04",topic:"Propiedades generales",objective:"Identificar las propiedades generales",difficulty:"básica",type:"multiple-choice",prompt:"Selecciona las propiedades generales de la materia (las tienen todos los cuerpos):",options:["Masa","Densidad","Volumen","Punto de ebullición"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"Las propiedades generales son la masa y el volumen: las poseen todos los cuerpos. La densidad y el punto de ebullición son propiedades específicas."},{id:"mat-05",topic:"Propiedades específicas",objective:"Distinguir propiedades específicas",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de las siguientes es una propiedad específica de la materia?",options:["Masa","Volumen","Densidad","Peso aparente"],correctAnswer:2,shuffleOptions:!0,explanation:"La densidad es una propiedad específica: caracteriza a una sustancia concreta y permite identificarla. La masa y el volumen son propiedades generales."},{id:"mat-06",topic:"Densidad",objective:"Escribir la fórmula de la densidad",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la fórmula de la densidad?",options:["d = m · V","d = V / m","d = m / V","d = m + V"],correctAnswer:2,shuffleOptions:!0,explanation:"La densidad es la masa por unidad de volumen: d = m / V. En la notación moderna también se escribe ρ = m/V."},{id:"mat-07",topic:"Densidad",objective:"Identificar la unidad SI de la densidad",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es la unidad de la densidad en el Sistema Internacional?",options:["g/cm³","kg/m³","g/L","kg·m³"],correctAnswer:1,shuffleOptions:!0,explanation:"La unidad SI de la densidad es el kilogramo por metro cúbico (kg/m³). El g/cm³ y el g/L son unidades habituales en la práctica."},{id:"mat-08",topic:"Densidad",objective:"Calcular la densidad",difficulty:"media",type:"numeric",prompt:"Un objeto tiene una masa de 8 kg y ocupa un volumen de 2 m³. ¿Cuál es su densidad (en kg/m³)?",correctAnswer:4,tolerance:.1,unit:"kg/m³",explanation:"d = m / V = 8 kg / 2 m³ = 4 kg/m³."},{id:"mat-09",topic:"Volumen por desplazamiento",objective:"Calcular el volumen por desplazamiento",difficulty:"media",type:"numeric",prompt:"Se introduce una piedra en una probeta con agua. El nivel pasa de 30 mL a 50 mL. ¿Cuál es el volumen de la piedra (en cm³)?",correctAnswer:20,tolerance:1,unit:"cm³",explanation:"V = V₂ − V₁ = 50 mL − 30 mL = 20 mL = 20 cm³. El volumen de la piedra es la diferencia entre ambos niveles."},{id:"mat-10",topic:"Densidad",objective:"Comprender la propiedad intensiva",difficulty:"media",type:"true-false",prompt:"Si cortamos por la mitad un bloque de aluminio, su densidad se reduce a la mitad.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. La densidad es una propiedad intensiva: depende de la sustancia, no de la cantidad. Al cortar el bloque, la masa y el volumen se reducen a la mitad, pero su cociente (la densidad) se mantiene en 2700 kg/m³."},{id:"mat-11",topic:"Menisco",objective:"Distinguir menisco cóncavo de convexo",difficulty:"media",type:"single-choice",prompt:"El mercurio forma un menisco convexo. ¿Dónde se lee su volumen?",options:["En el punto más bajo de la superficie","En el punto más alto (la cima) de la superficie","En cualquier punto, da igual","No se puede leer"],correctAnswer:1,shuffleOptions:!0,explanation:"El mercurio forma un menisco convexo (curvado hacia arriba); el volumen se lee en el punto más alto (la cima) de la superficie. El agua, en cambio, forma menisco cóncavo y se lee en el punto más bajo."},{id:"mat-12",topic:"Conversión de densidades",objective:"Convertir g/cm³ a kg/m³",difficulty:"media",type:"numeric",prompt:"El aluminio tiene una densidad de 2,7 g/cm³. ¿Cuántos kg/m³ es eso?",correctAnswer:2700,tolerance:1,unit:"kg/m³",explanation:"Para pasar de g/cm³ a kg/m³ se multiplica por 1000: 2,7 × 1000 = 2700 kg/m³."},{id:"mat-13",topic:"Propiedades específicas",objective:"Identificar propiedades específicas",difficulty:"media",type:"multiple-choice",prompt:"Selecciona las propiedades específicas de la materia:",options:["Densidad","Masa","Punto de ebullición","Volumen"],correctAnswer:[0,2],shuffleOptions:!1,explanation:"La densidad y el punto de ebullición son propiedades específicas: caracterizan a cada sustancia y permiten identificarla. La masa y el volumen son generales."},{id:"mat-14",topic:"Densidad",objective:"Relacionar densidad y masa para el mismo volumen",difficulty:"media",type:"single-choice",prompt:"Para el mismo volumen, ¿qué ocurre con una sustancia más densa?",options:["Tiene menos masa","Tiene más masa","Tiene la misma masa","No se puede comparar"],correctAnswer:1,shuffleOptions:!0,explanation:'Una sustancia más densa "empaca" más materia en el mismo espacio, por lo que, para el mismo volumen, tiene más masa. Por eso una esfera de hierro pesa más que una de madera del mismo tamaño.'},{id:"mat-15",topic:"Conversión de densidades",objective:"Comprender el factor g/L",difficulty:"media",type:"true-false",prompt:"1 g/L es equivalente a 1 kg/m³.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. 1 g/L = 10⁻³ kg / 10⁻³ m³ = 1 kg/m³. Por eso el aire, con densidad 1,3 g/L, equivale a 1,3 kg/m³."},{id:"mat-16",topic:"Identificación",objective:"Identificar una sustancia por su densidad",difficulty:"avanzada",type:"single-choice",prompt:"Una roca tiene una masa de 54 g y un volumen de 20 cm³. Según la tabla de la lección, ¿qué es?",options:["Hierro","Mármol","Azufre","Aceite"],correctAnswer:1,shuffleOptions:!0,explanation:"d = m/V = 54 g / 20 cm³ = 2,7 g/cm³ = 2700 kg/m³. Según la tabla, 2700 kg/m³ corresponde al mármol."},{id:"mat-17",topic:"Propiedades generales",objective:"Comprender por qué las propiedades generales no identifican",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué la masa y el volumen, por sí solos, no sirven para identificar una sustancia?",options:["Porque son propiedades específicas","Porque son generales: dicen cuánta materia hay, pero no de qué sustancia se compone","Porque siempre son iguales en todas las sustancias","Porque no se pueden medir"],correctAnswer:1,shuffleOptions:!0,explanation:"Las propiedades generales (masa y volumen) indican cuánto hay, no de qué se trata. Un litro de agua y un litro de leche tienen el mismo volumen, pero son sustancias distintas."},{id:"mat-18",topic:"Menisco",objective:"Aplicar la lectura del menisco cóncavo",difficulty:"avanzada",type:"true-false",prompt:"Para leer el volumen de agua (menisco cóncavo) en una probeta, se mira al punto más bajo de la curva, con la vista a la altura del líquido.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. El agua forma un menisco cóncavo; el volumen se lee en el punto más bajo de la curva, con la vista a la altura exacta del líquido para evitar errores de lectura."},{id:"mat-19",topic:"Conversión de densidades",objective:"Convertir kg/m³ a g/cm³",difficulty:"avanzada",type:"numeric",prompt:"El agua tiene una densidad de 1000 kg/m³. ¿Cuál es su densidad en g/cm³?",correctAnswer:1,tolerance:.1,unit:"g/cm³",explanation:"Para pasar de kg/m³ a g/cm³ se divide entre 1000: 1000 / 1000 = 1 g/cm³."},{id:"mat-20",topic:"Densidad",objective:"Detectar el error de que la densidad cambie con la cantidad",difficulty:"avanzada",type:"single-choice",prompt:"¿En qué caso SÍ cambia la densidad de una sustancia?",options:["Al duplicar la cantidad de la misma sustancia","Al cambiar de sustancia o al variar las condiciones (p. ej. la temperatura)","Nunca cambia en ninguna circunstancia","Al usar una balanza más precisa"],correctAnswer:1,shuffleOptions:!0,explanation:"La densidad es intensiva: duplicar la cantidad no la cambia. Solo cambia al cambiar de sustancia o al variar las condiciones, como la temperatura (que modifica ligeramente el volumen)."}]};w(document.querySelector("#app"),k);</script>
