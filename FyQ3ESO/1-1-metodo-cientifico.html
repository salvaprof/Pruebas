        </fieldset><button class="primary" type="submit">Comprobar</button>`:a.type==="multiple-choice"?`<fieldset class="options">${a.options.map((r,c)=>`<label class="option"><input type="checkbox" name="a" value="${c}"><span>${r}</span></label>`).join("")}

      <div class="topbar">

      <button id="retry" class="primary">Repetir</button>
    </section></main>`,b(e),e.querySelector("#retry").onclick=()=>{n=0,s=0,o=0,l()}};l()}const A={title:"El método científico",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/1.1-El metodo cientifico_desarrollo.md",instructions:"Responde a las 20 preguntas sobre el método científico. Cada pregunta evalúa un paso o concepto del proceso de investigación científica. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio del método científico.":e>=60?"Buen trabajo; repasa los pasos que fallaste.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"met-01",topic:"Conceptos",objective:"Definir el método científico",difficulty:"básica",type:"single-choice",prompt:"¿Qué es el método científico?",options:["Una lista de fórmulas matemáticas","Un procedimiento ordenado y repetible para investigar fenómenos naturales","Un conjunto de leyes universales","Una forma de clasificar la materia"],correctAnswer:1,shuffleOptions:!0,explanation:"El método científico es la forma de trabajo ordenada y repetible que se utiliza para investigar los fenómenos que se producen en la naturaleza."},{id:"met-02",topic:"Pasos del método",objective:"Identificar el primer paso del método científico",difficulty:"básica",type:"single-choice",prompt:"¿Cuál es el primer paso del método científico?",options:["Experimentación","Observación","Formulación de leyes","Elaboración de un informe"],correctAnswer:1,shuffleOptions:!0,explanation:"La observación es el primer paso: se dedica atención, con todos los sentidos, a un fenómeno tal y como se presenta."},{id:"met-03",topic:"Hipótesis",objective:"Definir una hipótesis",difficulty:"básica",type:"single-choice",prompt:"¿Qué es una hipótesis?",options:["Una ley demostrada y universal","Una suposición clara y comprobable sobre cómo ocurre un fenómeno","Un modelo matemático de un fenómeno","Un informe científico"],correctAnswer:1,shuffleOptions:!0,explanation:"Una hipótesis es una suposición sobre cómo ocurre un fenómeno. Para ser válida debe enunciarse de forma clara y poder comprobarse (falsificarse) mediante un experimento."},{id:"met-04",topic:"Hipótesis",objective:"Comprender que una hipótesis válida puede ser falsa",difficulty:"básica",type:"true-false",prompt:"Una hipótesis puede estar bien planteada (ser válida) pero no ser verdadera.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. Por ejemplo, la hipótesis de que el periodo de un péndulo depende de la masa estaba bien formulada, pero la experimentación demostró que era falsa. Una hipótesis válida solo requiere ser clara y comprobable."},{id:"met-05",topic:"Fuentes de información",objective:"Identificar fuentes fiables de información",difficulty:"básica",type:"single-choice",prompt:"¿Cuál de las siguientes es una fuente de información de mayor credibilidad?",options:["Una publicación en redes sociales","Un video de YouTube sin acreditar","Un artículo de una revista especializada","Un comentario en un foro de Internet"],correctAnswer:2,shuffleOptions:!0,explanation:"Las monografías y revistas especializadas, así como los organismos de investigación (NASA, universidades), son fuentes de mayor credibilidad. Las redes sociales y YouTube son canales de divulgación sin gran control científico."},{id:"met-06",topic:"Cálculo",objective:"Calcular el periodo de una oscilación",difficulty:"básica",type:"numeric",prompt:"En el experimento del péndulo, el tiempo para 10 oscilaciones con una longitud de 0,30 m es 11,0 s. ¿Cuál es el periodo de una oscilación (T)?",correctAnswer:1.1,tolerance:.01,unit:"s",explanation:"T = t / 10 = 11,0 s / 10 = 1,10 s. El periodo de una oscilación se obtiene dividiendo el tiempo cronometrado entre 10."},{id:"met-07",topic:"Experimentación",objective:"Identificar la variable independiente",difficulty:"básica",type:"single-choice",prompt:"En el experimento del péndulo, ¿cuál es la variable independiente?",options:["La masa de la esfera","El periodo de oscilación","La longitud del hilo","La temperatura del laboratorio"],correctAnswer:2,shuffleOptions:!0,explanation:"La variable independiente es la que se modifica voluntariamente. En el experimento del péndulo, es la longitud del hilo, que se cambia a propósito para comprobar su efecto en el periodo."},{id:"met-08",topic:"Experimentación",objective:"Identificar la variable controlada",difficulty:"media",type:"single-choice",prompt:"En el experimento del péndulo, la masa de la esfera se mantiene igual en todas las medidas. ¿Qué tipo de variable es la masa?",options:["Variable independiente","Variable dependiente","Variable controlada (control)","Variable aleatoria"],correctAnswer:2,shuffleOptions:!0,explanation:"La masa es una variable controlada: se mantiene fija para que cualquier cambio en el periodo se deba exclusivamente a la variación de la longitud, no a la masa."},{id:"met-09",topic:"Gráficas",objective:"Identificar el eje correcto para la variable dependiente",difficulty:"media",type:"true-false",prompt:"En una gráfica, la variable dependiente se representa en el eje horizontal (abscisas).",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. La variable dependiente se representa en el eje vertical (ordenadas, Y) y la variable independiente en el eje horizontal (abscisas, X). En la gráfica T–l, T (dependiente) va en ordenadas y l (independiente) en abscisas."},{id:"met-10",topic:"Leyes",objective:"Distinguir ley cualitativa de ley cuantitativa",difficulty:"media",type:"single-choice",prompt:"Una ley cualitativa se caracteriza por:",options:["Tener una expresión matemática y una gráfica","Ser un enunciado sin expresión matemática","Ser un modelo de un fenómeno","Ser una teoría generalizada"],correctAnswer:1,shuffleOptions:!0,explanation:"Una ley cualitativa se define mediante un enunciado, pero no se puede expresar matemáticamente. Por ejemplo: «A mayor longitud del péndulo, mayor periodo de oscilación»."},{id:"met-11",topic:"Fórmulas",objective:"Escribir la segunda ley de Newton",difficulty:"media",type:"short-answer",prompt:"Escribe la fórmula de la segunda ley de Newton (principio fundamental de la dinámica) que relaciona fuerza, masa y aceleración.",acceptedAnswers:["F = m·a","F = m * a","F=ma","F = m·a","F= m·a","F = m·a "],explanation:"La segunda ley de Newton establece F = m · a, donde F es la fuerza aplicada (N), m la masa (kg) y a la aceleración (m/s²)."},{id:"met-12",topic:"Cálculo",objective:"Calcular la densidad a partir de la constante de proporcionalidad",difficulty:"media",type:"numeric",prompt:"En la tabla de acero, la masa para un volumen de 2 cm³ es 15,6 g. ¿Cuál es la densidad (constante de proporcionalidad k = m/V)?",correctAnswer:7.8,tolerance:.1,unit:"g/cm³",explanation:"k = m / V = 15,6 g / 2 cm³ = 7,8 g/cm³. El cociente es siempre el mismo (7,8/1 = 15,6/2 = 31,2/4 = …), lo que confirma la proporcionalidad y da la densidad del acero."},{id:"met-13",topic:"Teorías",objective:"Definir una teoría",difficulty:"media",type:"single-choice",prompt:"¿Qué es una teoría científica?",options:["Una suposición no comprobada","Un modelo matemático simplificado","Un conjunto de leyes y principios que explica un fenómeno","Un artículo científico publicado"],correctAnswer:2,shuffleOptions:!0,explanation:"Una teoría es una ley generalizada que abarca un conjunto de hechos. Está compuesta por leyes y principios que explican un fenómeno. Se afianza si permite predecir nuevos hechos."},{id:"met-14",topic:"Teorías",objective:"Comprender la condición de rechazo de una teoría",difficulty:"media",type:"true-false",prompt:"Basta con que una teoría no explique un solo hecho para que tenga que modificarse o rechazarse.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. Una teoría debe explicar muchos hechos, pero basta con que no explique uno de ellos para que tenga que modificarse o rechazarse."},{id:"met-15",topic:"Modelos",objective:"Distinguir teoría de modelo",difficulty:"media",type:"single-choice",prompt:"¿Cuál de los siguientes es un ejemplo de modelo?",options:["La segunda ley de Newton (F = m·a)","La teoría atómico-molecular de Dalton","Los modelos atómicos para explicar la estructura del átomo","El principio de conservación de la energía"],correctAnswer:2,shuffleOptions:!0,explanation:"Un modelo es una representación de un fenómeno natural, generalmente mediante expresiones matemáticas, que lo describe total o parcialmente para simplificar su estudio. Los modelos atómicos son un ejemplo claro."},{id:"met-16",topic:"Errores frecuentes",objective:"Detectar el error de cambiar varias variables a la vez",difficulty:"avanzada",type:"single-choice",prompt:"Un alumno cambia a la vez la longitud y la masa del péndulo. ¿Cuál es el problema de este experimento?",options:["No puede saber si el cambio del periodo se debe a la longitud o a la masa","El péndulo se rompe","No puede medir la longitud con una regla","El cronómetro no funciona correctamente"],correctAnswer:0,shuffleOptions:!0,explanation:"Si se cambian dos variables a la vez, no se puede atribuir el cambio del periodo a ninguna de ellas en concreto. Por eso la masa debe permanecer como variable controlada (igual en todas las medidas)."},{id:"met-17",topic:"Errores frecuentes",objective:"Detectar el error sobre el periodo del péndulo",difficulty:"avanzada",type:"true-false",prompt:"Según la ley del péndulo (T = 2π√(l/g)), el periodo de oscilación depende de la masa de la esfera.",options:["Verdadero","Falso"],correctAnswer:1,explanation:"Falso. La fórmula T = 2π√(l/g) no contiene la masa m. El periodo depende solo de la longitud l y de la gravedad g, no de la masa ni de la amplitud (para ángulos pequeños). Esto se confirmó experimentalmente."},{id:"met-18",topic:"Fórmulas",objective:"Interpretar la fórmula del periodo del péndulo",difficulty:"avanzada",type:"single-choice",prompt:"En la fórmula T = 2π√(l/g), ¿qué representa la magnitud g?",options:["La longitud del hilo","La masa de la esfera","La aceleración de la gravedad (≈ 9,8 m/s² en la Tierra)","El ángulo de desviación"],correctAnswer:2,shuffleOptions:!0,explanation:"g es la aceleración de la gravedad, que en la superficie terrestre vale aproximadamente 9,8 m/s². El periodo del péndulo depende de la longitud l y de la gravedad g."},{id:"met-19",topic:"Informe científico",objective:"Identificar las partes de un informe científico",difficulty:"avanzada",type:"multiple-choice",prompt:"Selecciona todas las partes que componen un artículo científico:",options:["Resumen o abstract","Método experimental","Opiniones personales sin evidencia","Resultados, interpretación y conclusiones","Referencias o bibliografía"],correctAnswer:[0,1,3,4],shuffleOptions:!1,explanation:"Un artículo científico consta de: encabezado, resumen, objeto, introducción, método experimental, resultados, interpretación y conclusiones, y referencias. Las opiniones personales sin evidencia no forman parte del informe."},{id:"met-20",topic:"Fuentes de información",objective:"Comprender el concepto de referenciar",difficulty:"avanzada",type:"single-choice",prompt:"Referenciar una fuente de información significa:",options:["Copiar la información sin atribuir el origen","Indicar de dónde se ha obtenido la información para poder consultarla","Eliminar las fuentes que no son fiables","Publicar la información en redes sociales"],correctAnswer:1,shuffleOptions:!0,explanation:"Referenciar es indicar de dónde se ha obtenido la información para poder consultarla. Un informe científico sin referencias no se puede contrastar ni repetir, y por tanto no cumple su función."}]};j(document.querySelector("#app"),A);</script>
