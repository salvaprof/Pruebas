        </section>
      </main>`,g(e),e.querySelector("#form").addEventListener("submit",i=>{i.preventDefault(),n++;const l=h(a),p=q(a,l);p&&r++;const u=e.querySelector("#feedback");p?(u.className="feedback ok",u.innerHTML=`<strong>Correcto</strong>

          <p>${a.explanation}</p>

        </fieldset><button class="primary" type="submit">Comprobar</button>`:a.type==="multiple-choice"?`<fieldset class="options">${a.options.map((i,l)=>`<label class="option"><input type="checkbox" name="a" value="${l}"><span>${i}</span></label>`).join("")}

      <button id="retry" class="primary">Repetir</button>
    </section></main>`,g(e),e.querySelector("#retry").onclick=()=>{o=0,r=0,n=0,c()}};c()}const C={title:"La clasificación de la materia",subject:"Física y Química",level:"3.º ESO",sourceLesson:"lessons/FyQ3ESO/2.2-La clasificacion de la materia_desarrollo.md",instructions:"Responde a las 20 preguntas sobre la clasificación de la materia. Se evalúan sustancias puras (elementos y compuestos), mezclas homogéneas y heterogéneas, la separación de componentes y las propiedades de sustancias puras y mezclas. Al finalizar, verás tu puntuación y la explicación de cada respuesta.",finalMessage:e=>e>=80?"Muy buen dominio de la clasificación de la materia.":e>=60?"Buen trabajo; repasa elementos, compuestos y tipos de mezcla.":"Conviene repasar la lección y volver a intentar.",questions:[{id:"cla-01",topic:"Sustancias puras",objective:"Definir sustancia pura",difficulty:"básica",type:"single-choice",prompt:"Una sustancia pura es aquella que:",options:["Está formada por varias sustancias unidas","Está formada por un solo componente, con propiedades constantes","Cambia sus propiedades según la cantidad","Siempre se encuentra mezclada en la naturaleza"],correctAnswer:1,shuffleOptions:!0,explanation:"Una sustancia pura está formada por un solo componente (todos sus átomos o moléculas son idénticos), por lo que sus propiedades (densidad, punto de ebullición, etc.) son constantes."},{id:"cla-02",topic:"Elementos",objective:"Definir elemento o sustancia simple",difficulty:"básica",type:"single-choice",prompt:"Un elemento (sustancia simple) es una sustancia pura formada por:",options:["Dos o más tipos de átomo unidos químicamente","Un solo tipo de átomo","Varias sustancias mezcladas","Moléculas de compuestos distintos"],correctAnswer:1,shuffleOptions:!0,explanation:"Un elemento está formado por un solo tipo de átomo y no puede descomponerse en sustancias más sencillas por métodos químicos. El átomo es su unidad mínima."},{id:"cla-03",topic:"Compuestos",objective:"Definir compuesto químico",difficulty:"básica",type:"single-choice",prompt:"Un compuesto químico es una sustancia pura formada por:",options:["Un solo tipo de átomo","Dos o más tipos de átomo unidos químicamente en proporción fija","Varias sustancias mezcladas sin unirse","Átomos sueltos sin unirse"],correctAnswer:1,shuffleOptions:!0,explanation:"Un compuesto está formado por dos o más tipos de átomo unidos químicamente en proporción fija (p. ej., el agua H₂O). A diferencia de un elemento, sí puede descomponerse en sus elementos por métodos químicos."},{id:"cla-04",topic:"Mezclas",objective:"Definir mezcla",difficulty:"básica",type:"single-choice",prompt:"Una mezcla es un sistema formado por varias sustancias puras que:",options:["Están unidas químicamente en proporción fija","Están juntas pero sin unirse químicamente; cada componente conserva sus propiedades","Se han descompuesto en átomos","Forman una sola sustancia nueva"],correctAnswer:1,shuffleOptions:!0,explanation:"En una mezcla las sustancias puras están juntas pero sin unirse químicamente. Cada componente conserva su identidad y propiedades, y pueden separarse por métodos físicos."},{id:"cla-05",topic:"Mezclas homogéneas",objective:"Identificar una mezcla homogénea",difficulty:"básica",type:"single-choice",prompt:"Una mezcla homogénea (disolución) tiene:",options:["Varias fases con componentes distinguibles","Una única fase; sus componentes no pueden distinguirse a simple vista","Siempre burbujas visibles","Composición variable en cada porción"],correctAnswer:1,shuffleOptions:!0,explanation:'Una mezcla homogénea tiene una única fase y composición uniforme: sus componentes no pueden distinguirse a simple vista ni con microscopio. Por eso "parece" una sola sustancia.'},{id:"cla-06",topic:"Mezclas heterogéneas",objective:"Identificar una mezcla heterogénea",difficulty:"básica",type:"true-false",prompt:"La arena de playa es una mezcla heterogénea porque sus componentes (arena, conchas, agua) pueden distinguirse.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. La arena de playa es heterogénea: tiene varias fases y sus componentes son distinguibles. Cada sustancia conserva sus propias propiedades."},{id:"cla-07",topic:"Disoluciones",objective:"Identificar soluto y solvente",difficulty:"básica",type:"single-choice",prompt:"En una disolución, el soluto es:",options:["La sustancia que disuelve, normalmente en mayor cantidad","La sustancia que se disuelve, normalmente en menor cantidad","El recipiente que contiene la mezcla","Siempre el agua"],correctAnswer:1,shuffleOptions:!0,explanation:"El soluto es la sustancia que se disuelve (normalmente en menor cantidad), como la sal o el azúcar. El solvente es el que disuelve (normalmente en mayor cantidad), como el agua."},{id:"cla-08",topic:"Elementos",objective:"Distinguir elementos monoatómicos y poliatómicos",difficulty:"media",type:"single-choice",prompt:"El oxígeno (O₂) es un elemento:",options:["Monoatómico, como el helio","Poliatómico (bimolecular): dos átomos del mismo elemento unidos","Compuesto, porque tiene dos átomos","Mezcla de gases"],correctAnswer:1,shuffleOptions:!0,explanation:"El O₂ es un elemento poliatómico (bimolecular): dos átomos de oxígeno unidos. Los gases nobles (He, Ne, Ar) son los elementos monoatómicos, que existen como átomos sueltos."},{id:"cla-09",topic:"Compuestos",objective:"Leer una fórmula química",difficulty:"media",type:"single-choice",prompt:"Según la fórmula CO₂, el dióxido de carbono está formado por:",options:["Un átomo de carbono y dos de oxígeno","Doce átomos de carbono y dos de oxígeno","Catorce átomos de carbono","Un átomo de carbono y un óxido"],correctAnswer:0,shuffleOptions:!0,explanation:"CO₂ indica un átomo de carbono (C) y dos de oxígeno (O₂). La proporción de átomos es fija, por eso el compuesto tiene propiedades constantes."},{id:"cla-10",topic:"Clasificación",objective:"Clasificar el agua destilada",difficulty:"media",type:"single-choice",prompt:"El agua destilada (H₂O) es:",options:["Un elemento","Una mezcla homogénea","Un compuesto químico","Una mezcla heterogénea"],correctAnswer:2,shuffleOptions:!0,explanation:"El agua (H₂O) es un compuesto: dos tipos de átomo (H y O) unidos químicamente en proporción fija 2:1. No es un elemento (no es un solo tipo de átomo) ni una mezcla."},{id:"cla-11",topic:"Clasificación",objective:"Clasificar el agua con sal",difficulty:"media",type:"single-choice",prompt:"El agua con sal disuelta es:",options:["Un compuesto","Una mezcla homogénea (disolución)","Un elemento","Una mezcla heterogénea"],correctAnswer:1,shuffleOptions:!0,explanation:"El agua con sal es una disolución (mezcla homogénea): el agua y la sal están juntos pero sin unirse químicamente, y la sal (soluto) no se ve. Se separa por evaporación o destilación."},{id:"cla-12",topic:"Propiedades",objective:"Comparar propiedades de puros y mezclas",difficulty:"media",type:"true-false",prompt:"Las propiedades de una sustancia pura son constantes, mientras que las de una mezcla dependen de la proporción de sus componentes.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. En una sustancia pura la composición es fija, así que sus propiedades son constantes. En una mezcla, las propiedades dependen de la proporción de cada componente y cambian si cambia esa proporción."},{id:"cla-13",topic:"Separación",objective:"Elegir el método de separación para mezclas heterogéneas",difficulty:"media",type:"multiple-choice",prompt:"Selecciona los métodos de separación apropiados para mezclas heterogéneas (componentes distinguibles):",options:["Decantación","Filtración","Separación magnética","Electrólisis"],correctAnswer:[0,1,2],shuffleOptions:!1,explanation:"Las mezclas heterogéneas se separan según la densidad (decantación, flotación), con un filtro (filtración) o con un imán (separación magnética). La electrólisis es un método químico, no una separación física de mezclas."},{id:"cla-14",topic:"Separación",objective:"Elegir el método de separación para mezclas homogéneas",difficulty:"media",type:"single-choice",prompt:"¿Qué método se usa para separar el agua de las sales del agua del mar?",options:["Filtración","Decantación","Destilación (según el punto de ebullición)","Separación magnética"],correctAnswer:2,shuffleOptions:!0,explanation:"El agua del mar es una disolución (homogénea). Al calentar, el agua hierve a 100 °C y se evapora, mientras las sales se quedan: es una destilación, que separa según el punto de ebullición."},{id:"cla-15",topic:"Propiedades",objective:"Interpretar la densidad de una mezcla",difficulty:"media",type:"single-choice",prompt:"¿Por qué la leche entera es menos densa que la leche desnatada?",options:["Porque la leche entera tiene más agua","Porque la leche entera tiene más grasa, y la grasa flota (es menos densa que el agua)","Porque la desnatada tiene más sales","Porque la entera está más fría"],correctAnswer:1,shuffleOptions:!0,explanation:"La leche entera tiene más grasa (nata) que la desnatada. La grasa, como el aceite, flota sobre el agua, lo que significa que su densidad es menor que la del agua. Cuanta más grasa, menor densidad."},{id:"cla-16",topic:"Detección de errores",objective:"Distinguir compuesto de mezcla",difficulty:"avanzada",type:"single-choice",prompt:"¿Cuál es la diferencia esencial entre un compuesto y una mezcla?",options:["No hay diferencia","En el compuesto los átomos están unidos químicamente en proporción fija; en la mezcla las sustancias solo están mezcladas, sin unirse y en proporción variable","La mezcla siempre es líquida","El compuesto siempre es un gas"],correctAnswer:1,shuffleOptions:!0,explanation:"En un compuesto los átomos están unidos químicamente en proporción fija (no se separan por métodos físicos); en una mezcla las sustancias solo están juntas, sin unirse, y en proporción variable (se separan por métodos físicos)."},{id:"cla-17",topic:"Detección de errores",objective:"Clasificar sangre y suero",difficulty:"avanzada",type:"single-choice",prompt:"¿Cómo se clasifican la sangre y el suero sanguíneo?",options:["Ambas son mezclas homogéneas","La sangre es heterogénea (células distinguibles); el suero es homogéneo","Ambas son compuestos","La sangre es un elemento"],correctAnswer:1,shuffleOptions:!0,explanation:"La sangre es una mezcla heterogénea: contiene glóbulos rojos, blancos y plaquetas que se distinguen (forman fases). El suero sanguíneo (la parte líquida, sin células) es una mezcla homogénea."},{id:"cla-18",topic:"Propiedades",objective:"Interpretar el punto de ebullición",difficulty:"avanzada",type:"single-choice",prompt:"Al calentar agua con sal, la temperatura de ebullición:",options:["Se mantiene siempre a 100 °C","Varía (va aumentando), porque la composición cambia al evaporarse el agua","Baja constantemente","No se puede medir"],correctAnswer:1,shuffleOptions:!0,explanation:'El agua pura hierve a 100 °C fijos. El agua con sal es una mezcla: al evaporarse el agua, la concentración de sal aumenta y la temperatura de ebullición va cambiando. Una mezcla "hierve" en un rango, no a una temperatura fija.'},{id:"cla-19",topic:"Clasificación",objective:"Clasificar el agua con gas antes de abrir",difficulty:"avanzada",type:"true-false",prompt:"El agua con gas antes de abrir la botella es una mezcla homogénea, porque el CO₂ está disuelto y no se ven burbujas.",options:["Verdadero","Falso"],correctAnswer:0,explanation:"Exacto. Antes de abrir, el CO₂ está disuelto bajo presión: no hay burbujas visibles, así que es homogénea. Después de abrir, la presión cae y el CO₂ forma burbujas visibles, volviéndola heterogénea."},{id:"cla-20",topic:"Propiedades",objective:"Aplicar la conductividad para medir salinidad",difficulty:"avanzada",type:"single-choice",prompt:"¿Por qué la conductividad eléctrica aumenta al disolver más sal en el agua?",options:["Porque la sal enfría el agua","Porque la sal produce partículas cargadas (iones Na⁺ y Cl⁻) que conducen la corriente; cuanto más sal, más iones","Porque el agua se vuelve más densa","Porque la sal es un metal"],correctAnswer:1,shuffleOptions:!0,explanation:"La sal disuelta produce partículas cargadas (iones Na⁺ y Cl⁻) que conducen la electricidad. Cuanta más sal, más iones y mayor conductividad. Por eso se usa para medir la salinidad del agua."}]};E(document.querySelector("#app"),C);</script>
  <style rel="stylesheet" crossorigin>*{box-sizing:border-box}:root{--bg:#f3f5f8;--text:#172033;--card-bg:#fff;--card-shadow:0 8px 30px rgba(20,30,50,.08);--option-border:#e1e5eb;--option-active-border:#356ae6;--option-active-bg:#f1f5ff;--primary:#356ae6;--progress-bg:#e3e7ee;--progress-bar:#356ae6;--field-border:#d9dee7;--btn-border:#cfd5df;--btn-bg:#fff;--btn-text:#172033;--feedback-ok-bg:#e9f7ee;--feedback-ok-border:#9ad4ac;--feedback-wrong-bg:#fff3e6;--feedback-wrong-border:#edbd87;--select-bg:#fff;--select-border:#d9dee7}[data-theme=dark]{--bg:#0f1729;--text:#e2e8f0;--card-bg:#1e293b;--card-shadow:0 8px 30px rgba(0,0,0,.35);--option-border:#334155;--option-active-border:#60a5fa;--option-active-bg:#1e3a5f;--primary:#3b82f6;--progress-bg:#334155;--progress-bar:#3b82f6;--field-border:#475569;--btn-border:#475569;--btn-bg:#1e293b;--btn-text:#e2e8f0;--feedback-ok-bg:#052e16;--feedback-ok-border:#22c55e;--feedback-wrong-bg:#1c0a00;--feedback-wrong-border:#f59e0b;--select-bg:#1e293b;--select-border:#475569}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.assessment{width:min(900px,calc(100% - 32px));margin:auto;padding:32px 0 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow,.question__meta{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.25rem 0 .75rem}h2{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.35}.card{background:var(--card-bg);border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:var(--card-shadow)}.progress{height:10px;background:var(--progress-bg);border-radius:999px;overflow:hidden}.progress__bar{height:100%;background:var(--progress-bar);transition:width .25s}.options{border:0;padding:0;margin:24px 0;display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--option-border);border-radius:12px;
