<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chocolate Fix</title>
<style>
:root{
  --marron:#6b2222; --rosa:#e26189; --ambar:#d69a3c;
  --marron-l:#a8624e; --rosa-l:#f4abc4; --ambar-l:#efc882;
  --papel:#f8f0cf; --papel-b:#fffdf3; --tinta:#3b2b21; --linea:#c9b98a;
  --bandeja:#c23a44; --celda:#cf4650; --ok:#2e7d32; --ko:#b3261e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* La barra de desplazamiento vertical no debe cambiar nunca el ancho util: eso desplaza el centro de la pagina. */
html{scrollbar-gutter:stable}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#fdf7e3;color:var(--tinta);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-size:16px;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- barra superior ---------- */
header{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
  padding:.5rem .8rem;background:#2f7fb8;color:#fff;
}
header h1{font-size:1.15rem;margin:0;letter-spacing:.06em;text-transform:uppercase}
.navegador{display:flex;align-items:center;gap:.35rem;margin-left:auto}
.navegador .btn{font-size:1.3rem;line-height:1;padding:.25rem .7rem}
.chip{background:#fff;color:#1c5a86;border-radius:999px;padding:.25rem .7rem;font-weight:700;min-width:6.5rem;text-align:center}
.nivel{border-radius:999px;padding:.25rem .7rem;font-weight:700;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}
.nivel.beginner{background:#8fd694;color:#14521d}
.nivel.intermediate{background:#f2cf6b;color:#5c4300}
.nivel.advanced{background:#f09a5b;color:#5f2a05}
.nivel.expert{background:#e2707a;color:#5b0f1a}
.btn{border:0;border-radius:.55rem;padding:.5rem .8rem;background:#eaf3fa;font-weight:600}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#ffd45e;color:#4a3000}
.toggle{border-radius:999px;padding:.35rem .8rem;font-size:.8rem;background:#fff;color:#1c5a86}
.toggle[aria-pressed="false"]{background:#5f9cc9;color:#dcecf7}
select{font:inherit;border-radius:.45rem;border:0;padding:.4rem .5rem;background:#eaf3fa}

/* ---------- layout ---------- */
main{display:flex;flex-wrap:wrap;gap:1rem;padding:1rem;max-width:1180px;margin:0 auto}
.juego{display:flex;flex-direction:column;gap:.8rem;align-items:center;width:min(92vw,340px)}
.hojapistas{flex:1 1 340px;min-width:300px}

/* ---------- tablero ---------- */
.tablero{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:.45rem;
  background:var(--bandeja);padding:.55rem;border-radius:1rem;
  width:min(92vw,340px);aspect-ratio:1;
}
.celda{background:var(--celda);border-radius:.6rem;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation;aspect-ratio:1;min-width:0;overflow:hidden}
.celda svg{width:88%;height:88%;display:block}
.celda.sugerida{outline:3px dashed #fff;outline-offset:-3px}
.celda.malo{outline:4px solid #ffe082;outline-offset:-4px}
.celda.acierto{outline:4px solid #a5d6a7;outline-offset:-4px}

/* ---------- bandeja ---------- */
.bandeja{
  display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;
  background:#e7d9ae;padding:.55rem;border-radius:1rem;width:min(92vw,340px);
  min-height:4.2rem;
}
.ficha{background:#fff;border-radius:.5rem;display:flex;align-items:center;justify-content:center;aspect-ratio:1;touch-action:manipulation}
.ficha svg{width:86%;height:86%;display:block}
.ficha.elegida{outline:4px solid #2f7fb8;outline-offset:2px}
.ficha.vacia{background:transparent;border:1px dashed var(--linea)}

/* ---------- hoja de pistas ---------- */
.hojapistas{
  background:var(--papel);border:2px solid var(--linea);border-radius:.8rem;padding:.8rem;
}
.hojapistas h2{margin:0 0 .6rem;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;text-align:center}
.cuadrantes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;align-items:start}
.mini{display:grid;gap:0;background:#fff;border:1px solid #b9b9b9;padding:2px;justify-self:start}
.mini .c{width:22px;height:22px;border:1px solid #d3d3d3;background:var(--papel-b);display:flex;align-items:center;justify-content:center;position:relative}
.mini .c svg{width:100%;height:100%;display:block}
.leyenda{font-size:.78rem;line-height:1.35;margin-top:.7rem;border-top:1px dashed var(--linea);padding-top:.5rem}
.leyenda b{font-weight:700}

/* ---------- mensajes ---------- */
.mensaje{min-height:4.2rem;font-weight:600;text-align:center;width:100%}
.mensaje.ok{color:var(--ok)}
.mensaje.ko{color:var(--ko)}
.mensaje.av{color:#1c5a86}
.acciones{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}

/* ---------- ficha imprimible ---------- */
#ficha{display:none}
@media print{
  body{background:#fff}
  header,main,#ayuda{display:none!important}
  #ficha{display:block;padding:1cm}
  #ficha .hojapistas{border:0;background:#fff}
  #ficha .tablero{background:#fff;border:2px solid #000;border-radius:0;width:9cm}
  #ficha .celda{background:#fff;border:1px solid #000;border-radius:0}
  #ficha h3{font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase}
}
@media (max-width:760px){
  main{padding:.6rem}
  .hojapistas{order:2}
}
</style>
</head>
<body>
<header>
  <h1>Chocolate&nbsp;Fix</h1>
  <span class="nivel" id="nivel">beginner</span>
  <button class="btn toggle" id="texto" aria-pressed="true" title="Mostrar u ocultar las pistas escritas">Pistas escritas</button>
  <div class="navegador">
    <button class="btn" id="anterior" title="Reto anterior">&#8249;</button>
    <span class="chip" id="chip">Reto 1</span>
    <button class="btn" id="siguiente" title="Reto siguiente">&#8250;</button>
    <select id="lista" title="Ir a un reto"></select>
  </div>
</header>

<main>
  <section class="juego">
    <div class="tablero" id="tablero"></div>
    <div class="bandeja" id="bandeja"></div>
    <div class="acciones">
      <button class="btn primary" id="comprobar">Comprobar</button>
      <button class="btn" id="solucion">Ver solución</button>
      <button class="btn" id="reiniciar">Reiniciar</button>
      <button class="btn" id="imprimir">Ficha imprimible</button>
    </div>
    <p class="mensaje" id="mensaje"></p>
  </section>

  <section class="hojapistas">
    <h2>Pistas del reto</h2>
    <div class="cuadrantes" id="cuadrantes"></div>
    <div class="leyenda" id="leyenda"></div>
    <div class="leyenda" id="pistas"></div>
  </section>
</main>

/* ---------- svg ---------- */
function formaSVG(forma, color, grosor, redondeado){
  var g = '<g fill="none" stroke="'+color+'" stroke-width="'+grosor+'" stroke-linejoin="round" stroke-linecap="round">';
  if (forma === "circle") g += '<circle cx="50" cy="50" r="34"/>';
  else if (forma === "square") g += '<rect x="16" y="16" width="68" height="68" rx="9"/>';
  else g += '<path d="M50 15 L85 81 L15 81 Z"/>';
  return g + "</g>";
}
function anillos(forma, color, grosor){
  var escala = [1, 0.62, 0.3];
  var s = "";
  for (var i=0;i<escala.length;i++){
    s += '<g transform="translate(50 50) scale('+escala[i]+') translate(-50 -50)">'+formaSVG(forma,color,grosor)+"</g>";
  }
  return s;
}
function svgPieza(pieza){
  var p = parte(pieza);
  var c = p[0], f = p[1];
  var s = '<svg viewBox="0 0 100 100" role="img" aria-label="'+pieza+'">';
  s += '<rect x="2" y="2" width="96" height="96" rx="18" fill="'+HEX[c]+'"/>';
  s += anillos(f, HEX_L[c], 7);
  return s + "</svg>";
}
function svgPista(c, f){
  var s = '<svg viewBox="0 0 100 100">';
  if (c) s += '<rect x="4" y="4" width="92" height="92" rx="10" fill="'+HEX[c]+'"/>';
  if (f) s += formaSVG(f, c ? HEX_L[c] : "#8d8d8d", c ? 9 : 11);
  return s + "</svg>";
}

/* ---------- pistas ---------- */
function pistasDe(r){
  var v = [];
  for (var i=0;i<9;i++) v.push({color:null, forma:null});
  r.bloques.forEach(function(b){
    for (var i=0;i<9;i++){
      if (!b.mini[i]) continue;
      var p = parte(b.mini[i]);
      if (p[0]) v[i].color = p[0];
      if (p[1]) v[i].forma = p[1];
    }
  });
  return v;
}
function describirPistas(v){
  var trozos = [];
  for (var i=0;i<9;i++){
    if (!v[i].color && !v[i].forma) continue;
    var r = Math.floor(i/3)+1, c = i%3+1;
    var q = [];
    if (v[i].color) q.push("color "+NOMBRE_C[v[i].color]);
    if (v[i].forma) q.push("forma "+NOMBRE_F[v[i].forma]);
    trozos.push("fila "+r+", columna "+c+": "+q.join(" y "));
  }
  return trozos;
}

/* ---------- render ---------- */
function renderTablero(marcas){
  var cont = document.getElementById("tablero");
  cont.innerHTML = "";
  for (var i=0;i<9;i++){
    var d = document.createElement("div");
    d.className = "celda";
    d.dataset.i = i;
    if (tablero[i]) d.innerHTML = svgPieza(tablero[i]);
    if (marcas && marcas[i]) d.classList.add(marcas[i]);
    if (seleccion && marcas && marcas.sugerir) d.classList.add("sugerida");
    d.addEventListener("click", function(){ pulsarCelda(+this.dataset.i); });
    d.addEventListener("dragover", function(e){ e.preventDefault(); });
    d.addEventListener("drop", function(e){
      e.preventDefault();
      var i = +this.dataset.i, t = e.dataTransfer.getData("text/plain");
      if (t) colocarEn(i, t);
    });
    cont.appendChild(d);
  }
}
function renderBandeja(){
  var cont = document.getElementById("bandeja");
  cont.innerHTML = "";
  var enMano = seleccion && seleccion.origen === "tablero" ? seleccion.pieza : null;
  var enTablero = {};
  tablero.forEach(function(p){ if (p) enTablero[p] = 1; });
  PIEZAS.forEach(function(p){
    var d = document.createElement("div");
    if (enTablero[p] && p !== enMano){
      d.className = "ficha vacia";
      cont.appendChild(d);
      return;
    }
    d.className = "ficha";
    d.dataset.p = p;
    d.innerHTML = svgPieza(p);
    d.draggable = true;
    if (seleccion && seleccion.pieza === p){
      d.classList.add("elegida");
      d.title = "Toca una casilla para colocarlo";
    }
    d.addEventListener("click", function(){ pulsarFicha(this.dataset.p); });
    d.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", this.dataset.p); seleccion = null; });
    cont.appendChild(d);
  });
}
function renderHojapistas(contenedor, r){
  contenedor.innerHTML = "";
  r.bloques.slice().sort(function(a,b){
    return (a.pos[0]-b.pos[0]) || (a.pos[1]-b.pos[1]);
  }).forEach(function(b){
    var filas = b.size ? b.size[0] : 3, cols = b.size ? b.size[1] : 3;
    var ini = b.anchor ? Math.min(FILA_ANCLA[b.anchor.charAt(0)], 3 - filas) : 0;
    var inj = b.anchor ? Math.min(COL_ANCLA[b.anchor.charAt(1)], 3 - cols) : 0;
    var g = document.createElement("div");
    g.className = "mini";
    g.style.gridTemplateColumns = "repeat("+cols+",auto)";
    g.style.gridRow = (b.pos[0]+1)+"";
    g.style.gridColumn = (b.pos[1]+1)+"";
    for (var r=0;r<filas;r++){
      for (var c=0;c<cols;c++){
        var p = parte(b.mini[(ini+r)*3 + (inj+c)]);
        var d = document.createElement("div");
        d.className = "c";
        if (p[0] || p[1]) d.innerHTML = svgPista(p[0], p[1]);
        g.appendChild(d);
      }
    }
    contenedor.appendChild(g);
  });
}
function renderTodo(marcas){
  renderTablero(marcas);
  renderBandeja();
  document.getElementById("chip").textContent = "Reto " + n;
  var el = document.getElementById("nivel");
  el.textContent = NIVEL_ES[reto.nivel];
  el.className = "nivel " + reto.nivel;
  document.getElementById("lista").value = n;
}

/* ---------- interacción ---------- */
function pulsarFicha(pieza){
  seleccion = (seleccion && seleccion.pieza === pieza && seleccion.origen === "bandeja")
    ? null : {origen:"bandeja", pieza:pieza};
  mensaje("");
  renderTodo();
}
function pulsarCelda(i){
  var ahora = Date.now();
  var doble = ultimoToca.i === i && ahora - ultimoToca.t < 500;
  ultimoToca = {i:i, t:ahora};
  if (doble && tablero[i]){ quitarFicha(i); return; }
  if (seleccion){
    colocarEn(i, seleccion.pieza);
    return;
  }
  if (tablero[i]){
    seleccion = {origen:"tablero", pieza:tablero[i], i:i};
    mensaje("Bombón cogido: tócalo en otra casilla para moverlo; tócalo dos veces para devolverlo.", "av");
    renderTodo();
  }
}
function quitarFicha(i){
  tablero[i] = null;
  seleccion = null;
  ultimoToca = {i:-1, t:0};
  mensaje("Bombón devuelto a las fichas.", "av");
  renderTodo();
  guardar();
}
function colocarEn(i, pieza){
  var desde = -1;
  if (seleccion && seleccion.origen === "tablero") desde = seleccion.i;
  var antes = tablero[i];
  tablero[i] = pieza;
  if (desde >= 0) tablero[desde] = antes;
  seleccion = null;
  mensaje("");
  renderTodo();
}
function comprobar(){
  var libres = 0, i;
  for (i=0;i<9;i++) if (!tablero[i]) libres++;
  if (libres){ mensaje("Faltan "+libres+" bombón"+(libres>1?"es":"")+" por colocar en el tablero.", "ko"); return; }
  var v = pistasDe(reto), marcas = [], mal = 0;
  for (i=0;i<9;i++){
    var p = parte(tablero[i]);
    if ((v[i].color && v[i].color !== p[0]) || (v[i].forma && v[i].forma !== p[1])){ marcas[i] = "malo"; mal++; }
  }
  if (mal){
    for (i=0;i<9;i++) if (!marcas[i]) marcas[i] = "acierto";
    mensaje(mal+" casilla"+(mal>1?"s":"")+" no cumple la pista (marcadas en amarillo).", "ko");
    renderTodo(marcas);
    return;
  }
  if (resueltos.indexOf(n) < 0) resueltos.push(n);
  guardar();
  renderTodo(marcas.map(function(){ return "acierto"; }));
  mensaje("¡Correcto! Todas las casillas cumplen las pistas.", "ok");
}
function mensaje(texto, clase){
  var m = document.getElementById("mensaje");
  m.textContent = texto;
  m.className = "mensaje" + (clase ? " "+clase : "");
}

/* ---------- navegación ---------- */
function irA(nuevo, tableros){
  n = Math.min(40, Math.max(1, nuevo));
  reto = DATOS.filter(function(r){ return r.n === n; })[0];
  var guardado = tableros && tableros[n];
  tablero = guardado && guardado.length === 9 ? guardado.slice() : Array(9).fill(null);
  seleccion = null;
  ultimoToca = {i:-1, t:0};
  renderHojapistas(document.getElementById("cuadrantes"), reto);
  renderTodo();
  var trozos = describirPistas(pistasDe(reto));
  document.getElementById("leyenda").innerHTML =
    "<b>Cómo se lee:</b> cada recuadro pequeño es una ventana del tablero. La casilla de arriba a la "+
    "izquierda del recuadro corresponde a la casilla del tablero que ocupa esa misma posición. "+
    "Un recuadro de color fija el <b>color</b> de esa casilla; una silueta fija la <b>forma</b>; "+
    "los dos juntos fijan ambos. Las casillas en blanco no dan información.";
  document.getElementById("pistas").innerHTML =
    "<b>Pistas de este reto:</b><br>" + trozos.map(function(t){ return "&bull; "+t; }).join("<br>");
  pintarTexto();
  mensaje("");
  guardar();
}
function pintarTexto(){
  document.getElementById("pistas").style.display = texto ? "" : "none";
  document.getElementById("texto").setAttribute("aria-pressed", texto ? "true" : "false");
}

/* ---------- ficha imprimible ---------- */
function ficha(){
  var f = document.getElementById("ficha");
  f.innerHTML =
    "<h3>Chocolate Fix &mdash; reto "+n+" ("+NIVEL_ES[reto.nivel]+")</h3>"+
    "<div class='hojapistas'><h2>Pistas</h2><div class='cuadrantes' id='fichaPistas'></div></div>"+
    "<div class='tablero' id='fichaTablero'></div>"+
    "<p>Coloca los 9 bombones (3 colores &times; 3 formas) de modo que todas las casillas cumplan las pistas.</p>";
  renderHojapistas(document.getElementById("fichaPistas"), reto);
  var t = document.getElementById("fichaTablero");
  for (var i=0;i<9;i++){
    var d = document.createElement("div");
    d.className = "celda";
    t.appendChild(d);
  }
  window.print();
}

/* ---------- arranque ---------- */
(function(){
  var tableros = recuperar();
  var sel = document.getElementById("lista");
  DATOS.forEach(function(r){
    var o = document.createElement("option");
    o.value = r.n;
    o.textContent = r.n + " · " + NIVEL_ES[r.nivel];
    sel.appendChild(o);
  });
  sel.addEventListener("change", function(){ irA(+this.value, tableros); });
  document.getElementById("anterior").addEventListener("click", function(){ irA(n-1, tableros); });
  document.getElementById("siguiente").addEventListener("click", function(){ irA(n+1, tableros); });
  document.getElementById("comprobar").addEventListener("click", comprobar);
  document.getElementById("texto").addEventListener("click", function(){
    texto = !texto; pintarTexto(); guardar();
  });
  document.getElementById("reiniciar").addEventListener("click", function(){
    tablero = Array(9).fill(null); seleccion = null; ultimoToca = {i:-1, t:0}; renderTodo(); mensaje(""); guardar();
  });
  document.getElementById("solucion").addEventListener("click", function(){
    tablero = reto.solucion.slice(); seleccion = null; ultimoToca = {i:-1, t:0}; renderTodo();
    mensaje("Solución del librito. Prueba a deducirla tú: mira primero las pistas.", "av");
  });
  document.getElementById("imprimir").addEventListener("click", ficha);
  irA(n, tableros);
})();
</script>
